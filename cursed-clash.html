<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CURSED CLASH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04060f; font-family:"Trebuchet MS",system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #pad { position:fixed; inset:0; pointer-events:none; }
  .btn { position:absolute; pointer-events:auto; border-radius:50%;
         background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.22);
         color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
         user-select:none; letter-spacing:1px; text-align:center; padding:4px; line-height:1.05; }
  .btn.on { background:rgba(255,80,120,.45); border-color:#ff5078; }
  #stick { position:absolute; left:4vw; bottom:5vh; width:26vmin; height:26vmin; border-radius:50%;
           pointer-events:auto; background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02));
           border:1px solid rgba(255,255,255,.15); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:38%; height:38%; border-radius:50%; transform:translate(-50%,-50%);
          background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); }
  #pad.hidden { display:none; }
  /* on-screen controls visibility is driven by the COMPUTER/MOBILE setting (syncPad), not by device */</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="pad" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" data-k="punch"  style="right:4vw;bottom:8vh;width:20vmin;height:20vmin">PUNCH</div>
  <div class="btn" data-k="kick"   style="right:23vw;bottom:8vh;width:20vmin;height:20vmin">KICK</div>
  <div class="btn" data-k="block"  style="right:4vw;bottom:29vh;width:15vmin;height:15vmin;font-size:11px">BLOCK</div>
  <div class="btn" data-k="parry"  style="right:23vw;bottom:29vh;width:15vmin;height:15vmin;font-size:11px;border-color:rgba(140,255,240,.5)">PARRY</div>
  <div class="btn" data-k="super"  style="right:12vw;bottom:47vh;width:16vmin;height:16vmin;font-size:10px">SPECIAL</div>
  <div class="btn" data-k="jump"   style="left:3vw;bottom:76vh;width:12vmin;height:12vmin;font-size:9px;border-color:rgba(255,220,120,.55)">JUMP</div>
  <div class="btn" data-k="crouch" style="left:3vw;bottom:63vh;width:12vmin;height:12vmin;font-size:9px;border-color:rgba(160,255,180,.55)">CROUCH</div>
  <div class="btn" data-k="dash"   style="left:3vw;bottom:50vh;width:12vmin;height:12vmin;font-size:9px;border-color:rgba(160,220,255,.55)">DASH</div>
</div>
<script>
/* ============================================================
   CURSED CLASH  —  2D arena fighter (cel-shaded)
   Menu -> DBFZ-style character select -> Fight
   Keys: A/D move · W jump · J punch · K kick · L block · I special
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

const GRAV = 2100;
const GROUND_Y = () => H*0.82;
const isTouch = matchMedia('(pointer:coarse)').matches;
// Control scheme is the player's choice, not a device guess. 0=COMPUTER (keyboard only, no on-screen pad), 1=MOBILE (on-screen stick+buttons)
let ctrlMode = isTouch?1:0;
try{ const c=localStorage.getItem('cc_ctrl'); if(c!=null){ const n=parseInt(c,10); if(n===0||n===1) ctrlMode=n; } }catch(e){}
function TU(){ return ctrlMode===1; }   // use touch UI / on-screen controls

/* ============================================================
   COLOUR + CEL-SHADING HELPERS  (fakes a 3D look)
   ============================================================ */
function hex2rgb(h){
  if(typeof h!=='string') return [128,128,128];
  const m=h.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
  if(m) return [+m[1],+m[2],+m[3]];
  let s=h.replace('#','').trim();
  if(s.length===3) s=s.split('').map(c=>c+c).join('');
  if(s.length>=6){
    const r=parseInt(s.slice(0,2),16),g=parseInt(s.slice(2,4),16),b=parseInt(s.slice(4,6),16);
    if(!isNaN(r)&&!isNaN(g)&&!isNaN(b)) return [r,g,b];
  }
  return [128,128,128];
}
function mix(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`; }
function light(c,t){ return mix(c,'#ffffff',t); }
function dark(c,t){ return mix(c,'#000000',t); }
function hexA(c,a){ const r=hex2rgb(c); return `rgba(${r[0]},${r[1]},${r[2]},${a})`; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);

function roundRect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// shaded capsule/box: light from top-left, dark outline, rim highlight
function part3d(g,x,y,w,h,r,col){
  const grd=g.createLinearGradient(x,y,x+w*0.85,y+h);
  grd.addColorStop(0, light(col,0.40));
  grd.addColorStop(0.46, col);
  grd.addColorStop(1, dark(col,0.42));
  g.fillStyle=grd; roundRect(g,x,y,w,h,r); g.fill();
  g.strokeStyle=dark(col,0.66); g.lineWidth=Math.max(1.4,Math.min(w,h)*0.085);
  roundRect(g,x,y,w,h,r); g.stroke();
}
// shaded sphere
function sphere3d(g,cx,cy,r,col,noStroke){
  const grd=g.createRadialGradient(cx-r*0.38,cy-r*0.44,r*0.06,cx,cy,r*1.18);
  grd.addColorStop(0, light(col,0.60));
  grd.addColorStop(0.55, col);
  grd.addColorStop(1, dark(col,0.44));
  g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
  if(!noStroke){ g.strokeStyle=dark(col,0.62); g.lineWidth=Math.max(1.4,r*0.13); g.stroke(); }
}
function drawLimb3d(g,x,y,ang,len,wdt,col,footCol){
  g.save(); g.translate(x,y); g.rotate(ang);
  part3d(g,-wdt/2,0,wdt,len,wdt*0.46,col);
  if(footCol){ part3d(g,-wdt/2-1.5,len-wdt*0.85,wdt+3,wdt*0.95,wdt*0.42,footCol); }
  g.restore();
}
// two-bone leg: thigh + shin + foot (knee folds BACKWARD for a +x-facing rig)
function drawLeg3d(g,hipX,hipY,thighAng,kneeAng,thighLen,shinLen,wdt,col,shoeCol,footAng){
  g.save(); g.translate(hipX,hipY); g.rotate(thighAng);
  part3d(g,-wdt/2,0,wdt,thighLen,wdt*0.50,col);
  g.translate(0,thighLen); g.rotate(kneeAng);
  part3d(g,-wdt/2*0.88,0,wdt*0.88,shinLen,wdt*0.44,col);
  g.save(); g.translate(0,shinLen); g.rotate(footAng||0);
  part3d(g,-wdt/2-2,-wdt*0.85,wdt+4,wdt*0.85,wdt*0.38,shoeCol);
  g.restore();
  g.restore();
}
// two-bone arm: upper + forearm + fist
function drawArm3d(g,shX,shY,upAng,elbAng,upLen,foreLen,wdt,col,handCol,handR){
  g.save(); g.translate(shX,shY); g.rotate(upAng);
  part3d(g,-wdt/2,0,wdt,upLen,wdt*0.48,col);
  g.translate(0,upLen); g.rotate(elbAng);
  part3d(g,-wdt/2*0.86,0,wdt*0.86,foreLen,wdt*0.42,col);
  sphere3d(g,0,foreLen+handR*0.55,handR,handCol);
  g.restore();
}

/* ============================================================
   ROSTER
   ============================================================ */
const CHARS = [
  { id:'goku', name:'GOKU', tag:'Saiyan Raised on Earth',
    colA:'#ff8c1a', colB:'#1f63c9', colC:'#16161e', skin:'#f2c49b', shoe:'#2b4a8f', hair:'goku', style:'brawler',
    hp:110, speed:320, dmg:1.00,
    ability:{name:'KAMEHAMEHA', short:'KAMEHAMEHA', type:'wave',
      desc:'Cups both palms and fires a huge blue-white ki beam straight across the screen.', dmg:20, kb:430, speed:640, col:'#63c8ff'} },

  { id:'vegeta', name:'VEGETA', tag:'Prince of All Saiyans',
    colA:'#e8ecf2', colB:'#26417a', colC:'#15151c', skin:'#f2c49b', shoe:'#dfe6ef', hair:'vegeta', style:'royal',
    hp:105, speed:315, dmg:1.05,
    ability:{name:'BIG BANG ATTACK', short:'BIG BANG', type:'orb',
      desc:'Hurls a huge blue-white ki sphere that pierces through anything.', dmg:26, kb:400, speed:300, col:'#8fd8ff', bigOrb:true, r:42} },

  { id:'saitama', name:'SAITAMA', tag:'One Punch',
    colA:'#ffd83d', colB:'#e5382f', colC:'#eef2f5', skin:'#f2c49b', shoe:'#e5382f', hair:'bald', style:'casual',
    hp:120, speed:340, dmg:1.20,
    ability:{name:'SERIOUS PUNCH', short:'SERIOUS', type:'burst',
      desc:'One punch. Massive damage if it connects.', dmg:34, kb:620, dashT:0.34, col:'#ffe14d', fx:'punch'} },

  { id:'hiei', name:'HIEI', tag:'Master of the Jagan',
    colA:'#191b26', colB:'#4a2a7a', colC:'#0c0c12', skin:'#e9cda9', shoe:'#101018', hair:'hiei', style:'ninja',
    hp:100, speed:352, dmg:1.08,
    ability:{name:'DRAGON OF THE DARKNESS FLAME', short:'DARK FLAME', type:'wave',
      desc:'Unleashes the black dragon of the Darkness Flame straight across the screen.', dmg:24, kb:470, speed:560, col:'#a24dff', kind:'dragon', r:42, h:96} },

  { id:'shishio', name:'SHISHIO', tag:'The Hitokiri Battousai Slayer',
    colA:'#2b2430', colB:'#c9b79a', colC:'#141018', skin:'#e7c6a1', shoe:'#1c1720', hair:'shishio', style:'samurai',
    hp:108, speed:326, dmg:1.12,
    ability:{name:'HOMURA DAMA', short:'HOMURA DAMA', type:'burst',
      desc:'Erupts in searing flame — a point-blank blast that shreds through guard.', dmg:28, kb:560, dashT:0.32, col:'#ff5a1f', fx:'fire'} }
];

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};
window.addEventListener('keydown', e=>{
  if(!keys[e.code]){
    keys[e.code]=true;
    // discrete press actions (combos are resolved inside pressInput)
    if(e.code==='Space'){ held.jump=true; pressInput('jump'); }
    else if(e.code==='KeyQ'){ pressInput('dash'); }
    else if(e.code==='KeyJ'){ held.punch=true; pressInput('punch'); }
    else if(e.code==='KeyK'){ held.kick=true; pressInput('kick'); }
    else if(e.code==='KeyF'){ pressInput('block'); }
    onKeyPress(e.code);
  } else keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{
  keys[e.code]=false;
  if(e.code==='Space') held.jump=false;
  if(e.code==='KeyJ') held.punch=false;
  if(e.code==='KeyK') held.kick=false;
});

const pad = { x:0, y:0 };
let padBlock=false, padSuper=false, padParry=false;
// ---- unified input state (keyboard + touch): held buttons + last-press time for combos ----
const held = { punch:false, kick:false, jump:false, crouch:false };
const downAt = {};
const COMBO_W = 0.15;                       // "pressed together" window, seconds
let pendingKind=null, pendingT=0, jumpPending=0;
function canAct(){ return (screen==='fight' || (screen==='training' && !trainMenuOpen)) && p1 && !p1.ko; }
function crouchHeld(){ return !!(keys['ControlLeft']||keys['ControlRight']||held.crouch); }
function combo(kind){ pendingKind=null; jumpPending=0; p1.doAttack(kind); }
// resolve a two-button move when both land inside the combo window; a lone press is buffered briefly
function pressInput(name){
  if(!canAct()) return;
  const now=performance.now()/1000;
  const since = n => now-(downAt[n]??-9);
  downAt[name]=now;
  if(name==='punch'){
    if(since('block')<=COMBO_W){ parryCombo(); return; }           // F + LMB = parry
    if(held.kick && since('kick')<=COMBO_W){ combo('slam'); return; }   // LMB+RMB = slam
    if(held.jump && since('jump')<=COMBO_W){ combo('upper'); return; }  // Space+LMB = uppercut
    pendingKind='punch'; pendingT=COMBO_W;
  } else if(name==='kick'){
    if(crouchHeld()){ p1.doAttack('sweep'); return; }                   // crouch + RMB = sweep (no window)
    if(held.punch && since('punch')<=COMBO_W){ combo('slam'); return; }
    pendingKind='kick'; pendingT=COMBO_W;
  } else if(name==='jump'){
    if(held.punch && since('punch')<=COMBO_W){ combo('upper'); return; }
    jumpPending=COMBO_W;                                                // hold the jump in case an uppercut lands
  } else if(name==='dash'){
    pendingKind=null; p1.doAttack('dash');
  } else if(name==='block'){
    if(since('punch')<=COMBO_W){ parryCombo(); return; }            // F + LMB = parry
  }
}
function resetInput(){ pendingKind=null; pendingT=0; jumpPending=0;
  held.punch=held.kick=held.jump=held.crouch=false;
  for(const k in downAt) downAt[k]=-9; }
// F + LMB pressed together -> parry (the once-every-20s deflect)
function parryCombo(){ pendingKind=null; jumpPending=0; if(canAct()) p1.doParry(); }
// commit buffered single inputs once their combo window has elapsed
function stepInput(dt){
  if(pendingKind){ pendingT-=dt; if(pendingT<=0){ const k=pendingKind; pendingKind=null; if(canAct() && p1.hitStun<=0) p1.doAttack(k); } }
  if(jumpPending>0){ jumpPending-=dt; if(jumpPending<=0 && canAct() && p1.onGround && p1.hitStun<=0 && p1.superT<=0){ p1.vy=-820; p1.onGround=false; } }
}
const stick = document.getElementById('stick'), knob=document.getElementById('knob');
let stickId=null, sCx=0, sCy=0;
function stickStart(e){ const t=e.changedTouches?e.changedTouches[0]:e;
  const r=stick.getBoundingClientRect(); sCx=r.left+r.width/2; sCy=r.top+r.height/2; stickId=t.identifier??'m'; stickMove(e); }
function stickMove(e){
  const t = e.changedTouches ? [...e.changedTouches].find(x=>x.identifier===stickId) : e;
  if(!t) return;
  let dx=t.clientX-sCx, dy=t.clientY-sCy; const R=stick.offsetWidth*0.42;
  const d=Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  pad.x = dx/R; pad.y = dy/R;
  if(e.cancelable) e.preventDefault();
}
function stickEnd(){ stickId=null; pad.x=pad.y=0; knob.style.transform='translate(-50%,-50%)'; }
stick.addEventListener('touchstart',stickStart,{passive:false});
stick.addEventListener('touchmove',stickMove,{passive:false});
stick.addEventListener('touchend',stickEnd); stick.addEventListener('touchcancel',stickEnd);
stick.addEventListener('mousedown',stickStart); window.addEventListener('mousemove',e=>{ if(stickId==='m') stickMove(e); });
window.addEventListener('mouseup',()=>{ if(stickId==='m') stickEnd(); });

document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=()=>{ b.classList.add('on');
    if(k==='punch'){ held.punch=true; pressInput('punch'); }
    else if(k==='kick'){ held.kick=true; pressInput('kick'); }
    else if(k==='jump'){ held.jump=true; pressInput('jump'); }
    else if(k==='crouch'){ held.crouch=true; }
    else if(k==='dash'){ pressInput('dash'); }
    else if((k==='block')){ padBlock=true; pressInput('block'); }
    else if(k==='super')padSuper=true; else if(k==='parry')padParry=true; };
  const off=()=>{ b.classList.remove('on');
    if(k==='punch')held.punch=false; else if(k==='kick')held.kick=false; else if(k==='jump')held.jump=false;
    else if(k==='crouch')held.crouch=false;
    else if(k==='block')padBlock=false; else if(k==='super')padSuper=false; else if(k==='parry')padParry=false; };
  b.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});
const superBtn = document.querySelector('[data-k="super"]');
const padEl = document.getElementById('pad');
function syncPad(){
  const want = TU() && (screen==='fight' || (screen==='training' && !trainMenuOpen));
  if(padEl) padEl.classList.toggle('hidden', !want);
  if(stick) stick.style.display = TU() ? '' : 'none';
}
function updateParryBtn(){
  const b=document.querySelector('[data-k="parry"]'); if(!b) return;
  const cd=(typeof p1!=='undefined'&&p1)?p1.parryCool:0;
  b.style.opacity = cd>0 ? '0.4' : '1';
}
function setCtrlMode(i){ ctrlMode=((i%2)+2)%2; try{ localStorage.setItem('cc_ctrl',String(ctrlMode)); }catch(e){} syncPad(); }
function toggleCtrl(){ setCtrlMode(ctrlMode+1); }
cv.addEventListener('contextmenu', e=>e.preventDefault());
// pointerdown → menu / training-button taps (touch + mouse)
cv.addEventListener('pointerdown', e=>{
  const r=cv.getBoundingClientRect();
  onPointer(e.clientX-r.left, e.clientY-r.top);
});
// mousedown fires per-button, so LMB+RMB combos register even while the other is already held
cv.addEventListener('mousedown', e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if(screen==='fight' || (screen==='training' && !trainMenuOpen)){
    const onTopBtn = (screen==='fight') ? inRect(x,y,menuBtnRect()) : inRect(x,y,trainMenuRect());
    if(e.button===2){ e.preventDefault(); held.kick=true; pressInput('kick'); return; }
    if(e.button===0 && !onTopBtn){ held.punch=true; pressInput('punch'); return; }
  }
});
window.addEventListener('mouseup', e=>{
  if(e.button===2) held.kick=false;
  if(e.button===0) held.punch=false;
});
window.addEventListener('blur', resetInput);

function inRect(x,y,r){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

/* ============================================================
   FX
   ============================================================ */
const fx = [];
function burst(x,y,n,col,spd=1){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(60+Math.random()*260)*spd;
    fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.5+Math.random()*.4,t:0,c:col,r:2+Math.random()*4});
  }
}
function ring(x,y,col,r=0){ fx.push({ring:true,x,y,r:r||12,max:90,col,t:0,life:.4}); }
function blast(x,y,r,col,life=0.55,kind='energy'){ fx.push({blast:true,x,y,r,col,t:0,life,kind}); }
function floatText(x,y,txt,col){ fx.push({txt:txt,x,y,vy:-60,t:0,life:.8,c:col||'#fff'}); }
// block impact VFX (guard flash + shield ring, per-character colour)
function guardFx(x,y,col,power=1){ fx.push({guard:true,x,y,col,power,t:0,life:.46}); }
// parry deflect VFX: cyan flash + cross-slash impact + spark ring
function parrySparkFx(x,y,col,dir){ fx.push({parry:true,x,y,col,dir:dir||1,t:0,life:.42}); }
function drawParrySpark(g,f,k){
  const p=1-k, c=f.col||'#9ff7ff', cx=f.x, cy=f.y;
  g.save(); g.translate(cx,cy);
  const R=(18+72*p);
  const rg=g.createRadialGradient(0,0,1,0,0,R);
  rg.addColorStop(0,hexA('#ffffff',.75*k)); rg.addColorStop(.35,hexA(c,.6*k)); rg.addColorStop(1,hexA(c,0));
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  g.globalAlpha=.9*k; g.strokeStyle='#ffffff'; g.lineWidth=4*k+1.5; g.shadowColor=c; g.shadowBlur=22; g.lineCap='round';
  for(let i=0;i<6;i++){ const a=(i/6)*6.283+0.3;
    g.beginPath(); g.moveTo(Math.cos(a)*R*0.3,Math.sin(a)*R*0.3); g.lineTo(Math.cos(a)*R*1.15,Math.sin(a)*R*1.15); g.stroke(); }
  g.strokeStyle=hexA('#ffffff',.95); g.lineWidth=5*k+2;
  g.beginPath(); g.moveTo(-R*0.8,-R*0.5); g.lineTo(R*0.8,R*0.5); g.stroke();
  g.beginPath(); g.moveTo(-R*0.8,R*0.5); g.lineTo(R*0.8,-R*0.5); g.stroke();
  g.restore();
}
function drawGuardBurst(g,f,k){
  const p=1-k, col=f.col, pw=f.power||1;
  g.save(); g.translate(f.x,f.y);
  const R=(26+70*p)*pw;
  const rg=g.createRadialGradient(0,0,1,0,0,R);
  rg.addColorStop(0,hexA('#ffffff',.55*k)); rg.addColorStop(.4,hexA(light(col,.3),.6*k)); rg.addColorStop(1,hexA(col,0));
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  g.globalAlpha=.9*k; g.strokeStyle=hexA(light(col,.4),.95); g.lineWidth=5*k+2; g.shadowColor=col; g.shadowBlur=20;
  g.beginPath(); g.arc(0,0,R*0.92,0,7); g.stroke();
  g.globalAlpha=.6*k; g.lineWidth=3*k+1;
  g.beginPath(); g.arc(0,0,R*1.35,0,7); g.stroke();
  g.restore();
}

/* ============================================================
   PROJECTILES
   ============================================================ */
let projectiles = [];
function clearProjectiles(){ projectiles.length=0; }
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=dt;
    if(p.homing && p.target && !p.target.ko){
      const dy=(p.target.top+55)-p.y;
      p.vy += Math.sign(dy)*Math.min(160,Math.abs(dy)*6)*dt*6;
      p.vy = Math.max(-260,Math.min(260,p.vy));
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.spin=(p.spin||0)+dt*(p.spinRate||6);
    p.trail=p.trail||[]; p.trail.push({x:p.x,y:p.y}); if(p.trail.length>12) p.trail.shift();
    const foe = p.owner===p1 ? p2 : p1;
    if(!p.dead && !foe.ko && p.t>p.armDelay && !p.hitList.includes(foe)){
      const hb=foe.hurtbox();
      const pr={x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2};
      if(rectHit(pr,hb)){
        p.hitList.push(foe);
        foe.takeHit(p.owner,{dmg:Math.round(p.dmg*(p.owner.char.dmg||1)*(p.owner.dmul||1)),kb:p.kb,stun:.26,super:!!p.superAttack,ranged:true,yoff:0});
        burst(p.x,p.y,p.r>24?22:10,p.col,1.15);
        blast(p.x,p.y,p.r*1.7,p.col,0.42);
        if(p.pierce){ p.hp=(p.hp||1)-1; if(p.hp<=0) p.dead=true; }
        else p.dead=true;
      }
    }
    if(p.t>p.life || p.x<-90 || p.x>W+90 || p.y<-140 || p.y>H+90) p.dead=true;
    if(p.dead) projectiles.splice(i,1);
  }
}
function spawnProjectile(owner,opt){
  projectiles.push(Object.assign({owner,x:0,y:0,vx:0,vy:0,r:16,dmg:10,kb:200,life:2.2,t:0,
    armDelay:0,col:'#fff',pierce:false,homing:false,target:null,hitList:[],trail:[],kind:'orb',spin:0,spinRate:6},opt));
}
function fireAbility(f){
  const ab=f.char.ability, gy=GROUND_Y();
  f.meter=0;
  f.superT = (ab.type==='dash'||ab.type==='burst') ? (ab.dashT||0.4) : 0.9;
  f.state=POSE.SUPER; f.abilityFired=false; f.dashTick=0;
  ring(f.x,gy,ab.col,20); shake=7;
  if(ab.type==='dash'){ f.vx=f.dir*1500; f.vy=-140; f.onGround=false; }
  if(ab.type==='burst'){ f.vx=f.dir*1250; f.vy=-90; f.onGround=false; }
}

/* ============================================================
   FIGHTER
   ============================================================ */
const POSE = { IDLE:0, WALK:1, JUMP:2, PUNCH:3, KICK:4, BLOCK:5, HURT:6, KO:7, SUPER:8, DUMMY:9, PARRY:10,
  UPPER:11, SWEEP:12, DASH:13, SLAM:14, CROUCH:15, STAGGER:16 };
// ---- movelist: LMB punch · RMB kick · LMB+RMB slam · Space+LMB uppercut · Ctrl(hold)+RMB sweep · Q dash · Space jump · F block ----
const MOVES = {
  punch: {state:'PUNCH', startup:.06,active:.06,recover:.12,dmg:6, kb:130,stun:.22,reach:66,yoff:-70,award:8},
  kick:  {state:'KICK',  startup:.11,active:.10,recover:.24,dmg:10,kb:260,stun:.32,reach:82,yoff:-52,award:12},
  upper: {state:'UPPER', startup:.09,active:.10,recover:.30,dmg:11,kb:210,stun:.30,reach:62,yoff:-98,award:12,launch:true},
  sweep: {state:'SWEEP', startup:.10,active:.09,recover:.32,dmg:9, kb:150,stun:.44,reach:92,yoff:8,  award:12,knockdown:true},
  dash:  {state:'DASH',  startup:.08,active:.13,recover:.26,dmg:11,kb:320,stun:.30,reach:78,yoff:-58,award:12,lunge:640},
  slam:  {state:'SLAM',  startup:.20,active:.12,recover:.36,dmg:18,kb:470,stun:.50,reach:80,yoff:-70,award:20,heavy:true},
};
// guard-meter tuning: parry is a once-every-20s read; a full guard = 1.5s stagger
const PARRY_CD=20, STAGGER_TIME=1.5, BLOCK_DECAY=9;
// how much each move taxes the guard meter when blocked (heavier hits break guard faster)
const GUARD_COST={ punch:8, kick:14, upper:15, sweep:16, dash:16, slam:30, counter:26 };
function guardCost(a){ if(a.super) return 42; if(a.kind && GUARD_COST[a.kind]!=null) return GUARD_COST[a.kind];
  return Math.max(6, Math.round((a.kb||120)/18)); }

class Fighter {
  constructor(opts){
    Object.assign(this,{
      x:0,y:0,vx:0,vy:0,dir:1,onGround:true,w:44,h:118,
      hp:100,maxhp:100,meter:0,maxMeter:100,
      state:POSE.IDLE,t:0,anim:0,hitStun:0,blockStun:0,atk:null,hasHit:false,
      cooldown:0,superT:0,invuln:0,ko:false,hitFlash:0,combo:0,comboT:0,
      parryT:0,parryWindow:0,parryCool:0,parryKick:0,parrySpark:0,parryHeld:false,
      blockMeter:0,maxBlock:100,staggerT:0,blockFlash:0,
      name:'?',ai:false,aiT:0,aiState:'approach',aiReaction:null,aiReactT:0,aiTell:false,abilityFired:false,dashTick:0,char:CHARS[0],role:null
    },opts);
    this.applyChar(this.char);
  }
  applyChar(c){ this.char=c; this.colA=c.colA; this.colB=c.colB; this.colC=c.colC;
    this.name=c.name; this.maxhp=c.hp; this.hp=c.hp; this.speed=c.speed;
    this.blockMeter=0; this.staggerT=0; this.blockFlash=0; this.parryCool=0; this.parryWindow=0; }
  get top(){ return this.y-this.h; }
  hurtbox(){ return {x:this.x-this.w*0.55,y:this.top+8,w:this.w*1.1,h:this.h-8}; }
  blocking(){ return this.state===POSE.BLOCK && this.onGround; }
  // guard broken: stagger for a beat, wide open — the punish window for breaking someone's block
  breakGuard(){
    this.blockMeter=0; this.staggerT=STAGGER_TIME; this.state=POSE.STAGGER;
    this.atk=null; this.hitStun=0; this.blockStun=0; this.vx*=0.2; this.hitFlash=1;
    shake=Math.max(shake,14); hitStop=Math.max(hitStop,0.09);
    floatText(this.x,this.top+6,'GUARD BREAK!','#ffd166');
    burst(this.x,this.top+58,18,'#ffd166',1.2); ring(this.x,this.top+58,'#ffd166',16,60);
  }
  parrying(){ return this.parryWindow>0; }
  get dmul(){ return this.ai ? aiDiff().dmg : 1; }      // AI hits at its difficulty's damage scale
  get meterMul(){ return this.ai ? aiDiff().meter : 1; }
  // tap P (or the PARRY button) to open a short deflect window. Time it and you negate
  // the hit and answer with a free counter — no more getting blended the second you're touched.
  doParry(){
    if(this.cooldown>0 || this.hitStun>0 || this.staggerT>0 || this.ko || this.superT>0 || this.parryCool>0 || this.parryWindow>0 || this.atk) return;
    this.parryWindow=0.30; this.parryCool=PARRY_CD;   // a parry is a big commitment — one every 20s
    this.state=POSE.PARRY; this.vx*=0.5;
  }
  doCounter(){
    this.atk={kind:'counter',startup:.10,active:.15,recover:.24,dmg:22*(this.char.dmg||1),reach:92,kb:520,stun:.5,yoff:-60,award:20};
    this.state=POSE.PUNCH; this.atk.t=0; this.hasHit=false;
    this.cooldown=this.atk.startup+this.atk.active+this.atk.recover;
  }

  doAttack(kind){
    if(this.cooldown>0 || this.hitStun>0 || this.staggerT>0 || this.ko || this.superT>0 || this.parryWindow>0) return;
    const M=MOVES[kind] || MOVES.punch;
    this.atk={kind,startup:M.startup,active:M.active,recover:M.recover,
      dmg:M.dmg*this.char.dmg*this.dmul, kb:M.kb, stun:M.stun, reach:M.reach, yoff:M.yoff,
      award:M.award, launch:!!M.launch, knockdown:!!M.knockdown, heavy:!!M.heavy};
    this.state = POSE[M.state] ?? POSE.PUNCH;
    this.atk.t=0; this.hasHit=false; this.cooldown=this.atk.startup+this.atk.active+this.atk.recover;
    if(M.lunge) this.vx = this.dir*M.lunge;   // dash strike carries you in
  }
  doSuper(){ if(this.meter<this.maxMeter || this.ko || this.superT>0 || this.parryWindow>0) return; fireAbility(this); }

  update(dt,foe){
    this.t+=dt; this.cooldown=Math.max(0,this.cooldown-dt);
    this.hitFlash=Math.max(0,this.hitFlash-dt*3);
    this.hitStun=Math.max(0,this.hitStun-dt);
    this.blockStun=Math.max(0,this.blockStun-dt);
    this.invuln=Math.max(0,this.invuln-dt);
    this.parryT=Math.max(0,this.parryT-dt);
    this.parryWindow=Math.max(0,this.parryWindow-dt);
    this.parryCool=Math.max(0,this.parryCool-dt);
    this.parryKick=Math.max(0,this.parryKick-dt);
    this.parrySpark=Math.max(0,this.parrySpark-dt*3.5);
    // guard meter (Valheim-style): drains slowly when you're not taking hits on the guard
    this.blockMeter=Math.max(0,this.blockMeter-dt*BLOCK_DECAY);
    if(this.staggerT>0) this.staggerT=Math.max(0,this.staggerT-dt);
    this.blockFlash=Math.max(0,this.blockFlash-dt*2.5);
    this.comboT=Math.max(0,this.comboT-dt);
    if(this.comboT===0) this.combo=0;
    if(this.ko){ this.parryWindow=0; this.state=POSE.KO; this.applyPhysics(dt); return; }

    if(this.superT>0){
      this.superT-=dt;
      const ab=this.char.ability;
      if(ab.type==='dash'){
        this.dashTick-=dt;
        const bb={x:this.x+this.dir*10-30,y:this.top+50,w:70,h:52};
        if(this.dashTick<=0 && !foe.ko && rectHit(bb,foe.hurtbox())){
          this.dashTick=0.10;
          foe.takeHit(this,{dmg:Math.round(ab.dmg*this.char.dmg*this.dmul),kb:ab.kb,stun:.18,yoff:0});
          this.meter=Math.min(this.maxMeter,this.meter+6*this.meterMul);
          burst(this.x+this.dir*22,this.top+60,10,ab.col,1.1);
        }
        this.vx*=0.93; this.applyPhysics(dt);
        if(this.superT<=0){ this.state=POSE.IDLE; this.vx*=0.3; }
        return;
      }
      if(ab.type==='burst'){
        const bb={x:this.x+this.dir*8-42,y:this.top+36,w:94,h:64};
        if(!this.abilityFired && !foe.ko && rectHit(bb,foe.hurtbox())){
          this.abilityFired=true;
          foe.takeHit(this,{dmg:Math.round(ab.dmg*this.char.dmg*this.dmul),kb:ab.kb,stun:.55,super:true,yoff:0});
          burst(foe.x,foe.top+55,44,ab.col,1.8); ring(foe.x,foe.top+55,'#fff',34);
          blast(foe.x,foe.top+55,150,ab.col,0.55,ab.fx||'energy');
          shake=20; flashScreen=0.45;
        }
        // guarantee the signature blast even if it whiffs past the target
        if(!this.abilityFired && this.superT < (ab.dashT||0.4)*0.5){
          this.abilityFired=true;
          const bx=this.x+this.dir*44, by=this.top+55;
          blast(bx,by,140,ab.col,0.55,ab.fx||'energy');
          burst(bx,by,22,ab.col,1.2); shake=Math.max(shake,10);
        }
        this.vx*=0.90; this.applyPhysics(dt);
        if(this.superT<=0){ this.state=POSE.IDLE; this.vx*=0.3; }
        return;
      }
      if(!this.abilityFired && this.superT<0.72){
        this.abilityFired=true;
        if(ab.type==='wave'){
          spawnProjectile(this,{x:this.x+this.dir*52,y:this.top+62,vx:this.dir*ab.speed,vy:0,
            r:ab.r||34,h:ab.h||66,dmg:ab.dmg*this.dmul,kb:ab.kb,col:ab.col,life:2.0,kind:(ab.kind||'wave'),pierce:true,hp:99,superAttack:true});
          shake=8;
        } else if(ab.type==='orb'){
          const r = ab.bigOrb?(ab.r||40):20;
          spawnProjectile(this,{x:this.x+this.dir*48,y:this.top+46,vx:this.dir*ab.speed,vy:0,
            r, h:52, dmg:ab.dmg*this.dmul, kb:ab.kb, col:ab.col, life:2.6, pierce:!ab.bigOrb, hp:ab.bigOrb?99:2,
            kind:ab.bigOrb?'bigorb':'orb', superAttack:true});
        }
        burst(this.x+this.dir*46,this.top+58,16,ab.col,1.2);
      }
      this.vx*=this.onGround?0.7:0.97; this.applyPhysics(dt);
      if(this.superT<=0) this.state=POSE.IDLE;
      return;
    }

    if(this.atk){
      this.atk.t+=dt;
      const a=this.atk;
      if(a.t>=a.startup && a.t<=a.startup+a.active && !this.hasHit){
        const bb={x:this.x+this.dir*a.reach-26,y:this.top+70+a.yoff,w:52,h:40};
        if(!foe.invuln && rectHit(bb,foe.hurtbox())){
          this.hasHit=true;
          const res=foe.takeHit(this,a);
          if(res!=='parry'){
            this.meter=Math.min(this.maxMeter,this.meter+(a.award||8)*this.meterMul);
            if(res==='hit' && a.launch){ foe.vy=-430; foe.onGround=false; }
            if(res==='hit' && a.knockdown){ foe.vy=-180; foe.onGround=false; foe.hitStun=Math.max(foe.hitStun,0.5); }
          }
        }
      }
      if(a.t>=a.startup+a.active+a.recover){ this.atk=null; this.state=POSE.IDLE; }
    }
    this.control(dt,foe); this.applyPhysics(dt);
  }

  control(dt,foe){
    if(this.staggerT>0){ this.vx*=0.86; this.state=POSE.STAGGER; return; }   // guard-broken: wide open for StaggerTime
    if(this.hitStun>0 || this.blockStun>0 || (this.atk && this.atk.t<this.atk.startup+this.atk.active+this.atk.recover)){
      this.vx *= this.onGround?0.86:0.98;
      if(this.onGround && !this.atk) this.state = this.hitStun>0?POSE.HURT:this.state;
      return;
    }
    let mv=0;
    if(this.ai) mv=this.aiMove(dt,foe);
    else if(this.role==='dummy'){ this.dir = foe.x>=this.x?1:-1; if(this.onGround && !this.atk) this.state=POSE.IDLE; }
    else {
      const crouch = crouchHeld();
      if(keys['KeyA']||keys['ArrowLeft']||pad.x<-0.28) mv-=1;
      if(keys['KeyD']||keys['ArrowRight']||pad.x>0.28) mv+=1;
      if(crouch) mv=0;                                // hold crouch (Ctrl / CROUCH button)
      this.dir = foe.x>=this.x?1:-1;
      const pHeld = keys['KeyP']||padParry;
      if(pHeld && !this.parryHeld) this.doParry();     // fresh tap only — no hold-to-spam
      this.parryHeld = pHeld;
      if(this.parryWindow>0){ /* hold the deflect stance */ }
      else if(crouch) this.state=POSE.CROUCH;
      else if(keys['KeyF']||padBlock) this.state=POSE.BLOCK;
      else if(keys['KeyI']||padSuper) this.doSuper();
      else if(this.onGround) this.state = Math.abs(mv)>0.1?POSE.WALK:POSE.IDLE;
    }
    if(this.state===POSE.BLOCK||this.state===POSE.PARRY) this.vx*=0.55;
    else if(this.state===POSE.CROUCH) this.vx*=0.6;
    else this.vx=mv*this.speed;
    if(this.onGround) this.anim += Math.abs(this.vx)*dt*Math.PI*2/WALK_CYCLE_PX;
  }

  aiMove(dt,foe){
    const D=aiDiff();
    const dx=foe.x-this.x, dist=Math.abs(dx);
    if(!this.atk && this.superT<=0) this.dir = dx>=0?1:-1;
    let mv=0;

    // ---- reactive layer: read the foe's startup / incoming fire and parry or block ----
    const projIn = projectiles.some(p=>p.owner!==this && Math.sign(p.vx)===Math.sign(this.x-p.x) && Math.abs(p.x-this.x)<180);
    const tell = (foe.atk && foe.atk.t < foe.atk.startup+foe.atk.active+0.03) || foe.superT>0 || projIn;
    if(tell && !this.aiTell){
      const inRange = (foe.atk && dist <= (foe.atk.reach||80)+70) || (foe.superT>0 && dist<330) || projIn;
      const r=Math.random();
      if(inRange && r < D.parry) this.aiReaction='parry';
      else if(r < D.parry + D.block) this.aiReaction='block';
      else this.aiReaction=null;
      this.aiReactT = D.react[0] + Math.random()*(D.react[1]-D.react[0]);
    }
    this.aiTell = tell;
    if(this.aiReaction && this.aiReactT>0){
      this.aiReactT -= dt;
      if(this.aiReactT<=0){
        if(this.aiReaction==='parry') this.doParry();
        else if(this.aiReaction==='block') this.aiReaction='blockActive';
      }
    }
    if(this.parryWindow>0) return 0;                                  // hold the deflect
    if(this.aiReaction==='blockActive'){ this.state=POSE.BLOCK; if(!tell) this.aiReaction=null; return 0; }

    // ---- standing game plan on a cadence (gated by difficulty) ----
    this.aiT-=dt;
    if(this.aiT<=0){
      this.aiT = 0.12 + Math.random()*(0.34 - D.aggro*0.14);
      const roll=Math.random();
      if(this.meter>=this.maxMeter && dist<320 && roll<D.superUse) this.aiState='super';
      else if(dist<95 && this.cooldown<=0 && roll<D.aggro)         this.aiState='attack';
      else if(this.onGround && dist<190 && dist>55 && roll<D.jump)  this.aiState='jump';
      else if(dist>150)                                             this.aiState='approach';
      else if(dist<70)                                              this.aiState='space';
      else                                                          this.aiState = roll<D.aggro?'attack':'approach';
    }
    switch(this.aiState){
      case 'super': if(this.meter>=this.maxMeter) this.doSuper(); this.aiState='approach'; break;
      case 'jump':  if(this.onGround){ this.vy=-820; this.onGround=false; } this.aiState='approach'; break;
      case 'attack':
        if(dist<95 && this.cooldown<=0){
          const r=Math.random(), airborneFoe = !foe.onGround;
          let kind;
          if(airborneFoe && dist<80 && r<0.6) kind='upper';       // anti-air launcher
          else if(dist>80)                    kind = r<0.45?'kick':'dash';
          else if(r<0.14)                     kind='upper';
          else if(r<0.30)                     kind='sweep';
          else if(r<0.42)                     kind='slam';
          else                                kind = r<0.72?'punch':'kick';
          this.doAttack(kind);
        }
        mv=Math.sign(dx)*0.6*D.speed; break;
      case 'approach': mv=Math.sign(dx)*D.speed; break;
      case 'space':    mv=-Math.sign(dx)*D.spacing; break;
      case 'block':    this.state=POSE.BLOCK; break;
    }
    if(this.onGround && Math.abs(mv)>0.1 && !this.atk && this.superT<=0) this.state=POSE.WALK;
    else if(this.onGround && !this.atk && this.superT<=0) this.state=POSE.IDLE;
    return mv;
  }

  takeHit(src,a){
    // ---- PARRY: front-facing deflect inside the window negates the hit + auto-counters ----
    if(this.parryWindow>0 && !src.ko && !a.unparryable){
      const kbDir = src.x<=this.x?1:-1;
      const fromFront = this.dir!==kbDir;   // same facing rule as block: guard the side you're looking at
      const reachOK = Math.abs(src.x-this.x) <= (a.ranged?300:(a.reach!=null?a.reach+90:150));
      if(fromFront && reachOK){
        this.parryWindow=0; this.parryCool=PARRY_CD; this.parrySpark=1; this.parryKick=0.18;
        this.hp=Math.min(this.maxhp,this.hp+Math.round((a.dmg||0)*0.12));
        this.vx=0; this.hitStun=0;
        parrySparkFx(this.x,this.top+58,this.char.colA,this.dir);
        floatText(this.x,this.top+8,'PARRY!','#9ff7ff');
        shake=Math.max(shake,8); hitStop=Math.max(hitStop,0.10); flashScreen=Math.max(flashScreen,0.12);
        this.doCounter();
        return 'parry';
      }
    }
    const dir = src.x<=this.x?1:-1;
    const blocked = this.blocking() && this.dir!==dir;
    if(blocked){
      const red = a.super?0.35:0.25;                    // block only softens it: take 25% (75% reduction)
      const dealt = Math.max(1, Math.round((a.dmg||6)*red));
      this.hp-=dealt; this.blockStun=0.18; this.vx=dir*(a.kb||120)*0.35;
      this.blockFlash=1;
      this.blockMeter += guardCost(a);                  // different moves tax the guard differently
      const gcol=(styleConfig(this.char).block.guardCol)||'#9fe8ff';
      burst(this.x,this.top+60,8,gcol,.7); ring(this.x,this.top+60,gcol,10);
      guardFx(this.x,this.top+58,gcol,a.super?1.4:1);
      src.meter=Math.min(src.maxMeter,src.meter+3*src.meterMul);
      floatText(this.x,this.top+22,'-'+dealt,'#ffd166');
      if(this.blockMeter>=this.maxBlock) this.breakGuard();
      return 'block';
    }
    this.hp-=a.dmg; this.hitStun=(a.stun||0.25)+0.04; this.vx=dir*(a.kb||130);
    if(!a.super && this.onGround) this.vy=-120;
    this.hitFlash=1; this.atk=null;
    src.combo++; src.comboT=1.2;
    const col = a.super?'#ff4d8d':'#ffd166';
    burst(this.x+dir*-10,this.top+60,a.super?26:12,col,a.super?1.4:1);
    ring(this.x,this.top+58,col,a.super?26:12);
    floatText(this.x,this.top+17,Math.round(a.dmg),col);
    shake=Math.max(shake,a.super?14:5);
    if(this.hp<=0){
      if(this.role==='dummy'){ this.hp=this.maxhp; this.hitFlash=1; }
      else { this.hp=0; this.ko=true; this.state=POSE.KO; this.vy=-520; this.vx=dir*260; }
    }
    return 'hit';
  }

  applyPhysics(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(!this.onGround) this.vy+=GRAV*dt;
    const gy=GROUND_Y();
    if(this.y>=gy){ this.y=gy; this.vy=0; this.onGround=true; } else this.onGround=false;
    const L=W*0.06,R=W*0.94;
    if(this.x<L){ this.x=L; this.vx=Math.max(0,this.vx); }
    if(this.x>R){ this.x=R; this.vx=Math.min(0,this.vx); }
    if(this.onGround && this.hitStun<=0 && !this.atk) this.vx*=(1-Math.min(1,dt*8));
    if(this.hitStun>0) this.vx*=(1-Math.min(1,dt*3));
  }

  draw(g){
    const gy=GROUND_Y();
    // contact shadow
    g.save();
    const sh=Math.max(0.28,1-(gy-this.y)/280);
    g.globalAlpha=0.32*sh; g.fillStyle='#000';
    g.beginPath(); g.ellipse(this.x,gy+4,this.w*0.9*sh,11*sh,0,0,7); g.fill();
    g.restore();

    g.save();
    g.translate(this.x,this.y); g.scale(this.dir,1);
    if(this.ko) g.rotate(-this.dir*1.35);
    paintFighter(g,this.char,this);
    g.restore();

    if(this.combo>1 && this.comboT>0){
      g.save(); g.font='bold 22px Trebuchet MS'; g.fillStyle='#ffd166'; g.textAlign='center';
      g.globalAlpha=Math.min(1,this.comboT*3);
      g.fillText(this.combo+' HIT',this.x,this.top-24); g.restore();
    }
  }
}

function styleConfig(c){ return STYLE_CFG[c.style] || STYLE_CFG.brawler; }
function walkJoint(K,sk){
  K=((K%1)+1)%1;
  const e=sk?sk.walk:STYLE_CFG.brawler.walk, ease=t=>t*t*(3-2*t);
  const C=(keys)=>{                              // smooth keyed curve
    for(let i=0;i<keys.length-1;i++){
      const [k0,v0]=keys[i], [k1,v1]=keys[i+1];
      if(K>=k0&&K<=k1){ const t=(K-k0)/(k1-k0||1); return v0+(v1-v0)*ease(t); }
    }
    return keys[keys.length-1][1];
  };
  const ha=e.hipAmp;
  const hipFwd  = C([[0,.50],[.12,.29],[.25,.06],[.40,-.24],[.50,-.44],[.62,-.26],[.75,.13],[.88,.44],[1,.50]])*ha + (e.hipBack||0); // + = knee forward
  const kneeFlex= C([[0,.16],[.12,.28],[.25,.20],[.40,.16],[.50,.40],[.62,.95],[.72,1.28],[.82,.82],[.92,.32],[1,.16]])*e.kneeAmp; // + = heel folds back
  const ank     = C([[0,-.10],[.12,.05],[.25,.00],[.40,.10],[.50,.45],[.62,.30],[.72,.05],[.82,-.05],[.92,-.12],[1,-.10]])*ha; // + = toes down
  return {thigh:-hipFwd, knee:kneeFlex, foot:ank};
}
function kickPose(st,stage,k){
  const S=st.kick;
  if(stage==='wind') return {th:lerp(S.w[0],S.w[1],k), kn:lerp(S.w[2],S.w[3],k), ft:lerp(S.w[4],S.w[5],k)};
  if(stage==='hit')  return {th:lerp(S.h[0],S.h[1],k), kn:lerp(S.h[2],S.h[3],k), ft:lerp(S.h[4],S.h[5],k)};
  return {th:S.r[0]+(S.h[1]-S.r[0])*0, kn:S.r[1], ft:lerp(S.r[2],S.r[3],k), rec:true};
}
function punchPose(st,stage,k){
  const P=st.punch;
  if(stage==='wind') return {fUp:lerp(P.wind[0],P.wind[1],k), fElb:lerp(P.wind[2],P.wind[3],k)};
  if(stage==='hit')  return {fUp:lerp(P.hit[0],P.hit[1],k),  fElb:lerp(P.hit[2],P.hit[3],k)};
  return {fUp:lerp(P.rec[0],P.rec[1],k), fElb:lerp(P.rec[2],P.rec[3],k)};
}
function atkStage(a){
  if(a.t < a.startup)               return {stage:'wind', k: a.startup?a.t/a.startup:1};
  if(a.t < a.startup+a.active)      return {stage:'hit',  k: (a.t-a.startup)/(a.active||1)};
  return {stage:'rec', k: (a.t-a.startup-a.active)/(a.recover||1)};
}
function paintFighter(g,c,S){
  const t=S.t||0, a=S.anim||0, state=S.state??POSE.IDLE;
  const flash=S.hitFlash>0;
  const gi   = flash?'#ffffff':c.colA;
  const sub  = flash?'#ffffff':c.colB;
  const hairC= flash?'#ffffff':c.colC;
  const skin = flash?'#ffffff':c.skin;
  const shoe = flash?'#ffffff':c.shoe;
  const cr = state===POSE.CROUCH, sgr = state===POSE.STAGGER;
  const bob  = (state===POSE.WALK ? Math.abs(Math.sin(a*Math.PI*2))*2.4
             : state===POSE.IDLE ? Math.sin(t*3)*2 : 0) + (cr?16:0) + (sgr?Math.abs(Math.sin(t*13))*4:0);

  const eB=state===POSE.BLOCK, pn=state===POSE.PUNCH, kk=state===POSE.KICK, sp=state===POSE.SUPER, pry=state===POSE.PARRY;
  const accept = pry || (S.parrySpark>0);   // cross-arm deflect guard (parry stance + the moment after a deflect)
  const walking = state===POSE.WALK;
  const airborne = state===POSE.JUMP || S.onGround===false;
  const pnPh = (pn && S.atk) ? atkStage(S.atk) : null;
  const kkPh = (kk && S.atk) ? atkStage(S.atk) : null;
  const upPh = (state===POSE.UPPER && S.atk) ? atkStage(S.atk) : null;
  const swPh = (state===POSE.SWEEP && S.atk) ? atkStage(S.atk) : null;
  const dsPh = (state===POSE.DASH  && S.atk) ? atkStage(S.atk) : null;
  const slPh = (state===POSE.SLAM  && S.atk) ? atkStage(S.atk) : null;
  const mvPh = upPh||swPh||dsPh||slPh;

  // ---- per-character style ----
  const STD=styleConfig(c), WK=STD.walk;
  const bGuard=STD.block.b, fGuard=STD.block.f;   // both arms raised into a face guard when blocking
  // ---- legs (thigh + shin + foot, knee folds backward) ----
  const HIP_Y=-48+bob, THIGH=STD.thigh, SHIN=STD.shin, LEGW=STD.legW;
  const SP=STD.spread!=null?STD.spread:8;
  if(kkPh){
    // planted rear leg
    drawLeg3d(g,-SP,HIP_Y, STD.kickRear[0],STD.kickRear[1], THIGH,SHIN,LEGW, dark(c.colB,0.12), shoe);
    // kicking front leg: knee up -> snap out -> retract
    const p=kickPose(STD,kkPh.stage,smooth(kkPh.k));
    drawLeg3d(g,SP,HIP_Y, p.th,p.kn, THIGH,SHIN,LEGW, c.colB, shoe, p.ft);
  } else if(swPh){
    // sweep: planted rear leg, front leg whips out low across the ground
    const p=smooth(swPh.k);
    drawLeg3d(g,-SP,HIP_Y, 0.18,-0.55, THIGH,SHIN,LEGW, dark(c.colB,0.12), shoe);
    const ext = swPh.stage==='wind'? lerp(0.2,0.5,p) : swPh.stage==='hit'? 1 : lerp(1,0.2,p);
    drawLeg3d(g,SP,HIP_Y+6, 1.05*ext, -0.22, THIGH,SHIN,LEGW, c.colB, shoe, 0.55);
  } else if(dsPh){
    // dash strike: leading front leg, trailing rear leg
    drawLeg3d(g,-SP,HIP_Y, 0.62,-0.95, THIGH,SHIN,LEGW, dark(c.colB,0.12), shoe, 0.2);
    drawLeg3d(g,SP,HIP_Y, -0.55,-0.65, THIGH,SHIN,LEGW, c.colB, shoe, 0.3);
  } else if(walking){
    for(const L of [{hip:-SP,ph:0,col:dark(c.colB,0.12)},{hip:SP,ph:0.5,col:c.colB}]){
      const j=walkJoint(a/6.2831853+L.ph, STD);      // real hip/knee/ankle curves (per-style)
      drawLeg3d(g,L.hip,HIP_Y,j.thigh,j.knee,THIGH,SHIN,LEGW,L.col,shoe,j.foot);
    }
  } else if(airborne){
    drawLeg3d(g,-SP,HIP_Y, 0.45,-0.75, THIGH,SHIN,LEGW,dark(c.colB,0.12),shoe, 0.3);
    drawLeg3d(g, SP,HIP_Y,-0.35,-0.5,  THIGH,SHIN,LEGW,c.colB,shoe, 0.3);
  } else if(cr){
    drawLeg3d(g,-SP,HIP_Y, 1.0,-0.42, THIGH,SHIN,LEGW,dark(c.colB,0.12),shoe, 0.35);
    drawLeg3d(g, SP,HIP_Y, 1.0,-0.42, THIGH,SHIN,LEGW,c.colB,shoe, 0.35);
  } else if(sgr){
    const wob=Math.sin(t*13)*0.14;                       // guard broken: off-balance wobbly stance
    drawLeg3d(g,-SP-3,HIP_Y, 0.30+wob,-0.34, THIGH,SHIN,LEGW,dark(c.colB,0.12),shoe, 0.25);
    drawLeg3d(g, SP+3,HIP_Y,-0.30-wob,-0.38, THIGH,SHIN,LEGW,c.colB,shoe, 0.2);
  } else {
    drawLeg3d(g,-SP,HIP_Y, 0.06,-0.10, THIGH,SHIN,LEGW,dark(c.colB,0.12),shoe);
    drawLeg3d(g, SP,HIP_Y,-0.06,-0.10, THIGH,SHIN,LEGW,c.colB,shoe);
  }

  // ---- torso ----
  const TW=STD.torsoW, TH=STD.torsoH, TX=-TW/2, TY=-92+bob;
  part3d(g,TX,TY,TW,TH,11,sub);
  part3d(g,TX,TY,TW,TH*0.65,11,gi);             // gi top
  g.save();                                      // sash / belt
  part3d(g,TX,-64+bob,TW,STD.beltH,3, light(c.colB,0.05));
  g.restore();
  // chest emblem highlight
  g.save(); g.globalAlpha=.20; g.fillStyle='#fff';
  roundRect(g,-10,-88+bob,18,16,6); g.fill(); g.restore();

  // ---- back arm (counterbalances the front arm) ----
  const armSw = walking ? Math.cos(a) : Math.sin(t*2)*4;
  const aAmp = walking ? WK.armAmp : 1;
  let bUp, bElb;
  if(walking){ bUp=armSw*0.55*aAmp; bElb=-0.5-Math.max(0,armSw)*0.35*aAmp; }
  else if(pnPh && S.atk.kind==='punch'){ bUp=STD.block.b[0]; bElb=STD.block.b[1]; }   // retract to guard
  else if(kkPh){ bUp=1.15; bElb=-0.55; }                                     // swing back for balance
  else if(upPh){ bUp=-1.9; bElb=-0.9; }                                      // uppercut: back arm guards
  else if(slPh){ bUp=slPh.stage==='wind'?-2.7:-0.4; bElb=-0.7; }             // slam: both arms overhead
  else if(swPh||dsPh){ bUp=-0.55; bElb=-0.95; }
  else if(accept){ bUp=-2.15; bElb=-1.20; }                                  // deflect: cross-arm guard
  else if(eB){ bUp=bGuard[0]; bElb=bGuard[1]; }
  else if(sp){ bUp=-Math.PI/2-0.35; bElb=-0.35; }
  else if(cr){ bUp=0.5; bElb=-1.0; }
  else if(sgr){ bUp=1.35+Math.sin(t*13)*0.2; bElb=-0.35; }          // arms flung out, defenceless
  else { bUp=STD.idle.bUp; bElb=STD.idle.bElb; }
  drawArm3d(g,-15,-86+bob, bUp, bElb, STD.upLen,STD.foreLen, STD.armW, eB?light(dark(c.colB,0.12),0.18):dark(c.colB,0.12), skin, 6.5);

  // ---- front arm ----
  let fUp, fElb;
  if(pnPh && S.atk){
    // wind up (pull elbow back) -> snap out straight -> retract (per-style)
    const p=punchPose(STD,pnPh.stage,smooth(pnPh.k)); fUp=p.fUp; fElb=p.fElb;
  } else if(kkPh){
    fUp=-0.75; fElb=-0.9;                                                      // arms up while kicking
  } else if(upPh){
    const p=smooth(upPh.k);                                                   // uppercut: sweep low -> up
    if(upPh.stage==='wind'){ fUp=lerp(0.35,0.75,p); fElb=lerp(-1.0,-1.5,p); }
    else if(upPh.stage==='hit'){ fUp=-2.55; fElb=-0.15; }
    else { fUp=lerp(-2.55,-0.25,p); fElb=lerp(-0.15,-0.55,p); }
  } else if(swPh){ fUp=-1.05; fElb=-0.5; }                                    // sweep: arms out for balance
  else if(dsPh){ fUp=-1.35; fElb=-0.12; }                                     // dash: arm thrust forward
  else if(slPh){
    const p=smooth(slPh.k);                                                   // slam: raise -> smash down
    if(slPh.stage==='wind'){ fUp=lerp(-1.4,-2.7,p); fElb=lerp(-0.5,-0.95,p); }
    else if(slPh.stage==='hit'){ fUp=-0.30; fElb=-0.10; }
    else { fUp=lerp(-0.30,-0.45,p); fElb=lerp(-0.10,-0.6,p); }
  } else if(walking){
    fUp=-Math.cos(a)*0.55*aAmp; fElb=-0.45-Math.max(0,Math.cos(a))*0.5*aAmp;   // near arm opposes the far leg
  } else if(accept){ fUp=-2.15; fElb=-1.20; }                                  // deflect: cross-arm guard
  else if(eB){ fUp=fGuard[0]; fElb=fGuard[1]; }
  else if(sp){ fUp=-Math.PI/2-0.35; fElb=-0.35; }
  else if(cr){ fUp=0.45; fElb=-1.0; }
  else if(sgr){ fUp=1.25-Math.sin(t*13)*0.2; fElb=-0.35; }           // arms flung out, defenceless
  else { fUp=STD.idle.fUp+Math.sin(t*2)*0.05; fElb=STD.idle.fElb; }
  drawArm3d(g,15,-86+bob, fUp, fElb, STD.upLen+2,STD.foreLen+2, STD.armW, eB?light(gi,0.20):gi, skin, 7);

  // punching fist highlight
  if(pnPh && pnPh.stage==='hit' && S.atk){
    g.save(); g.translate(15,-86+bob); g.rotate(fUp); g.translate(0,42);
    sphere3d(g,0,0,9.5,gi); g.restore();
  }
  if(sp){ g.save(); g.shadowColor=c.colA; g.shadowBlur=22; g.fillStyle=c.colA;
    g.beginPath(); g.arc(23,-74+bob,13,0,7); g.fill(); g.restore(); }

  // ---- neck + head ----
  part3d(g,-5,-98+bob,10,8,3,skin);
  sphere3d(g,1,-110+bob,15,skin);
  drawHair3d(g,c,-110+bob,hairC);
  // eyes + brow
  g.save(); g.fillStyle='#1c1a22';
  roundRect(g,3,-115+bob,4.5,3.2,1.4); g.fill();
  roundRect(g,10,-115+bob,3.6,3.2,1.4); g.fill();
  g.strokeStyle='#1c1a22'; g.lineWidth=1.6; g.lineCap='round';
  g.beginPath(); g.moveTo(2,-119+bob); g.lineTo(8,-118+bob); g.stroke();
  g.beginPath(); g.moveTo(9.5,-118+bob); g.lineTo(14,-119+bob); g.stroke();
  g.restore();

  // ---- block guard: forearms + shield drawn ON TOP of the head so the guard reads in front of the face ----
  if(eB){
    const gc=(STD.block.guardCol)||c.colA, gk=(STD.block.guardKind)||'ki', t0=S.t||0;

    drawArm3d(g,-15,-86+bob, bGuard[0], bGuard[1], STD.upLen,STD.foreLen, STD.armW, light(dark(c.colB,0.12),0.18), skin, 6.5);
    g.save();

    gg.addColorStop(0,hexA(light(gc,.4),.34)); gg.addColorStop(1,hexA(gc,0));
    g.fillStyle=gg; g.beginPath(); g.arc(19,-108,32,0,7); g.fill();
    g.strokeStyle=hexA(gc,.85); g.lineWidth=3; g.shadowColor=gc; g.shadowBlur=16;
    const rr=13+Math.sin(t0*5)*1.6;
    g.beginPath(); g.arc(19,-108,rr,0,7); g.stroke();
    if(gk==='ki'){ g.globalAlpha=.5; g.beginPath(); g.arc(19,-108,rr+7+Math.sin(t0*7)*2,0,7); g.stroke(); }
    if(gk==='fire'){ g.globalAlpha=.7;
      for(let i=0;i<5;i++){ const a=-1.4+i*0.44+t0*1.2;
        g.beginPath(); g.moveTo(19,-108); g.lineTo(19+Math.cos(a)*22,-108+Math.sin(a)*22); g.stroke(); } }
    if(gk==='dark'){ g.globalAlpha=.55; g.strokeStyle=hexA('#12001f',.9); g.shadowBlur=12;
      for(let i=0;i<3;i++){ const a=t0*2+i*2.1;
        g.beginPath(); g.arc(19,-108,rr+3+i*4,a,a+1.8); g.stroke(); } }
    if(gk==='impact'){ g.globalAlpha=.6; g.strokeStyle='#fff'; g.shadowBlur=18;
      g.beginPath(); g.moveTo(8,-130); g.lineTo(30,-86); g.stroke(); }
    g.restore();
    drawArm3d(g,15,-86+bob, fGuard[0], fGuard[1], STD.upLen+2,STD.foreLen+2, STD.armW, light(gi,0.20), skin, 7);
  }

  // ---- parry deflect halo (active window) ----
  if(pry){
    g.save();
    const gc=c.colA, t0=S.t||0;
    const rg=g.createRadialGradient(20,-104,2,20,-104,38);
    rg.addColorStop(0,hexA(light(gc,.5),.30)); rg.addColorStop(1,hexA('#9ff7ff',0));
    g.fillStyle=rg; g.beginPath(); g.arc(20,-104,38,0,7); g.fill();
    g.strokeStyle=hexA('#9ff7ff',.85); g.lineWidth=3; g.shadowColor='#9ff7ff'; g.shadowBlur=18;
    const rr=16+Math.sin(t0*10)*2;
    g.beginPath(); g.arc(20,-104,rr,0,7); g.stroke();
    g.globalAlpha=.5; g.beginPath(); g.arc(20,-104,rr+7,0,7); g.stroke();
    g.restore();
  }

  // ---- move strike fx (upper / sweep / dash / slam) ----
  if(mvPh && mvPh.stage==='hit' && S.atk){
    const fc=(STD.block.punchCol)||c.colA, hx=S.atk.reach;
    g.save(); g.lineCap='round';
    if(upPh){                                    // rising ki arc
      const lg=g.createLinearGradient(hx,-40,hx,-140);
      lg.addColorStop(0,hexA(fc,.1)); lg.addColorStop(.6,hexA(light(fc,.4),.85)); lg.addColorStop(1,hexA('#ffffff',0));
      g.strokeStyle=lg; g.lineWidth=10; g.shadowColor=fc; g.shadowBlur=26;
      g.beginPath(); g.moveTo(hx-6,-40); g.quadraticCurveTo(hx+22,-100,hx-2,-138); g.stroke();
      g.globalAlpha=.95; g.strokeStyle='#fff'; g.lineWidth=4;
      g.beginPath(); g.moveTo(hx-4,-46); g.quadraticCurveTo(hx+18,-98,hx-2,-132); g.stroke();
    } else if(swPh){                             // ground dust sweep
      g.globalAlpha=.85; g.strokeStyle='#fff'; g.lineWidth=5; g.shadowColor=fc; g.shadowBlur=22;
      g.beginPath(); g.moveTo(6,-14); g.quadraticCurveTo(hx*0.5,-26,hx,-10); g.stroke();
      for(let i=0;i<6;i++){ g.globalAlpha=.5; g.fillStyle=fc;
        g.beginPath(); g.arc(10+i*13,-8-((i*7)%9),3+((i*5)%4),0,7); g.fill(); }
    } else if(dsPh){                             // forward impact streak
      g.globalAlpha=.95; g.strokeStyle='#fff'; g.lineWidth=6; g.shadowColor=fc; g.shadowBlur=26;
      g.beginPath(); g.moveTo(0,-62); g.lineTo(hx,-58); g.stroke();
      g.globalAlpha=.5; g.strokeStyle=fc; g.lineWidth=3;
      for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(-4,-70+i*12); g.lineTo(hx-10,-64+i*12); g.stroke(); }
    } else if(slPh){                             // heavy boom shockwave
      const R=26;
      const sg=g.createRadialGradient(hx,-70,1,hx,-70,R*1.8);
      sg.addColorStop(0,hexA('#ffffff',.95)); sg.addColorStop(.45,hexA(fc,.8)); sg.addColorStop(1,hexA(fc,0));
      g.fillStyle=sg; g.beginPath(); g.arc(hx,-70,R*1.8,0,7); g.fill();
      g.globalAlpha=.9; g.strokeStyle='#fff'; g.lineWidth=6; g.shadowColor=fc; g.shadowBlur=30;
      g.beginPath(); g.arc(hx,-70,R*0.6,0,7); g.stroke();
      g.globalAlpha=.8; g.strokeStyle=fc; g.lineWidth=3;
      g.beginPath(); g.arc(hx,-70,R,0,7); g.stroke();
      for(let i=0;i<9;i++){ const ang=i/9*6.283;
        g.beginPath(); g.moveTo(hx+Math.cos(ang)*R*0.7,-70+Math.sin(ang)*R*0.7);
        g.lineTo(hx+Math.cos(ang)*R*1.9,-70+Math.sin(ang)*R*1.9); g.stroke(); }
    }
    g.restore();
  }

  // ---- strike impact fx on active frames ----
  if(pnPh && pnPh.stage==='hit' && S.atk){
    const hx=S.atk.reach-4, fx0=(STD.block.punchFx)||'impact', fc=(STD.block.punchCol)||c.colA;
    g.save(); g.lineCap='round';
    if(fx0==='shock'||fx0==='boom'){
      const R=fx0==='boom'?20:16;
      const sg=g.createRadialGradient(hx,-70,1,hx,-70,R*1.7);
      sg.addColorStop(0,hexA('#ffffff',.95)); sg.addColorStop(.45,hexA(fc,.8)); sg.addColorStop(1,hexA(fc,0));
      g.fillStyle=sg; g.beginPath(); g.arc(hx,-70,R*1.7,0,7); g.fill();
      g.globalAlpha=.95; g.strokeStyle='#ffffff'; g.lineWidth=6; g.shadowColor=fc; g.shadowBlur=30;
      g.beginPath(); g.arc(hx,-70,R*0.55,0,7); g.stroke();
      g.globalAlpha=.8; g.strokeStyle=hexA(fc,.9); g.lineWidth=3;
      g.beginPath(); g.arc(hx,-70,R*0.9,0,7); g.stroke();
      if(fx0==='boom'){ g.globalAlpha=.85; g.strokeStyle='#fff'; g.lineWidth=3;
        for(let i=0;i<8;i++){ const a=i/8*6.283;
          g.beginPath(); g.moveTo(hx+Math.cos(a)*R*0.6, -70+Math.sin(a)*R*0.6);
          g.lineTo(hx+Math.cos(a)*R*1.8, -70+Math.sin(a)*R*1.8); g.stroke(); } }
    } else if(fx0==='flame'||fx0==='darkflame'){
      const base=fx0==='flame'?fc:'#a24dff';
      g.globalAlpha=.9; g.strokeStyle='#fff'; g.lineWidth=5; g.shadowColor=base; g.shadowBlur=26;
      g.beginPath(); g.moveTo(15,-86); g.lineTo(hx,-70); g.stroke();
      for(let i=0;i<7;i++){ const a=-1.25+i*0.42, rr=30+((i*7)%14);
        const px=hx-6, py=-70;
        const fg=g.createRadialGradient(px,py,1,px+Math.cos(a)*rr,py+Math.sin(a)*rr,14);
        fg.addColorStop(0,hexA(fx0==='flame'?'#fff2c0':'#e8c8ff',.95));
        fg.addColorStop(.5,hexA(base,.85)); fg.addColorStop(1,hexA(dark(base,.4),0));
        g.fillStyle=fg; g.beginPath(); g.arc(px+Math.cos(a)*rr,py+Math.sin(a)*rr,14,0,7); g.fill(); }
    } else { // 'impact' — sai blow-through
      g.globalAlpha=.95; g.strokeStyle='#fff'; g.lineWidth=6;
      g.shadowColor=fc; g.shadowBlur=26;
      g.beginPath(); g.moveTo(15,-86); g.lineTo(hx,-70); g.stroke();
      g.globalAlpha=.5; g.strokeStyle=fc; g.lineWidth=3;
      g.beginPath(); g.moveTo(15,-96); g.lineTo(hx-6,-84); g.stroke();
      g.beginPath(); g.moveTo(15,-76); g.lineTo(hx-6,-58); g.stroke();
    }
    g.restore();
  }
  if(kkPh && kkPh.stage==='hit' && S.atk){
    const hx=S.atk.reach, hy=-34;
    g.save(); g.globalAlpha=.95; g.strokeStyle='#fff'; g.lineWidth=7; g.lineCap='round';
    g.shadowColor=c.colA; g.shadowBlur=28;
    g.beginPath(); g.moveTo(6,-40); g.lineTo(hx,hy); g.stroke();
    g.globalAlpha=.45; g.strokeStyle=c.colA; g.lineWidth=3;
    g.beginPath(); g.moveTo(2,-52); g.lineTo(hx-8,-46); g.stroke();
    g.beginPath(); g.moveTo(2,-30); g.lineTo(hx-8,-22); g.stroke();
    g.restore();
  }

  // ---- ability aura ----
  if(sp){
    const ab=c.ability, col=ab.col;
    const denom = (ab.type==='dash'||ab.type==='burst')?(ab.dashT||0.4):0.9;
    const p = 1-S.superT/denom;
    g.save();
    const fade=(1-p);
    // ground charge ring
    g.globalAlpha=0.65*fade; g.strokeStyle=col; g.lineWidth=4; g.shadowColor=col; g.shadowBlur=24;
    g.beginPath(); g.ellipse(0,2,70+p*130,18+p*28,0,0,7); g.stroke();
    // rising energy column
    const ch=g.createLinearGradient(0,-180,0,10);
    ch.addColorStop(0,hexA(col,0)); ch.addColorStop(.6,hexA(col,.32*fade)); ch.addColorStop(1,hexA(light(col,.3),.5*fade));
    g.globalAlpha=1; g.shadowBlur=0; g.fillStyle=ch;
    g.beginPath(); g.moveTo(-26,-180); g.lineTo(26,-180); g.lineTo(42,6); g.lineTo(-42,6); g.closePath(); g.fill();
    // aura rings pulsing up the body
    for(let i=0;i<4;i++){
      const yy=4-i*40-((p*44)%40);
      g.globalAlpha=0.55*fade*(1-i*0.18); g.strokeStyle=col; g.lineWidth=3;
      g.beginPath(); g.ellipse(0,yy,46-i*5,13-i*2.4,0,0,7); g.stroke();
    }
    // bright core flare
    g.globalAlpha=0.4*fade;
    const cg=g.createRadialGradient(0,-92,4,0,-92,96+p*80);
    cg.addColorStop(0,hexA(light(col,.5),.9)); cg.addColorStop(1,hexA(col,0));
    g.fillStyle=cg; g.beginPath(); g.arc(0,-92,96+p*80,0,7); g.fill();
    // point-blank charge in the extended hand (burst/dash abilities)
    if(ab.type==='burst'||ab.type==='dash'){
      const bx=36, by=-84, R=(ab.fx==='fire'?28:20)+p*20;
      g.globalAlpha=fade;
      const og=g.createRadialGradient(bx,by,2,bx,by,R*2.4);
      og.addColorStop(0,hexA('#ffffff',.98)); og.addColorStop(.4,hexA(light(col,.4),.9)); og.addColorStop(1,hexA(col,0));
      g.fillStyle=og; g.beginPath(); g.arc(bx,by,R*2.4,0,7); g.fill();
      // radial flick
      g.globalAlpha=fade*.85; g.strokeStyle=hexA(light(col,.4),.95); g.lineWidth=3.5; g.lineCap='round';
      for(let i=0;i<6;i++){ const a=-0.7+i*0.28;
        g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+Math.cos(a)*R*2.8, by+Math.sin(a)*R*2.8); g.stroke(); }
      // flame tongues for the fire variant
      if(ab.fx==='fire'){
        g.globalAlpha=fade*.9;
        for(let i=0;i<8;i++){ const a=i/8*6.283+R*0.2;
          const px=bx+Math.cos(a)*R*1.6, py=by+Math.sin(a)*R*1.6-R*0.4;
          const fg=g.createRadialGradient(px,py,1,px,py,R*0.9);
          fg.addColorStop(0,hexA('#fff2c0',.95)); fg.addColorStop(.5,hexA(col,.85)); fg.addColorStop(1,hexA(dark(col,.4),0));
          g.fillStyle=fg; g.beginPath(); g.arc(px,py,R*0.9,0,7); g.fill(); }
      }
    }
    g.restore();
  }
}

function drawHair3d(g,c,y,hairC){
  switch(c.hair){
    case 'goku': { // big black spikes
      g.save(); g.strokeStyle=dark(hairC,0.55); g.lineWidth=1.6; g.lineJoin='round';
      const spikes=[[-15,-4,-24,-22],[-9,-10,-12,-30],[-2,-12,2,-32],[5,-11,12,-30],[12,-7,20,-22],[16,-2,16,-14]];
      g.beginPath();
      g.moveTo(-16,y+2);
      for(const s of spikes){ g.lineTo(s[0],y+s[1]); g.lineTo(s[2],y+s[3]); }
      g.lineTo(15,y+2); g.closePath();
      const grd=g.createLinearGradient(-16,y-32,16,y+2);
      grd.addColorStop(0,light(hairC,0.42)); grd.addColorStop(0.5,hairC); grd.addColorStop(1,dark(hairC,0.5));
      g.fillStyle=grd; g.fill(); g.stroke();
      // side burns
      g.fillStyle=dark(hairC,0.3); roundRect(g,-16,y-2,5,12,2); g.fill();
      g.restore(); break;
    }
    case 'vegeta': { // upswept flame with widow's peak
      g.save(); g.strokeStyle=dark(hairC,0.55); g.lineWidth=1.6; g.lineJoin='round';
      g.beginPath();
      g.moveTo(-16,y+2); g.lineTo(-14,y-16); g.lineTo(-8,y-26); g.lineTo(-4,y-14);
      g.lineTo(-1,y-20); g.lineTo(2,y-33); g.lineTo(6,y-18); g.lineTo(9,y-28);
      g.lineTo(13,y-12); g.lineTo(16,y-18); g.lineTo(16,y+2); g.closePath();
      const grd=g.createLinearGradient(-16,y-32,16,y+2);
      grd.addColorStop(0,light(hairC,0.4)); grd.addColorStop(0.5,hairC); grd.addColorStop(1,dark(hairC,0.5));
      g.fillStyle=grd; g.fill(); g.stroke(); g.restore(); break;
    }
    case 'hiei': { // tall chaotic black spikes
      g.save(); g.strokeStyle=dark(hairC,0.55); g.lineWidth=1.6; g.lineJoin='round';
      g.beginPath();
      g.moveTo(-15,y+3); g.lineTo(-13,y-18); g.lineTo(-7,y-30); g.lineTo(-4,y-18);
      g.lineTo(-1,y-35); g.lineTo(3,y-19); g.lineTo(8,y-31); g.lineTo(11,y-16);
      g.lineTo(16,y-20); g.lineTo(15,y+3); g.closePath();
      const grd=g.createLinearGradient(-15,y-35,16,y+3);
      grd.addColorStop(0,light(hairC,0.35)); grd.addColorStop(0.5,hairC); grd.addColorStop(1,dark(hairC,0.5));
      g.fillStyle=grd; g.fill(); g.stroke();
      // signature white starburst streak
      g.save(); g.globalAlpha=.9; g.fillStyle='#eef0ff';
      g.beginPath(); g.moveTo(1,y-34); g.lineTo(3.4,y-22); g.lineTo(6.6,y-31); g.lineTo(4,y-20); g.closePath(); g.fill();
      g.restore();
      g.restore(); break;
    }
    case 'shishio': { // wild dark hair + head bandages
      g.save(); g.strokeStyle=dark(hairC,0.5); g.lineWidth=1.6; g.lineJoin='round';
      g.beginPath();
      g.moveTo(-16,y+4); g.lineTo(-17,y-16); g.lineTo(-9,y-24); g.lineTo(-2,y-20);
      g.lineTo(4,y-30); g.lineTo(9,y-18); g.lineTo(16,y-24); g.lineTo(17,y-5); g.lineTo(15,y+4); g.closePath();
      const grd=g.createLinearGradient(-17,y-30,17,y+4);
      grd.addColorStop(0,light(hairC,0.3)); grd.addColorStop(0.5,hairC); grd.addColorStop(1,dark(hairC,0.5));
      g.fillStyle=grd; g.fill(); g.stroke();
      // bandage wrap across the crown
      g.strokeStyle='#e3d7bb'; g.lineWidth=4; g.lineCap='round';
      g.beginPath(); g.moveTo(-14,y-9); g.lineTo(14,y-15); g.stroke();
      g.beginPath(); g.moveTo(-13,y-16); g.lineTo(15,y-20); g.stroke();
      g.beginPath(); g.moveTo(-10,y-23); g.lineTo(12,y-25); g.stroke();
      g.restore(); break;
    }
    case 'bald': { // shine
      g.save(); g.globalAlpha=.5; g.fillStyle='#fff';
      g.beginPath(); g.ellipse(2,y-7,7,4,-0.5,0,7); g.fill(); g.restore(); break;
    }
  }
}

function drawVoidBg(g,gy,A){
  g.save();
  const rg=g.createRadialGradient(W/2,gy*0.55,10,W/2,gy*0.55,Math.max(W,H)*0.72);
  rg.addColorStop(0,'rgba(255,255,255,.6)'); rg.addColorStop(.5,'rgba(222,232,246,.28)'); rg.addColorStop(1,'rgba(160,180,210,0)');
  g.fillStyle=rg; g.fillRect(0,0,W,gy); g.restore();
  g.save(); g.globalAlpha=.5;
  for(let i=0;i<14;i++){
    const bx=((i*337)%W), by=gy*(0.10+((i*97)%62)/100), s=3+(i%4)*3;
    g.fillStyle= i%2?'#9fb0c8':'#c3cfdf';
    g.beginPath(); g.moveTo(bx,by-s); g.lineTo(bx+s,by); g.lineTo(bx,by+s); g.lineTo(bx-s,by); g.closePath(); g.fill();
  }
  g.restore();
}
function drawArena(g){
  const gy=GROUND_Y(), A=currentArena();
  const sky=g.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,A.sky[0]); sky.addColorStop(.55,A.sky[1]); sky.addColorStop(1,A.sky[2]);
  g.fillStyle=sky; g.fillRect(0,0,W,gy);
  g.save(); g.globalAlpha=.10;
  for(let i=0;i<7;i++){
    const yy=gy*(0.10+i*0.11);
    g.strokeStyle= i%2?A.line1:A.line2; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,yy); g.lineTo(W,yy-40); g.stroke();
  }
  g.restore();
  if(A.motif==='city') drawCitySil(g,gy,A);
  else if(A.motif==='mesa') drawMesaSil(g,gy,A);
  else if(A.motif==='ice') drawIceBg(g,gy,A);
  else drawVoidBg(g,gy,A);
  const gg=g.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,A.floor[0]); gg.addColorStop(1,A.floor[1]);
  g.fillStyle=gg; g.fillRect(0,gy,W,H-gy);
  g.save();
  g.shadowColor=A.edgeGlow; g.shadowBlur=16; g.strokeStyle=A.edge; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,gy); g.lineTo(W,gy); g.stroke(); g.restore();
  g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=1;
  for(let i=-6;i<=6;i++){ g.beginPath(); g.moveTo(W/2+i*70,gy); g.lineTo(W/2+i*300,H); g.stroke(); }
}

function drawProjectiles(g){
  for(const p of projectiles){
    const vs=Math.hypot(p.vx,p.vy)||1, ux=p.vx/vs, uy=p.vy/vs;
    g.save();
    // ---- tapered glowing wake ----
    for(let i=0;i<p.trail.length;i++){
      const q=p.trail[i], k=(i+1)/p.trail.length;
      const rr=(p.r*0.85)*k;
      g.globalAlpha=k*0.30;
      const tg=g.createRadialGradient(q.x,q.y,1,q.x,q.y,rr*1.5);
      tg.addColorStop(0,hexA(light(p.col,.35),.9)); tg.addColorStop(.55,hexA(p.col,.4)); tg.addColorStop(1,hexA(p.col,0));
      g.fillStyle=tg;
      g.beginPath(); g.ellipse(q.x,q.y,rr*1.4,rr*0.9,Math.atan2(uy,ux),0,7); g.fill();
    }
    g.globalAlpha=1;
    // bright core streak tying the wake to the head
    if(p.trail.length>1){
      const first=p.trail[0];
      g.globalAlpha=0.45; g.strokeStyle=hexA(light(p.col,.45),.75); g.lineWidth=p.r*0.5; g.lineCap='round';
      g.beginPath(); g.moveTo(first.x,first.y); g.lineTo(p.x,p.y); g.stroke(); g.globalAlpha=1;
    }
    if(p.kind==='dragon')      drawDragon(g,p);
    else if(p.kind==='wave')   drawBeam(g,p,ux,uy);
    else if(p.kind==='bigorb') drawOrb(g,p.x,p.y,p.r,p.col,1.0,false);
    else                       drawOrb(g,p.x,p.y,p.r,p.col,0.62,true);
    g.restore();
  }
}

// glowing energy sphere with a hot core + crackling corona (Big Bang / orbs)
function drawOrb(g,x,y,r,col,coreScale,pierce){
  g.save(); g.translate(x,y);
  if(pierce){                              // sharp forward lance (piercing shots)
    g.shadowColor=light(col,.4); g.shadowBlur=26;
    const lg=g.createLinearGradient(-r*0.3,0,r*3.4,0);
    lg.addColorStop(0,hexA('#ffffff',.95)); lg.addColorStop(.5,hexA(light(col,.3),.7)); lg.addColorStop(1,hexA(col,0));
    g.fillStyle=lg;
    g.beginPath(); g.moveTo(-r*0.3,-r*0.55); g.lineTo(r*3.4,0); g.lineTo(-r*0.3,r*0.55); g.closePath(); g.fill();
  }
  const halo=g.createRadialGradient(0,0,r*0.1,0,0,r*2.4);
  halo.addColorStop(0,hexA(light(col,.6),.6)); halo.addColorStop(.4,hexA(col,.34)); halo.addColorStop(1,hexA(col,0));
  g.fillStyle=halo; g.beginPath(); g.arc(0,0,r*2.4,0,7); g.fill();
  sphere3d(g,0,0,r,col,true);
  g.globalAlpha=.75;
  const cor=g.createRadialGradient(0,0,r*0.2,0,0,r*1.05);
  cor.addColorStop(0,hexA('#ffffff',.92)); cor.addColorStop(.5,hexA(light(col,.4),.5)); cor.addColorStop(1,hexA(col,0));
  g.fillStyle=cor; g.beginPath(); g.arc(0,0,r*1.05,0,7); g.fill();
  g.globalAlpha=1;
  g.shadowColor=col; g.shadowBlur=18; g.strokeStyle=hexA('#ffffff',.8); g.lineWidth=Math.max(1.3,r*0.1);
  for(let i=0;i<4;i++){ const a=i*1.57+r*0.05;
    g.beginPath(); g.ellipse(0,0,r*0.98,r*0.55,a,0.3,Math.PI*0.95); g.stroke(); }
  // outer energy shell
  g.globalAlpha=.5; g.strokeStyle=hexA(light(col,.5),.85); g.lineWidth=r*0.14;
  g.beginPath(); g.arc(0,0,r*1.5,0.3,2.4); g.stroke();
  g.beginPath(); g.arc(0,0,r*1.5,3.4,5.6); g.stroke();
  // lightning crackle
  g.globalAlpha=.9; g.strokeStyle='#ffffff'; g.lineWidth=1.6;
  for(let i=0;i<5;i++){ const a=i*1.256+r*0.03, r0=r*0.95, r1=r*1.75;
    g.beginPath(); g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
    g.lineTo(Math.cos(a+0.22)*(r0+r1)*0.5, Math.sin(a+0.22)*(r0+r1)*0.5);
    g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1); g.stroke(); }
  g.shadowColor='#fff'; g.shadowBlur=20;
  g.fillStyle=hexA('#ffffff',.95); g.beginPath(); g.arc(-r*0.1,-r*0.1,r*coreScale*0.55,0,7); g.fill();
  g.restore();
}

// Kamehameha-style beam: long tapered column, white-hot core, leading tip, energy rings
function drawBeam(g,p,ux,uy){
  const ang=Math.atan2(uy,ux), L=p.r*7.0, H=p.h*0.62;
  g.save(); g.translate(p.x,p.y); g.rotate(ang);
  const aura=g.createRadialGradient(0,0,2,0,0,L*1.05);
  aura.addColorStop(0,hexA(light(p.col,.3),.65)); aura.addColorStop(.5,hexA(p.col,.28)); aura.addColorStop(1,hexA(p.col,0));
  g.fillStyle=aura; g.beginPath(); g.ellipse(-L*0.1,0,L*1.02,H*1.7,0,0,7); g.fill();
  const body=g.createLinearGradient(0,-H,0,H);
  body.addColorStop(0,hexA(dark(p.col,.2),0.05)); body.addColorStop(.28,hexA(p.col,.85)); body.addColorStop(.5,hexA(light(p.col,.45),1)); body.addColorStop(.72,hexA(p.col,.85)); body.addColorStop(1,hexA(dark(p.col,.2),0.05));
  g.fillStyle=body;
  g.beginPath();
  g.moveTo(-L,0);
  g.quadraticCurveTo(-L*0.1,-H, p.r*0.8,-H*1.08);
  g.quadraticCurveTo(p.r*1.25,0, p.r*0.8,H*1.08);
  g.quadraticCurveTo(-L*0.1,H, -L,0);
  g.closePath(); g.fill();
  g.shadowColor=light(p.col,.5); g.shadowBlur=26;
  const core=g.createLinearGradient(0,-H*0.42,0,H*0.42);
  core.addColorStop(0,hexA('#ffffff',.1)); core.addColorStop(.5,hexA('#ffffff',1)); core.addColorStop(1,hexA('#ffffff',.1));
  g.fillStyle=core;
  g.beginPath();
  g.moveTo(-L*0.92,0);
  g.quadraticCurveTo(-L*0.1,-H*0.42, p.r*0.7,-H*0.42);
  g.quadraticCurveTo(p.r*1.0,0, p.r*0.7,H*0.42);
  g.quadraticCurveTo(-L*0.1,H*0.42, -L*0.92,0);
  g.closePath(); g.fill();
  g.fillStyle='#fff'; g.shadowBlur=36;
  g.beginPath(); g.arc(p.r*0.78,0,p.r*0.62,0,7); g.fill();
  g.globalAlpha=.6; g.fillStyle=light(p.col,.5);
  g.beginPath(); g.arc(p.r*0.78,0,p.r*0.95,0,7); g.fill();
  g.globalAlpha=1;
  g.shadowBlur=0; g.strokeStyle=hexA(light(p.col,.55),.6); g.lineWidth=2.4;
  for(let i=0;i<6;i++){ const rx=-L*0.2+i*L*0.2, rr=H*(1-i*0.11);
    g.beginPath(); g.ellipse(rx,0,rr*0.24,rr,0,0,7); g.stroke(); }
  g.strokeStyle=hexA('#ffffff',.35); g.lineWidth=2;
  for(let i=0;i<7;i++){ const rx=-L*0.5+i*L*0.16, o=Math.sin(i*2.1)*H*0.5;
    g.beginPath(); g.moveTo(rx,-H*0.9+o*0.3); g.quadraticCurveTo(rx+L*0.08,-H*1.3,rx+L*0.16,-H*0.7+o*0.3); g.stroke();
    g.beginPath(); g.moveTo(rx,H*0.9-o*0.3); g.quadraticCurveTo(rx+L*0.08,H*1.3,rx+L*0.16,H*0.7-o*0.3); g.stroke(); }
  g.restore();
}

// Hiei's Dragon of the Darkness Flame: black dragon head + purple dark-flame wake
function drawDragon(g,p){
  const dir=Math.sign(p.vx)||1;
  // dark serpentine spine (body) under the flames
  const pts=[{x:p.x,y:p.y}].concat(p.trail.slice().reverse());
  g.save(); g.lineCap='round';
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], w=p.r*(0.7-i/pts.length*0.55);
    g.strokeStyle='#150a24'; g.lineWidth=Math.max(2,w*1.9);
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke();
  }
  // dark-flame body coiling along the wake
  for(let i=0;i<p.trail.length;i++){
    const q=p.trail[i], k=(i+1)/p.trail.length, rr=p.r*(0.45+1.05*k);
    const wob=Math.sin(i*0.9)*p.r*0.28;
    const fg=g.createRadialGradient(q.x,q.y+wob,1,q.x,q.y+wob,rr*1.6);
    fg.addColorStop(0,hexA('#c66bff',.95)); fg.addColorStop(.45,hexA('#6a1fd0',.6)); fg.addColorStop(1,hexA('#2a0740',0));
    g.fillStyle=fg; g.beginPath(); g.arc(q.x,q.y+wob,rr*1.6,0,7); g.fill();
  }
  // sharp dark-flame tongues licking off the body
  for(let i=0;i<p.trail.length;i++){
    const q=p.trail[i], kk=(i+1)/p.trail.length, w=p.r*(0.35+kk*1.0);
    for(const s of [-1,1]){
      const fg=g.createLinearGradient(q.x,q.y,q.x-p.r*0.35,q.y+s*w);
      fg.addColorStop(0,hexA('#e6b3ff',.9)); fg.addColorStop(.5,hexA('#8b3bff',.55)); fg.addColorStop(1,hexA('#3a0d6b',0));
      g.fillStyle=fg;
      g.beginPath();
      g.moveTo(q.x+w*0.25, q.y);
      g.quadraticCurveTo(q.x-p.r*0.1, q.y+s*w*0.75, q.x-p.r*0.55, q.y+s*w);
      g.quadraticCurveTo(q.x-p.r*0.15, q.y+s*w*0.4, q.x-p.r*0.5, q.y);
      g.closePath(); g.fill();
    }
  }
  g.restore();   // close the spine/tongue save
  // head
  g.save(); g.translate(p.x,p.y); g.scale(dir,1);
  g.shadowColor='#8b3bff'; g.shadowBlur=30;
  const R=p.r;
  g.fillStyle='#0c0714';
  // --- skull + upper jaw (profile, pointed forward) ---
  g.beginPath();
  g.moveTo(-R*0.95,-R*0.5);
  g.quadraticCurveTo(-R*0.2,-R*1.02, R*0.6,-R*0.72);
  g.quadraticCurveTo(R*1.45,-R*0.6, R*2.15,-R*0.34);
  g.lineTo(R*2.45,-R*0.15);
  g.lineTo(R*1.15,-R*0.03);
  g.quadraticCurveTo(R*0.5,-R*0.04,-R*0.1,R*0.06);
  g.quadraticCurveTo(-R*0.62,R*0.12,-R*0.95,-R*0.5);
  g.closePath(); g.fill();
  // --- lower jaw (open, also pointing forward) ---
  g.beginPath();
  g.moveTo(-R*0.5,R*0.22);
  g.quadraticCurveTo(R*0.6,R*0.34, R*1.35,R*0.47);
  g.lineTo(R*2.32,R*0.62);
  g.lineTo(R*1.45,R*0.9);
  g.quadraticCurveTo(R*0.3,R*1.0,-R*0.5,R*0.84);
  g.quadraticCurveTo(-R*0.74,R*0.5,-R*0.5,R*0.22);
  g.closePath(); g.fill();
  // --- big horns sweeping back off the crown ---
  g.beginPath();
  g.moveTo(-R*0.05,-R*0.78);
  g.quadraticCurveTo(-R*0.7,-R*1.55,-R*1.95,-R*1.18);
  g.quadraticCurveTo(-R*0.95,-R*0.98,-R*0.5,-R*0.72);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(-R*0.5,-R*0.62);
  g.quadraticCurveTo(-R*1.2,-R*1.05,-R*1.85,-R*0.55);
  g.quadraticCurveTo(-R*1.1,-R*0.6,-R*0.75,-R*0.42);
  g.closePath(); g.fill();
  // --- dark open-mouth cavity (the gaping maw) ---
  g.fillStyle='#05030a';
  g.beginPath();
  g.moveTo(R*0.85,-R*0.02);
  g.quadraticCurveTo(R*1.7,-R*0.08, R*2.44,-R*0.12);
  g.lineTo(R*2.34,R*0.6);
  g.quadraticCurveTo(R*1.6,R*0.5, R*0.72,R*0.3);
  g.closePath(); g.fill();
  // --- fangs along the maw (pointing into the gap) ---
  g.fillStyle='#e8e0ff';
  for(let i=0;i<4;i++){ const tx=R*(1.25+i*0.24);
    g.beginPath(); g.moveTo(tx,-R*0.05); g.lineTo(tx+R*0.07,R*0.22); g.lineTo(tx-R*0.07,R*0.22); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(tx+R*0.07,R*0.52); g.lineTo(tx+R*0.17,R*0.2); g.lineTo(tx-R*0.03,R*0.2); g.closePath(); g.fill(); }
  // --- single glowing eye (profile) + brow ---
  g.shadowColor='#ff3df0'; g.shadowBlur=24; g.fillStyle='#ff9bff';
  g.beginPath(); g.ellipse(R*0.5,-R*0.52,R*0.3,R*0.15,-0.3,0,7); g.fill();
  g.shadowBlur=0; g.fillStyle='#ffffff';
  g.beginPath(); g.arc(R*0.6,-R*0.52,R*0.06,0,7); g.fill();
  g.fillStyle='#0c0714';
  g.beginPath(); g.moveTo(R*0.12,-R*0.58); g.quadraticCurveTo(R*0.55,-R*0.82,R*0.95,-R*0.58); g.quadraticCurveTo(R*0.55,-R*0.66,R*0.12,-R*0.58); g.closePath(); g.fill();
  // --- dark flame pouring from the maw (kept off the snout tip) ---
  g.shadowColor='#c66bff'; g.shadowBlur=30; g.globalAlpha=.9;
  const bf=g.createRadialGradient(R*2.62,R*0.24,1,R*2.62,R*0.24,R*0.78);
  bf.addColorStop(0,hexA('#f0d0ff',.95)); bf.addColorStop(.5,hexA('#a24dff',.6)); bf.addColorStop(1,hexA('#8b3bff',0));
  g.fillStyle=bf; g.beginPath(); g.arc(R*2.62,R*0.24,R*0.78,0,7); g.fill();
  g.globalAlpha=1;
  g.restore();
}

// point-blank impact blast (Saitama shockwave / Shishio flame burst)
function drawBlast(g,f,k){
  const p=1-k, col=f.col, kind=f.kind||'energy', white=(kind==='punch');
  const main = white?'#eaf6ff':col;
  g.save(); g.translate(f.x,f.y);
  // bright explosive flash disc
  const discA = white? Math.min(1,k*1.5) : k*0.9;
  const discR = f.r*(0.45+p*1.0);
  const dg=g.createRadialGradient(0,0,1,0,0,discR);
  dg.addColorStop(0,hexA('#ffffff',.98*discA));
  dg.addColorStop(.5,hexA(light(main,.3),.78*discA));
  dg.addColorStop(1,hexA(main,0));
  g.fillStyle=dg; g.beginPath(); g.arc(0,0,discR,0,7); g.fill();
  // expanding concentric shock rings
  const rings = white?4:2;
  for(let i=0;i<rings;i++){
    const rr=f.r*(0.25+p*(0.7+i*0.26));
    g.globalAlpha=Math.min(1,k*1.25)*(0.95-i*0.17);
    g.strokeStyle = i===0 ? '#ffffff' : hexA(main,.85);
    g.lineWidth=(9-i*1.6)*k+2.5; g.shadowColor=white?'#ffffff':main; g.shadowBlur=34;
    g.beginPath(); g.arc(0,0,rr,0,7); g.stroke();
  }
  // radial air/speed lines (shockwave)
  if(white){
    g.globalAlpha=Math.min(1,k*1.2)*0.85; g.strokeStyle='#ffffff'; g.lineWidth=3; g.lineCap='round';
    for(let i=0;i<16;i++){ const a=i/16*6.283+f.t*0.3;
      const r0=f.r*(0.3+p*0.55), r1=r0+f.r*(0.45+p*0.55);
      g.beginPath(); g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0); g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1); g.stroke(); }
  }
  // hot core flash
  const coreK=Math.max(0,1-p*1.8);
  if(coreK>0){
    const cg=g.createRadialGradient(0,0,1,0,0,f.r*0.85);
    cg.addColorStop(0,hexA('#ffffff',coreK)); cg.addColorStop(.5,hexA(light(main,.4),.8*coreK)); cg.addColorStop(1,hexA(main,0));
    g.globalAlpha=coreK; g.fillStyle=cg; g.beginPath(); g.arc(0,0,f.r*0.85,0,7); g.fill();
  }
  // fire tongues (Shishio)
  if(kind==='fire'){
    g.globalAlpha=k*0.9;
    for(let i=0;i<12;i++){
      const a=i/12*6.283+f.t*0.4, rr=f.r*(0.3+p*0.6);
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr-p*f.r*0.5;
      const fg=g.createRadialGradient(px,py,1,px,py,f.r*0.34);
      fg.addColorStop(0,hexA('#fff2c0',1)); fg.addColorStop(.4,hexA(col,.85)); fg.addColorStop(1,hexA(dark(col,.4),0));
      g.fillStyle=fg; g.beginPath(); g.arc(px,py,f.r*0.34,0,7); g.fill();
    }
    g.globalAlpha=Math.min(1,k*1.1); g.fillStyle=hexA('#fff0c0',.9);
    g.beginPath(); g.arc(0,0,f.r*0.3*(1-p*0.5),0,7); g.fill();
  }
  g.restore();
}

function bar(g,x,y,w,h,f,left){
  g.save();
  g.fillStyle='rgba(0,0,0,.55)'; roundRect(g,x-3,y-3,w+6,h+6,6); g.fill();
  g.fillStyle='#241528'; roundRect(g,x,y,w,h,4); g.fill();
  const pct=Math.max(0,f.hp/f.maxhp), fw=w*pct;
  const grad=g.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,'#ff4d6d'); grad.addColorStop(1,'#ffb347');
  g.save(); if(!left){ g.translate(x+w,0); g.scale(-1,1); g.translate(-x,0); }
  g.fillStyle=grad; roundRect(g,x,y,fw,h,4); g.fill(); g.restore();
  const my=y+h+6, mh=8;
  g.fillStyle='#111'; roundRect(g,x,my,w,mh,4); g.fill();
  const mp=f.meter/f.maxMeter;
  const mg=g.createLinearGradient(x,0,x+w,0);
  mg.addColorStop(0,f.meter>=f.maxMeter?'#fff':'#7fd7ff'); mg.addColorStop(1,'#5b8cff');
  g.save(); if(!left){ g.translate(x+w,0); g.scale(-1,1); g.translate(-x,0); }
  g.fillStyle=mg; roundRect(g,x,my,w*mp,mh,4); g.fill(); g.restore();
  g.fillStyle='#fff'; g.font='bold 10px Trebuchet MS'; g.textAlign='center';
  if(f.meter>=f.maxMeter) g.fillText(f.char.ability.short+' READY',x+w/2,my+7.5);
  // guard meter (Valheim-style): fills as you block, drains over time; full = guard break + stagger
  const gy2=my+mh+5, gh2=7;
  g.fillStyle='rgba(0,0,0,.6)'; roundRect(g,x-1,gy2-1,w+2,gh2+2,4); g.fill();
