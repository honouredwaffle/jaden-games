<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CURSED CLASH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#07070c; font-family:"Trebuchet MS",system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #pad { position:fixed; inset:0; pointer-events:none; }
  .btn { position:absolute; pointer-events:auto; border-radius:50%;
         background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.22);
         color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
         user-select:none; letter-spacing:1px; text-align:center; padding:4px; line-height:1.05; }
  .btn.on { background:rgba(255,80,120,.45); border-color:#ff5078; }
  #stick { position:absolute; left:4vw; bottom:5vh; width:30vmin; height:30vmin; border-radius:50%;
           pointer-events:auto; background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02));
           border:1px solid rgba(255,255,255,.15); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:38%; height:38%; border-radius:50%; transform:translate(-50%,-50%);
          background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); }
  #pad.hidden { display:none; }
  @media (hover:hover) and (pointer:fine){ #stick{display:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="pad" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" data-k="punch" style="right:5vw;bottom:16vh;width:19vmin;height:19vmin">PUNCH</div>
  <div class="btn" data-k="kick"  style="right:24vw;bottom:7vh;width:19vmin;height:19vmin">KICK</div>
  <div class="btn" data-k="block" style="right:5vw;bottom:37vh;width:15vmin;height:15vmin;font-size:11px">BLOCK</div>
  <div class="btn" data-k="super" style="right:24vw;bottom:28vh;width:16vmin;height:16vmin;font-size:10px">DOMAIN</div>
</div>
<script>
/* ============================================================
   CURSED CLASH  —  2D arena fighter
   Menu -> Character Select -> Fight
   Keys: A/D move · W jump · J punch · K kick · L block · I ability
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

const GRAV = 2100;
const GROUND_Y = () => H*0.82;
const isTouch = matchMedia('(pointer:coarse)').matches;

// ============================================================
//  ROSTER
// ============================================================
const CHARS = [
  {
    id:'sukuna', name:'SUKUNA', tag:'King of Curses',
    colA:'#ff5c8a', colB:'#3a1030', colC:'#1a0a18', skin:'#e8b58c', hair:'spiky',
    hp:115, speed:300, dmg:1.15,
    ability:{name:'DISMANTLE', short:'DISMANTLE', type:'wave',
      desc:'Sends a flying slash wave tearing across the screen.',
      dmg:22, kb:430, speed:820, col:'#ff4d6d'}
  },
  {
    id:'gojo', name:'GOJO', tag:'The Strongest',
    colA:'#8fdcff', colB:'#12304a', colC:'#0a1a24', skin:'#f0c9a0', hair:'white',
    hp:100, speed:330, dmg:1.0,
    ability:{name:'HOLLOW PURPLE', short:'HOLLOW', type:'orbs',
      desc:'Three cursed orbs creep forward and pierce anything in their path.',
      dmg:13, kb:220, speed:340, col:'#b98bff'}
  },
  {
    id:'yuji', name:'YUJI', tag:'Divergent Fist',
    colA:'#ff9f5c', colB:'#3a2410', colC:'#241305', skin:'#e8b58c', hair:'short',
    hp:105, speed:360, dmg:1.0,
    ability:{name:'DIVERGENT FIST', short:'DIVERGE', type:'dash',
      desc:'Lunges forward with a double-impact rush. Hits up to 4 times.',
      dmg:9, kb:150, dashT:0.42, col:'#ffb347'}
  },
  {
    id:'megumi', name:'MEGUMI', tag:'Ten Shadows',
    colA:'#7fe3b0', colB:'#10312a', colC:'#081c18', skin:'#ecc39c', hair:'buzz',
    hp:105, speed:330, dmg:1.0,
    ability:{name:'SHADOW WOLF', short:'WOLF', type:'summon',
      desc:'Summons a shadow wolf that charges down the enemy.',
      dmg:24, kb:420, speed:760, col:'#5b8cff'}
  }
];

// ============================================================
//  INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e=>{
  if(!keys[e.code]) onKeyPress(e.code);
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

const pad = { x:0, y:0 };
let padPunch=false, padKick=false, padBlock=false, padSuper=false;
const stick = document.getElementById('stick'), knob=document.getElementById('knob');
let stickId=null, sCx=0, sCy=0;
function stickStart(e){ const t=e.changedTouches?e.changedTouches[0]:e;
  const r=stick.getBoundingClientRect(); sCx=r.left+r.width/2; sCy=r.top+r.height/2; stickId=t.identifier??'m'; stickMove(e); }
function stickMove(e){
  const t = e.changedTouches ? [...e.changedTouches].find(x=>x.identifier===stickId) : e;
  if(!t) return;
  let dx=t.clientX-sCx, dy=t.clientY-sCy; const R=stick.offsetWidth*0.42;
  const d=Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  pad.x = dx/R; pad.y = dy/R;
  if(e.cancelable) e.preventDefault();
}
function stickEnd(){ stickId=null; pad.x=pad.y=0; knob.style.transform='translate(-50%,-50%)'; }
stick.addEventListener('touchstart',stickStart,{passive:false});
stick.addEventListener('touchmove',stickMove,{passive:false});
stick.addEventListener('touchend',stickEnd); stick.addEventListener('touchcancel',stickEnd);
stick.addEventListener('mousedown',stickStart); window.addEventListener('mousemove',e=>{ if(stickId==='m') stickMove(e); });
window.addEventListener('mouseup',()=>{ if(stickId==='m') stickEnd(); });

document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=()=>{ b.classList.add('on'); if(k==='punch')padPunch=true; if(k==='kick')padKick=true; if(k==='block')padBlock=true; if(k==='super')padSuper=true; };
  const off=()=>{ b.classList.remove('on'); if(k==='punch')padPunch=false; if(k==='kick')padKick=false; if(k==='block')padBlock=false; if(k==='super')padSuper=false; };
  b.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});
const superBtn = document.querySelector('[data-k="super"]');
const padEl = document.getElementById('pad');

// canvas pointer (menus)
cv.addEventListener('pointerdown', e=>{
  const r=cv.getBoundingClientRect();
  onPointer((e.clientX-r.left), (e.clientY-r.top));
});

// ============================================================
//  PARTICLES / FX
// ============================================================
const fx = [];
function burst(x,y,n,col,spd=1){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(60+Math.random()*260)*spd;
    fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.5+Math.random()*.4,t:0,c:col,r:2+Math.random()*4});
  }
}
function ring(x,y,col,r=0){ fx.push({ring:true,x,y,r:r||12,max:90,col,t:0,life:.4}); }
function floatText(x,y,txt,col){ fx.push({txt:txt,x,y,vy:-60,t:0,life:.8,c:col||'#fff'}); }

// ============================================================
//  PROJECTILES (abilities)
// ============================================================
let projectiles = [];
function clearProjectiles(){ projectiles.length=0; }
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.t += dt;
    // homing for wolf
    if(p.homing && p.target && !p.target.ko){
      const dy=(p.target.top+55)-p.y;
      p.vy += Math.sign(dy)*Math.min(160, Math.abs(dy)*6)*dt*6;
      p.vy = Math.max(-260, Math.min(260,p.vy));
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.trail = p.trail || [];
    p.trail.push({x:p.x,y:p.y}); if(p.trail.length>8) p.trail.shift();

    // hit?
    const foe = p.owner===p1 ? p2 : p1;
    if(!p.dead && !foe.ko && p.t>p.armDelay && !p.hitList.includes(foe)){
      const hb=foe.hurtbox();
      const pr = {x:p.x-p.r, y:p.y-p.r, w:p.r*2, h:p.r*2};
      if(rectHit(pr,hb)){
        p.hitList.push(foe);
        foe.takeHit(p.owner, {dmg:Math.round(p.dmg*(p.owner.char.dmg||1)), kb:p.kb, stun:.24, super:false, ranged:true, yoff:0});
        burst(p.x,p.y,p.r>20?20:10,p.col,1.1);
        if(p.pierce){ p.hp=(p.hp||1)-1; if(p.hp<=0) p.dead=true; }
        else p.dead=true;
      }
    }
    // bounds / life
    if(p.t>p.life || p.x<-80 || p.x>W+80 || p.y<-120 || p.y>H+80) p.dead=true;
    if(p.x < -40 && p.owner.x>W/2) p.dead=true;

    if(p.dead) projectiles.splice(i,1);
  }
}
function spawnProjectile(owner, opt){
  projectiles.push(Object.assign({
    owner, x:0,y:0,vx:0,vy:0,r:16,dmg:10,kb:200,life:2.2,t:0,armDelay:0,
    col:'#fff', pierce:false, homing:false, target:null, hitList:[], trail:[],
    kind:'orb'
  }, opt));
}
function fireAbility(f){
  const ab=f.char.ability;
  const gy=GROUND_Y();
  f.meter=0; f.superT=ab.type==='dash'?ab.dashT:0.9;
  f.state=POSE.SUPER; f.abilityFired=false; f.dashHits=0; f.dashTick=0;
  ring(f.x, gy, ab.col, 20); shake=7;
  if(ab.type==='dash'){ f.vx=f.dir*1500; f.vy=-140; f.onGround=false; }
}

// ============================================================
//  FIGHTER
// ============================================================
const POSE = { IDLE:0, WALK:1, JUMP:2, PUNCH:3, KICK:4, BLOCK:5, HURT:6, KO:7, SUPER:8 };

class Fighter {
  constructor(opts){
    Object.assign(this,{
      x:0, y:0, vx:0, vy:0, dir:1, onGround:true,
      w:44, h:110,
      hp:100, maxhp:100, meter:0, maxMeter:100,
      state:POSE.IDLE, t:0, anim:0,
      hitStun:0, blockStun:0, atk:null, hasHit:false,
      cooldown:0, superT:0, invuln:0, ko:false, hitFlash:0,
      combo:0, comboT:0, name:'?', ai:false, aiT:0, aiState:'approach',
      abilityFired:false, dashHits:0, dashTick:0, char:CHARS[0]
    }, opts);
    this.applyChar(this.char);
  }
  applyChar(c){ this.char=c; this.colA=c.colA; this.colB=c.colB; this.colC=c.colC; this.name=c.name;
    this.maxhp=c.hp; this.hp=c.hp; this.speed=c.speed; }
  get cx(){ return this.x; }
  get top(){ return this.y - this.h; }
  hurtbox(){ return {x:this.x-this.w*0.55, y:this.top+8, w:this.w*1.1, h:this.h-8}; }
  blocking(){ return (this.state===POSE.BLOCK) && this.onGround; }

  doAttack(kind){
    if(this.cooldown>0 || this.hitStun>0 || this.ko || this.superT>0) return;
    if(kind==='punch'){ this.atk={kind,startup:.07,active:.07,recover:.14,dmg:6*this.char.dmg,reach:64,kb:130,stun:.22,yoff:-70,award:8}; }
    if(kind==='kick'){  this.atk={kind,startup:.11,active:.10,recover:.24,dmg:10*this.char.dmg,reach:80,kb:260,stun:.32,yoff:-52,award:12}; }
    this.state = kind==='punch'?POSE.PUNCH:POSE.KICK;
    this.atk.t = 0; this.hasHit=false; this.cooldown = (this.atk.startup+this.atk.active+this.atk.recover);
  }
  doSuper(){ if(this.meter < this.maxMeter || this.ko || this.superT>0) return; fireAbility(this); }

  update(dt, foe){
    this.t += dt; this.cooldown = Math.max(0, this.cooldown-dt);
    this.hitFlash = Math.max(0,this.hitFlash-dt*3);
    this.hitStun = Math.max(0,this.hitStun-dt);
    this.blockStun = Math.max(0,this.blockStun-dt);
    this.invuln = Math.max(0,this.invuln-dt);
    this.comboT = Math.max(0,this.comboT-dt);
    if(this.comboT===0) this.combo=0;

    if(this.ko){ this.state=POSE.KO; this.applyPhysics(dt); return; }

    // ---- ability in progress ----
    if(this.superT>0){
      this.superT -= dt;
      const ab=this.char.ability;
      if(ab.type==='dash'){
        // multi-hit rush
        this.dashTick -= dt;
        const hb=foe.hurtbox();
        const bb={x:this.x+this.dir*10-30, y:this.top+50, w:70, h:50};
        if(this.dashTick<=0 && !foe.ko && rectHit(bb,hb)){
          this.dashTick=0.10; this.dashHits++;
          foe.takeHit(this,{dmg:Math.round(ab.dmg*this.char.dmg),kb:ab.kb,stun:.18,super:false,yoff:0});
          this.meter=Math.min(this.maxMeter,this.meter+6);
          burst(this.x+this.dir*20,this.top+60,10,ab.col,1.1);
        }
        this.vx *= 0.93;
        this.applyPhysics(dt);
        if(this.superT<=0){ this.state=POSE.IDLE; this.vx*=0.3; }
        return;
      }
      // orb / wave / summon: fire once, then brief recovery
      if(!this.abilityFired && this.superT < 0.72){
        this.abilityFired=true;
        const gy=GROUND_Y();
        if(ab.type==='wave'){
          spawnProjectile(this,{x:this.x+this.dir*50,y:this.top+62,vx:this.dir*ab.speed,vy:0,
            r:34,h:64,dmg:ab.dmg,kb:ab.kb,col:ab.col,life:1.6,kind:'wave'});
          shake=8;
        } else if(ab.type==='orbs'){
          for(let i=0;i<3;i++){
            spawnProjectile(this,{x:this.x+this.dir*44,y:this.top+30+i*26,vx:this.dir*ab.speed,vy:(i-1)*14,
              r:20,h:44,dmg:ab.dmg,kb:ab.kb,col:ab.col,life:2.6,pierce:true,hp:2,kind:'orb'});
          }
        } else if(ab.type==='summon'){
          spawnProjectile(this,{x:this.x+this.dir*50,y:GROUND_Y()-40,vx:this.dir*ab.speed,vy:0,
            r:30,h:70,dmg:ab.dmg,kb:ab.kb,col:ab.col,life:2.2,kind:'wolf',homing:true,target:foe});
        }
        burst(this.x+this.dir*44,this.top+58,16,ab.col,1.2);
      }
      this.vx *= this.onGround?0.7:0.97;
      this.applyPhysics(dt);
      if(this.superT<=0) this.state=POSE.IDLE;
      return;
    }

    // ---- normal attack ----
    if(this.atk){
      this.atk.t += dt;
      const a=this.atk;
      if(a.t >= a.startup && a.t <= a.startup+a.active && !this.hasHit){
        const hb=foe.hurtbox();
        const bb = {x:this.x + this.dir*a.reach-26, y:this.top + 70 + a.yoff, w:52, h:40};
        if(!foe.invuln && rectHit(bb, hb)){
          this.hasHit=true;
          foe.takeHit(this,a);
          this.meter = Math.min(this.maxMeter, this.meter + (a.award||8));
        }
      }
      if(a.t >= a.startup+a.active+a.recover){ this.atk=null; this.state=POSE.IDLE; }
    }

    this.control(dt, foe);
    this.applyPhysics(dt);
  }

  control(dt, foe){
    if(this.hitStun>0 || this.blockStun>0 || (this.atk && this.atk.t<this.atk.startup+this.atk.active+this.atk.recover)) {
      this.vx *= this.onGround ? 0.86 : 0.98;
      if(this.onGround && !this.atk) this.state = this.hitStun>0?POSE.HURT:this.state;
      return;
    }
    let mv = 0;
    if(this.ai){ mv = this.aiMove(dt, foe); }
    else {
      if(keys['KeyA']||keys['ArrowLeft']||pad.x<-0.28) mv -= 1;
      if(keys['KeyD']||keys['ArrowRight']||pad.x>0.28) mv += 1;
      this.dir = foe.x >= this.x ? 1 : -1;
      if(keys['KeyL']||padBlock){ this.state=POSE.BLOCK; }
      else if(keys['KeyJ']||padPunch){ this.doAttack('punch'); }
      else if(keys['KeyK']||padKick){ this.doAttack('kick'); }
      else if(keys['KeyI']||padSuper){ this.doSuper(); }
      else if(this.onGround){ this.state = Math.abs(mv)>0.1?POSE.WALK:POSE.IDLE; }
      if((keys['KeyW']||keys['ArrowUp']||pad.y<-0.5) && this.onGround){ this.vy=-820; this.onGround=false; }
    }
    if(this.state===POSE.BLOCK){ this.vx *= 0.6; }
    else this.vx = mv*this.speed;
    if(this.onGround) this.anim += Math.abs(this.vx)*dt*0.03;
  }

  aiMove(dt, foe){
    this.aiT -= dt;
    const dx = foe.x - this.x, dist = Math.abs(dx);
    if(!this.atk && this.superT<=0) this.dir = dx>=0?1:-1;
    let mv = 0;
    if(this.aiT<=0){
      this.aiT = 0.10 + Math.random()*0.22;
      if(foe.superT>0 || (foe.atk && dist<90 && Math.random()<0.5)) this.aiState='block';
      else if(dist>150) this.aiState='approach';
      else if(dist<70) this.aiState='space';
      else this.aiState = Math.random()<0.7?'attack':'block';
    }
    switch(this.aiState){
      case 'approach': mv = Math.sign(dx); break;
      case 'space': mv = -Math.sign(dx); break;
      case 'block': this.state=POSE.BLOCK; break;
      case 'attack':
        if(this.meter>=this.maxMeter && dist<230 && Math.random()<0.4) this.doSuper();
        else if(dist<95 && this.cooldown<=0) this.doAttack(dist<72?(Math.random()<0.55?'punch':'kick'):'kick');
        mv = Math.sign(dx)*0.6;
        break;
    }
    if(this.onGround && Math.abs(mv)>0.1 && !this.atk && this.superT<=0) this.state=POSE.WALK;
    else if(this.onGround && !this.atk && this.superT<=0) this.state=POSE.IDLE;
    return mv;
  }

  takeHit(src, a){
    const dir = src.x <= this.x ? 1 : -1;
    const blocked = this.blocking() && this.dir !== dir;
    if(blocked){
      const chip = a.super?7:Math.max(1, Math.round((a.dmg||6)*0.12));
      this.hp -= chip; this.blockStun=0.18; this.vx = dir*(a.kb||120)*0.35;
      burst(this.x, this.top+60, 6, '#9fe8ff', .7); ring(this.x, this.top+60, '#9fe8ff', 10);
      src.meter = Math.min(src.maxMeter, src.meter + 3);
      return;
    }
    this.hp -= a.dmg; this.hitStun = (a.stun||0.25)+0.04; this.vx = dir*(a.kb||130);
    if(!a.super && this.onGround) this.vy = -120;
    this.hitFlash = 1; this.atk=null;
    src.combo++; src.comboT = 1.2;
    const col = a.super?'#ff4d8d':'#ffd166';
    burst(this.x+dir*-10, this.top+60, a.super?26:12, col, a.super?1.4:1);
    ring(this.x, this.top+58, col, a.super?26:12);
    floatText(this.x, this.top+17, Math.round(a.dmg), col);
    shake = Math.max(shake, a.super?14:5);
    if(this.hp<=0){ this.hp=0; this.ko=true; this.state=POSE.KO; this.vy=-520; this.vx=dir*260; }
  }

  applyPhysics(dt){
    this.x += this.vx*dt; this.y += this.vy*dt;
    if(!this.onGround) this.vy += GRAV*dt;
    const gy = GROUND_Y();
    if(this.y >= gy){ this.y=gy; this.vy=0; this.onGround=true; } else this.onGround=false;
    const L = W*0.06, R = W*0.94;
    if(this.x<L){ this.x=L; this.vx=Math.max(0,this.vx); }
    if(this.x>R){ this.x=R; this.vx=Math.min(0,this.vx); }
    if(this.onGround && this.hitStun<=0 && !this.atk) this.vx *= (1-Math.min(1,dt*8));
    if(this.hitStun>0) this.vx *= (1-Math.min(1,dt*3));
  }

  // ---------- drawing ----------
  draw(g){
    const gy = GROUND_Y();
    g.save();
    const sh = Math.max(0.25, 1 - (gy-this.y)/260);
    g.globalAlpha = 0.30*sh; g.fillStyle='#000';
    g.beginPath(); g.ellipse(this.x, gy+4, this.w*0.85*sh, 10*sh, 0,0,7); g.fill();
    g.restore();

    g.save();
    g.translate(this.x, this.y); g.scale(this.dir, 1);
    if(this.ko) g.rotate(-this.dir*1.35);

    const flash = this.hitFlash>0;
    const body = flash ? '#ffffff' : this.colA;
    const dark = flash ? '#ffffff' : this.colB;
    const trim = flash ? '#ffffff' : this.colC;
    const skin = flash ? '#ffffff' : this.char.skin;

    const t=this.t, a=this.anim;
    const bob = this.state===POSE.IDLE ? Math.sin(t*3)*2 : 0;
    let legSwing = this.state===POSE.WALK ? Math.sin(a)*14 : 0;
    drawLimb(g, -9, -46+bob, legSwing, 16, dark, trim);
    drawLimb(g,  9, -46+bob, -legSwing, 16, body, trim);

    g.fillStyle = dark; roundRect(g, -16, -96+bob, 32, 52, 10); g.fill();
    g.fillStyle = body; roundRect(g, -16, -96+bob, 32, 34, 10); g.fill();
    g.fillStyle = trim; g.fillRect(-16, -78+bob, 32, 4);

    // head
    g.fillStyle = skin; g.beginPath(); g.arc(0,-108+bob,15,0,7); g.fill();
    drawHair(g, this.char, bob, trim, body);
    g.fillStyle='#241018'; g.fillRect(5,-112+bob,4,3); g.fillRect(11,-112+bob,3,3);

    // arms
    const eB=this.state===POSE.BLOCK, pn=this.state===POSE.PUNCH, kk=this.state===POSE.KICK, sp=this.state===POSE.SUPER;
    const swA = this.state===POSE.WALK ? -Math.sin(a)*18 : Math.sin(t*2)*4;
    drawLimb(g, -14, -88+bob, swA*0.4, 15, dark, trim);
    let fAng=swA, fLen=15;
    if(pn && this.atk) fAng=-Math.PI/2+0.15;
    if(kk && this.atk) fAng=Math.PI/2-0.4;
    if(eB) fAng=-Math.PI/2+0.9;
    if(sp) fAng=-Math.PI/2-0.3;
    g.save();
    g.translate(14,-88+bob); g.rotate(fAng);
    g.fillStyle=body; roundRect(g,-7,0,14,fLen+16,7); g.fill();
    g.fillStyle=skin; g.beginPath(); g.arc(0,fLen+18,7,0,7); g.fill();
    if(pn){ g.fillStyle=body; g.beginPath(); g.arc(0,fLen+22,10,0,7); g.fill(); }
    g.restore();

    // melee fx
    if(this.atk && this.atk.t>=this.atk.startup && this.atk.t<=this.atk.startup+this.atk.active){
      const hx=this.atk.reach, hy=-70+(this.atk.kind==='kick'?18:0);
      g.save(); g.globalAlpha=0.85; g.strokeStyle='#fff'; g.lineWidth=5; g.lineCap='round';
      g.shadowColor=this.colA; g.shadowBlur=22; g.beginPath();
      if(this.atk.kind==='kick'){ g.moveTo(4,-40); g.lineTo(hx-6,-30); }
      else { g.moveTo(14,-88); g.lineTo(hx,hy); }
      g.stroke(); g.restore();
    }

    // ability aura
    if(sp){
      const ab=this.char.ability;
      g.save();
      const p = ab.type==='dash' ? (1-this.superT/ab.dashT) : (1-this.superT/0.9);
      g.globalAlpha=0.5*(1-p); g.strokeStyle=ab.col; g.lineWidth=4;
      g.beginPath(); g.arc(0,-60, 70+p*150,0,7); g.stroke();
      g.globalAlpha=0.22; g.fillStyle=ab.col;
      g.beginPath(); g.arc(0,-60, 40+p*90,0,7); g.fill();
      g.restore();
    }
    g.restore();

    if(this.combo>1 && this.comboT>0){
      g.save(); g.font='bold 22px Trebuchet MS'; g.fillStyle='#ffd166'; g.textAlign='center';
      g.globalAlpha=Math.min(1,this.comboT*3);
      g.fillText(this.combo+' HIT', this.x, this.top-24);
      g.restore();
    }
  }
}

function drawHair(g, c, bob, trim, body){
  const y=-106+bob;
  switch(c.hair){
    case 'spiky':
      g.fillStyle=trim; g.beginPath();
      g.moveTo(-16,y-6); g.lineTo(-6,y-28); g.lineTo(0,y-12);
      g.lineTo(8,y-30); g.lineTo(12,y-10); g.lineTo(17,y-18);
      g.lineTo(15,y); g.lineTo(-16,y); g.closePath(); g.fill(); break;
    case 'white':
      g.fillStyle='#e9f4ff'; g.beginPath();
      g.moveTo(-16,y-8); g.lineTo(-10,y-30); g.lineTo(-2,y-16);
      g.lineTo(6,y-32); g.lineTo(13,y-14); g.lineTo(17,y-22);
      g.lineTo(16,y); g.lineTo(-16,y); g.closePath(); g.fill(); break;
    case 'short':
      g.fillStyle=trim; g.beginPath();
      g.moveTo(-16,y-2); g.quadraticCurveTo(0,y-34,16,y-2);
      g.quadraticCurveTo(0,y-12,-16,y-2); g.closePath(); g.fill(); break;
    case 'buzz':
      g.fillStyle=body; g.beginPath(); g.arc(0,y-6,16,Math.PI,0); g.fill(); break;
  }
}
function drawLimb(g,x,y,ang,len,col,trim){
  g.save(); g.translate(x,y); g.rotate(ang);
  g.fillStyle=col; roundRect(g,-7,0,14,len,7); g.fill();
  g.fillStyle=trim; roundRect(g,-7,len-4,14,7,3); g.fill();
  g.restore();
}
function roundRect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

let shake=0, flashScreen=0, hitStop=0;
function drawArena(g){

  g.fillStyle=sky; g.fillRect(0,0,W,gy);
  g.save(); g.globalAlpha=.85; g.fillStyle='#ffe9c9';
  g.beginPath(); g.arc(W*0.82,H*0.17,42,0,7); g.fill();
  g.globalAlpha=.12; g.beginPath(); g.arc(W*0.82,H*0.17,90,0,7); g.fill(); g.restore();
  g.fillStyle='#1a0f22';
  for(let i=0;i<9;i++){
    const bx=(i/9)*W+((i*137)%40), bw=W*0.06+(i%3)*22, bh=H*0.12+(i%4)*60;
    g.fillRect(bx,gy-bh,bw,bh);
    g.fillStyle='rgba(255,180,90,.20)';
    for(let wy=gy-bh+14; wy<gy-16; wy+=22)
      for(let wx=bx+8; wx<bx+bw-8; wx+=18) if(((wx*wy)|0)%7<3) g.fillRect(wx,wy,6,8);
    g.fillStyle='#1a0f22';
  }
  const gg=g.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#241826'); gg.addColorStop(1,'#0c070e');
  g.fillStyle=gg; g.fillRect(0,gy,W,H-gy);
  g.strokeStyle='rgba(255,80,120,.35)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,gy); g.lineTo(W,gy); g.stroke();
  g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=1;
  for(let i=-6;i<=6;i++){ g.beginPath(); g.moveTo(W/2+i*70,gy); g.lineTo(W/2+i*300,H); g.stroke(); }
}

function drawProjectiles(g){
  for(const p of projectiles){
    g.save();
    // trail
    for(let i=0;i<p.trail.length;i++){
      const q=p.trail[i], k=i/p.trail.length;
      g.globalAlpha=k*0.4; g.fillStyle=p.col;
      g.beginPath(); g.arc(q.x, q.y, p.r*k*0.9,0,7); g.fill();
    }
    g.globalAlpha=1;
    if(p.kind==='wave'){
      g.translate(p.x,p.y);
      g.shadowColor=p.col; g.shadowBlur=30; g.fillStyle=p.col;
      g.beginPath(); g.ellipse(0,0,p.r*0.35,p.h/2,0,0,7); g.fill();
      g.strokeStyle='#fff'; g.lineWidth=3; g.globalAlpha=.9;
      g.beginPath(); g.ellipse(0,0,p.r*0.2,p.h/2*0.9,0,0,7); g.stroke();
    } else if(p.kind==='wolf'){
      g.translate(p.x,p.y); g.scale(Math.sign(p.vx)||1,1);
      g.shadowColor=p.col; g.shadowBlur=26; g.fillStyle=p.col;
      g.beginPath(); g.ellipse(0,0,32,15,0,0,7); g.fill();        // body
      g.beginPath(); g.moveTo(20,-4); g.lineTo(40,-16); g.lineTo(30,0); g.closePath(); g.fill(); // head
      g.strokeStyle=p.col; g.lineWidth=5; g.lineCap='round';
      g.beginPath(); g.moveTo(18,4); g.lineTo(34,2); g.stroke();  // jaw
      for(const lx of [-14,-2,10]){ g.beginPath(); g.moveTo(lx,8); g.lineTo(lx-4,20); g.stroke(); }
      g.globalAlpha=.5; g.beginPath(); g.arc(-30,0,14,0,7); g.fill();
    } else {
      g.shadowColor=p.col; g.shadowBlur=28; g.fillStyle=p.col;
      g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill();
      g.globalAlpha=.5; g.fillStyle='#fff';
      g.beginPath(); g.arc(p.x,p.y,p.r*0.45,0,7); g.fill();
    }
    g.restore();
  }
}

function bar(g,x,y,w,h,f,left){
  g.save();
  g.fillStyle='rgba(0,0,0,.5)'; roundRect(g,x-3,y-3,w+6,h+6,6); g.fill();
  g.fillStyle='#2a1520'; roundRect(g,x,y,w,h,4); g.fill();
  const pct=Math.max(0,f.hp/f.maxhp), fw=w*pct;
  const grad=g.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,'#ff4d6d'); grad.addColorStop(1,'#ffb347');
  g.save();
  if(!left){ g.translate(x+w,0); g.scale(-1,1); g.translate(-x,0); }
  g.fillStyle=grad; roundRect(g,x,y,fw,h,4); g.fill(); g.restore();
  const my=y+h+6, mh=8;
  g.fillStyle='#111'; roundRect(g,x,my,w,mh,4); g.fill();
  const mp=f.meter/f.maxMeter;
  const mg=g.createLinearGradient(x,0,x+w,0);
  mg.addColorStop(0, f.meter>=f.maxMeter?'#fff':'#7fd7ff'); mg.addColorStop(1,'#5b8cff');
  g.save();
  if(!left){ g.translate(x+w,0); g.scale(-1,1); g.translate(-x,0); }
  g.fillStyle=mg; roundRect(g,x,my,w*mp,mh,4); g.fill(); g.restore();
  g.fillStyle='#fff'; g.font='bold 10px Trebuchet MS'; g.textAlign='center';
  if(f.meter>=f.maxMeter) g.fillText(f.char.ability.short+' READY', x+w/2, my+7.5);
  g.restore();
}
function drawHUD(g){
  const pad=W*0.04, bw=W*0.34, bh=24, by=26;
  bar(g,pad,by,bw,p1,true);
  bar(g,W-pad-bw,by,bw,p2,false);
  g.font='bold 14px Trebuchet MS'; g.fillStyle='#fff'; g.textAlign='left';
  g.fillText(p1.name+' · '+p1.char.tag, pad, by-8);
  g.textAlign='right'; g.fillText(p2.char.tag+' · '+p2.name, W-pad, by-8);
  g.textAlign='center'; g.font='bold 22px Trebuchet MS'; g.fillStyle='#ffd166';
  g.fillText('CURSED CLASH', W/2, by+18);
}

//  FIGHTERS
// ============================================================
const p1 = new Fighter({x:200, y:GROUND_Y(), ai:false});
const p2 = new Fighter({x:700, y:GROUND_Y(), ai:true, dir:-1});

// ============================================================
//  SCREEN STATE
// ============================================================
let screen='menu';          // menu | select | fight | over
let menuT=0, selT=0;
let selIndex=0, rivalIndex=1, rivalRoll=0;
let fightState='intro', fightT=0, winner=null;
const ROUND_TIME=60; let roundTime=ROUND_TIME;
let lastFightWinner=null;   // persisted for over screen
let overButtons=[];

function resetPositions(){
  const gy=GROUND_Y();
  for(const [f,x,dir] of [[p1,W*0.28,1],[p2,W*0.72,-1]]){
    f.x=x; f.y=gy; f.vx=0; f.vy=0; f.dir=dir; f.onGround=true;
    f.hp=f.maxhp; f.meter=0; f.state=POSE.IDLE; f.atk=null; f.ko=false;
    f.combo=0; f.hitStun=0; f.blockStun=0; f.superT=0; f.hitFlash=0;
  }
  clearProjectiles(); fx.length=0;
  roundTime=ROUND_TIME; fightState='intro'; fightT=0; winner=null;
}
function startFight(){
  p1.applyChar(CHARS[selIndex]);
  p2.applyChar(CHARS[rivalIndex]);
  resetPositions();
  screen='fight';
  padEl.classList.remove('hidden');
  superBtn.textContent = p1.char.ability.short;
}
function goMenu(){ screen='menu'; menuT=0; padEl.classList.add('hidden'); clearProjectiles(); }
function goSelect(){ screen='select'; selT=0; padEl.classList.add('hidden'); clearProjectiles(); }

function onKeyPress(code){
  if(screen==='menu'){
    if(['Space','Enter','KeyJ','NumpadEnter'].includes(code)) goSelect();
  } else if(screen==='select'){
    if(['KeyA','ArrowLeft'].includes(code)) selIndex=(selIndex+CHARS.length-1)%CHARS.length;
    if(['KeyD','ArrowRight'].includes(code)) selIndex=(selIndex+1)%CHARS.length;
    if(['Space','Enter','KeyJ','NumpadEnter'].includes(code)){
      rivalIndex = randomRival(); startFight();
    }
  } else if(screen==='fight'){
    if(['Escape'].includes(code)) goSelect();
  } else if(screen==='over'){
    if(['Space','Enter','KeyJ','NumpadEnter'].includes(code)){ rivalIndex=randomRival(); startFight(); }
    if(['Escape','Backspace'].includes(code)) goSelect();
  }
}
function randomRival(){
  let r=selIndex; let guard=0;
  while(r===selIndex && guard++<20) r=Math.floor(Math.random()*CHARS.length);
  return r;
}

function onPointer(x,y){
  if(screen==='menu'){ goSelect(); return; }
  if(screen==='select'){
    // card grid
    const g=gridRects();
    for(let i=0;i<g.length;i++){
      if(inRect(x,y,g[i])){ 
        if(selIndex===i){ rivalIndex=randomRival(); startFight(); }
        else { selIndex=i; ring(g[i].x+g[i].w/2, g[i].y+g[i].h/2, CHARS[i].colA, 14); }
        return;
      }
    }
    // confirm button
    if(inRect(x,y,confirmRect())){ rivalIndex=randomRival(); startFight(); return; }
    return;
  }
  if(screen==='over'){
    for(const b of overButtons){ if(inRect(x,y,b)){ b.fn(); return; } }
  }
}

function renderMenu(g){
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0612'); bg.addColorStop(.6,'#1c0a24'); bg.addColorStop(1,'#3a0d1e');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  // glow blobs
  for(let i=0;i<5;i++){
    const bx=W*(0.15+0.18*i), by=H*0.5+Math.sin(menuT*0.7+i)*40;
    g.save(); g.globalAlpha=.10;

    rg.addColorStop(0, CHARS[i%CHARS.length].colA); rg.addColorStop(1,'transparent');

  g.fillStyle='#c9b7ff'; g.font='bold 16px Trebuchet MS';

  // roster silhouettes strip
  const n=CHARS.length, cw=Math.min(110,W*0.2), gap=14, tot=n*cw+(n-1)*gap;
  let sx=cx-tot/2;
  for(let i=0;i<n;i++){

    g.globalAlpha=.85;
    g.fillStyle='rgba(255,255,255,.05)'; roundRect(g,bx,by,cw,cw*0.9,12); g.fill();
    g.strokeStyle=c.colA; g.lineWidth=2; roundRect(g,bx,by,cw,cw*0.9,12); g.stroke();

    const fake={char:c, state:POSE.IDLE, t:menuT+i, anim:0, atk:null, ko:false, hitFlash:0, superT:0, dir:1, combo:0, comboT:0};
    drawMini(g, fake);

    g.fillStyle='#fff'; g.font='bold 12px Trebuchet MS'; g.textAlign='center';
    g.fillText(c.name, bx+cw/2, by+cw*0.9+18);

  g.restore();
  g.textAlign='center'; g.fillStyle='rgba(255,255,255,.35)'; g.font='12px Trebuchet MS';
  g.fillText('A/D move · W jump · J punch · K kick · L block · I ability', cx, H*0.94);
}

function drawMini(g, f){
  // simplified front-facing fighter for menus
  const c=f.char;
  const bob=Math.sin(f.t*3)*2;
  g.fillStyle=c.colB; roundRect(g,-9,-46+bob,10,40,6); g.fill();
  roundRect(g,1,-46+bob,10,40,6); g.fill();
  g.fillStyle=c.colB; roundRect(g,-16,-96+bob,32,52,10); g.fill();
  g.fillStyle=c.colA; roundRect(g,-16,-96+bob,32,34,10); g.fill();
  g.fillStyle=c.colC; g.fillRect(-16,-78+bob,32,4);
  g.fillStyle=c.skin; g.beginPath(); g.arc(0,-108+bob,15,0,7); g.fill();
  drawHair(g,c,bob,c.colC,c.colA);
  g.fillStyle='#241018'; g.fillRect(4,-112+bob,4,3); g.fillRect(10,-112+bob,3,3);
  g.fillStyle=c.colA; roundRect(g,-22,-88+bob,10,34,5); g.fill();
  roundRect(g,12,-88+bob,10,34,5); g.fill();
}

//  RENDER: CHARACTER SELECT
// ============================================================
let cardRects=[];
function gridRects(){
  const n=CHARS.length, cols = n;
  const cw=Math.min(W*0.20, 150), ch=cw*1.15, gap=Math.min(W*0.03,22);
  const tot=cols*cw+(cols-1)*gap;
  const x0=W/2-tot/2, y0=H*0.34;
  const arr=[];
  for(let i=0;i<n;i++) arr.push({x:x0+i*(cw+gap), y:y0, w:cw, h:ch});
  return arr;
}
function confirmRect(){
  const w=Math.min(W*0.42,280), h=Math.min(H*0.10,64);
  return {x:W/2-w/2, y:H*0.82, w, h};
}
function renderSelect(g){
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0612'); bg.addColorStop(1,'#20081c');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  g.textAlign='center'; g.fillStyle='#fff'; g.font=`bold ${Math.min(W*0.07,44)}px Trebuchet MS`;
  g.fillText('CHOOSE YOUR FIGHTER', W/2, H*0.14);
  g.fillStyle='rgba(255,255,255,.4)'; g.font='13px Trebuchet MS';
  g.fillText(isTouch?'tap a card twice to lock in':'A/D to browse · SPACE to lock in', W/2, H*0.14+26);

  const rects=gridRects(); cardRects=rects;
  for(let i=0;i<CHARS.length;i++){
    const c=CHARS[i], r=rects[i], sel=i===selIndex;
    g.save();
    if(sel){
      g.shadowColor=c.colA; g.shadowBlur=30;
    }
    g.fillStyle=sel?'rgba(255,255,255,.10)':'rgba(255,255,255,.04)';
    roundRect(g,r.x,r.y,r.w,r.h,14); g.fill();
    g.strokeStyle=c.colA; g.lineWidth=sel?4:2; g.globalAlpha=sel?1:.6;
    roundRect(g,r.x,r.y,r.w,r.h,14); g.stroke();
    g.restore();

    // portrait
    g.save(); g.translate(r.x+r.w/2, r.y+r.h*0.52); g.scale(sel?1.05:0.95,sel?1.05:0.95);
    const fake={char:c, state:POSE.IDLE, t:selT+i*0.8, anim:0};
    drawMini(g,fake);
    g.restore();

    g.textAlign='center';
    g.fillStyle='#fff'; g.font='bold 15px Trebuchet MS';
    g.fillText(c.name, r.x+r.w/2, r.y+r.h+20);
    g.fillStyle='rgba(255,255,255,.45)'; g.font='11px Trebuchet MS';
    g.fillText(c.tag, r.x+r.w/2, r.y+r.h+36);
  }

  // ability panel for selected
  const c=CHARS[selIndex];
  const pw=Math.min(W*0.8,620), ph=Math.min(H*0.14,96), px=W/2-pw/2, py=H*0.63;
  g.save();
  g.fillStyle='rgba(0,0,0,.45)'; roundRect(g,px,py,pw,ph,12); g.fill();
  g.strokeStyle=c.colA; g.globalAlpha=.6; g.lineWidth=2; roundRect(g,px,py,pw,ph,12); g.stroke();
  g.globalAlpha=1; g.textAlign='left';
  g.fillStyle=c.colA; g.font='bold 16px Trebuchet MS';
  g.fillText('ABILITY · '+c.ability.name, px+16, py+26);
  g.fillStyle='#ddd'; g.font='12.5px Trebuchet MS';
  wrapText(g, c.ability.desc, px+16, py+50, pw-32, 16);
  g.fillStyle='rgba(255,255,255,.55)'; g.font='11px Trebuchet MS';
  g.fillText(`HP ${c.hp}  ·  SPEED ${c.speed}  ·  DMG x${c.dmg.toFixed(2)}`, px+16, py+ph-10);
  g.restore();

  // confirm
  const cb=confirmRect(); const ready=true;
  g.save(); g.textAlign='center';
  g.fillStyle='rgba(255,80,120,.85)'; roundRect(g,cb.x,cb.y,cb.w,cb.h,12); g.fill();
  g.strokeStyle='#fff'; g.globalAlpha=.5; g.lineWidth=2; roundRect(g,cb.x,cb.y,cb.w,cb.h,12); g.stroke();
  g.globalAlpha=1; g.fillStyle='#fff'; g.font='bold 20px Trebuchet MS';
  g.fillText('FIGHT  ▶', W/2, cb.y+cb.h*0.66);
  g.restore();

  // rival preview
  g.textAlign='center'; g.fillStyle='rgba(255,255,255,.35)'; g.font='12px Trebuchet MS';
  g.fillText('rival is chosen at random', W/2, H*0.75);
}

function wrapText(g,text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxW){ g.fillText(line,x,yy); line=w; yy+=lh; }
    else line=test;
  }
  g.fillText(line,x,yy);
}

// ============================================================
//  FIGHT LOOP
// ============================================================
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.033);
  if(hitStop>0){ hitStop-=dt; dt*=0.15; }
  shake*=0.88; flashScreen=Math.max(0,flashScreen-dt*2.2);
  step(dt); render();
  requestAnimationFrame(loop);
}

function step(dt){
  if(screen==='menu'){ menuT+=dt; return; }
  if(screen==='select'){ selT+=dt; return; }

  fightT+=dt;
  updateProjectiles(dt);

  if(screen==='over'){
    p1.update(dt,p2); p2.update(dt,p1);
    return;
  }
  if(screen==='fight'){
    if(fightState==='intro'){ if(fightT>1.1){ fightState='live'; fightT=0; } return; }
    roundTime-=dt;
    p1.update(dt,p2); p2.update(dt,p1);
    const dx=p2.x-p1.x, minD=54;
    if(Math.abs(dx)<minD){ const push=(minD-Math.abs(dx))/2*Math.sign(dx||1); p1.x-=push; p2.x+=push; }
    if(p1.hitFlash>0.9||p2.hitFlash>0.9) hitStop=Math.max(hitStop,0.05);
    if(p1.ko||p2.ko||roundTime<=0){
      lastFightWinner = p2.ko?'p1':(p1.ko?'p2':(p1.hp===p2.hp?'draw':(p1.hp>p2.hp?'p1':'p2')));
      screen='over'; fightT=0;
      if(lastFightWinner!=='draw'){ const w=lastFightWinner==='p1'?p1:p2; w.state=POSE.IDLE; }
    }
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(screen==='menu'){ renderMenu(ctx); return; }
  if(screen==='select'){ renderSelect(ctx); return; }

  ctx.save();
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);
  drawArena(ctx);
  const order=[p1,p2].sort((a,b)=>a.y-b.y);
  for(const f of order) f.draw(ctx);
  drawProjectiles(ctx);
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=1/60;
    if(f.t>=f.life){ fx.splice(i,1); continue; }
    const k=1-f.t/f.life;
    ctx.save(); ctx.globalAlpha=k;
    if(f.ring){ ctx.strokeStyle=f.col; ctx.lineWidth=3*k+1;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r+(1-k)*f.max,0,7); ctx.stroke(); }
    else if(f.txt){ ctx.fillStyle=f.c; ctx.font='bold 18px Trebuchet MS'; ctx.textAlign='center';
      ctx.fillText(f.txt, f.x, f.y+(1-k)*-30); }
    else { f.x+=f.vx/60; f.y+=f.vy/60; f.vy+=1400/60; f.vx*=0.97;
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*k,0,7); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();

  drawHUD(ctx);
  ctx.save(); ctx.textAlign='center'; ctx.font='bold 30px Trebuchet MS';
  ctx.fillStyle=roundTime<10?'#ff4d6d':'#fff';
  ctx.fillText(Math.max(0,Math.ceil(roundTime)), W/2, 96);
  ctx.restore();

  if(flashScreen>0){ ctx.fillStyle=`rgba(255,255,255,${flashScreen*0.8})`; ctx.fillRect(0,0,W,H); }

  if(screen==='fight'&&fightState==='intro'){
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle='#fff'; ctx.font='bold 54px Trebuchet MS';
    ctx.globalAlpha=Math.min(1,fightT*2);
    ctx.fillText(fightT<0.6?'ROUND 1':'FIGHT!', W/2, H*0.42);
    ctx.restore();
  }

  if(screen==='over'){
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle = lastFightWinner==='draw'?'#ffd166':'#fff';
    ctx.font='bold 52px Trebuchet MS';
    ctx.fillText(lastFightWinner==='draw'?'DRAW':(lastFightWinner==='p1'?'YOU WIN!':'RIVAL WINS'), W/2, H*0.34);
    ctx.font='16px Trebuchet MS'; ctx.fillStyle='#c9b7ff';
    ctx.fillText(lastFightWinner==='p1'?'🔥 clean. run it back?':'tough one. rematch?', W/2, H*0.34+34);
    ctx.restore();

    // buttons
    overButtons=[];
    const bw=Math.min(W*0.6,300), bh=Math.min(H*0.09,56), bx=W/2-bw/2;
    const specs=[
      {label:'REMATCH', y:H*0.48, fn:()=>{ rivalIndex=randomRival(); startFight(); }, col:'#ff4d6d'},
      {label:'CHANGE FIGHTER', y:H*0.48+bh+16, fn:()=>{ goSelect(); }, col:'#7fd7ff'},
      {label:'MAIN MENU', y:H*0.48+2*(bh+16), fn:()=>{ goMenu(); }, col:'#8f8fa8'}
    ];
    for(const s of specs){
      const r={x:bx,y:s.y,w:bw,h:bh,fn:s.fn};
      overButtons.push(r);
      const on = overButtons.mouseOver===r;
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,.06)'; roundRect(ctx,r.x,r.y,r.w,r.h,12); ctx.fill();
      ctx.strokeStyle=s.col; ctx.lineWidth=2; ctx.globalAlpha=.85;
      roundRect(ctx,r.x,r.y,r.w,r.h,12); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.font='bold 18px Trebuchet MS';
      ctx.fillText(s.label, W/2, r.y+r.h*0.66);
      ctx.restore();
    }
  }
}

// start
goMenu();
requestAnimationFrame(loop);
window.CLASH = { p1, p2, CHARS, get screen(){return screen}, startFight, goSelect, goMenu,
  setSel(i){ selIndex=i; }, get sel(){return selIndex} };
</script>
