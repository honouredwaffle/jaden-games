function onKeyPress(code){
  if((screen==='menu'||screen==='select') && code==='KeyM') setDiff(diffIndex+1);
  if((screen==='menu'||screen==='select') && code==='KeyC') toggleCtrl();
  if(code==='BracketLeft'||code==='Comma'){ setArena(arenaIndex-1); arenaOverride=arenaIndex; }
  if(code==='BracketRight'||code==='Period'){ setArena(arenaIndex+1); arenaOverride=arenaIndex; }
  const go=['Space','Enter','KeyJ','NumpadEnter'];
  if(screen==='menu'){ if(code==='KeyT'){ openTraining(); return; } if(go.includes(code)) goSelect(); }
  else if(screen==='select'){
    if(['KeyA','ArrowLeft'].includes(code)){ selIndex=(selIndex+CHARS.length-1)%CHARS.length; selFlash=0.25; }
    if(['KeyD','ArrowRight'].includes(code)){ selIndex=(selIndex+1)%CHARS.length; selFlash=0.25; }
    if(code==='KeyT'){ openTraining(); return; }
    if(go.includes(code)){ rivalIndex=randomRival(); startFight(); }
  }
  else if(screen==='fight'){ if(code==='Escape') goSelect(); if(code==='KeyT') openTraining(); }
  else if(screen==='training'){
    if(code==='Escape'){ if(trainMenuOpen) setTrainMenuOpen(false); else goMenu(); }
    if(code==='KeyT') setTrainMenuOpen(!trainMenuOpen);
    if(code==='KeyR') trainReset();
  }
  else if(screen==='over'){
    if(go.includes(code)){ rivalIndex=randomRival(); startFight(); }
    if(code==='KeyT'){ openTraining(); return; }
    if(['Escape','Backspace'].includes(code)) goSelect();
  }
}
function onPointer(x,y){
  if(!x&&!y) { /* noop */ }
  if(screen==='menu'){ if(inRect(x,y,ctrlRect())){ toggleCtrl(); return; } if(inRect(x,y,diffRect())){ setDiff(diffIndex+1); return; } if(inRect(x,y,menuTrainRect())){ openTraining(); return; } goSelect(); return; }
  if(screen==='select'){
    if(inRect(x,y,diffPillRect())){ setDiff(diffIndex+1); return; }
    if(inRect(x,y,arenaPillRect())){ setArena(arenaIndex+1); arenaOverride=arenaIndex; return; }
    const tiles=selectTiles();
    for(let i=0;i<tiles.length;i++){
      if(inRect(x,y,tiles[i])){
        if(selIndex===i){ rivalIndex=randomRival(); startFight(); }
        else { selIndex=i; selFlash=0.3; ring(tiles[i].x+tiles[i].w/2,tiles[i].y+tiles[i].h/2,CHARS[i].colA,16); }
        return;
      }
    }
    if(inRect(x,y,confirmRect())){ rivalIndex=randomRival(); startFight(); return; }
    return;
  }
  if(screen==='fight'){ if(inRect(x,y,menuBtnRect())){ goSelect(); return; } return; }
  if(screen==='training'){
    if(trainMenuOpen){ for(const b of trainBtns){ if(inRect(x,y,b)){ b.fn(); return; } } return; }
    for(const b of trainButtons){ if(inRect(x,y,b)){ b.fn(); return; } }
    return;
  }
  if(screen==='over'){ for(const b of overButtons){ if(inRect(x,y,b)){ b.fn(); return; } } }
}

function renderMenu(g){

  g.fillStyle=bg; g.fillRect(0,0,W,H);
  g.save(); g.globalAlpha=.10;
  for(let i=0;i<7;i++){
    const yy=H*(0.06+i*0.14);
    g.strokeStyle=i%2?'#5bc8ff':'#ff6bd0'; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,yy); g.lineTo(W,yy-60); g.stroke();
  }
  g.restore();
  const cx=W/2, cy=H*0.34, s=Math.min(W*0.13,94);

  g.shadowColor='#ff4d6d'; g.shadowBlur=44;

  for(let i=0;i<n;i++){

    g.save();
    g.fillStyle='rgba(255,255,255,.05)'; roundRect(g,bx,by,cw,ch,12); g.fill();

    g.fillStyle='#fff'; g.font='bold 13px Trebuchet MS'; g.textAlign='center';
    g.fillText(c.name,bx+cw/2,by+ch+18);
  }
  const blink=0.5+0.5*Math.sin(menuT*3);
  g.save(); g.textAlign='center'; g.globalAlpha=0.4+0.6*blink;
  g.fillStyle='#fff'; g.font='bold 20px Trebuchet MS';
  g.fillText(isTouch?'TAP TO PLAY':'PRESS SPACE TO PLAY',cx,H*0.895); g.restore();

  g.fillText('DIFFICULTY'+(isTouch?'  (tap)':'  (M)'),diffRect().x+diffRect().w/2,diffRect().y-8); g.restore();
  drawDiffSeg(g, diffRect(), true);
  // controls selector
  g.save(); g.textAlign='center'; g.fillStyle='rgba(255,255,255,.45)'; g.font='bold 11px Trebuchet MS';
  g.fillText('CONTROLS'+(isTouch?'  (tap)':'  (C)'),ctrlRect().x+ctrlRect().w/2,ctrlRect().y-8); g.restore();
  drawCtrlSeg(g, ctrlRect(), true);
  // TRAINING button
  const tb=menuTrainRect();
  g.save();
  const tg=g.createLinearGradient(tb.x,tb.y,tb.x,tb.y+tb.h);
  tg.addColorStop(0,'rgba(70,200,255,.30)'); tg.addColorStop(1,'rgba(30,120,220,.30)');
  g.fillStyle=tg; roundRect(g,tb.x,tb.y,tb.w,tb.h,10); g.fill();
  g.strokeStyle='#8fe3ff'; g.lineWidth=2; g.shadowColor='#5bc8ff'; g.shadowBlur=14; roundRect(g,tb.x,tb.y,tb.w,tb.h,10); g.stroke();

  g.fillText(isTouch?'⚔  TRAINING':'⚔  TRAINING  (T)',tb.x+tb.w/2,tb.y+tb.h*0.66); g.restore();
  g.textAlign='center'; g.fillStyle='rgba(255,255,255,.35)'; g.font='12px Trebuchet MS';
  g.fillText('LMB/RMB punch/kick · LMB+RMB slam · Space+LMB uppercut · Ctrl+RMB sweep · Q dash · F block (dmg -75%) · F+LMB parry (20s)',cx,H*0.945);
}

/* ============================================================
   RENDER: DBFZ-STYLE CHARACTER SELECT
   ============================================================ */
function selectTiles(){
  const n=CHARS.length;
  const ts=Math.min(W*0.115,H*0.15), gap=ts*0.22;
  const tot=n*ts+(n-1)*gap;
  const x0=W/2-tot/2, y=H*0.72;
  const arr=[];
  for(let i=0;i<n;i++) arr.push({x:x0+i*(ts+gap),y,w:ts,h:ts});
  return arr;
}
function confirmRect(){
  const w=Math.min(W*0.34,240), h=Math.min(H*0.085,58);
  return {x:W/2-w/2,y:H*0.895,w,h};
}
function arenaPillRect(){ const w=Math.min(W*0.40,340), h=Math.min(H*0.05,32); return {x:W/2-w/2,y:H*0.205,w,h}; }
function diffPillRect(){ const a=arenaPillRect(); const w=Math.min(W*0.40,340), h=Math.min(H*0.05,32); return {x:W/2-w/2, y:a.y+a.h+8, w, h}; }

  const spw=Math.min(W*0.16,120), sph=spw*1.0;

  drawPlayerSlot(g, W*0.97-spw, H*0.24, spw, sph, p2.char, 'P2', false, true);

  // central big fighter
  const baseY=H*0.60, sc=Math.min(W/540,H/480);
  g.save();
  g.translate(W/2, baseY); g.scale(sc,sc);
  // glow platform
  const pg=g.createRadialGradient(0,0,4,0,0,150);
  pg.addColorStop(0, c.colA+'55'); pg.addColorStop(1,'transparent');
  g.fillStyle=pg; g.beginPath(); g.ellipse(0,0,150,42,0,0,7); g.fill();

  g.beginPath(); g.ellipse(0,4,58,12,0,0,7); g.fill(); g.restore();
  const scl = selFlash>0 ? 1.05 : 1.0;

    if(sel){ g.shadowColor=cc.colA; g.shadowBlur=26; }

    roundRect(g,t.x,t.y,t.w,t.h,10); g.stroke();
    g.restore();
    g.save(); g.translate(t.x+t.w/2,t.y+t.h-8); g.scale(t.w/120*0.72,t.w/120*0.72);
    paintFighter(g,cc,{t:selT+i*0.7,state:POSE.IDLE,anim:0,atk:null,hitFlash:0,superT:0});
    g.restore();
    if(sel){
      g.save(); g.beginPath();
      g.moveTo(t.x+t.w/2-10,t.y-10); g.lineTo(t.x+t.w/2+10,t.y-10); g.lineTo(t.x+t.w/2,t.y+2); g.closePath();

  cg.addColorStop(0,'#ff5c8a'); cg.addColorStop(1,'#c81e4f');
  g.fillStyle=cg; roundRect(g,cb.x,cb.y,cb.w,cb.h,10); g.fill();
  g.strokeStyle='#fff'; g.globalAlpha=.6; g.lineWidth=2; roundRect(g,cb.x,cb.y,cb.w,cb.h,10); g.stroke();
  g.globalAlpha=1; g.fillStyle='#fff'; g.font='bold 19px Trebuchet MS';
  g.fillText('FIGHT  ▶', W/2, cb.y+cb.h*0.67); g.restore();
}
function drawPlayerSlot(g,x,y,w,h,ch,label,isP1,isCPU){
  g.save();
  g.fillStyle='rgba(4,18,40,.7)'; roundRect(g,x,y,w,h,8); g.fill();
  g.strokeStyle=isP1?'#5bc8ff':'#ff5c8a'; g.lineWidth=2; g.globalAlpha=.8;
  roundRect(g,x,y,w,h,8); g.stroke(); g.restore();
  g.save(); g.textAlign='center'; g.fillStyle=isP1?'#5bc8ff':'#ff5c8a'; g.font='bold 12px Trebuchet MS';
  g.fillText(label,x+w/2,y-6); g.restore();
  if(isCPU){
    g.save(); g.textAlign='center'; g.fillStyle='rgba(255,255,255,.55)'; g.font='bold 34px Trebuchet MS';
    g.fillText('?',x+w/2,y+h*0.62); g.restore();
    g.save(); g.textAlign='center'; g.fillStyle='rgba(255,255,255,.34)'; g.font='10px Trebuchet MS';
    g.fillText('RANDOM',x+w/2,y+h+14); g.restore();
  } else {
    g.save(); g.translate(x+w/2,y+h-8); g.scale(w/130,w/130);
    paintFighter(g,ch,{t:selT,state:POSE.IDLE,anim:0,atk:null,hitFlash:0,superT:0}); g.restore();
    g.save(); g.textAlign='center'; g.fillStyle='#fff'; g.font='bold 11px Trebuchet MS';
    g.fillText(ch.name,x+w/2,y+h+14); g.restore();
  }
}
function wrapText(g,text,x,y,maxW,lh){
  const words=text.split(' '); let line='',yy=y;
  for(const w of words){ const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxW){ g.fillText(line,x,yy); line=w; yy+=lh; } else line=test; }
  g.fillText(line,x,yy);
}

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.033);
  if(hitStop>0){ hitStop-=dt; dt*=0.15; }
  shake*=0.88; flashScreen=Math.max(0,flashScreen-dt*2.2);
  step(dt); render(); requestAnimationFrame(loop);
}
function step(dt){
  arenaT+=dt;
  updateParryBtn();
  if(screen==='menu'){ menuT+=dt; return; }
  if(screen==='select'){ selT+=dt; selFlash=Math.max(0,selFlash-dt*1.6); return; }
  if(screen==='training'){ stepInput(dt); updateTraining(dt); return; }
  fightT+=dt; updateProjectiles(dt);
  if(screen==='over'){ p1.update(dt,p2); p2.update(dt,p1); return; }
  if(screen==='fight'){
    if(fightState==='intro'){ if(fightT>1.1){ fightState='live'; fightT=0; } return; }
    roundTime-=dt;
    stepInput(dt);
    p1.update(dt,p2); p2.update(dt,p1);
    const dx=p2.x-p1.x, minD=54;
    if(Math.abs(dx)<minD){ const push=(minD-Math.abs(dx))/2*Math.sign(dx||1); p1.x-=push; p2.x+=push; }
    if(p1.hitFlash>0.9||p2.hitFlash>0.9) hitStop=Math.max(hitStop,0.05);
    if(p1.ko||p2.ko||roundTime<=0){
      lastFightWinner = p2.ko?'p1':(p1.ko?'p2':(p1.hp===p2.hp?'draw':(p1.hp>p2.hp?'p1':'p2')));
      screen='over'; fightT=0;
      if(lastFightWinner!=='draw'){ const w=lastFightWinner==='p1'?p1:p2; w.state=POSE.IDLE; }
    }
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(screen==='menu'){ renderMenu(ctx); return; }
  if(screen==='select'){ renderSelect(ctx); return; }
  if(screen==='training'){ renderTraining(); return; }
  ctx.save();
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);
  drawArena(ctx);
  for(const f of [p1,p2].sort((a,b)=>a.y-b.y)) f.draw(ctx);
  drawProjectiles(ctx);
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=1/60;
    if(f.t>=f.life){ fx.splice(i,1); continue; }
    const k=1-f.t/f.life;
    ctx.save(); ctx.globalAlpha=k;
    if(f.ring){ ctx.strokeStyle=f.col; ctx.lineWidth=3*k+1;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r+(1-k)*f.max,0,7); ctx.stroke(); }
    else if(f.guard){ drawGuardBurst(ctx,f,k); }
    else if(f.parry){ drawParrySpark(ctx,f,k); }
    else if(f.blast){ drawBlast(ctx,f,k); }
    else if(f.txt){ ctx.fillStyle=f.c; ctx.font='bold 18px Trebuchet MS'; ctx.textAlign='center';
      ctx.fillText(f.txt,f.x,f.y+(1-k)*-30); }
    else { f.x+=f.vx/60; f.y+=f.vy/60; f.vy+=1400/60; f.vx*=0.97;
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*k,0,7); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
  drawHUD(ctx);
  ctx.save(); ctx.textAlign='center'; ctx.font='bold 30px Trebuchet MS';
  ctx.fillStyle=roundTime<10?'#ff4d6d':'#fff';
  ctx.fillText(Math.max(0,Math.ceil(roundTime)),W/2,96); ctx.restore();
  if(flashScreen>0){ ctx.fillStyle=`rgba(255,255,255,${flashScreen*0.8})`; ctx.fillRect(0,0,W,H); }
  if(screen==='fight'&&fightState==='intro'){
    ctx.save(); ctx.textAlign='center';
    const A=currentArena();
    ctx.globalAlpha=Math.min(1,fightT*2);
    ctx.fillStyle=A.accent; ctx.font='bold 18px Trebuchet MS'; ctx.shadowColor=A.edgeGlow; ctx.shadowBlur=14;
    ctx.fillText('◈ '+A.name,W/2,H*0.34); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='bold 54px Trebuchet MS';
    ctx.fillText(fightT<0.6?'ROUND 1':'FIGHT!',W/2,H*0.42); ctx.restore();
  }
  if(screen==='over'){
    ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle=lastFightWinner==='draw'?'#ffd166':'#fff'; ctx.font='bold 52px Trebuchet MS';
    ctx.fillText(lastFightWinner==='draw'?'DRAW':(lastFightWinner==='p1'?'YOU WIN!':'RIVAL WINS'),W/2,H*0.34);
    ctx.font='16px Trebuchet MS'; ctx.fillStyle='#c9b7ff';
    ctx.fillText(lastFightWinner==='p1'?'🔥 clean. run it back?':'tough one. rematch?',W/2,H*0.34+34); ctx.restore();
    overButtons=[];
    const bw=Math.min(W*0.6,300), bh=Math.min(H*0.09,56), bx=W/2-bw/2;
    const specs=[
      {label:'REMATCH',y:H*0.48,fn:()=>{ rivalIndex=randomRival(); startFight(); },col:'#ff4d6d'},
      {label:'CHANGE FIGHTER',y:H*0.48+bh+16,fn:()=>{ goSelect(); },col:'#7fd7ff'},
      {label:'MAIN MENU',y:H*0.48+2*(bh+16),fn:()=>{ goMenu(); },col:'#8f8fa8'}
    ];
    for(const s of specs){
      const r={x:bx,y:s.y,w:bw,h:bh,fn:s.fn}; overButtons.push(r);
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,.06)'; roundRect(ctx,r.x,r.y,r.w,r.h,12); ctx.fill();
      ctx.strokeStyle=s.col; ctx.lineWidth=2; ctx.globalAlpha=.85; roundRect(ctx,r.x,r.y,r.w,r.h,12); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 18px Trebuchet MS';
      ctx.fillText(s.label,W/2,r.y+r.h*0.66); ctx.restore();
    }
  }
}

goMenu();
requestAnimationFrame(loop);
