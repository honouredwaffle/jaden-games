<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#6a7480;overflow:hidden}
#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:6px;white-space:pre;z-index:9}
</style></head><body>
<div id="hud">loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8792a0);
scene.add(new THREE.AmbientLight(0xffffff,1.1));
const d=new THREE.DirectionalLight(0xffffff,1.6); d.position.set(5,16,9); scene.add(d);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0xa8b0ba}));
gr.rotation.x=-Math.PI/2; gr.position.y=-0.02; scene.add(gr);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);
cam.position.set(0,1.5,5); cam.lookAt(0,1.0,0);

const hud=document.getElementById('hud');
const KEY=n=>n.replace(/^mixamorig[0-9]*:?/,'');
window.PROBE={ready:false};
new GLTFLoader().load('assets/mannequin.glb',gltf=>{
  const root=gltf.scene; root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);
  const H=box.max.y-box.min.y;
  const proto=root;
  const clone=skeletonClone(proto);
  clone.scale.setScalar(1.8/H);
  clone.position.y=-box.min.y*(1.8/H);
  clone.traverse(o=>{ if(o.isMesh){o.frustumCulled=false;} });
  scene.add(clone);
  const bones={};
  clone.traverse(o=>{ if(o.isBone){ const k=KEY(o.name); if(!bones[k]) bones[k]=o; } });
  for(const k in bones) bones[k].userData.rest=bones[k].quaternion.clone();
  let nB=0,nM=0; clone.traverse(o=>{ if(o.isBone)nB++; if(o.isMesh)nM++; });
  if(!window.PROBE.peds){ window.PROBE.peds=[]; }
  const ped={group:clone,root:clone,bones,H,minY:box.min.y};
  window.PROBE.ped=ped;
  window.PROBE.ready=true;
  const names=Object.keys(bones);
  hud.textContent='h='+H.toFixed(3)+' bones='+nB+' meshes='+nM+'\n'+names.slice(0,40).join(', ');
  console.log('[probe] ready h='+H.toFixed(3)+' bones='+nB+' meshes='+nM);
},undefined,e=>{ hud.textContent='LOAD FAIL '+e; console.warn(e); });

// ---- helpers exposed for the test harness ----
window.PROBE.render=()=>renderer.render(scene,cam);

function frame(shot){
  // shot: {ang, dist, targetY, label}
  const t=new THREE.Vector3(0,shot.targetY??0.9,0);
  cam.position.set(Math.sin(shot.ang)*shot.dist, (shot.targetY??0.9)+0.25, Math.cos(shot.ang)*shot.dist);
  cam.lookAt(t); cam.updateMatrixWorld();
  renderer.render(scene,cam);
}
window.PROBE.frame=(ang,dist,ty)=>{ frame({ang,dist,targetY:ty}); };

// bone axis probe: rotate a named bone by +a around local X/Y/Z, measure the
// world displacement of a tip bone (foot/head/hand) => which local axis swings it.
function tipOf(bones,which,boneName){
  const side = /Right/.test(boneName)?'Right':'Left';
  if(which==='leg') return bones[side+'ToeBase']||bones[side+'Toe_End']||bones[side+'Foot'];
  if(which==='knee') return bones[side+'Foot']||bones[side+'Leg'];
  if(which==='arm') return bones[side+'Hand']||bones[side+'ForeArm'];
  return bones['Head'];
}
function wp(o){ o.updateWorldMatrix(true,false); return new THREE.Vector3().setFromMatrixPosition(o.matrixWorld); }
window.PROBE.probeAxis=(boneName,which)=>{
  const p=window.PROBE.ped; if(!p) return null;
  const b=p.bones[boneName]; const tip=tipOf(p.bones,which,boneName);
  b.quaternion.copy(b.userData.rest);
  p.root.updateMatrixWorld(true);
  const base=wp(tip).clone();
  const res={bone:boneName,tip:tip.name,base:[base.x,base.y,base.z],ax:{}};
  const A=new THREE.Quaternion();
  for(const [k,ax] of [['X',new THREE.Vector3(1,0,0)],['Y',new THREE.Vector3(0,1,0)],['Z',new THREE.Vector3(0,0,1)]]){
    A.setFromAxisAngle(ax,0.5);
    b.quaternion.copy(b.userData.rest).multiply(A);
    p.root.updateMatrixWorld(true);
    const w=wp(tip);
    const dd=w.clone().sub(base);
    res.ax[k]=[+dd.x.toFixed(3),+dd.y.toFixed(3),+dd.z.toFixed(3)];
    b.quaternion.copy(b.userData.rest);
  }
  p.root.updateMatrixWorld(true);
  return res;
};
window.PROBE.setBone=(boneName,ang,axk)=>{
  const p=window.PROBE.ped; const b=p.bones[boneName]; if(!b) return;
  const ax = axk==='X'?new THREE.Vector3(1,0,0):axk==='Y'?new THREE.Vector3(0,1,0):new THREE.Vector3(0,0,1);
  const q=new THREE.Quaternion().setFromAxisAngle(ax,ang);
  b.quaternion.copy(b.userData.rest).multiply(q);
};
window.PROBE.reset=()=>{ const p=window.PROBE.ped; for(const k in p.bones) p.bones[k].quaternion.copy(p.bones[k].userData.rest); p.root.updateMatrixWorld(true); renderer.render(scene,cam); };
window.PROBE.boneNames=()=>{ const p=window.PROBE.ped; return Object.keys(p.bones); };

// ---- candidate skinned animation (axes from the probe above) ----
const AX={X:new THREE.Vector3(1,0,0),Y:new THREE.Vector3(0,1,0),Z:new THREE.Vector3(0,0,1)};
const _q=new THREE.Quaternion();
function sb(B,name,ang,axis){
  const b=B[name]; if(!b||!b.userData.rest) return;
  _q.setFromAxisAngle(AX[axis],ang);
  b.quaternion.copy(b.userData.rest).multiply(_q);
}
window.PROBE.anim=(phase,run)=>{
  const p=window.PROBE.ped; const B=p.bones;
  const R=run||0, s=Math.sin(phase), c=Math.cos(phase);
  const LEG=0.80+0.32*R;
  // legs swing on local X (both + = forward)
  sb(B,'LeftUpLeg',  s*LEG,'X');
  sb(B,'RightUpLeg',-s*LEG,'X');
  // knee FOLDS as the leg swings forward (cos>0 for L / <0 for R); some bend when back too
  sb(B,'LeftLeg', 0.05+(0.40+0.80*R)*(0.5+0.5*c)+(0.15+0.20*R)*Math.max(0,-c),'X');
  sb(B,'RightLeg',0.05+(0.40+0.80*R)*(0.5-0.5*c)+(0.15+0.20*R)*Math.max(0, c),'X');
  // ankle: point toe on push-off (leg back), lift on swing
  sb(B,'LeftFoot', (0.28*Math.max(0,-s)-0.22*Math.max(0, s)),'X');
  sb(B,'RightFoot',(0.28*Math.max(0, s)-0.22*Math.max(0,-s)),'X');
  // arms: hang (X, + = down for both), swing front/back on Z. NOTE: +Z = forward for
  // the LEFT arm but backward for the RIGHT, so BOTH share -s*AA to swing contralaterally.
  const HANG=1.18+0.10*R, AA=0.95+0.45*R;
  sb(B,'LeftArm',  HANG,'X'); sb(B,'RightArm', HANG,'X');
  sb(B,'LeftArm',  -s*AA,'Z'); sb(B,'RightArm', -s*AA,'Z');
  const EB=0.55+0.75*R;
  sb(B,'LeftForeArm', EB,'X'); sb(B,'RightForeArm', EB,'X');
  // torso: forward lean grows with speed, subtle counter-rotation
  sb(B,'Spine',  0.04+0.09+0.20*R,'X'); sb(B,'Spine1',-s*0.12,'Y'); sb(B,'Spine2',-s*0.07,'Y');
  p.root.updateMatrixWorld(true);
};
window.PROBE.strip=(run)=>{ const out=[]; for(let i=0;i<6;i++){ window.PROBE.anim(i/6*Math.PI*2, run); window.PROBE.frame(Math.PI/2, 4.2, 0.95); } return out.length; };
window.PROBE.frameSide=(ang,dist,ty)=>frame({ang,dist,targetY:ty});
</script></body></html>
