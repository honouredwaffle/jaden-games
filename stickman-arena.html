<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Arena</title>
<style>
  :root{ --paper:#f2ecdd; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0e0e12; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    font-family:'Trebuchet MS',Verdana,sans-serif; color:#222; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0e0e12; }
  #game{ position:relative; width:min(100vw, calc(100vh * 16 / 9)); height:min(100vh, calc(100vw * 9 / 16));
    background:var(--paper); box-shadow:0 10px 40px rgba(0,0,0,.6); overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; image-rendering:auto; }
  /* touch controls */
  #touch{ position:fixed; inset:0; pointer-events:none; z-index:20; }
  #touch button{ pointer-events:auto; position:absolute; border:2px solid rgba(255,255,255,.4);
    border-radius:50%; background:rgba(15,15,20,.5); color:#fff; font-weight:bold;
    font-size:15px; width:62px; height:62px; display:flex; align-items:center;
    justify-content:center; backdrop-filter:blur(4px); -webkit-user-select:none; user-select:none; }
  #touch button:active{ background:rgba(255,90,0,.85); border-color:#fff; }
  .tleft  { left:calc(16px + env(safe-area-inset-left,0px));  bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .tright { left:calc(92px + env(safe-area-inset-left,0px));  bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .tcrouch{ left:calc(16px + env(safe-area-inset-left,0px));  bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  .tjump  { left:calc(92px + env(safe-area-inset-left,0px));  bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  .tf { right:calc(92px + env(safe-area-inset-right,0px));  bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .tg { right:calc(16px + env(safe-area-inset-right,0px));  bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .th { right:calc(16px + env(safe-area-inset-right,0px));  bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  .ts1{ right:calc(92px + env(safe-area-inset-right,0px));  bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  .ts2{ right:calc(168px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .hidden{ display:none !important; }
  #rotate{ position:fixed; inset:0; z-index:50; background:#0e0e12; color:#fff;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; font-size:20px; text-align:center; padding:24px; }
  #rotate .big{ font-size:56px; }
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="touch" class="hidden">
    <button class="tleft" data-k="KeyA">◀</button>
    <button class="tright" data-k="KeyD">▶</button>
    <button class="tcrouch" data-k="KeyS">▼</button>
    <button class="tjump" data-k="KeyW">▲</button>
    <button class="tg" data-k="KeyG">KICK</button>
    <button class="tf" data-k="KeyF">PUNCH</button>
    <button class="th" data-k="KeyH">BLOCK</button>
    <button class="ts1" data-k="Digit1">M1</button>
    <button class="ts2" data-k="Digit2">M2</button>
  </div>
  <div id="rotate" class="hidden"><div class="big">🔄</div><div>Rotate your phone to <b>landscape</b><br>to play Stickman Arena</div></div>
</div></div>
<script>
"use strict";
/* ============================================================
   STICKMAN ARENA  —  v0.1 (grey-box core)
   Build started 2026-10-04 for Jaden.
   - rigged stick fighters, real limb animation (arcs / follow-through)
   - attribute system: each attribute = 4 moves (W.I.P until made)
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const GROUND = 470;

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

/* ---------- attributes ---------- */
const ATTR = {
  fire:      {name:'FIRE',      emoji:'🔥', main:'#ff5a00', glow:'#ffd000', dark:'#7a1e00', fx:'fire'},
  poison:    {name:'POISON',    emoji:'☠️', main:'#9b30ff', glow:'#e0a0ff', dark:'#3d0a5c', fx:'poison'},
  lightning: {name:'LIGHTNING', emoji:'⚡', main:'#00c8ff', glow:'#ffffff', dark:'#00527a', fx:'bolt'},
  devil:     {name:'DEVIL',     emoji:'😈', main:'#ff1030', glow:'#ff5555', dark:'#120000', fx:'devil'},
};
const ATTR_KEYS = Object.keys(ATTR);

/* move slots per attribute — 'wip' shows Work In Progress */
const KITS = {
  lightning: ['burst','beam','wip','wip'],
  fire:      ['wip','wip','wip','wip'],
  poison:    ['wip','wip','wip','wip'],
  devil:     ['wip','wip','wip','wip'],
};

/* ---------- move definitions ---------- */
const MOVES = {
  punch: {startup:70,  active:70,  recovery:150, dmg:6,  reach:44, hh:30, kb:2.4, type:'melee'},
  kick:  {startup:120, active:80,  recovery:230, dmg:11, reach:58, hh:26, kb:5.0, type:'melee'},
  burst: {startup:150, active:130, recovery:260, dmg:14, reach:74, hh:48, kb:3.6, type:'melee'},
  beam:  {startup:430, active:40,  recovery:380, dmg:20, reach:0,  hh:0,  kb:6.0, type:'beam'},
};

/* ---------- input ---------- */
const keys = {};
const pressed = {}; // edge-triggered
addEventListener('keydown', e=>{
  if(!e.repeat && !keys[e.code]) pressed[e.code]=true;
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
function consume(code){ if(pressed[code]){ pressed[code]=false; return true; } return false; }

/* touch controls */
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
function layoutTouch(){
  const portrait = window.innerHeight > window.innerWidth;
  document.getElementById('touch').classList.toggle('hidden', !isTouch);
  document.getElementById('rotate').classList.toggle('hidden', !(isTouch && portrait));
}
if(isTouch){
  document.querySelectorAll('#touch button').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{ e.preventDefault(); if(!keys[k]) pressed[k]=true; keys[k]=true; };
    const off=e=>{ e.preventDefault(); keys[k]=false; };
    b.addEventListener('touchstart',on,{passive:false});
    b.addEventListener('touchend',off,{passive:false});
    b.addEventListener('touchcancel',off,{passive:false});
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  addEventListener('resize', layoutTouch);
  addEventListener('orientationchange', ()=>setTimeout(layoutTouch,150));
  layoutTouch();
}
function syncTouchVisibility(){
  if(!isTouch) return;
  const el=document.getElementById('touch');
  const show = (game.state==='fight' || game.state==='ko');
  el.classList.toggle('hidden', !show);
}
/* tap/click: choose a fighter, toggle CPU, or start */
cv.addEventListener('pointerdown', e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W;
  const y=(e.clientY-r.top)/r.height*H;
  if(game.state==='menu'){
    const n=ATTR_KEYS.length;
    if(y>480){ game.state='selecting'; game.selT=0; return; }
    if(y<110 && x>W-170){ game.p2cpu=!game.p2cpu; return; }
    const idx=clamp(Math.floor(x/(W/n)),0,n-1);
    game.selP1=idx;
  } else if(game.state==='selecting'){
    // ignore
  } else if(game.state==='ko' && game.koTimer>700){ startFight(); }
});

/* ---------- effects ---------- */
let particles = [];
let floaters = [];   // floating text
let shake = 0, hitstop = 0;

function spawnParticle(o){ particles.push(Object.assign({x:0,y:0,vx:0,vy:0,life:400,max:400,size:3,color:'#000',g:0.0004,shape:'dot'},o)); }
function burst(x,y,color,n=10,spd=0.35){
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), s=rand(spd*0.3,spd);
    spawnParticle({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.1,life:rand(220,480),max:480,size:rand(1.5,3.5),color,g:0.0012,shape:'spark'});
  }
}
function floatText(x,y,txt,color){ floaters.push({x,y,txt,color,life:1100,max:1100}); }

/* ============================================================
   FIGHTER
   ============================================================ */
class Fighter{
  constructor(opts){
    this.id=opts.id;
    this.ctrl=opts.ctrl;
    this.x=opts.x; this.y=GROUND;           // y = hip position
    this.vx=0; this.vy=0;
    this.facing=opts.facing;
    this.attr=opts.attr;
    this.isCPU=!!opts.isCPU;
    this.hp=100; this.maxhp=100;
    this.state='idle'; this.stateT=0;
    this.onGround=true;
    this.attack=null; this.attackHit=false;
    this.blocking=false; this.crouch=false;
    this.hurtFlash=0;
    this.walkPhase=0;
    this.trail=[];
    this.pose=null;
    this.spawnBeam=false;
    this.koTimer=0;
    this.chargeGlow=0;
  }
  get attrDef(){ return ATTR[this.attr]; }

  hurt(dmg, dir, kb, stun=280){
    if(this.state==='ko') return;
    let d=dmg;
    if(this.blocking && Math.sign(dir)!==this.facing){ d*=0.25; kb*=0.6; }
    this.hp=Math.max(0,this.hp-d);
    this.hurtFlash=180;
    this.vx = dir*kb;
    this.state='hit'; this.stateT=0;
    this.hitStun = stun;
    this.attack=null;
    shake=Math.max(shake, this.blocking?4:9);
    hitstop=Math.max(hitstop, this.blocking?30:70);
    const ad=this.attrDef;
    burst(this.x+ (this.blocking? 0:0), this.y-24, this.blocking? '#999': ad.main, this.blocking?6:14, this.blocking?0.25:0.5);
    if(this.hp<=0){ this.state='ko'; this.stateT=0; this.koTimer=0; this.vx=dir*6; shake=16; hitstop=140; }
  }
  startMove(name){
    if(this.state==='hit'||this.state==='ko') return;
    if(this.attack) return;
    if(['punch','kick','burst','beam'].includes(name)){
      if(name==='beam' && !this.onGround) return;
      this.attack={name, m:MOVES[name], t:0, dur:MOVES[name].startup+MOVES[name].active+MOVES[name].recovery, fired:false};
      this.state = (name==='punch'||name==='kick')? name : (name==='beam'?'beam':'burst');
      this.stateT=0; this.attackHit=false;
    }
  }
  wip(slot){
    if(this.state==='hit'||this.state==='ko') return;
    const kit=KITS[this.attr];
    if(kit[slot]==='wip'){
      floatText(this.x, this.y-78, 'W.I.P', '#888');
    }
  }
  special(slot){
    const kit=KITS[this.attr];
    const m=kit[slot];
    if(!m || m==='wip'){ this.wip(slot); return; }
    this.startMove(m);
  }

  update(dt, now, opp){
    const ad=this.attrDef;
    if(this.hurtFlash>0) this.hurtFlash-=dt;
    if(hitstop>0) { return; } // world frozen

    // ---- state timers / attack timeline ----
    this.stateT+=dt;
    if(this.attack){
      this.attack.t+=dt;
      const m=this.attack.m;
      if(m.type==='beam' && !this.attack.fired && this.attack.t>=m.startup){
        this.attack.fired=true;
        beams.push({x:this.x+this.facing*40, y:this.y-30, vx:this.facing*0.95, owner:this, life:1500, r:16, attr:this.attr});
        shake=Math.max(shake,6);
      }
      if(this.attack.t>=this.attack.dur){ this.attack=null; if(this.state!=='ko') this.state=this.onGround?'idle':'jump'; }
    }

    // ---- hit state ----
    if(this.state==='hit'){
      if(this.hitStun!==undefined){ this.hitStun-=dt; }
      if((this.hitStun===undefined||this.hitStun<=0)) this.state=this.onGround?'idle':'jump';
    }
    if(this.state==='ko'){ this.koTimer+=dt; this.vx*=0.9; this.x+=this.vx*dt*0.06; return; }

    // ---- movement ----
    const busy = !!this.attack || this.state==='hit';
    let move=0;
    const cpu = this.isCPU && game.state==='fight';
    let ai = null;
    if(cpu) ai = aiThink(this, opp, dt);

    const left  = cpu? ai.left  : keys[this.ctrl.left];
    const right = cpu? ai.right : keys[this.ctrl.right];
    const wantJump = cpu? ai.jump : consume(this.ctrl.jump);
    const wantCrouch = cpu? ai.crouch : keys[this.ctrl.crouch];

    if(!busy && this.state!=='ko'){
      if(left)  move=-1;
      if(right) move=1;
    }
    this.crouch = (!busy && this.onGround && wantCrouch) ? true : false;
    if(this.crouch) move=0;

    // facing handled by AI/player intent when not busy
    if(!busy && move!==0) this.facing = move;

    // horizontal physics
    const speed=3.0;
    if(move!==0 && this.state!=='hit'){
      this.x += move*speed*dt*0.06;
      if(this.onGround){ this.state='walk'; this.walkPhase += dt*0.012; }
      else this.state='jump';
    } else if(this.onGround && this.state==='walk'){ this.state='idle'; }
    if(move===0 && this.onGround && (this.state==='walk')) this.state='idle';

    // jumping
    if(wantJump===true && this.onGround && !busy){
      this.vy=-0.62; this.onGround=false; this.state='jump';
    }

    // gravity
    if(!this.onGround){
      this.vy += 0.0022*dt;
      this.y += this.vy*dt*0.06;
      if(this.y>=GROUND){ this.y=GROUND; this.vy=0; this.onGround=true; if(this.state!=='hit') this.state=this.attack?'punch':'idle'; if(this.state==='jump')this.state='idle'; }
    }
    // knockback velocity decay
    if(Math.abs(this.vx)>0.02){ this.x += this.vx*dt*0.06; this.vx*=Math.pow(0.86, dt/16); }
    else this.vx=0;

    // clamp to arena
    this.x=clamp(this.x, 40, W-40);

    // ---- block ----
    this.blocking = (!busy && this.onGround && (cpu? ai.block : keys[this.ctrl.block]));

    // ---- attacks ----  (player)
    if(!cpu && !busy && this.state!=='hit'){
      if(consume(this.ctrl.punch)) this.startMove('punch');
      else if(consume(this.ctrl.kick)) this.startMove('kick');
      else {
        const sk=this.ctrl.specials;
        for(let i=0;i<sk.length;i++){ if(consume(sk[i])){ this.special(i); break; } }
      }
    }
    // CPU attacks
    if(cpu && !busy && this.state!=='hit' && ai.move){ this.startMove(ai.move); ai.move=null; }

    // ---- build pose ----
    this.pose = computePose(this, now, dt);

    // ---- attack trail (weapon arcs) ----
    if(this.attack){
      const tip = this.pose.bladeTip;
      const wx=this.x + tip.x*this.facing, wy=this.y+tip.y;
      this.trail.push({x:wx,y:wy,life:180,max:180});
    }
    for(let i=this.trail.length-1;i>=0;i--){ this.trail[i].life-=dt; if(this.trail[i].life<=0) this.trail.splice(i,1); }
    if(this.trail.length>24) this.trail.splice(0,this.trail.length-24);

    // ---- hit detection (melee) ----
    if(this.attack && this.attack.m.type==='melee'){
      const m=this.attack.m;
      const t=this.attack.t;
      if(t>=m.startup && t<=m.startup+m.active && !this.attackHit){
        const hx=this.x + this.facing*(m.reach*0.6);
        const hy=this.y - m.hh;
        const oppBody={x:opp.x, y:opp.y-22};
        if(Math.abs(hx-oppBody.x)< (m.reach*0.6+18) && Math.abs(hy-oppBody.y)<40){
          this.attackHit=true;
          opp.hurt(m.dmg, this.facing, m.kb);
          burst(hx, hy, ad.main, 12, 0.5);
        }
      }
    }
    if(this.spawnBeam){ this.spawnBeam=false; }
  }
}

/* ============================================================
   POSE / ANIMATION  (forward kinematics, arcs + follow-through)
   local space: hip at (0,0), -y is up, +x is forward (facing)
   limb angle measured from straight-down (0), + rotates toward +x
   ============================================================ */
const TLEN=26, HEADSEG=9, HR=7, UARM=13, FARM=12, THIGH=16, SHIN=16, BLADE=24;

function seg(o,len,a){ return {x:o.x+Math.sin(a)*len, y:o.y+Math.cos(a)*len}; }

function computePose(f, now, dt){
  const p = { lean:0.16, hipDrop:0, headTilt:-0.05,
    afU:0.80, afL:1.20,   // front arm upper / forearm
    abU:-0.62, abL:-0.28, // back arm
    lfU:0.50, lfL:0.10, lbU:-0.60, lbL:-0.10,
    bladeA:1.70, y:f.y };

  const st=f.state;

  if(st==='idle'){
    const b=Math.sin(now/480)*0.05;
    p.lean=0.16+b*0.3;
    p.lfU=0.50; p.lfL=0.10;      // front leg forward
    p.lbU=-0.60; p.lbL=-0.10;    // back leg back (clear separation)
    p.afU=0.80+b*0.5; p.afL=1.20+b*0.4;   // front arm raised, blade forward
    p.abU=-0.62-b*0.3; p.abL=-0.28;
    p.bladeA=1.70+b*0.4;         // blade angled up-forward
    p.headTilt=-0.05;
    p.hipDrop=Math.sin(now/480)*0.5;
  }
  else if(st==='walk'){
    const s=Math.sin(f.walkPhase), c=Math.cos(f.walkPhase);
    p.lfU=0.55*s; p.lbU=0.55*Math.sin(f.walkPhase+Math.PI);
    p.lfL=p.lfU + 0.5*Math.max(0,-c);
    p.lbL=p.lbU + 0.5*Math.max(0,Math.cos(f.walkPhase));
    p.afU=0.30 - 0.5*s; p.abU=-0.22 + 0.5*s;
    p.afL=p.afU+0.4; p.abL=p.abU+0.35;
    p.lean=0.11; p.hipDrop=-Math.abs(Math.sin(f.walkPhase))*1.5;
  }
  else if(st==='jump' || !f.onGround){
    if(f.vy<0){ // rising - tuck
      p.lfU=0.95; p.lfL=1.7; p.lbU=-0.35; p.lbL=0.2;
      p.afU=1.3; p.afL=1.0; p.abU=-1.0; p.abL=-0.6; p.lean=0.2;
    } else { // falling - reach
      p.lfU=0.5; p.lfL=0.4; p.lbU=-0.5; p.lbL=-0.3;
      p.afU=1.0; p.afL=0.9; p.abU=-0.9; p.abL=-0.5; p.lean=0.12;
    }
  }
  else if(st==='crouch' || f.crouch){
    p.lfU=0.95; p.lfL=-0.35; p.lbU=-0.95; p.lbL=0.5;
    p.lean=0.35; p.afU=0.7; p.afL=1.1; p.abU=0.2; p.abL=0.4;
  }
  else if(st==='hit'){
    const k=clamp(f.stateT/140,0,1);
    p.lean=-0.35*k+0.09; p.headTilt=-0.4*k;
    p.afU=0.3-1.1*k; p.afL=0.5-1.0*k; p.abU=-0.2-0.9*k; p.abL=-0.1-0.7*k;
    p.lfU=0.2*k+0.06; p.lbU=-0.5*k-0.06;
  }
  else if(st==='ko'){
    const k=clamp(f.koTimer/500,0,1);
    p.lean=-1.4*k; p.headTilt=-0.6*k;
    p.afU=-1.2*k+0.3; p.abU=-1.6*k;
    p.lfU=1.0*k; p.lbU=0.5*k; p.lfL=0.6*k; p.lbL=0.9*k;
  }
  else if(st==='punch'){
    const m=MOVES.punch, t=f.attack? f.attack.t : 0;
    const a1=m.startup, a2=m.startup+m.active, a3=m.startup+m.active+m.recovery;
    if(t<a1){ const k=ease(t/a1); p.afU=lerp(0.30,-0.6,k); p.afL=lerp(0.55,-0.15,k); p.lean=lerp(0.09,-0.02,k); p.abU=lerp(-0.22,-0.5,k); }
    else if(t<a2){ const k=ease((t-a1)/(a2-a1)); p.afU=lerp(-0.6,1.55,k); p.afL=lerp(-0.15,1.55,k); p.lean=lerp(-0.02,0.3,k); p.abU=lerp(-0.5,-0.7,k); p.abL=-0.6; }
    else { const k=ease((t-a2)/(a3-a2)); p.afU=lerp(1.55,0.30,k); p.afL=lerp(1.55,0.55,k); p.lean=lerp(0.3,0.09,k); p.abU=lerp(-0.7,-0.22,k); }
    p.bladeA=p.afL;
  }
  else if(st==='kick'){
    const m=MOVES.kick, t=f.attack? f.attack.t : 0;
    const a1=m.startup, a2=m.startup+m.active, a3=m.startup+m.active+m.recovery;
    if(t<a1){ const k=ease(t/a1); p.lean=lerp(0.09,-0.05,k); p.lfU=lerp(0.06,-0.4,k); p.lfL=lerp(0.05,-0.8,k); p.afU=lerp(0.30,0.1,k); p.abU=lerp(-0.22,-0.5,k); }
    else if(t<a2){ const k=ease((t-a1)/(a2-a1)); p.lean=lerp(-0.05,-0.25,k); p.lfU=lerp(-0.4,1.45,k); p.lfL=lerp(-0.8,1.3,k); p.abU=lerp(-0.5,-0.9,k); p.afU=lerp(0.1,-0.3,k); }
    else { const k=ease((t-a2)/(a3-a2)); p.lean=lerp(-0.25,0.09,k); p.lfU=lerp(1.45,0.06,k); p.lfL=lerp(1.3,0.05,k); }
  }
  else if(st==='burst'){
    const m=MOVES.burst, t=f.attack? f.attack.t : 0;
    const a1=m.startup, a2=m.startup+m.active, a3=m.startup+m.active+m.recovery;
    if(t<a1){ const k=ease(t/a1); p.afU=lerp(0.30,-0.9,k); p.abU=lerp(-0.22,-0.9,k); p.lean=lerp(0.09,-0.15,k); }
    else if(t<a2){ const k=ease((t-a1)/(a2-a1)); p.afU=lerp(-0.9,1.5,k); p.abU=lerp(-0.9,1.3,k); p.afL=1.5; p.abL=1.45; p.lean=lerp(-0.15,0.35,k); }
    else { const k=ease((t-a2)/(a3-a2)); p.afU=lerp(1.5,0.30,k); p.abU=lerp(1.3,-0.22,k); p.afL=lerp(1.5,0.55,k); p.abL=lerp(1.45,-0.05,k); p.lean=lerp(0.35,0.09,k); }
    p.bladeA=p.afL;
  }
  else if(st==='beam'){
    const m=MOVES.beam, t=f.attack? f.attack.t : 0;
    const a1=m.startup, a3=m.startup+m.active+m.recovery;
    f.chargeGlow = t<a1 ? ease(t/a1) : 0;
    if(t<a1){ const k=ease(t/a1); p.lean=lerp(0.09,-0.2,k); p.afU=lerp(0.30,1.2,k); p.afL=lerp(0.55,1.5,k); p.abU=lerp(-0.22,1.1,k); p.abL=lerp(-0.05,1.5,k); }
    else { const k=ease(clamp((t-a1)/(m.active*2),0,1)); p.lean=lerp(-0.2,0.3,k); p.afU=lerp(1.2,1.55,k); p.afL=1.55; p.abU=lerp(1.1,1.5,k); p.abL=1.5; }
    p.bladeA=p.afL;
  }

  // forward kinematics
  return fk(p);
}

/* generic forward-kinematics: angles -> joint positions. pose-local origin = hip */
function fk(p){
  const hip={x:0,y:p.hipDrop||0};
  const neck={x:hip.x+Math.sin(p.lean)*TLEN, y:hip.y-Math.cos(p.lean)*TLEN};
  const ha=p.lean+(p.headTilt||0);
  const head={x:neck.x+Math.sin(ha)*HEADSEG, y:neck.y-Math.cos(ha)*HEADSEG};
  const sh={x:neck.x, y:neck.y+2};
  const bKnee=seg(hip,THIGH,p.lbU), bFoot=seg(bKnee,SHIN,p.lbL);
  const fKnee=seg(hip,THIGH,p.lfU), fFoot=seg(fKnee,SHIN,p.lfL);
  const bElb=seg(sh,UARM,p.abU), bHand=seg(bElb,FARM,p.abL);
  const fElb=seg(sh,UARM,p.afU), fHand=seg(fElb,FARM,p.afL);
  const bladeA=(p.bladeA!==undefined)?p.bladeA:p.afL;
  const bladeTip=seg(fHand,BLADE,bladeA);
  Object.assign(p,{hip,neck,head,sh,bKnee,bFoot,fKnee,fFoot,bElb,bHand,fElb,fHand,bladeTip,bladeA});
  return p;
}

/* ============================================================
   ATTRIBUTE SIGNATURES — give each fighter a unique silhouette
   ============================================================ */
// things drawn BEHIND the body (wings, tail, cloak, ground-glow)
function attrBack(p, ad, attr, now, k){
  k=k===undefined?1:k;
  if(attr==='devil'){ drawDevilWings(p, ad, k); drawDevilTail(p, ad, now/430); }
  if(attr==='fire' && k>0.02){          // heat haze/shadow glow behind legs
    ctx.save(); ctx.globalAlpha=0.28*k; ctx.fillStyle=ad.main;
    ctx.beginPath(); ctx.ellipse(p.hip.x, p.hip.y+14, 20*k, 6*k, 0,0,TAU); ctx.fill(); ctx.restore();
  }
  if(attr==='poison' && k>0.02){         // dripping cloak silhouette behind torso
    ctx.save(); ctx.globalAlpha=0.5*k; ctx.fillStyle=ad.dark;
    ctx.beginPath();
    ctx.moveTo(p.neck.x-7*k, p.neck.y+2);
    ctx.quadraticCurveTo(p.hip.x-16*k, p.hip.y+4, p.hip.x-11*k, p.hip.y+18*k);
    ctx.lineTo(p.hip.x+11*k, p.hip.y+18*k);
    ctx.quadraticCurveTo(p.hip.x+16*k, p.hip.y+4, p.neck.x+7*k, p.neck.y+2);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if(attr==='lightning' && k>0.02){      // electric ground arc behind
    ctx.save(); ctx.globalAlpha=0.35*k; ctx.strokeStyle=ad.main; ctx.lineWidth=2;
    for(let i=0;i<2;i++){ ctx.beginPath(); let x=p.hip.x-16; const y=p.hip.y+12+i*4;
      ctx.moveTo(x,y); for(let s=0;s<5;s++){ x+=8; ctx.lineTo(x, y+Math.sin(now/70+s+i)*4);} ctx.stroke(); }
    ctx.restore();
  }
}

// things drawn ON the body (head gear, crest, flame-hair, drips, sparks)
function attrFront(p, ad, attr, now, k){
  k=k===undefined?1:k;
  if(k<0.02) return;
  const ha=p.lean+(p.headTilt||0);
  if(attr==='devil'){ drawHorns(p, ad, k); }

  if(attr==='fire'){                     // flame "hair" — flickering tongues, not a crown
    ctx.save();
    const base={x:p.head.x, y:p.head.y-3};
    const offs=[-4.5,-1.8,1.2,4.2];
    for(let i=0;i<offs.length;i++){
      const sx=offs[i];
      const fl=12+Math.sin(now/70+i*1.7)*6 + (i===1||i===2?5:0);   // taller middle tongues
      const w=2.2+Math.sin(now/110+i)*0.6;
      const wob=Math.sin(now/130+i*2)*2;
      const g2=ctx.createLinearGradient(base.x+sx, base.y, base.x+sx+wob, base.y-fl*k);
      g2.addColorStop(0,'#ff4a00'); g2.addColorStop(0.5, ad.main); g2.addColorStop(0.8,'#ffb300'); g2.addColorStop(1, 'rgba(255,235,120,0)');
      ctx.fillStyle=g2;
      ctx.beginPath();
      ctx.moveTo(base.x+sx-w, base.y);
      ctx.quadraticCurveTo(base.x+sx-w*1.4, base.y-fl*0.55*k, base.x+sx+wob, base.y-fl*k);   // left edge up to wavy tip
      ctx.quadraticCurveTo(base.x+sx+w*1.4, base.y-fl*0.55*k, base.x+sx+w, base.y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  if(attr==='lightning'){                // spiky crest + crackle arcs
    ctx.save(); ctx.strokeStyle=ad.main; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.shadowColor=ad.main; ctx.shadowBlur=6;
    for(let i=0;i<5;i++){
      const sx=p.head.x+(i-2)*2.6, sy=p.head.y-6;
      const h=6+Math.sin(now/60+i)*2;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+(i-2)*1.5, sy-h*k); ctx.stroke();
    }
    // small crackles around shoulders
    for(let i=0;i<3;i++){
      const a=now/120+i*2.1, r=20;
      const cx=p.sh.x+Math.cos(a)*r*k, cy=p.sh.y+Math.sin(a)*r*k;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*7, cy+Math.sin(a)*7+3); ctx.stroke();
    }
    ctx.restore();
  }

  if(attr==='poison'){                   // pointed hood over head + dripping globs
    ctx.save();
    // hood (pointed cowl)
    ctx.fillStyle=ad.dark; ctx.globalAlpha=0.92;
    ctx.beginPath();
    ctx.moveTo(p.head.x-10, p.head.y+3);
    ctx.quadraticCurveTo(p.head.x-11, p.head.y-10*k, p.head.x-1, p.head.y-16*k);
    ctx.quadraticCurveTo(p.head.x+9, p.head.y-20*k, p.head.x+3, p.head.y-26*k);   // peak
    ctx.quadraticCurveTo(p.head.x+12, p.head.y-16*k, p.head.x+10, p.head.y+3);
    ctx.closePath(); ctx.fill();
    // drips falling from hands + blade tip
    const vy=Math.sin(now/260)*2;
    const pts=[[p.fHand.x,p.fHand.y],[p.bHand.x,p.bHand.y],[(p.fHand.x+p.bladeTip.x)/2,(p.fHand.y+p.bladeTip.y)/2]];
    for(const d of pts){
      ctx.globalAlpha=0.9; ctx.fillStyle=ad.main;
      for(let i=0;i<3;i++){ const yy=d[1]+6*k + ((now/6+i*10)%16) + vy; ctx.beginPath(); ctx.arc(d[0]+(i-1)*1.5, yy, 2.6-i*0.5, 0, TAU); ctx.fill(); }
      // drip stream
      ctx.globalAlpha=0.5; ctx.strokeStyle=ad.main; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(d[0], d[1]+4*k); ctx.lineTo(d[0], d[1]+14*k+vy); ctx.stroke();
    }
    ctx.restore();
  }
}


function drawDevilWings(p, ad, spread){
  if(spread<0.03) return;
  const bx=(p.sh.x+p.hip.x)/2, by=(p.sh.y+p.hip.y)/2;
  const wings=[
    {base:1.95, len:48, ax:bx,   ay:by-9},   // upper lobe sweeps up+back
    {base:3.40, len:40, ax:bx-3, ay:by+9},   // lower lobe sweeps down+back
  ];
  ctx.save();
  for(const w of wings){
    const L=w.len*spread;
    const base={x:w.ax, y:w.ay};
    const pts=[];
    for(let f=0; f<3; f++){
      const a=w.base - f*0.34;
      const r=L*(1 - f*0.16);
      pts.push({x:base.x+Math.cos(a)*r, y:base.y+Math.sin(a)*r});
    }
    ctx.beginPath(); ctx.moveTo(base.x,base.y);
    ctx.lineTo(pts[0].x, pts[0].y);
    for(let f=1; f<pts.length; f++){
      const mid={x:(pts[f-1].x+pts[f].x)/2 - 4*spread, y:(pts[f-1].y+pts[f].y)/2 - 4*spread};
      ctx.quadraticCurveTo(mid.x, mid.y, pts[f].x, pts[f].y);
    }
    ctx.quadraticCurveTo(base.x-12*spread, base.y+4*spread, base.x, base.y);
    ctx.closePath();
    ctx.fillStyle=ad.dark; ctx.globalAlpha=0.9; ctx.fill();
    ctx.strokeStyle=ad.main; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.globalAlpha=0.9;
    for(const q of pts){ ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawDevilTail(p, ad, tt){
  ctx.save();
  ctx.strokeStyle=ad.dark; ctx.lineWidth=5; ctx.lineCap='round';
  let tx=p.hip.x-5, ty=p.hip.y+4, ang=Math.PI*0.45;
  ctx.beginPath(); ctx.moveTo(tx,ty);
  for(let i=0;i<6;i++){ ang+=0.38+Math.sin(tt+i*0.6)*0.14; const len=11-i*0.7; tx+=Math.cos(ang)*len; ty+=Math.sin(ang)*len; ctx.lineTo(tx,ty); }
  ctx.stroke();
  // red spade tip
  ctx.fillStyle=ad.main;
  ctx.beginPath(); ctx.moveTo(tx,ty-3.5); ctx.lineTo(tx+3.5,ty+0.5); ctx.lineTo(tx,ty+3); ctx.lineTo(tx-3.5,ty+0.5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHorns(p, ad, grow){
  if(grow<0.03) return;
  const ha=p.lean+(p.headTilt||0);
  ctx.save();
  const hx0=p.head.x, hy0=p.head.y;
  for(const s of [-1,1]){
    const g=grow;
    // root on the head top, tip out+up
    const rootA={x:hx0+Math.sin(ha+s*0.15)*4, y:hy0-Math.cos(ha+s*0.15)*4};
    const rootB={x:hx0+Math.sin(ha+s*0.55)*5, y:hy0-Math.cos(ha+s*0.55)*5};
    const tip ={x:hx0 + s*11*g, y:hy0 - 17*g};
    const ctl ={x:hx0 + s*9*g, y:hy0 - 12*g};
    ctx.beginPath();
    ctx.moveTo(rootA.x, rootA.y);
    ctx.quadraticCurveTo(ctl.x, ctl.y, tip.x, tip.y);
    ctx.quadraticCurveTo(hx0+s*6*g, hy0-6*g, rootB.x, rootB.y);
    ctx.closePath();
    ctx.fillStyle=ad.main; ctx.fill();
    ctx.strokeStyle=ad.glow; ctx.lineWidth=0.8; ctx.stroke();
  }
  ctx.restore();
}


function drawFighter(f, now){
  const p=f.pose; if(!p) return;
  const ad=f.attrDef;

  // weapon trail (arc)
  if(f.trail.length>1){
    ctx.save();
    ctx.lineCap='round';
    for(let i=1;i<f.trail.length;i++){
      const a=f.trail[i-1], b=f.trail[i];
      const k=i/f.trail.length;
      ctx.strokeStyle=ad.main;
      ctx.globalAlpha=0.55*k*(b.life/b.max);
      ctx.lineWidth=3+6*k;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.strokeStyle=ad.glow; ctx.globalAlpha=0.5*k*(b.life/b.max); ctx.lineWidth=1.5+2*k;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing, 1);

  const back = f.hurtFlash>0 ? '#c0392b' : '#6b6b6b';
  const front= f.hurtFlash>0 ? '#e74c3c' : '#141414';
  const lw=5, lwB=4;

  function line(a,b,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  function dot(a,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(a.x,a.y,r,0,TAU); ctx.fill(); }

  // charge glow
  if(f.chargeGlow>0){
    ctx.save();
    const g=ctx.createRadialGradient(p.fHand.x,p.fHand.y,2,p.fHand.x,p.fHand.y,34);
    g.addColorStop(0,ad.glow); g.addColorStop(0.4,ad.main); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.8*f.chargeGlow;
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.fHand.x,p.fHand.y,34,0,TAU); ctx.fill();
    ctx.restore();
  }

  // attribute signature (back)
  attrBack(p, ad, f.attr, now, 1);

  // back limbs
  line(p.hip,p.bKnee,back,lwB); line(p.bKnee,p.bFoot,back,lwB);
  line(p.sh,p.bElb,back,lwB); line(p.bElb,p.bHand,back,lwB);
  // torso
  line(p.hip,p.neck,front,lw+1);
  // head
  dot(p.head,HR,front);
  // attribute signature (front) — horns, flame-hair, crest, hood
  attrFront(p, ad, f.attr, now, 1);
  // front leg
  line(p.hip,p.fKnee,front,lw); line(p.fKnee,p.fFoot,front,lw);
  dot(p.fFoot,3,front);
  // front arm
  line(p.sh,p.fElb,front,lw); line(p.fElb,p.fHand,front,lw);
  // blade
  ctx.strokeStyle=ad.main; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.shadowColor=ad.main; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(p.fHand.x,p.fHand.y); ctx.lineTo(p.bladeTip.x,p.bladeTip.y); ctx.stroke();
  ctx.shadowBlur=0;
  dot(p.fHand,2.5,front);

  ctx.restore();
}

function drawParticles(){
  for(const pt of particles){
    const k=pt.life/pt.max;
    ctx.globalAlpha=clamp(k,0,1);
    ctx.fillStyle=pt.color;
    if(pt.shape==='spark'){
      ctx.strokeStyle=pt.color; ctx.lineWidth=pt.size*0.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x-pt.vx*22,pt.y-pt.vy*22); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size*k+0.5,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function drawBeams(){
  for(const b of beams){
    const ad=ATTR[b.attr];
    const t=1-b.life/1500;
    ctx.save();
    // core
    ctx.strokeStyle='#fff'; ctx.lineWidth=b.r*0.7; ctx.lineCap='round'; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*60, b.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle=ad.main; ctx.lineWidth=b.r; ctx.globalAlpha=0.75;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*90, b.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // rings travelling along
    ctx.globalAlpha=0.9;
    for(let i=0;i<4;i++){
      const rx=b.x-b.vx*(20+i*22);
      ctx.strokeStyle=ad.glow; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(rx,b.y,5+i*1.5,10+i*4,0,0,TAU); ctx.stroke();
      // spiky energy
      ctx.strokeStyle=ad.main; ctx.lineWidth=2;
      for(let a=0;a<6;a++){
        const ang=a/6*TAU + t*3;
        ctx.beginPath(); ctx.moveTo(rx+Math.cos(ang)*10,b.y+Math.sin(ang)*16);
        ctx.lineTo(rx+Math.cos(ang)*20,b.y+Math.sin(ang)*28); ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ============================================================
   AI
   ============================================================ */
let aiTimer=0, aiPlan={left:false,right:false,jump:false,crouch:false,block:false,move:null};
function aiThink(f,opp,dt){
  aiTimer-=dt;
  const dist=Math.abs(f.x-opp.x);
  if(aiTimer<=0){
    aiTimer=rand(250,600);
    aiPlan={left:false,right:false,jump:false,crouch:false,block:false,move:null};
    if(opp && opp.x<f.x) aiPlan.left=true; else if(opp && opp.x>f.x) aiPlan.right=true;
    if(dist<70){
      const r=Math.random();
      if(r<0.45) aiPlan.move='punch';
      else if(r<0.65) aiPlan.move='kick';
      else if(r<0.8) aiPlan.block=true;
      else if(r<0.9 && f.attr==='lightning') aiPlan.move='burst';
    } else if(dist<160){
      if(Math.random()<0.25) aiPlan.jump=true;
    } else {
      // close distance
    }
  } else {
    if(opp && opp.x<f.x) aiPlan.left=true; else if(opp && opp.x>f.x) aiPlan.right=true;
  }
  aiPlan.jump=false; // jump handled by edge once — keep simple
  return aiPlan;
}

/* ============================================================
   GAME
   ============================================================ */
let beams=[];
const game={ state:'menu', winner:null, koTimer:0, p2cpu:false, selP1:2, selP2:0, selT:0 };

let p1, p2;
function makeFighters(){
  p1=new Fighter({id:1,x:300,facing:1, attr:ATTR_KEYS[game.selP1],
    ctrl:{left:'KeyA',right:'KeyD',jump:'KeyW',crouch:'KeyS',punch:'KeyF',kick:'KeyG',block:'KeyH',specials:['Digit1','Digit2','Digit3','Digit4']}});
  p2=new Fighter({id:2,x:660,facing:-1, attr:ATTR_KEYS[game.selP2], isCPU:game.p2cpu,
    ctrl:{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',crouch:'ArrowDown',punch:'KeyK',kick:'KeyL',block:'KeyJ',specials:['Digit7','Digit8','Digit9','Digit0']}});
}

function startFight(){ makeFighters(); game.state='fight'; game.winner=null; game.koTimer=0; particles=[]; floaters=[]; beams=[]; }

/* ---------- update ---------- */
let last=performance.now();
function update(dt, now){
  syncTouchVisibility();
  if(hitstop>0){ hitstop-=dt; }
  if(shake>0) shake*=Math.pow(0.9, dt/16);

  if(game.state==='menu'){
    if(consume('KeyA')) game.selP1=(game.selP1+ATTR_KEYS.length-1)%ATTR_KEYS.length;
    if(consume('KeyD')) game.selP1=(game.selP1+1)%ATTR_KEYS.length;
    if(consume('ArrowLeft')) game.selP2=(game.selP2+ATTR_KEYS.length-1)%ATTR_KEYS.length;
    if(consume('ArrowRight')) game.selP2=(game.selP2+1)%ATTR_KEYS.length;
    if(consume('KeyC')) game.p2cpu=!game.p2cpu;
    if(consume('Space')||consume('Enter')){ game.state='selecting'; game.selT=0; }
    return;
  }
  if(game.state==='selecting'){
    game.selT+=dt;
    if(game.selT>=1500) startFight();
    return;
  }

  if(game.state==='fight' || game.state==='ko'){
    if(hitstop<=0){
      p1.update(dt, now, p2);
      p2.update(dt, now, p1);
    }
    // beams
    for(let i=beams.length-1;i>=0;i--){
      const b=beams[i]; if(hitstop>0) break;
      b.x+=b.vx*dt*0.06; b.life-=dt;
      const opp = (b.owner===p1)? p2 : p1;
      if(Math.abs(b.x-opp.x)<24 && Math.abs(b.y-(opp.y-24))<46){
        opp.hurt(MOVES.beam.dmg, Math.sign(b.vx), MOVES.beam.kb, 420);
        burst(b.x,b.y,ATTR[b.attr].main,22,0.7);
        beams.splice(i,1); continue;
      }
      if(b.life<=0 || b.x<-40 || b.x>W+40) beams.splice(i,1);
    }
    // particles
    for(let i=particles.length-1;i>=0;i--){
      const pt=particles[i]; pt.life-=dt;
      pt.x+=pt.vx*dt*0.06; pt.y+=pt.vy*dt*0.06; pt.vy+=pt.g*dt;
      if(pt.life<=0) particles.splice(i,1);
    }
    for(let i=floaters.length-1;i>=0;i--){ floaters[i].life-=dt; floaters[i].y-=dt*0.02; if(floaters[i].life<=0) floaters.splice(i,1); }

    if(p1.hp<=0 || p2.hp<=0){
      if(game.state==='fight'){ game.state='ko'; game.koTimer=0; game.winner = p1.hp<=0? (p2.hp<=0?'draw':2):1; }
    }
    if(game.state==='ko'){
      game.koTimer+=dt;
      if(game.koTimer>1800 && (consume('Space')||consume('Enter'))) startFight();
    }
  }
}

/* ---------- render ---------- */
function render(now){
  ctx.save();
  if(shake>0.3){ ctx.translate(rand(-shake,shake), rand(-shake,shake)); }

  // paper bg
  ctx.fillStyle='#f2ecdd'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='rgba(120,120,110,0.13)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // ground
  ctx.fillStyle='rgba(60,55,45,0.10)'; ctx.fillRect(0,GROUND+2,W,H-GROUND);
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,GROUND+2); ctx.lineTo(W,GROUND+2); ctx.stroke();

  if(game.state==='menu'||game.state==='selecting'){ drawMenu(now); ctx.restore(); return; }

  drawBeams();
  // fighters (draw the one further back first)
  const order = p1.y<=p2.y? [p2,p1]:[p1,p2];
  drawFighter(order[0], now); drawFighter(order[1], now);
  drawParticles();

  // floating text
  for(const fl of floaters){
    ctx.globalAlpha=clamp(fl.life/fl.max,0,1);
    ctx.fillStyle=fl.color; ctx.font='bold 20px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText(fl.txt, fl.x, fl.y); ctx.globalAlpha=1;
  }

  drawHUD();

  if(game.state==='ko'){
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,H/2-60,W,120);
    ctx.fillStyle='#fff'; ctx.font='bold 52px Trebuchet MS';
    const t = game.winner===1? ATTR[p1.attr].name+' WINS' : game.winner===2? ATTR[p2.attr].name+' WINS' : 'DOUBLE KO';
    ctx.fillText(t, W/2, H/2+6);
    ctx.font='18px Trebuchet MS';
    ctx.fillText('Press SPACE for a rematch', W/2, H/2+42);
  }
  ctx.restore();
}

function drawHUD(){
  const bar=(x,y,w,h,hp,flip,ad)=>{
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(x-2,y-2,w+4,h+4);
    ctx.fillStyle='#7a7a72'; ctx.fillRect(x,y,w,h);
    const ww=w*clamp(hp/100,0,1);
    const g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,'#ff4d4d'); g.addColorStop(1,ad.main);
    ctx.fillStyle=g;
    if(flip) ctx.fillRect(x+w-ww,y,ww,h); else ctx.fillRect(x,y,ww,h);
    ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
  };
  // P1 bar
  bar(24,24,330,20,p1.hp,false,p1.attrDef);
  ctx.fillStyle='#1a1a1a'; ctx.font='bold 16px Trebuchet MS'; ctx.textAlign='left';
  ctx.fillText(p1.attrDef.emoji+' '+p1.attrDef.name+'  —  P1', 24, 66);
  // P2 bar
  bar(W-24-330,24,330,20,p2.hp,true,p2.attrDef);
  ctx.textAlign='right';
  ctx.fillText((p2.isCPU?'CPU  —  ':'P2  —  ')+p2.attrDef.name+' '+p2.attrDef.emoji, W-24, 66);
}

/* generic rig painter at a screen position */
function drawRig(p, sx, sy, scale, front, back, ad, opts){
  opts=opts||{};
  const now=opts.now||0, k=(opts.k===undefined?1:opts.k), attr=opts.attr;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(scale,scale);
  const lw=5, lwB=4;
  const line=(a,b,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); };
  const dot=(a,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(a.x,a.y,r,0,TAU); ctx.fill(); };

  if(attr) attrBack(p, ad, attr, now, k);
  line(p.hip,p.bKnee,back,lwB); line(p.bKnee,p.bFoot,back,lwB);
  line(p.sh,p.bElb,back,lwB); line(p.bElb,p.bHand,back,lwB);
  line(p.hip,p.neck,front,lw+1);
  dot(p.head,HR,front);
  if(attr) attrFront(p, ad, attr, now, k);
  line(p.hip,p.fKnee,front,lw); line(p.fKnee,p.fFoot,front,lw); dot(p.fFoot,3,front);
  line(p.sh,p.fElb,front,lw); line(p.fElb,p.fHand,front,lw);
  if(opts.blade!==false){
    ctx.strokeStyle=ad.main; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.shadowColor=ad.main; ctx.shadowBlur=opts.glow||8;
    ctx.beginPath(); ctx.moveTo(p.fHand.x,p.fHand.y); ctx.lineTo(p.bladeTip.x,p.bladeTip.y); ctx.stroke();
    ctx.shadowBlur=0;
  }
  dot(p.fHand,2.5,front);
  ctx.restore();
}

function attrAura(ad, x, y, now, strength){
  const pulse=1+0.08*Math.sin(now/300);
  ctx.save();
  const g=ctx.createRadialGradient(x,y-10,6,x,y-10,95*pulse);
  g.addColorStop(0,ad.main); g.addColorStop(0.35,ad.glow); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.28*strength;
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y-10,95*pulse,0,TAU); ctx.fill();
  ctx.restore();
}

function ring(x,y,col,label){
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=3; ctx.globalAlpha=0.9;
  ctx.strokeRect(x-72,y-118,144,196);
  ctx.globalAlpha=1; ctx.fillStyle=col;
  ctx.fillRect(x-72,y-118,44,20);
  ctx.fillStyle='#fff'; ctx.font='bold 13px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText(label, x-50, y-104);
  ctx.restore();
}

/* pose for the character-select figures. ch = 0..1 "chosen" flourish */
/* ---- per-attribute PICK choreography (keyframe list, interpolated) ---- */
const READY = { lean:0.16, headTilt:-0.05, hipDrop:0,
  afU:0.85, afL:1.25, abU:-0.65, abL:-0.30,
  lfU:0.50, lfL:0.12, lbU:-0.60, lbL:-0.12, bladeA:1.75,
  horns:0, wings:0, glow:0.35 };

/* each key: u (0..1), plus any pose fields to lerp toward */
const PICK = {
  devil: [   // crouch/coil low -> rise (hips lead) -> horns sprout -> wings flare -> hero stance
    {u:0,    lean:0.16, headTilt:-0.05, hipDrop:0,  afU:0.85, afL:1.15, abU:-0.60, abL:-0.30, lfU:0.62, lfL:0.20, lbU:-0.70, lbL:-0.24, bladeA:1.60, horns:0, wings:0,   glow:0.35},
    {u:0.28, lean:0.70, headTilt:0.45,  hipDrop:8,  afU:0.35, afL:0.15, abU:0.55,  abL:0.40,  lfU:1.05, lfL:-0.75, lbU:-1.10, lbL:0.60, bladeA:0.30, horns:0, wings:0,   glow:0.55},
    {u:0.55, lean:0.24, headTilt:-0.02, hipDrop:2,  afU:0.60, afL:0.70, abU:-0.20, abL:-0.10, lfU:0.55, lfL:0.10, lbU:-0.60, lbL:-0.10, bladeA:0.90, horns:0.6, wings:0.4, glow:0.8},
    {u:0.78, lean:0.02, headTilt:-0.12, hipDrop:-1, afU:0.70, afL:0.55, abU:-0.55, abL:-0.35, lfU:0.50, lfL:0.16, lbU:-0.55, lbL:-0.16, bladeA:1.55, horns:1, wings:0.8, glow:1.0},
    {u:1,    lean:-0.12,headTilt:-0.20, hipDrop:-2, afU:0.55, afL:0.30, abU:-0.95, abL:-0.70, lfU:0.44, lfL:0.18, lbU:-0.48, lbL:-0.18, bladeA:1.90, horns:1, wings:1,   glow:1.0},
  ],
  fire: [    // wind up back -> big overhead two-hand raise -> downward chop to power stance
    {u:0,    lean:0.16, headTilt:-0.05, afU:0.85, afL:1.25, abU:-0.65, abL:-0.30, bladeA:1.75, glow:0.35},
    {u:0.28, lean:-0.30,headTilt:0.08,  afU:-0.60,afL:-1.30,abU:-0.55, abL:-1.10, bladeA:-2.10,glow:0.8},
    {u:0.55, lean:-0.14,headTilt:-0.22, afU:2.45, afL:2.95, abU:2.25, abL:2.80, bladeA:3.05, glow:1.0},
    {u:0.80, lean:0.34, headTilt:0.10,  afU:1.35, afL:1.15, abU:1.10, abL:0.90, bladeA:1.05, glow:1.0},
    {u:1,    lean:0.20, headTilt:-0.04, afU:0.95, afL:1.35, abU:-0.30, abL:-0.10, bladeA:1.70, glow:0.9},
  ],
  poison: [  // low guard -> blade twirl up -> settle into a coiled "come at me" stance
    {u:0,    lean:0.16, headTilt:-0.05, afU:0.85, afL:1.25, abU:-0.65, abL:-0.30, bladeA:1.75, glow:0.35},
    {u:0.30, lean:0.30, headTilt:0.20,  afU:0.20, afL:-0.60,abU:-0.90, abL:-1.10, bladeA:-1.00,glow:0.9},
    {u:0.60, lean:0.10, headTilt:-0.10, afU:1.90, afL:2.20, abU:-0.30, abL:-0.10, bladeA:2.40, glow:1.0},
    {u:1,    lean:0.24, headTilt:-0.06, afU:1.05, afL:1.45, abU:-0.85, abL:-0.55, bladeA:1.95, glow:0.9},
  ],
  lightning: [ // quick draw: snap blade out to the side with a jolt, lean back, arm extended
    {u:0,    lean:0.16, headTilt:-0.05, afU:0.85, afL:1.25, abU:-0.65, abL:-0.30, bladeA:1.75, glow:0.35},
    {u:0.25, lean:0.30, headTilt:0.12,  afU:0.30, afL:-0.30,abU:-0.40, abL:-0.30, bladeA:-0.60,glow:0.9},
    {u:0.55, lean:-0.22,headTilt:0.06,  afU:1.30, afL:1.05, abU:-1.10, abL:-0.90, bladeA:1.45, glow:1.0},
    {u:1,    lean:-0.10,headTilt:-0.08, afU:1.05, afL:1.00, abU:-0.95, abL:-0.85, bladeA:1.55, glow:0.9},
  ],
};

function poseLerp(a, b, k){
  const o={}; for(const key in b){ if(key==='u') continue; o[key]=lerp(a[key]!==undefined?a[key]:b[key], b[key], k); } return o;
}
function pickPose(attr, u){
  const keys=PICK[attr]||PICK.fire;
  if(u<=0) return Object.assign({}, READY, keys[0]);
  for(let i=1;i<keys.length;i++){
    if(u<=keys[i].u){
      const k=ease((u-keys[i-1].u)/(keys[i].u-keys[i-1].u));
      return poseLerp(keys[i-1], keys[i], k);
    }
  }
  return Object.assign({}, keys[keys.length-1]);
}

function selectPose(attr, t, ch){
  const b=Math.sin(t/520);
  let p;
  if(ch>0.001){
    p=pickPose(attr, ch);
    // gentle breathing on top of the held pose
    p.hipDrop=(p.hipDrop||0)+b*0.7; p.lean=(p.lean||0)+b*0.01;
  } else {
    p=Object.assign({}, READY);
    p.hipDrop=b*0.9; p.lean=0.16+b*0.02; p.afU=0.85+b*0.05;
    if(attr==='devil'){ p.lfU=0.62; p.lbU=-0.72; p.lfL=0.24; p.lbL=-0.24; p.lean=0.20; p.afU=0.18; p.afL=0.30; p.abU=-0.30; p.abL=-0.15; p.tailT=b; p.horns=0.85; p.wings=0.85; }
  }
  p.tailT=(p.horns||0)>0 ? (t/520) : b;   // tail animates once demon form is up
  return fk(p);
}

function drawMenu(now){
  const slots=ATTR_KEYS, n=slots.length;
  ctx.textAlign='center';
  ctx.fillStyle='#141414'; ctx.font='bold 52px Trebuchet MS';
  ctx.fillText('STICKMAN ARENA', W/2, 74);
  ctx.font='17px Trebuchet MS'; ctx.fillStyle='#777';
  ctx.fillText('CHARACTER SELECT  —  pick your fighter', W/2, 102);

  const cy=330, sc=1.7;
  for(let i=0;i<n;i++){
    const x=W*(i+0.5)/n;
    const ad=ATTR[slots[i]];
    const isP1=i===game.selP1, isP2=i===game.selP2;
    const chosen=isP1||isP2;
    let ch = 0;                                              // idle: ready stance, no flourish
    if(game.state==='selecting' && chosen) ch = clamp(game.selT/950,0,1);  // play pick animation on choose
    const p=selectPose(slots[i], now+i*500, ch);
    attrAura(ad, x, cy-40, now, chosen?1.0:0.45);
    if(isP2) ring(x,cy-40,'#ff3b3b', game.p2cpu?'CPU':'P2');
    if(isP1) ring(x,cy-40,'#2f9bff','P1');
    drawRig(p, x, cy, sc, '#141414', '#707070', ad,
      {attr:slots[i], now:now, k:(slots[i]==='devil'? (p.horns||0) : 1), glow: chosen?16:8});
    ctx.fillStyle=ad.main; ctx.font='bold 22px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText(ad.emoji+' '+ad.name, x, cy+66);
    const kit=KITS[slots[i]];
    const done=kit.filter(k=>k!=='wip').length;
    ctx.font='bold 13px Trebuchet MS';
    if(done===0){ ctx.fillStyle='#aaa'; ctx.fillText('W.I.P', x, cy+88); }
    else { ctx.fillStyle='#555'; ctx.fillText(done+' / 4 moves', x, cy+88); }
  }

  // bottom bar
  ctx.fillStyle='rgba(20,20,25,0.07)'; ctx.fillRect(W/2-190,486,380,40);
  ctx.fillStyle='#141414'; ctx.font='bold 24px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText('SPACE / TAP TO CHOOSE', W/2, 514);
  ctx.fillStyle='#777'; ctx.font='14px Trebuchet MS';
  if(isTouch){ ctx.fillText('tap a fighter to pick  •  tap here to fight  •  C = CPU', W/2, 540); }
  else { ctx.fillText('P1: A/D   •   P2: ◀ ▶   •   C = toggle CPU   •   then SPACE', W/2, 540); }
  // CPU toggle chip (tap top-right)
  ctx.fillStyle= game.p2cpu? '#2f9bff' : '#b8b0a0';
  ctx.fillRect(W-160, 24, 136, 30);
  ctx.fillStyle='#fff'; ctx.font='bold 14px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText(game.p2cpu? 'VS CPU  (tap)' : '2 PLAYER  (tap)', W-92, 44);
}

/* ---------- loop ---------- */
function frame(now){
  let dt=Math.min(40, now-last); last=now;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
