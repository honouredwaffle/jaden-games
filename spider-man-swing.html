<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider-Man Swing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8);
    font-size: 15px; line-height: 1.6; pointer-events: none;
    background: rgba(0,0,0,.35); padding: 10px 14px; border-radius: 10px;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #ff3b30; }
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,10,25,.88); color: #fff; text-align: center; gap: 10px;
  }
  #overlay h1 { font-size: 44px; letter-spacing: 2px; color: #ff3b30; text-shadow: 0 0 20px rgba(255,59,48,.5); }
  #overlay p { font-size: 15px; color: #cbd5e1; opacity: .9; line-height: 1.7; }
  #overlay .keys { display: inline-block; background: rgba(255,255,255,.08); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.15); font-weight: 600; margin: 0 2px; }
  #playBtn {
    margin-top: 14px; padding: 14px 46px; font-size: 18px; font-weight: 700;
    background: linear-gradient(135deg,#ff3b30,#c62828); color: #fff; border: none;
    border-radius: 40px; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(255,59,48,.4); transition: transform .15s;
  }
  #playBtn:hover { transform: scale(1.05); }
  #speedMeter { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 10; width: 240px; text-align: center; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.8); pointer-events:none; }
  #speedBar { height: 6px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  #speedFill { height: 100%; width: 0%; background: linear-gradient(90deg,#4cc9f0,#ff3b30); transition: width .1s; }
  #speedTxt { font-size: 13px; opacity:.9; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <b>SPIDER</b>-MAN SWING<br>
  Speed: <span id="sp">0</span> km/h
</div>
<div id="speedMeter">
  <div id="speedTxt">Swing speed</div>
  <div id="speedBar"><div id="speedFill"></div></div>
</div>
<div id="overlay">
  <h1>SPIDER-MAN</h1>
  <p>Web-swing through the city</p>
  <p>
    <span class="keys">W A S D</span> move &nbsp;
    <span class="keys">Space</span> jump / release web &nbsp;
    <span class="keys">E</span> shoot web & swing<br>
    <span class="keys">Mouse</span> move camera &nbsp;
    <span class="keys">Shift</span> hold to run
  </p>
  <p style="font-size:13px;opacity:.65">Aim above you, press E to shoot a web and swing! Press E again or Space to let go.</p>
  <button id="playBtn">PLAY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const gameDiv = document.getElementById('game');
  let scene, camera, renderer, player, buildings = [], ground;
  let keys = {}, mouseMoved = false;

  // Camera orbit
  let camAngle = 0, camPitch = 0.5, camDist = 14;

  // Physics state
  const playerPos = new THREE.Vector3(0, 30, 0);
  const playerVel = new THREE.Vector3(0, 0, 0);
  const GRAVITY = -24;
  let onGround = false;

  // Swinging
  let swinging = false;
  let anchorPoint = null;      // Vector3 anchor
  let webLength = 0;
  const MAX_WEB_LEN = 45;
  const SWING_ACCEL = 20;
  const DAMP = 0.997;

  // Init
  function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1628);
    scene.fog = new THREE.Fog(0x0a1628, 80, 320);

    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    gameDiv.appendChild(renderer.domElement);

    // Lights
    const hemi = new THREE.HemisphereLight(0x6688cc, 0x334466, 0.7);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(80, 120, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.far = 300;
    scene.add(sun);

    // Ground
    ground = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshStandardMaterial({ color: 0x1a2333, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Streets grid lines
    const grid = new THREE.GridHelper(500, 40, 0x2a3a55, 0x223050);
    grid.position.y = 0.1;
    scene.add(grid);

    buildCity();

    // Player model (simple stylized)
    player = new THREE.Group();
    buildPlayerModel(player);
    player.position.copy(playerPos);
    scene.add(player);

    // Events
    document.addEventListener('keydown', e => { keys[e.code] = true; handleKeyDown(e.code); });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    document.addEventListener('mousemove', onMouseMove);
    document.getElementById('playBtn').addEventListener('click', start);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  }

  function buildCity(){
    const rng = mulberry32(1337);
    const colCount = 10, rowCount = 10;
    const blockSize = 9, spacing = 12;
    for(let ix=0; ix<colCount; ix++){
      for(let iz=0; iz<rowCount; iz++){
        if(rng() < 0.18) continue; // gap for streets/plazas
        const cx = (ix - colCount/2) * spacing;
        const cz = (iz - rowCount/2) * spacing;
        const w = 6 + rng()*5;
        const d = 6 + rng()*5;
        let h = 12 + rng()*50;
        // taller toward center
        const dist = Math.hypot(cx, cz);
        h += Math.max(0, 40 - dist) * 0.8;
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.6 + rng()*0.1, 0.15, 0.25 + rng()*0.25),
          roughness: 0.8, metalness: 0.1
        });
        const geo = new THREE.BoxGeometry(w, h, d);
        const building = new THREE.Mesh(geo, mat);
        building.position.set(cx, h/2, cz);
        building.castShadow = true;
        building.receiveShadow = true;
        // small random rotation
        building.rotation.y = (rng()-0.5)*0.3;
        scene.add(building);
        buildings.push({ mesh: building, halfW: w/2, halfD: d/2, height: h, x: cx, z: cz });

        // windows (fake emissive dots)
        const winMat = new THREE.MeshBasicMaterial({ color: 0xffdd88 });
        const winCount = Math.floor(rng()*40)+20;
        for(let i=0;i<winCount;i++){
          const side = Math.floor(rng()*4);
          const wy = 2 + rng()*(h-4);
          const wx = (side<2 ? (rng()*w - w/2) : (side%2==0 ? w/2+0.15 : -w/2-0.15));
          const wz = (side>=2 ? (rng()*d - d/2) : (side%2==0 ? d/2+0.15 : -d/2-0.15));
          const win = new THREE.Mesh(winMat, new THREE.CircleGeometry(0.22, 6));
          win.position.set(cx+wx, wy, cz+wz);
          if(Math.abs(wx)>w/2) win.rotation.y = Math.PI/2;
          else if(Math.abs(wz)>d/2) win.rotation.y = 0;
          scene.add(win);
        }
      }
    }
  }

  function buildPlayerModel(g){
    // body
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.45), new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.5 }));
    body.position.y = 0.55;
    g.add(body);
    // head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.4 }));
    head.position.y = 1.45;
    g.add(head);
    // eyes (white)
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
    eye.scale.set(1,0.6,0.3);
    eye.position.set(0, 1.45, 0.32);
    g.add(eye);
    // legs
    const legMat = new THREE.MeshStandardMaterial({ color: 0xcc1111 });
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,0.2), legMat); legL.position.set(-0.18,-0.35,0); g.add(legL);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,0.2), legMat); legR.position.set(0.18,-0.35,0); g.add(legR);
  }

  // Web line visual
  let webLine = null;
  function updateWebLine(){
    if(swinging && anchorPoint){
      if(!webLine){
        const mat = new THREE.LineBasicMaterial({ color: 0xffffff });
        const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        webLine = new THREE.Line(geo, mat);
        scene.add(webLine);
      }
      const pts = webLine.geometry.attributes.position;
      pts.setXYZ(0, playerPos.x, playerPos.y, playerPos.z);
      pts.setXYZ(1, anchorPoint.x, anchorPoint.y, anchorPoint.z);
      pts.needsUpdate = true;
    } else if(webLine){
      scene.remove(webLine);
      webLine.geometry.dispose();
      webLine = null;
    }
  }

  function start(){
    document.getElementById('overlay').style.display='none';
    requestPointerLock();
  }

  function requestPointerLock(){
    renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
  }
  document.addEventListener('click', () => {
    if(document.getElementById('overlay').style.display!=='none') return;
    if(document.pointerLockElement!==renderer.domElement) requestPointerLock();
  });

  function onMouseMove(e){
    if(document.pointerLockElement !== renderer.domElement && mouseMoved) return;
    mouseMoved = true;
    camAngle += e.movementX * 0.003;
    camPitch -= e.movementY * 0.003;
    camPitch = Math.max(-0.2, Math.min(1.3, camPitch));
  }

  function handleKeyDown(code){
    if(code === 'KeyE' && !swinging){
      tryStartSwing();
    } else if((code === 'KeyE' || code==='Space') && swinging){
      // release
      swinging = false;
      anchorPoint = null;
    }
  }

  function tryStartSwing(){
    // find a building above/in front to anchor to
    const dir = getCameraForward();
    let best = null, bestScore = -Infinity;
    const maxReach = MAX_WEB_LEN;
    for(const b of buildings){
      const bx = b.x, by = b.height, bz = b.z;
      const dx = bx - playerPos.x, dy = by - playerPos.y, dz = bz - playerPos.z;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(dist > maxReach) continue;
      // prefer points above and in front
      const score = dist + (playerPos.y - by)*0.4; // penalize anchors too low
      if(score > bestScore){ bestScore = score; best = b; }
    }
    if(best){
      const anchorY = Math.max(playerPos.y + 3, best.height - 2);
      anchorPoint = new THREE.Vector3(best.x, anchorY, best.z);
      webLength = Math.min(MAX_WEB_LEN, anchorPoint.distanceTo(playerPos));
      swinging = true;
    }
  }

  function getCameraForward(){
    const f = new THREE.Vector3();
    camera.getWorldDirection(f);
    f.y = 0;
    if(f.lengthSq() < 0.01) f.set(0,0,-1);
    return f.normalize();
  }

  function getCameraRight(){
    const f = getCameraForward();
    return new THREE.Vector3(-f.z, 0, f.x).normalize();
  }

  let lastTime = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime)/1000);
    lastTime = now;

    updatePlayer(dt);
    updateCamera(dt);
    updateWebLine();

    // HUD speed
    const spd = playerVel.length();
    document.getElementById('sp').textContent = Math.round(spd*3.6);
    document.getElementById('speedFill').style.width = Math.min(100, spd*1.2) + '%';

    renderer.render(scene, camera);
  }

  function updatePlayer(dt){
    const f = getCameraForward();
    const r = getCameraRight();

    // Movement input
    let moveX = 0, moveZ = 0;
    if(keys['KeyW']) moveZ += 1;
    if(keys['KeyS']) moveZ -= 1;
    if(keys['KeyA']) moveX -= 1;
    if(keys['KeyD']) moveX += 1;

    // (already normalized via front/right)
    if(swinging){
      // SWING PHYSICS
      const toAnchor = new THREE.Vector3().subVectors(anchorPoint, playerPos);
      const dist = toAnchor.length();
      // if beyond web length, pull toward anchor
      if(dist > webLength){
        const pull = toAnchor.clone().normalize().multiplyScalar((dist - webLength)*8);
        playerVel.add(pull.multiplyScalar(dt));
      }
      // tangential acceleration toward movement direction
      toAnchor.normalize();
      const tangentDir = playerVel.clone();
      // accelerate along input direction
      if(moveZ !== 0 || moveX !== 0){
        const inputDir = f.clone().multiplyScalar(moveZ).add(r.clone().multiplyScalar(moveX)).normalize();
        playerVel.add(inputDir.multiplyScalar(SWING_ACCEL*dt));
      }
      playerVel.multiplyScalar(DAMP);
      playerVel.y += GRAVITY*0.6*dt; // lighter gravity while swinging
    } else {
      // normal movement (accel-based)
      const accel = (keys['ShiftLeft']||keys['ShiftRight']) ? 40 : 22;
      const targetVel = new THREE.Vector3();
      if(moveZ !== 0 || moveX !== 0){
        targetVel.copy(f).multiplyScalar(moveZ*accel).add(r.clone().multiplyScalar(moveX*accel));
      }
      playerVel.x += (targetVel.x - playerVel.x)*Math.min(1, dt*6);
      playerVel.z += (targetVel.z - playerVel.z)*Math.min(1, dt*6);

      if(keys['Space'] && onGround){
        playerVel.y = 10;
        onGround = false;
      }
      playerVel.y += GRAVITY*dt;
      playerVel.multiplyScalar(0.99);
    }

    // integrate
    playerPos.add(playerVel.clone().multiplyScalar(dt));

    // ground collision
    if(playerPos.y < 1.2){
      playerPos.y = 1.2;
      playerVel.y = 0;
      onGround = true;
    } else {
      onGround = false;
    }

    // collide with buildings (keep out of them)
    for(const b of buildings){
      const dx = playerPos.x - b.x, dz = playerPos.z - b.z;
      if(Math.abs(dx) < b.halfW+0.5 && Math.abs(dz) < b.halfD+0.5){
        if(playerPos.y < b.height){
          // push out along smallest axis
          const ox = b.halfW+0.5 - Math.abs(dx);
          const oz = b.halfD+0.5 - Math.abs(dz);
          if(ox < oz){
            playerPos.x = b.x + Math.sign(dx||1)*(b.halfW+0.5);
          } else {
            playerPos.z = b.z + Math.sign(dz||1)*(b.halfD+0.5);
          }
          // cancel velocity into wall
          // (approximate)
        }
      }
    }

    // stay in bounds
    const LIM = 240;
    playerPos.x = Math.max(-LIM, Math.min(LIM, playerPos.x));
    playerPos.z = Math.max(-LIM, Math.min(LIM, playerPos.z));

    player.position.copy(playerPos);
    // face movement direction-ish
    if(playerVel.lengthSq() > 1){
      const targetAngle = Math.atan2(playerVel.x, playerVel.z);
      player.rotation.y += (targetAngle - player.rotation.y)*Math.min(1, dt*8);
    }
  }

  function updateCamera(dt){
    // camera orbits player
    const offset = new THREE.Vector3(
      Math.sin(camAngle)*Math.cos(camPitch)*camDist,
      Math.sin(camPitch)*camDist,
      Math.cos(camAngle)*Math.cos(camPitch)*camDist
    );
    camera.position.copy(playerPos).add(offset);
    camera.lookAt(playerPos.x, playerPos.y+1, playerPos.z);
    // camera distance / shake on speed for feel
    const spd = playerVel.length();
    camDist = 14 + Math.min(4, spd*0.08);
  }

  // simple seeded rng
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a>>>15, 1 | a);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14)>>>0) / 4294967296;
    };
  }

  init();
})();
</script>
</body>
</html>
