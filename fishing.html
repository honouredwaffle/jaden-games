<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Cast — Fishing Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#04101c; font-family:'Trebuchet MS',system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:absolute; color:#eaf6ff; text-shadow:0 2px 6px rgba(0,0,0,.7); pointer-events:none; user-select:none; }
  #topbar { top:10px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .chip { background:rgba(3,20,36,.72); border:1px solid rgba(120,210,255,.35); border-radius:12px; padding:7px 12px; font-size:15px; font-weight:bold; backdrop-filter:blur(4px); }
  .chip small { display:block; font-size:10px; font-weight:normal; opacity:.65; letter-spacing:.5px; }
  #coin { color:#ffd85e; }
  #msg { top:78px; left:0; right:0; text-align:center; font-size:16px; font-weight:bold; min-height:22px; letter-spacing:.4px; }
  #hint { bottom:14px; left:0; right:0; text-align:center; font-size:14px; opacity:.85; }
  #powerWrap { position:absolute; left:0; right:0; bottom:52px; display:flex; justify-content:center; pointer-events:none; }
  #powerBar { width:min(70%,340px); height:16px; border:2px solid rgba(180,235,255,.7); border-radius:10px; overflow:hidden; background:rgba(0,0,0,.4); display:none; }
  #powerFill { height:100%; width:0%; background:linear-gradient(90deg,#39d98a,#ffd85e,#ff5f6d); transition:width .03s linear; }
  .panel { position:absolute; inset:0; background:rgba(3,12,22,.93); display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .panel.show { display:flex; }
  .card { background:linear-gradient(160deg,#0d2c47,#08202f); border:2px solid #3fa9f5; border-radius:18px; padding:20px 22px; max-width:380px; width:100%; text-align:center; box-shadow:0 18px 60px rgba(0,0,0,.6); }
  .card h2 { font-size:24px; color:#ffd85e; margin-bottom:6px; }
  .card p { font-size:15px; color:#cfe9ff; line-height:1.5; margin:6px 0; }
  .rar { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:bold; margin:6px 0; }
  .btn { display:inline-block; margin-top:14px; padding:12px 22px; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; color:#03202f; background:linear-gradient(180deg,#8fe3ff,#3fa9f5); box-shadow:0 6px 0 #1c5f8f; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #1c5f8f; }
  .btn.small { padding:9px 14px; font-size:14px; }
  .shoprow { display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,.05); border:1px solid rgba(120,210,255,.25); border-radius:12px; padding:10px 12px; margin:7px 0; text-align:left; }
  .shoprow b { font-size:14px; color:#eaf6ff; }
  .shoprow span { display:block; font-size:11px; opacity:.7; }
  .shoprow .buy { background:linear-gradient(180deg,#ffe07a,#ffb528); color:#3a2400; box-shadow:0 4px 0 #a86f00; border:none; border-radius:9px; padding:8px 12px; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap; }
  .shoprow .buy:disabled { filter:grayscale(1); opacity:.5; box-shadow:0 4px 0 #555; cursor:default; }
  .owned { font-size:12px; color:#7dffa8; font-weight:bold; }
  #rarityPop { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:34px; font-weight:bold; opacity:0; pointer-events:none; transition:opacity .25s; }
  #rarityPop.show { opacity:1; animation:pop .5s; }
  @keyframes pop { 0%{transform:scale(.4)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .scroll { max-height:52vh; overflow-y:auto; width:100%; padding-right:4px; }
  .scroll::-webkit-scrollbar { width:6px; } .scroll::-webkit-scrollbar-thumb { background:#3fa9f5; border-radius:3px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud" id="topbar">
    <div class="chip" id="coin">🪙 0<small>COINS</small></div>
    <div class="chip" id="rodChip">🎣 Basic Rod<small>ROD</small></div>
    <div class="chip" id="recChip">0 / 12<small>SPECIES</small></div>
  </div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="hint">Tap & hold to charge your cast</div>
  <div id="powerWrap"><div id="powerBar"><div id="powerFill"></div></div></div>
  <div id="rarityPop"></div>

  <!-- CATCH PANEL -->
  <div class="panel" id="catchPanel">
    <div class="card">
      <h2 id="cName">Fish</h2>
      <div class="rar" id="cRar">Common</div>
      <p id="cStats"></p>
      <p id="cQuote" style="font-style:italic;opacity:.8"></p>
      <p id="cCoins" style="color:#ffd85e;font-size:18px;font-weight:bold"></p>
      <button class="btn" id="cKeep">Keep it 🔥</button>
    </div>
  </div>

  <!-- SHOP PANEL -->
  <div class="panel" id="shopPanel">
    <div class="card">
      <h2>⚓ Bait & Tackle</h2>
      <div class="scroll" id="shopList"></div>
      <button class="btn" id="shopClose">Back to the water</button>
    </div>
  </div>

  <!-- RECORDS PANEL -->
  <div class="panel" id="recPanel">
    <div class="card">
      <h2>📖 Species Records</h2>
      <div class="scroll" id="recList"></div>
      <button class="btn" id="recClose">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    horizon = H*0.34;
  }
  window.addEventListener('resize', resize);

  // ---------- STATE ----------
  const RARITY = {
    common:   {name:'Common',    color:'#9fd6ff', mult:1.0, weight:52},
    uncommon: {name:'Uncommon',  color:'#6dff9b', mult:1.8, weight:26},
    rare:     {name:'Rare',      color:'#4fa8ff', mult:3.2, weight:14},
    epic:     {name:'Epic',      color:'#c07dff', mult:6.0, weight:6},
    cursed:   {name:'CURSED',    color:'#ff4d6d', mult:14.0, weight:2}
  };
  const FISH = [
    // name, rarity, minKg, maxKg, base, quote
    {n:'Sardine',        r:'common',   a:0.05,b:0.25, q:'Small, silver, everywhere.'},
    {n:'Bream',          r:'common',   a:0.3, b:1.1,  q:'A reliable little fighter.'},
    {n:'Flathead',       r:'common',   a:0.5, b:2.0,  q:'Lies in the sand, waits for you.'},
    {n:'Whiting',        r:'common',   a:0.2, b:0.9,  q:'Sweet and quick.'},
    {n:'Snapper',        r:'uncommon', a:1.2, b:5.0,  q:'Pink scales, real attitude.'},
    {n:'Tailor',         r:'uncommon', a:1.0, b:4.2,  q:'Teeth like a saw.'},
    {n:'Jewfish',        r:'uncommon', a:3.0, b:12.0, q:'The quiet giant of the estuary.'},
    {n:'Barramundi',     r:'rare',     a:2.5, b:15.0, q:'The icon. The legend. The barra.'},
    {n:'Mangrove Jack',  r:'rare',     a:1.5, b:8.0,  q:'Hides in the roots, hits like a truck.'},
    {n:'Marlin',         r:'epic',     a:40.0,b:180.0,q:'You did NOT expect this.'},
    {n:'Giant Trevally', r:'epic',     a:10.0,b:45.0, q:'Brutal from the first second.'},
    {n:'Cursed King',    r:'cursed',   a:60.0,b:400.0,q:'Something ancient took the hook. It took the boat too.'}
  ];
  const RODS = [
    {name:'Basic Rod',    cost:0,    cast:1.0, reel:1.0, luck:0,    desc:'It is a stick with string.'},
    {name:'Estuary Rig',  cost:120,  cast:1.18,reel:1.12,luck:1,   desc:'+cast, +reel, better fish.'},
    {name:'Carbon Spinner',cost:420, cast:1.38,reel:1.28,luck:2,   desc:'Fast, light, mean.'},
    {name:'Deep Caster',  cost:1100, cast:1.6, reel:1.45,luck:4,   desc:'Reaches the deep water.'},
    {name:'Cursed Rod',   cost:3000, cast:1.8, reel:1.7, luck:8,   desc:'It hums. You should not have held it.'}
  ];
  const BUSTED = {  // cast beyond the boat's safe reach => lose the fish
  };

  const S = {
    coins: 0, rod: 0, caught: {}, total: 0,
    state: 'idle'     // idle | charging | cast | waiting | bite | reeling | done
  };
  const RIPPLE = { };

  // ---------- persistence ----------
  function save(){
    try{ localStorage.setItem('deepcast_v1', JSON.stringify({coins:S.coins,rod:S.rod,caught:S.caught,total:S.total})); }catch(e){}
  }
  function load(){
    try{
      const d = JSON.parse(localStorage.getItem('deepcast_v1')||'null');
      if(d){ S.coins=d.coins||0; S.rod=d.rod||0; S.caught=d.caught||{}; S.total=d.total||0; }
    }catch(e){}
  }

  // ---------- fishing line / bobber ----------
  let horizon = H*0.34;
  const rod = { x:0, y:0 };              // rod tip anchor (set in layout)
  const bob = { x:0, y:0, tx:0, ty:0, flying:false, t:0, sx:0, sy:0, land:0 };
  let castPower = 0, powerDir = 1;
  let biteTimer = 0, biteWindow = 0;
  let reel = null;   // {fish, prog, pos, vel, zone, zoneVel, zoneMin, zoneMax, difficulty}
  let shakeT = 0;

  const msgEl = document.getElementById('msg');
  const hintEl = document.getElementById('hint');
  const powerBar = document.getElementById('powerBar');
  const powerFill = document.getElementById('powerFill');

  function say(t){ msgEl.textContent = t; }
  function hint(t){ hintEl.textContent = t; }

  function layout(){
    rod.x = W*0.18; rod.y = horizon + 6;
    horizon = H*0.34;
    rod.y = horizon + 6;
  }

  // ---------- input ----------
  const wrap = document.getElementById('wrap');
  function pointerDown(e){
    if(S.state!=='idle' && S.state!=='waiting') return;
    if(S.state==='waiting'){ // early hook = fail
      if(biteWindow>0){ hookSuccess(); } else { say('Too early! The line went slack…'); resetToIdle(); }
      return;
    }
    S.state='charging'; castPower=0; powerDir=1; powerBar.style.display='block';
    hint('Release to cast!');
  }
  function pointerUp(e){
    if(S.state==='charging'){
      powerBar.style.display='none';
      doCast(castPower);
    }
    if(S.state==='reeling'){ reel.holding = false; }
  }
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); pointerDown(e); });
  window.addEventListener('pointerup', e=>{ pointerUp(e); });
  window.addEventListener('pointercancel', ()=>{ if(S.state==='reeling'&&reel) reel.holding=false; });
  window.addEventListener('keydown', e=>{ if(e.code==='Space'&&!e.repeat){ e.preventDefault(); pointerDown(); } });
  window.addEventListener('keyup', e=>{ if(e.code==='Space'){ e.preventDefault(); pointerUp(); } });
  // hold tracking for reeling
  window.addEventListener('pointerdown', ()=>{ if(S.state==='reeling'&&reel) reel.holding=true; });

  document.getElementById('catchPanel').addEventListener('click', e=>{ if(e.target.id==='cKeep') hidePanel('catchPanel'); });
  document.getElementById('shopClose').addEventListener('click', ()=>hidePanel('shopPanel'));
  document.getElementById('recClose').addEventListener('click', ()=>hidePanel('recPanel'));

  function showPanel(id){ document.getElementById(id).classList.add('show'); }
  function hidePanel(id){ document.getElementById(id).classList.remove('show'); }

  // ---------- mechanics ----------
  function doCast(p){
    const power = p/100;
    const maxDist = (W*0.72) * RODS[S.rod].cast;
    const dist = (W*0.16) + power*maxDist;
    bob.sx = rod.x; bob.sy = rod.y - 8;
    bob.tx = Math.min(W-24, rod.x + dist);
    bob.ty = horizon + 20 + Math.random()*30 + power*(H*0.22);
    bob.flying = true; bob.t=0; bob.land=0.45 + power*0.35;
    S.state='cast';
    say('Casting…'); hint('');
  }

  function beginWait(){
    S.state='waiting';
    // luck + rod increases rare odds handled at catch time; wait time here
    const base = 1.3 + Math.random()*3.2;
    const baitBonus = (S.rod>=2?0.75:1.0);
    biteTimer = base*baitBonus;
    hint('Wait for the bite… (tap when you see it!)');
    say('');
  }

  function beginBite(){
    S.state='bite';
    biteWindow = 0.9;
    say('❗ BITE');
    shakeT = 0.3;
  }

  function hookSuccess(){
    const fish = rollFish();
    startReel(fish);
  }

  function rollFish(){
    // weighted by rarity with rod luck shifting odds toward rare
    const luck = RODS[S.rod].luck;
    const weights = {};
    for(const k in RARITY){ weights[k] = RARITY[k].weight; }
    weights.rare   += luck*2.2;
    weights.epic   += luck*1.1;
    weights.cursed += luck*0.35;
    weights.common = Math.max(6, weights.common - luck*2.5);
    let tot=0; for(const k in weights) tot+=weights[k];
    let r = Math.random()*tot, pick='common';
    for(const k in weights){ r-=weights[k]; if(r<=0){ pick=k; break; } }
    const pool = FISH.filter(f=>f.r===pick);
    const f = pool[Math.floor(Math.random()*pool.length)];
    const kg = f.a + Math.random()*(f.b-f.a);
    const value = Math.round(kg * 9 * RARITY[f.r].mult * (12+Math.random()*10) / 9);
    return { n:f.n, r:f.r, kg, value, quote:f.q };
  }

  function startReel(fish){
    const diff = {common:0.55,uncommon:0.7,rare:0.9,epic:1.15,cursed:1.45}[fish.r];
    const reelSpeed = RODS[S.rod].reel;
    const baseFight = 8 / reelSpeed;            // seconds of struggle
    reel = {
      fish,
      prog: 0.28,
      pos: 0.5, vel: 0,
      zone: 0.5, zoneVel: (Math.random()<.5?-1:1)*(0.45/diff),
      zoneH: Math.max(0.16, 0.34/diff),
      fight: baseFight,
      elapsed: 0,
      holding: false,
      grace: 0
    };
    S.state='reeling';
    say('Hooked! KEEP IT IN THE ZONE');
    hint('Hold to lift the bar · release to drop');
    powerBar.style.display='none';
  }

  function finishCatch(win){
    // record
    const f = reel.fish;
    const key = f.n;
    const prev = S.caught[key];
    const isNew = !prev;
    const isRecord = !prev || f.kg > prev.kg;
    if(isRecord) S.caught[key] = {kg:f.kg, value:f.value};
    S.total++;
    if(win){ S.coins += f.value; }
    save();
    reel = null; S.state='done';

    if(win){
      document.getElementById('cName').textContent = (isNew?'🆕 ':'') + f.n;
      const rr = document.getElementById('cRar');
      rr.textContent = RARITY[f.r].name; rr.style.background = RARITY[f.r].color+'22';
      rr.style.color = RARITY[f.r].color; rr.style.border = '1px solid '+RARITY[f.r].color;
      document.getElementById('cStats').textContent = f.kg.toFixed(2)+' kg' + (isRecord?' · ⭐ NEW RECORD':'');
      document.getElementById('cQuote').textContent = '"'+f.quote+'"';
      document.getElementById('cCoins').textContent = '+'+f.value+' 🪙';
      popRarity(f.r);
      showPanel('catchPanel');
    } else {
      say('It got away… 💨');
      hint('Tap & hold to charge your cast');
      setTimeout(()=>{ if(S.state==='done') resetToIdle(); }, 900);
      S.state='done';
    }
    updateHUD();
    if(win){ /* wait for panel close */ } else { /* handled above */ }
  }

  function resetToIdle(){
    bob.flying=false; bob.land=0;
    S.state='idle'; powerBar.style.display='none';
    hint('Tap & hold to charge your cast'); say('');
  }

  function popRarity(r){
    const el = document.getElementById('rarityPop');
    el.textContent = RARITY[r].name.toUpperCase()+'!';
    el.style.color = RARITY[r].color;
    el.style.textShadow = '0 0 24px '+RARITY[r].color;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'), 900);
  }

  // close catch panel -> idle
  document.getElementById('catchPanel').addEventListener('transitionend', ()=>{});
  const _hide = hidePanel;
  hidePanel = function(id){ _hide(id); if(id==='catchPanel'){ resetToIdle(); } };

  // ---------- shop ----------
  function openShop(){ renderShop(); showPanel('shopPanel'); }
  function renderShop(){
    const el = document.getElementById('shopList'); el.innerHTML='';
    RODS.forEach((r,i)=>{
      const row = document.createElement('div'); row.className='shoprow';
      const owned = i<=S.rod;
      const locked = i>S.rod+1;
      row.innerHTML = `<div style="flex:1"><b>🎣 ${r.name}</b><span>${r.desc}</span></div>`;
      if(owned){
        const o=document.createElement('div'); o.className='owned'; o.textContent = i===S.rod?'EQUIPPED':'OWNED'; row.appendChild(o);
      } else if(locked){
        const o=document.createElement('div'); o.className='owned'; o.style.color='#ff9d9d'; o.textContent='🔒'; row.appendChild(o);
      } else {
        const b=document.createElement('button'); b.className='buy';
        b.textContent = '🪙 '+r.cost;
        b.disabled = S.coins < r.cost;
        b.onclick = ()=>{ if(S.coins>=r.cost){ S.coins-=r.cost; S.rod=i; save(); updateHUD(); renderShop(); say('Equipped '+r.name+'!'); } };
        row.appendChild(b);
      }
      el.appendChild(row);
    });
    // a little bait nudge
    const note=document.createElement('p'); note.style.cssText='font-size:11px;opacity:.6;margin-top:8px';
    note.textContent='Better rods = longer casts, faster reels, and rarer fish.';
    el.appendChild(note);
  }

  // ---------- records ----------
  function openRecords(){
    const el = document.getElementById('recList'); el.innerHTML='';
    FISH.forEach(f=>{
      const c = S.caught[f.n];
      const row=document.createElement('div'); row.className='shoprow';
      const rc = RARITY[f.r].color;
      row.innerHTML = `<div style="flex:1"><b style="color:${c?rc:'#5f7f96'}">${c?'':'??? · '}${f.n}</b>
        <span style="color:${rc}">${RARITY[f.r].name}${c?' · best '+c.kg.toFixed(2)+'kg':''}</span></div>`;
      el.appendChild(row);
    });
    showPanel('recPanel');
  }

  // records chip click
  document.getElementById('recChip').style.pointerEvents='auto';
  document.getElementById('recChip').addEventListener('click', openRecords);
  document.getElementById('rodChip').style.pointerEvents='auto';
  document.getElementById('rodChip').addEventListener('click', openShop);

  // ---------- HUD ----------
  function updateHUD(){
    document.getElementById('coin').innerHTML = '🪙 '+S.coins+'<small>COINS</small>';
    document.getElementById('rodChip').innerHTML = '🎣 '+RODS[S.rod].name+'<small>TAP: SHOP</small>';
    const uniq = Object.keys(S.caught).length;
    document.getElementById('recChip').innerHTML = uniq+' / '+FISH.length+'<small>TAP: RECORDS</small>';
  }

  // ---------- update loop ----------
  let last = performance.now();
  function update(dt){
    const now = performance.now();
    // power charging
    if(S.state==='charging'){
      castPower += powerDir*135*dt;
      if(castPower>=100){ castPower=100; powerDir=-1; }
      if(castPower<=0){ castPower=0; powerDir=1; }
      powerFill.style.width = castPower+'%';
    }
    // bobber flight
    if(bob.flying){
      bob.t += dt/bob.land;
      if(bob.t>=1){ bob.t=1; bob.flying=false; rippleAt(bob.tx,bob.ty); beginWait(); }
    }
    if(shakeT>0) shakeT=Math.max(0,shakeT-dt);

    // waiting -> bite
    if(S.state==='waiting'){
      biteTimer -= dt;
      if(biteTimer<=0) beginBite();
    }
    if(S.state==='bite'){
      biteWindow -= dt;
      if(biteWindow<=0){ say('It spat the hook… 😤'); hint('Tap & hold to charge your cast'); S.state='done'; setTimeout(()=>{ if(S.state==='done') resetToIdle(); }, 800); shakeT=0; }
    }

    // reeling
    if(S.state==='reeling' && reel){
      reel.elapsed += dt;
      // bar physics
      const accel = reel.holding ? -1.9 : 1.35;   // hold lifts up
      reel.vel += accel*dt;
      reel.vel *= 0.90;
      reel.pos += reel.vel*dt;
      if(reel.pos<0){ reel.pos=0; reel.vel*=-0.3; }
      if(reel.pos>1){ reel.pos=1; reel.vel*=-0.3; }
      // zone movement
      reel.zone += reel.zoneVel*dt;
      if(reel.zone < reel.zoneH/2){ reel.zone=reel.zoneH/2; reel.zoneVel=Math.abs(reel.zoneVel); }
      if(reel.zone > 1-reel.zoneH/2){ reel.zone=1-reel.zoneH/2; reel.zoneVel=-Math.abs(reel.zoneVel); }
      // occasionally juke
      if(Math.random()<dt*0.55){ reel.zoneVel = (Math.random()<.5?-1:1)*(0.45+Math.random()*0.5)/ {common:.55,uncommon:.7,rare:.9,epic:1.15,cursed:1.45}[reel.fish.r]; }
      // progress
      const inZone = Math.abs(reel.pos - reel.zone) < reel.zoneH/2;
      if(inZone){ reel.prog += dt*(0.34/ reel.fight*8); }
      else { reel.prog -= dt*(0.30/ reel.fight*8); reel.grace+=dt; }
      reel.prog = Math.max(0, Math.min(1, reel.prog));
      if(reel.prog>=1){ finishCatch(true); }
      else if(reel.prog<=0){ finishCatch(false); }
    }
    // ripples
    for(const k in RIPPLE){ RIPPLE[k].t+=dt; if(RIPPLE[k].t>1.4) delete RIPPLE[k]; }
  }

  let rippleId=0;
  function rippleAt(x,y){ RIPPLE[rippleId++] = {x,y,t:0}; }

  // ---------- render ----------
  function draw(){
    const t = performance.now()/1000;
    // sky
    let g = ctx.createLinearGradient(0,0,0,horizon);
    g.addColorStop(0,'#0a2540'); g.addColorStop(.6,'#15507e'); g.addColorStop(1,'#2b83b8');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,horizon);
    // sun/moon glow
    ctx.save(); ctx.globalAlpha=.5;
    const sunx = W*0.72, suny = horizon*0.42;
    const sg = ctx.createRadialGradient(sunx,suny,4,sunx,suny,H*0.28);
    sg.addColorStop(0,'rgba(255,220,140,.9)'); sg.addColorStop(1,'rgba(255,220,140,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sunx,suny,H*0.28,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='#ffe9b0'; ctx.beginPath(); ctx.arc(sunx,suny,18,0,7); ctx.fill();

    // far hills
    ctx.fillStyle='#0b2c46';
    ctx.beginPath(); ctx.moveTo(0,horizon);
    for(let x=0;x<=W;x+=40){ ctx.lineTo(x, horizon - 16 - Math.sin(x*0.01+1)*10 - Math.sin(x*0.003)*14); }
    ctx.lineTo(W,horizon); ctx.closePath(); ctx.fill();

    // water
    g = ctx.createLinearGradient(0,horizon,0,H);
    g.addColorStop(0,'#0e5a86'); g.addColorStop(.45,'#0a3f63'); g.addColorStop(1,'#04223a');
    ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);
    // waves
    ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle='#bfeaff'; ctx.lineWidth=2;
    for(let i=0;i<7;i++){
      const yy=horizon+18+i*((H-horizon)/7);
      ctx.beginPath();
      for(let x=0;x<=W;x+=12){ ctx.lineTo(x, yy + Math.sin(x*0.012 + t*0.9 + i)*4); }
      ctx.stroke();
    }
    ctx.restore();

    // boat + character + rod
    drawAngler(t);

    // bobber
    if(S.state==='cast' || S.state==='waiting' || S.state==='bite'){
      let bx,by;
      if(bob.flying){
        const e = bob.t, ease = e*e*(3-2*e);
        bx = bob.sx + (bob.tx-bob.sx)*ease;
        by = bob.sy + (bob.ty-bob.sy)*ease - Math.sin(e*Math.PI)*H*0.13;
      } else { bx=bob.tx; by=bob.ty + Math.sin(t*2.4)*2; }
      drawBobber(bx,by, t);
    }

    // ripples
    ctx.save();
    for(const k in RIPPLE){
      const r = RIPPLE[k]; const p = r.t/1.4;
      ctx.globalAlpha = (1-p)*0.6; ctx.strokeStyle='#cdeeff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, 8+p*46, (8+p*46)*0.35, 0, 0, 7); ctx.stroke();
    }
    ctx.restore();

    // reeling UI
    if(S.state==='reeling' && reel) drawReelUI();
  }

  function drawAngler(t){
    const x = rod.x, y = rod.y;
    // boat
    ctx.save();
    ctx.fillStyle='#20323f';
    ctx.beginPath();
    ctx.moveTo(x-70,y+10); ctx.lineTo(x+70,y+10); ctx.lineTo(x+52,y+38); ctx.lineTo(x-52,y+38); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2d4354'; ctx.fillRect(x-46,y+2,92,10);
    // body
    ctx.fillStyle='#e8eef3'; ctx.beginPath(); ctx.arc(x,y-28,11,0,7); ctx.fill();  // head-ish
    ctx.fillStyle='#1b2b38'; ctx.fillRect(x-9,y-20,18,20); // torso
    ctx.fillStyle='#ffd9a8'; ctx.beginPath(); ctx.arc(x,y-30,9,0,7); ctx.fill(); // face
    ctx.fillStyle='#123'; ctx.beginPath(); ctx.arc(x+3,y-31,1.6,0,7); ctx.fill();
    // rod line
    const tipx = x+34, tipy = y-72;
    ctx.strokeStyle='#caa06a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x+6,y-16); ctx.lineTo(tipx,tipy); ctx.stroke();
    ctx.restore();

    // fishing line
    let endx, endy;
    if(bob.flying){
      const e=bob.t, ease=e*e*(3-2*e);
      endx = bob.sx+(bob.tx-bob.sx)*ease;
      endy = bob.sy+(bob.ty-bob.sy)*ease - Math.sin(e*Math.PI)*H*0.13;
    } else if(S.state==='waiting'||S.state==='bite'||S.state==='idle'||S.state==='done'){
      endx = bob.tx||tipx; endy = bob.ty||tipy;
      if(S.state==='idle'){ endx=tipx; endy=tipy; }
    } else { endx=tipx; endy=tipy; }
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(tipx,tipy);
    if(S.state==='reeling'&&reel){ ctx.lineTo(bob.tx, bob.ty + Math.sin(t*14)*3); }
    else ctx.lineTo(endx,endy);
    ctx.stroke(); ctx.restore();
    if(S.state==='reeling') drawBobber(bob.tx, bob.ty + Math.sin(t*14)*3, t);
    else if(S.state!=='idle'&&!bob.flying&&(S.state==='waiting'||S.state==='bite')) drawBobber(endx,endy,t);
  }

  function drawBobber(x,y,t){
    // glow when bite
    if(S.state==='bite'){
      ctx.save(); ctx.globalAlpha=.6+Math.sin(t*30)*.4;
      const gg=ctx.createRadialGradient(x,y,2,x,y,26); gg.addColorStop(0,'rgba(255,90,90,.9)'); gg.addColorStop(1,'rgba(255,90,90,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,26,0,7); ctx.fill(); ctx.restore();
      y += Math.sin(t*40)*3;
    }
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x,y+4,7,3,0,0,7); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fillStyle='#ff4d4d'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y-2,6,Math.PI,0); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
  }

  function drawReelUI(){
    const bx = W*0.5, by = H*0.72, bw = Math.min(W*0.62, 320), bh = 300;
    // panel
    ctx.save();
    ctx.globalAlpha=.92;
    ctx.fillStyle='#061a2b'; roundRect(bx-bw/2-16, by-bh/2-16, bw+32, bh+32, 16); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(120,210,255,.4)'; ctx.lineWidth=2; roundRect(bx-bw/2-16, by-bh/2-16, bw+32, bh+32, 16); ctx.stroke();

    // progress bar (left)
    const px = bx-bw/2, pw=22;
    ctx.fillStyle='#0a2c44'; roundRect(px, by-bh/2, pw, bh, 8); ctx.fill();
    const ph = bh*reel.prog;
    const col = reel.prog>0.66?'#5dff9d':(reel.prog>0.33?'#ffd85e':'#ff7a7a');
    ctx.fillStyle=col; roundRect(px, by+bh/2-ph, pw, ph, 8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5; roundRect(px, by-bh/2, pw, bh, 8); ctx.stroke();

    // zone track (right)
    const tx = bx+bw/2-46, tw=46, th=bh;
    ctx.fillStyle='#0a2c44'; roundRect(tx, by-th/2, tw, th, 8); ctx.fill();
    // green zone
    const zh = th*reel.zoneH;
    const zy = by-th/2 + (th*reel.zone) - zh/2;
    const zg=ctx.createLinearGradient(tx,0,tx+tw,0); zg.addColorStop(0,'#2ea86a'); zg.addColorStop(1,'#5dff9d');
    ctx.fillStyle=zg; roundRect(tx, zy, tw, zh, 6); ctx.fill();
    // fish marker (the hook/bar)
    const py = by-th/2 + th*reel.pos;
    ctx.fillStyle='#ffd85e';
    ctx.beginPath(); ctx.moveTo(tx-4,py); ctx.lineTo(tx+tw+4,py); ctx.lineTo(tx+tw+4,py+6); ctx.lineTo(tx-4,py+6); ctx.closePath(); ctx.fill();
    // little fish icon on the bar
    ctx.fillStyle='#062033'; ctx.beginPath(); ctx.arc(tx+tw/2, py+3, 3, 0, 7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5; roundRect(tx, by-th/2, tw, th, 8); ctx.stroke();

    // stress wiggle
    const inZone = Math.abs(reel.pos-reel.zone)<reel.zoneH/2;
    ctx.fillStyle= inZone?'#5dff9d':'#ff9d9d';
    ctx.font='bold 13px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText(inZone?'TIGHT LINE!':'SLACK — HOLD!', bx, by+bh/2+26);
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  // ---------- main ----------
  function frame(){
    const now=performance.now();
    let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- start ----------
  resize(); layout(); load(); updateHUD();
  window.addEventListener('resize', layout);
  resetToIdle();
  say('Welcome to Deep Cast 🎣');
  setTimeout(()=>say(''), 2200);
  frame();

  // expose a tiny API for tweaks
  window.DEEPCast = { S, openShop, openRecords };
})();
</script>
</body>
</html>
