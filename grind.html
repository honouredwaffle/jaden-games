<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>GRIND — Open City (working title)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0b0f14;font-family:'Trebuchet MS',system-ui,sans-serif;color:#eaf6ff;user-select:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hud{position:absolute;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.7);}

  /* top-left: cash + stars */
  #topLeft{top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:20;}
  .pill{background:rgba(6,16,26,.72);border:1px solid rgba(120,210,255,.35);border-radius:12px;padding:7px 12px;font-size:15px;font-weight:bold;backdrop-filter:blur(6px);}
  #cash{color:#5dff9d;}
  #heat{color:#ffb020;letter-spacing:2px;}
  #heat.hot{color:#ff4d6d;animation:pulse .7s infinite alternate;}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}

  /* top-right: objective */
  #objWrap{top:10px;right:10px;max-width:46vw;z-index:20;}
  #obj{background:rgba(6,16,26,.72);border:1px solid rgba(120,210,255,.35);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.35;backdrop-filter:blur(6px);}
  #obj b{color:#ffd85e;}
  #obj .sub{opacity:.7;font-size:11px;}

  /* bottom-center interaction prompt */
  #prompt{bottom:118px;left:0;right:0;text-align:center;z-index:20;}
  #prompt span{background:rgba(6,16,26,.8);border:1px solid rgba(120,210,255,.5);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:bold;display:none;}
  #prompt span b{color:#ffd85e;}

  /* toast */
  #toast{bottom:180px;left:0;right:0;text-align:center;z-index:25;font-size:16px;font-weight:bold;min-height:22px;transition:opacity .25s;}

  /* touch controls */
  #joy{position:absolute;left:20px;bottom:24px;width:140px;height:140px;border-radius:50%;z-index:30;
    background:radial-gradient(circle at 50% 42%, rgba(30,52,74,.5), rgba(5,12,20,.55));
    border:2px solid rgba(120,210,255,.35);touch-action:none;display:none;}
  #joy.show{display:block;}
  #joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #bfe9ff, #5aa8e0);border:2px solid rgba(255,255,255,.6);box-shadow:0 4px 14px rgba(0,0,0,.5);}
  #joy .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:10px;letter-spacing:2px;opacity:.6;}

  /* action buttons */
  #btns{position:absolute;right:18px;bottom:26px;display:flex;flex-direction:column;gap:10px;z-index:30;align-items:flex-end;}
  .abtn{width:70px;height:70px;border-radius:50%;border:2px solid rgba(120,210,255,.55);background:rgba(10,40,64,.72);
    color:#eaf6ff;font-size:22px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);}
  .abtn small{font-size:9px;opacity:.7;letter-spacing:1px;}
  .abtn:active{background:rgba(63,169,245,.5);}
  .abtn.hot{border-color:#ffd85e;box-shadow:0 0 16px rgba(255,216,94,.55);}
  #phoneBtn{width:56px;height:56px;font-size:20px;}
  #btns .srow{display:flex;gap:10px;}
  .abtn.small{width:58px;height:58px;font-size:18px;}

  /* phone / panels */
  .overlay{position:absolute;inset:0;z-index:60;background:rgba(3,8,14,.86);backdrop-filter:blur(8px);display:none;flex-direction:column;}
  .overlay.show{display:flex;}
  .ovHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(120,210,255,.25);}
  .ovHead h2{font-size:17px;letter-spacing:1px;}
  .ovHead .close{background:rgba(255,255,255,.08);border:none;color:#eaf6ff;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;}
  .ovBody{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(120,210,255,.3);background:rgba(10,40,64,.5);text-align:center;font-size:13px;font-weight:bold;cursor:pointer;}
  .tab.active{background:rgba(63,169,245,.4);border-color:#7dffd6;}

  .card{background:rgba(8,22,36,.8);border:1px solid rgba(120,210,255,.25);border-radius:12px;padding:12px;margin-bottom:10px;}
  .card h3{font-size:14.5px;margin-bottom:3px;}
  .card .meta{font-size:11.5px;opacity:.75;line-height:1.4;}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px;}
  .card .pay{color:#5dff9d;font-weight:bold;font-size:13px;}
  .card .req{font-size:11px;color:#ffb020;}
  .btn{background:linear-gradient(180deg,#3fa9f5,#1d6fb8);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;}
  .btn:disabled{background:#33404d;color:#8fa0ad;cursor:not-allowed;}
  .btn.good{background:linear-gradient(180deg,#3ddc84,#1d9c5c);}
  .btn.bad{background:linear-gradient(180deg,#ff5d6d,#b81d3d);}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(125,255,214,.15);color:#7dffd6;border:1px solid rgba(125,255,214,.4);margin-left:6px;}

  /* cashier minigame */
  #mini{position:absolute;inset:0;z-index:70;background:rgba(3,8,14,.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;}
  #mini.show{display:flex;}
  #mini h2{font-size:18px;letter-spacing:1px;margin-bottom:4px;}
  #mini .sub{font-size:12px;opacity:.7;margin-bottom:14px;}
  #conv{position:relative;width:min(92vw,560px);height:120px;border-radius:14px;background:rgba(8,22,36,.9);border:1px solid rgba(120,210,255,.3);overflow:hidden;}
  #scanZone{position:absolute;top:0;bottom:0;left:26%;width:26%;background:rgba(125,255,214,.14);border-left:2px dashed rgba(125,255,214,.6);border-right:2px dashed rgba(125,255,214,.6);}
  .item{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:40px;will-change:left;}
  #miniStats{display:flex;gap:22px;margin:14px 0;font-size:14px;}
  #miniStats b{color:#ffd85e;}
  #scanBtn{margin-top:6px;}
  #miniEnd{display:none;text-align:center;}
  #miniEnd h2{color:#5dff9d;}

  /* busted / fail flash */
  #flash{position:absolute;inset:0;z-index:80;background:rgba(184,29,61,0);pointer-events:none;transition:background .3s;}
  #bigMsg{position:absolute;inset:0;z-index:81;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;}
  #bigMsg .t{font-size:34px;font-weight:bold;letter-spacing:3px;color:#ff5d6d;text-shadow:0 4px 18px rgba(0,0,0,.8);}
  #bigMsg .s{font-size:14px;opacity:.85;margin-top:6px;}

  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="topLeft" class="hud">
  <div class="pill" id="cash">$0</div>
  <div class="pill" id="heat">☆☆☆☆☆</div>
  <div class="pill" id="hp" style="display:none;color:#ff8a8a;">HP</div>

  <div id="obj"><b>Objective</b><br><span class="sub">Open your phone (📱) and apply for a job.</span></div>

<!-- touch controls -->
<div id="joy"><div id="joyKnob"></div><div class="lbl">MOVE</div></div>
<div id="btns">
  <div class="srow">
    <div class="abtn small" id="jumpBtn">⤒<small>JUMP</small></div>

  <div class="abtn" id="actBtn">E<small>USE</small></div>
  <div class="abtn" id="punchBtn">PCH<small>PUNCH</small></div>
</div>

<!-- phone overlay -->
<div class="overlay" id="phone">
  <div class="ovHead"><h2>📱 PHONE</h2><button class="close" data-close="phone">✕</button></div>
  <div class="ovBody">
    <div class="tabs">
      <div class="tab active" data-tab="jobs">💼 JOBS</div>
      <div class="tab" data-tab="shop">🛒 SHOP</div>
      <div class="tab" data-tab="me">🧍 ME</div>
    </div>
    <div id="tabJobs"></div>
    <div id="tabShop" class="hidden"></div>
    <div id="tabMe" class="hidden"></div>
  </div>
</div>

<!-- cashier minigame -->
<div id="mini">
  <h2>🛒 CASHIER SHIFT</h2>
  <div class="sub">Tap <b>SCAN</b> (or spacebar) when an item is inside the green zone.</div>
  <div id="conv"><div id="scanZone"></div></div>
  <div id="miniStats"><div>Time <b id="mgTime">25</b>s</div><div>Scanned <b id="mgHits">0</b></div><div>Missed <b id="mgMiss">0</b></div></div>
  <div id="miniEnd"></div>
  <button class="btn good" id="scanBtn">SCAN</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

/* ============================================================
   GRIND — Open City (working title) — Slice 1
   Low-poly 3D open-world: on foot + cars, apply for jobs via
   phone, work a cashier shift, shop, crime + heat + cops.
   ============================================================ */

/* ---------- renderer / scene ---------- */
const wrap = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc2e8);
scene.fog = new THREE.Fog(0x9cc2e8, 90, 340);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 900);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xdfeaff, 0x4a5568, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.15);
sun.position.set(80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-160; sc.right=160; sc.top=160; sc.bottom=-160; sc.near=1; sc.far=420;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.28));

/* ---------- helpers ---------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function mesh(geo, col, x,y,z, flat=true){
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:col, roughness:1, metalness:0, flatShading:flat }));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function box(w,h,d,col,x,y,z){ return mesh(new THREE.BoxGeometry(w,h,d), col, x,y,z); }
function makeLabel(text, w=8, h=2.2, bg='#0b2338', fg='#eaf6ff', border='#7dffd6'){
  const c=document.createElement('canvas'); c.width=512; c.height=Math.round(512*h/w);
  const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle=border; g.lineWidth=10; g.strokeRect(8,8,c.width-16,c.height-16);
  g.fillStyle=fg; g.font='bold 74px Trebuchet MS, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, c.width/2, c.height/2, c.width-40);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:true }));
  sp.scale.set(w,h,1); return sp;
}

/* ============================================================
   CITY
   ============================================================ */
const CITY = { half: 112, step: 48, road: 16 };
const GROUND = new THREE.Mesh(new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x2b2f36, roughness:1 }));
GROUND.rotation.x=-Math.PI/2; GROUND.receiveShadow=true; scene.add(GROUND);

const solids = []; // AABBs for collision {minx,maxx,minz,maxz}
function addSolid(cx,cz,w,d){ solids.push({ minx:cx-w/2, maxx:cx+w/2, minz:cz-d/2, maxz:cz+d/2 }); }

/* ---------- shared mesh helpers: vertex-coloured merged geometry ----------
   One merged geometry per rigid part → far fewer draw calls. Used by
   buildings, houses AND people. */
const VCMAT = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.72 });
const _tmpc = new THREE.Color();
function cgeo(geo, hex, pos, scl, rot){
  const q = rot ? new THREE.Quaternion().setFromEuler(rot) : new THREE.Quaternion();
  const m = new THREE.Matrix4().compose(
    pos || new THREE.Vector3(),
    q,
    scl || new THREE.Vector3(1,1,1));
  geo.applyMatrix4(m);
  _tmpc.set(hex);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=_tmpc.r; arr[i*3+1]=_tmpc.g; arr[i*3+2]=_tmpc.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr,3));
  return geo;
}
function part(geos){ return partMat(geos, VCMAT); }
function partMat(geos, mat){
  const merged = mergeGeometries(geos, false);
  for(const g of geos) g.dispose();
  const m = new THREE.Mesh(merged, mat);
  m.castShadow = true;
  return m;
}
function V(x,y,z){ return new THREE.Vector3(x,y,z); }
function caps(r,len){ return new THREE.CapsuleGeometry(r,len,2,8); }
function ball(r,seg=9){ return new THREE.SphereGeometry(r,seg,Math.max(6,Math.round(seg*0.7))); }
function RNG(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
/* triangular-prism gable roof (has uv so it merges cleanly) */
function gableGeo(w,d,h){
  const hw=w/2, hd=d/2;
  const v=[-hw,0,-hd, hw,0,-hd, hw,0,hd, -hw,0,hd, -hw,h,0, hw,h,0];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  g.setIndex([0,1,5, 0,5,4, 3,4,5, 3,5,2, 0,4,3, 1,2,5]);
  g.computeVertexNormals();
  const uv=[]; for(let i=0;i<6;i++) uv.push((v[i*3]+hw)/w, v[i*3+1]/(h||1));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  return g;
}

const PALETTE = [0xd9dde3,0xc4ccd4,0xaeb8c2,0xd8c9b8,0xbfd0c4,0xcdd6df,0xa9c0d6,0xe0d5c4,0xb9c2b0];

/* ---- lit-window facade texture (one canvas, whole grid of windows) ---- */
const _texCache = {};
function litWindowMat(cols,rows,warm){
  const key=cols+'_'+rows+'_'+(warm?1:0);
  if(_texCache[key]) return _texCache[key];
  const c=document.createElement('canvas'); c.width=cols*10; c.height=rows*10;
  const g=c.getContext('2d');
  g.fillStyle='#0c1017'; g.fillRect(0,0,c.width,c.height);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const r=Math.random();
    g.fillStyle = r<0.40 ? (warm?'#ffd79a':'#c2e6ff')
               : r<0.56 ? (warm?'#6d5638':'#3f5a78')
               : '#111620';
    g.fillRect(x*10+2, y*10+2.5, 6, 5);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff,
                                           emissiveIntensity:0.85, roughness:0.85 });
  _texCache[key]=m; return m;
}
/* ---- tower silhouette by style ---- */
function towerTiers(style,w,d,h){
  if(style==='block') return [[w,d,0,h]];
  if(style==='setback'){ const n=h>55?4:3, t=[]; let cw=w,cd=d,z=0;
    for(let i=0;i<n;i++){ const seg=h*(i===0?0.42:0.58/(n-1)); t.push([cw,cd,z,z+seg]); z+=seg; cw*=0.78; cd*=0.78; } return t; }
  if(style==='taper'){ const n=4, t=[]; let cw=w,cd=d,z=0;
    for(let i=0;i<n;i++){ const seg=h/n; t.push([cw,cd,z,z+seg]); z+=seg; cw*=0.82; cd*=0.82; } return t; }
  if(style==='podium'){ const ph=h*0.26; return [[w,d,0,ph],[w*0.58,d*0.62,ph,h]]; }
  return [[w,d,0,h*0.8],[w*0.92,d*1.1,h*0.8,h]];              // slab
}
const ACCENTCOLS=[0x66e0ff,0xffb347,0xff4d8d,0x6dff9e];
function buildTower(cx,cz,w,d,h,style,seed){
  const R=RNG(seed);
  const warm=R()<0.62, acc=ACCENTCOLS[Math.floor(R()*ACCENTCOLS.length)];
  const grp=new THREE.Group(); grp.position.set(cx,0,cz);
  const tiers=towerTiers(style,w,d,h);
  for(const [tw,td,z0,z1] of tiers){
    const th=z1-z0;
    const cols=Math.max(3,Math.round(tw/2.6)), rows=Math.max(2,Math.round(th/3.0));
    const m=new THREE.Mesh(new THREE.BoxGeometry(tw,th,td), litWindowMat(cols,rows,warm));
    m.position.y=(z0+z1)/2+0.35;
    m.castShadow=true; m.receiveShadow=true;
    grp.add(m);
  }
  // glowing accent band at each setback
  for(let i=1;i<tiers.length;i++){
    const tw=tiers[i][0], td=tiers[i][1], z0=tiers[i][2];
    const band=new THREE.Mesh(new THREE.BoxGeometry(tw*1.06,0.45,td*1.06),
      new THREE.MeshStandardMaterial({color:acc,emissive:acc,emissiveIntensity:1.5}));
    band.position.y=z0+0.35; grp.add(band);
  }
  // rooftop plant + mast + beacon
  const [tw,td]=tiers[tiers.length-1]||[w,d];
  const top=h+0.35;
  const roof=new THREE.Mesh(new THREE.BoxGeometry(tw*0.5,1.6,td*0.5),
    new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:1}));
  roof.position.y=top+0.8; grp.add(roof);
  if(R()<0.65){
    const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,10,6),
      new THREE.MeshStandardMaterial({color:0x8a929c,metalness:0.6,roughness:0.4}));
    mast.position.y=top+6; grp.add(mast);
    const beacon=new THREE.Mesh(new THREE.SphereGeometry(0.42,8,6),
      new THREE.MeshStandardMaterial({color:0xff3333,emissive:0xff2222,emissiveIntensity:2.2}));
    beacon.position.y=top+11; grp.add(beacon);
  }
  scene.add(grp); addSolid(cx,cz,w,d);
}
/* ---- suburban house (merged to ~2 meshes each) ---- */
const WINMAT_BAY = new THREE.MeshStandardMaterial({color:0xfff0c8,emissive:0xffd9a0,emissiveIntensity:1.3});
const WALLCOLS=[0xd8cfc0,0xa8bacd,0xc09a86,0xa8b89a,0xe0dcd2,0xc08f8f,0x9aa2ab];
const ROOFCOLS=[0x3a3f47,0x6b3a2a,0x2f4a4e,0x4a4a52,0x7a4a3a,0x54585f];
function buildHouse(cx,cz,rot,seed){
  const R=RNG(seed);
  const wall=WALLCOLS[Math.floor(R()*WALLCOLS.length)];
  const roof=ROOFCOLS[Math.floor(R()*ROOFCOLS.length)];
  const w=8.2+R()*2.4, d=7.2+R()*1.6, h=2.8+R()*0.8;
  const geos=[], wins=[];
  geos.push(cgeo(new THREE.BoxGeometry(15,0.16,15), 0x3c6b34, V(0,0.08,0.6)));              // lawn
  geos.push(cgeo(new THREE.BoxGeometry(3.4,0.22,6.5), 0x8f8b84, V(w/2+1.4,0.12,-6.6)));    // driveway
  geos.push(cgeo(new THREE.BoxGeometry(w,h,d), wall, V(0,h/2+0.3,0)));                      // body
  geos.push(cgeo(gableGeo(w+0.9,d+0.9,d*0.38), roof, V(0,h+0.3,0)));                        // roof
  const gw=3.9, gd=4.8, gh=h*0.82;
  geos.push(cgeo(new THREE.BoxGeometry(gw,gh,gd), wall, V(w/2+1.3, gh/2+0.3, -d/2+gd/2-0.2)));   // garage
  geos.push(cgeo(gableGeo(gw+0.5,gd+0.5,gd*0.3), roof, V(w/2+1.3, gh+0.3, -d/2+gd/2-0.2)));      // garage roof
  geos.push(cgeo(new THREE.BoxGeometry(gw-0.6, gh*0.62, 0.16), 0x6b5a48, V(w/2+1.3, gh*0.42, -d/2-0.29)));

  geos.push(cgeo(new THREE.BoxGeometry(3.2,0.18,1.8), roof, V(-w/2+2.0,2.62,-d/2-1.0)));    // porch roof
  geos.push(cgeo(new THREE.BoxGeometry(0.14,2.3,0.14), 0xd8d4cc, V(-w/2+3.4,1.45,-d/2-1.7)));
  geos.push(cgeo(new THREE.BoxGeometry(0.14,2.3,0.14), 0xd8d4cc, V(-w/2+0.6,1.45,-d/2-1.7)));
  const fw=14.2, n=11;
  for(let i=0;i<n;i++){ const px=-fw/2+i*(fw/(n-1));

  geos.push(cgeo(new THREE.BoxGeometry(fw,0.12,0.09), 0xbca87e, V(0,0.6,-7.3)));
  if(R()<0.75){                                                                             // tree

  for(let i=0;i<wc;i++){

function buildCity(){
  const special = {
    '-1,-1':'store', '1,1':'shop', '-1,1':'police', '1,-1':'bank', '0,0':'tower'
  };
  const blockSize = CITY.step - CITY.road; // 32
  const styles=['setback','taper','podium','slab','block'];
  let seed=1000;
  for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
    const cx=i*CITY.step, cz=j*CITY.step, key=i+','+j;
    const slab=box(blockSize,0.35,blockSize, key==='0,0'?0x9aa3ad:0x8f97a0, cx,0.17,cz); scene.add(slab);
    const kind=special[key];
    if(kind){ buildSpecial(kind,cx,cz); continue; }
    const outer = (Math.abs(i)===2 || Math.abs(j)===2);
    if(outer && Math.abs(i)===2 && Math.abs(j)===2){
      // ---- commercial corner: a restaurant / takeaway ----
      const brandKeys=['chicken','pizza','cafe','donut'];
      const bk=brandKeys[EXTRA_PLACES.length % brandKeys.length];
      const brand=BRANDS[bk];
      const w=14+Math.random()*3, d=12+Math.random()*3, h=6.5+Math.random()*1.5;
      buildShop('food'+EXTRA_PLACES.length, brand, cx, cz, w, d, h, {roofSign:true, warm:bk==='cafe'});
      EXTRA_PLACES.push({key:'food'+EXTRA_PLACES.length, name:brand.name, x:cx, z:cz, w, d, brand:bk});
    } else if(outer){
      // ---- suburban ring: houses with lawns + fences ----
      buildHouse(cx-8.6, cz-8.6, 0, seed++);
      buildHouse(cx+8.2, cz-8.2, 0, seed++);
      buildHouse(cx+0.4, cz+8.6, 180, seed++);
    } else {
      // ---- downtown core: 1-2 varied towers ----
      if(Math.random()<0.45){
        buildTower(cx-7.5, cz-7.5, 12, 12, 22+Math.random()*34, 'taper', seed++);
        buildTower(cx+7.5, cz+7.5, 12, 12, 18+Math.random()*30, 'block', seed++);
      } else {
        const w=17+Math.random()*6, d=15+Math.random()*6, h=26+Math.random()*48;
        buildTower(cx, cz, w, d, h, styles[Math.floor(Math.random()*styles.length)], seed++);
      }
    }
  }
}

function logoGlyph(g, kind, cx, cy, r, accent){
  g.save(); g.translate(cx,cy);
  if(kind==='arches'){
    g.strokeStyle=accent; g.lineWidth=r*0.34; g.lineCap='round';
    for(const i of [-1,1]){ g.beginPath(); g.arc(i*r*0.48, r*0.18, r*0.55, Math.PI*1.05, Math.PI*1.95); g.stroke(); }
  } else if(kind==='bucket'){
    g.fillStyle=accent; g.beginPath(); g.moveTo(-r*0.7,-r*0.4); g.lineTo(r*0.7,-r*0.4); g.lineTo(r*0.5,r*0.72); g.lineTo(-r*0.5,r*0.72); g.closePath(); g.fill();
    g.strokeStyle='#ffffff'; g.lineWidth=r*0.12; g.beginPath(); g.moveTo(-r*0.62,-r*0.08); g.lineTo(r*0.62,-r*0.08); g.stroke();
  } else if(kind==='cup'){
    g.fillStyle=accent; g.beginPath(); g.moveTo(-r*0.52,-r*0.28); g.lineTo(r*0.52,-r*0.28); g.lineTo(r*0.34,r*0.72); g.lineTo(-r*0.34,r*0.72); g.closePath(); g.fill();
    g.fillStyle='#ffffff'; g.fillRect(-r*0.6,-r*0.42,r*1.2,r*0.16);
  } else if(kind==='pizza'){
    g.fillStyle=accent; g.beginPath(); g.moveTo(0,-r*0.72); g.lineTo(r*0.78,r*0.62); g.lineTo(-r*0.78,r*0.62); g.closePath(); g.fill();
    g.fillStyle='#b3121a';
    for(const p of [[0,-r*0.12],[-r*0.32,r*0.26],[r*0.32,r*0.26]]){ g.beginPath(); g.arc(p[0],p[1],r*0.13,0,7); g.fill(); }
  } else if(kind==='ring'){
    g.strokeStyle=accent; g.lineWidth=r*0.44; g.beginPath(); g.arc(0,0,r*0.56,0,7); g.stroke();
  } else if(kind==='vault'){
    g.fillStyle=accent; g.beginPath(); g.arc(0,0,r*0.64,0,7); g.fill();
    g.fillStyle='#14243d'; g.beginPath(); g.arc(0,0,r*0.34,0,7); g.fill();
    g.strokeStyle=accent; g.lineWidth=r*0.1; g.beginPath(); g.moveTo(0,0); g.lineTo(r*0.28,-r*0.28); g.stroke();
  } else if(kind==='shield'){
    g.fillStyle=accent; g.beginPath(); g.moveTo(0,-r*0.72); g.lineTo(r*0.62,-r*0.4); g.lineTo(r*0.44,r*0.46); g.lineTo(0,r*0.76); g.lineTo(-r*0.44,r*0.46); g.lineTo(-r*0.62,-r*0.4); g.closePath(); g.fill();
    g.fillStyle='#ffffff'; g.font='bold '+Math.round(r*0.85)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('★',0,r*0.02);
  } else if(kind==='tower'){
    g.fillStyle=accent; g.fillRect(-r*0.35,-r*0.7,r*0.7,r*1.4);
    g.fillStyle='#0b2338';
    for(let ry=0;ry<4;ry++) for(let rx=0;rx<2;rx++) g.fillRect(-r*0.24+rx*r*0.3,-r*0.56+ry*r*0.32,r*0.18,r*0.2);
  } else { // basket
    g.strokeStyle=accent; g.lineWidth=r*0.14; g.strokeRect(-r*0.62,-r*0.24,r*1.24,r*0.72);
    g.beginPath(); g.arc(0,-r*0.24,r*0.44,Math.PI,0); g.stroke();
  }
  g.restore();
}
function brandSignTex(brand, W=512, H=256){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle=brand.bg; g.fillRect(0,0,W,H);
  g.fillStyle=brand.accent; g.fillRect(0,0,W,9); g.fillRect(0,H-9,W,9);
  logoGlyph(g, brand.logo, 116, H/2, 74, brand.accent);
  g.fillStyle=brand.fg; g.textAlign='left'; g.textBaseline='middle';
  g.font='bold 58px Trebuchet MS, sans-serif';
  g.fillText(brand.name, 218, H/2, W-238);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
const _signMatCache={};
function signMat(brand){
  if(_signMatCache[brand.name]) return _signMatCache[brand.name];
  const tex=brandSignTex(brand);
  const m=new THREE.MeshStandardMaterial({ map:tex, emissiveMap:tex, emissive:0xffffff,
                                           emissiveIntensity:0.8, roughness:0.6, metalness:0.0 });
  _signMatCache[brand.name]=m; return m;
}
/* ---------- shop building: sign band wrapped round the ground floor ---------- */
function buildShop(key, brand, cx, cz, w, d, h, opts={}){
  const grp=new THREE.Group(); grp.position.set(cx,0,cz);
  // body (lit windows) + solid ground floor so the sign band reads
  const cols=Math.max(3,Math.round(w/2.6)), rows=Math.max(2,Math.round(h/3));
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), litWindowMat(cols,rows,opts.warm!==false));
  body.position.y=h/2+0.35; body.castShadow=true; body.receiveShadow=true; grp.add(body);
  // parapet / roof trim in the brand's roof colour
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,0.7,d*1.03),
    new THREE.MeshStandardMaterial({color:brand.roof, roughness:0.9}));
  roof.position.y=h+0.7; grp.add(roof);
  // SIGN BAND: one box → the brand sign shows on all four walls
  const bandH=opts.bandH||2.0, bandY=opts.bandY!==undefined?opts.bandY:(h-1.4);
  const band=new THREE.Mesh(new THREE.BoxGeometry(w+0.14, bandH, d+0.14), signMat(brand));
  band.position.y=bandY; grp.add(band);
  // entrance glass + door on the street side (+z)
  const ent=new THREE.Mesh(new THREE.BoxGeometry(w*0.42, 2.5, 0.18),
    new THREE.MeshStandardMaterial({color:0x101820, emissive:0xfff0c0, emissiveIntensity:0.35, roughness:0.3}));
  ent.position.set(0, 1.6, d/2+0.02); grp.add(ent);
  // awning
  if(opts.awning!==false){
    const aw=new THREE.Mesh(new THREE.BoxGeometry(w*0.72, 0.3, 1.7),
      new THREE.MeshStandardMaterial({color:brand.accent, emissive:brand.accent, emissiveIntensity:0.25, roughness:0.7}));
    aw.position.set(0, 3.0, d/2+0.85); grp.add(aw);
  }
  // projecting blade sign (sticks out so you can read it down the street)
  for(const sx of [-1,1]){
    const blade=new THREE.Mesh(new THREE.BoxGeometry(0.16, bandH*0.85, 1.5), signMat(brand));
    blade.position.set(sx*(w/2+0.55), bandY, 0); grp.add(blade);
  }
  // big roof sign for restaurants (mounted, with posts — not floating)
  if(opts.roofSign){
    const panel=new THREE.Mesh(new THREE.BoxGeometry(Math.min(w*1.15, 13), 2.6, 0.3), signMat(brand));
    panel.position.set(0, h+2.2, d/2-0.4); grp.add(panel);
    for(const sx of [-1,1]){
      const post=new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.6, 0.2),
        new THREE.MeshStandardMaterial({color:0x2a2f36, roughness:0.9}));
      post.position.set(sx*Math.min(w*0.4,4.5), h+0.9, d/2-0.4); grp.add(post);
    }
  }
  scene.add(grp);
  addSolid(cx,cz,w,d);
  return { x:cx, z:cz };
}

  t.push(cgeo(caps(0.205,0.10), top, V(0,0.30,0), V(1.02*TW,1,0.86*TD)));                 // waist

  t.push(cgeo(ball(0.138+0.02*heavy), top, V(-0.275*TW,0.73,0), V(1,1,0.86)));            // deltoid L
  t.push(cgeo(ball(0.138+0.02*heavy), top, V( 0.275*TW,0.73,0), V(1,1,0.86)));            // deltoid R

  if(topStyle==='jacket'||topStyle==='coat'){                                                       // lapels
    t.push(cgeo(new THREE.BoxGeometry(0.075,0.36,0.03), top2, V(-0.105,0.62,0.205), V(1,1,1), new THREE.Euler(0,0, 0.30)));

    t.push(cgeo(new THREE.BoxGeometry(0.032,0.44,0.02), 0xdadade, V(0,0.57,0.212)));              // placket
    t.push(cgeo(caps(0.233,0.045), top, V(0,0.80,0), V(1.05*TW,1,0.9*TD)));                       // collar

  }

/* Run/walk cycle with real joint articulation:
   - hips swing, knees FOLD on the swing-through leg, ankles roll (toe-off / toe-up)
   - arms swing opposite the legs, elbows held bent and breathing
   - torso leans forward, bobs, and counter-rotates against the hips
   amt 0 = idle .. 1 = full run */
function animateWalk(g, phase, amt, run){
  const L=g.userData.limbs; if(!L) return;
  amt = amt===undefined?1:amt;
  const R = clamp(run||0, 0, 1);            // 0 = walk, 1 = sprint (bigger stride + lean)
  const s=Math.sin(phase), c=Math.cos(phase);
  const swL=s, swR=-s;
  // ---- hips ----
  const A = 0.80 + 0.38*R;
  L.legL.rotation.x =  swL*A*amt;
  L.legR.rotation.x =  swR*A*amt;
  // ---- knees: fold hard when the leg swings forward through the air ----
  const kneeOf=(sw)=>{ const fold=Math.max(0,-sw), push=Math.max(0,sw);
                       return (0.10 + (1.40+0.35*R)*fold*fold + 0.30*push*Math.max(0,c))*amt + 0.04*(1-amt); };
  L.kneeL.rotation.x = kneeOf(swL);
  L.kneeR.rotation.x = kneeOf(swR);
  // ---- ankles: point the toe on push-off, lift the toe as the leg swings through ----
  const ankOf=(sw)=> (0.34*Math.max(0,sw) - 0.30*Math.max(0,-sw))*amt;
  L.ankleL.rotation.x = ankOf(swL);
  L.ankleR.rotation.x = ankOf(swR);
  // ---- arms: swing from the shoulder in BOTH axes, plus lateral sway so they
  //      are not locked to the body. Sign: for the LEFT arm (at -x) a NEGATIVE
  //      z-rotation swings the hand AWAY from the torso; the right arm mirrors.
  const AA = 1.05 + 0.35*R;
  L.armL.rotation.x = -swL*AA*amt;   L.armR.rotation.x = -swR*AA*amt;
  const splay=(0.11 + 0.17*R)*amt, sway=c*0.07*amt;
  L.armL.rotation.z = -splay - sway;
  L.armR.rotation.z =  splay - sway;
  const elbBend=()=> (0.95 + 0.45*Math.abs(c) + 0.20*R)*amt + 0.30*(1-amt);
  L.elbowL.rotation.x = -elbBend();   L.elbowR.rotation.x = -elbBend();
  // hands drag a beat behind the forearm (overlapping action)
  if(L.wristL){ const w=0.22*Math.sin(phase-0.75); L.wristL.rotation.x = w*amt; L.wristR.rotation.x = -w*amt; }
  // legs splay a hair outward instead of sitting on the centre seam
  L.legL.rotation.z =  0.05*amt;   L.legR.rotation.z = -0.05*amt;
  // ---- torso: forward lean + bob + shoulder/hip counter-rotation ----
  const B=g.userData.body;
  if(B){
    B.rotation.x = (0.05 + 0.13*amt + 0.11*R*amt);   // lean harder the faster you go
    B.rotation.y = -s*0.12*amt;                      // shoulders twist opposite the hips
    B.rotation.z =  c*0.06*amt;                      // slight roll
    B.position.y = 0.95 + (0.02 + 0.04*Math.abs(c))*amt;   // vertical bob
  }
}
/* Airborne jump pose: extend off the ground, tuck at the apex, reach down and
   absorb on landing. Driven by height + whether we're rising/falling. */
function poseJump(g, h, rising){
  const L=g.userData.limbs; if(!L) return;
  const k=clamp(h,0,1);                 // 0 = just took off / about to land, 1 = apex
  let hip,knee,ankle,arm,elbow,lean,dy;
  if(rising){                           // push-off -> tuck as we rise
    hip  = 0.55 - 1.35*k;
    knee = 0.35 + 1.05*k;
    ankle= 0.45 - 0.60*k;
    arm  = 0.55 - 1.85*k;
    elbow= -0.35 - 0.95*k;
    lean = 0.22 - 0.30*k;
    dy   = 0.02*k;
  } else {                              // falling -> legs reach down to land
    hip  = -0.80 + 0.95*k;
    knee = 1.30 - 0.75*k;
    ankle= -0.20 + 0.10*k;
    arm  = -1.20 + 1.00*k;
    elbow= -1.30 + 0.60*k;
    lean = 0.02 + 0.10*k;
    dy   = -0.06*k;
  }
  L.legL.rotation.x = hip;          L.legR.rotation.x = hip*0.80 + 0.12;   // slight stride offset
  L.kneeL.rotation.x = knee*0.85;   L.kneeR.rotation.x = knee*0.55 + 0.15;
  L.ankleL.rotation.x = ankle;      L.ankleR.rotation.x = ankle*0.6;
  L.armL.rotation.x = arm;          L.armR.rotation.x = arm*0.85 - 0.15;
  L.armL.rotation.z = -0.24;        L.armR.rotation.z = 0.24;   // arms out for balance
  L.elbowL.rotation.x = elbow;      L.elbowR.rotation.x = elbow*0.85;
  if(L.wristL){ L.wristL.rotation.x=-0.25*k; L.wristR.rotation.x=-0.18*k; }
  L.legL.rotation.z = 0.05;         L.legR.rotation.z = -0.05;
  const B=g.userData.body;
  if(B){ B.rotation.x=lean; B.rotation.y=0; B.rotation.z=0; B.position.y=0.95+dy; }
}
/* Landing crouch: knees bend + torso dips to absorb the impact. t 1 -> 0. */
function poseLand(g, t){
  const L=g.userData.limbs; if(!L) return;
  const a=clamp(t,0,1);
  L.legL.rotation.x = -0.30*a;  L.legR.rotation.x = -0.22*a;
  L.kneeL.rotation.x = 1.05*a;  L.kneeR.rotation.x = 0.85*a;
  L.ankleL.rotation.x = -0.35*a; L.ankleR.rotation.x = -0.28*a;
  L.armL.rotation.x = 0.35*a;   L.armR.rotation.x = 0.28*a;
  L.armL.rotation.z = -0.30*a;  L.armR.rotation.z = 0.30*a;    // arms out to catch balance
  L.elbowL.rotation.x = -0.85*a; L.elbowR.rotation.x = -0.70*a;
  if(L.wristL){ L.wristL.rotation.x=-0.30*a; L.wristR.rotation.x=-0.22*a; }
  L.legL.rotation.z = 0.05*(1-a*0.5); L.legR.rotation.z = -0.05*(1-a*0.5);
  const B=g.userData.body; if(B){ B.rotation.x=0.22*a; B.rotation.y=0; B.rotation.z=0; B.position.y=0.95-0.24*a; }
}
function idlePose(g){
  const L=g.userData.limbs; if(!L) return;
  L.legL.rotation.x=0; L.legR.rotation.x=0;
  L.kneeL.rotation.x=0.04; L.kneeR.rotation.x=0.04;
  L.ankleL.rotation.x=0; L.ankleR.rotation.x=0;
  L.armL.rotation.x=0; L.armR.rotation.x=0;
  L.armL.rotation.z=-0.09; L.armR.rotation.z=0.09;   // relaxed, just clear of the body
  L.elbowL.rotation.x=-0.14; L.elbowR.rotation.x=-0.14;
  if(L.wristL){ L.wristL.rotation.x=0.05; L.wristR.rotation.x=0.05; }
  L.legL.rotation.z=0.02; L.legR.rotation.z=-0.02;
  const B=g.userData.body; if(B){ B.rotation.set(0.02,0,0); B.position.y=0.95; }
}

/* ============================================================
   IMPORTED CHARACTER — Mixamo base mesh (.glb), skinned + bone-driven
   +Z facing preserved (Mixamo base faces +Z, same as our rig).
   ============================================================ */
function P(k){ return new URLSearchParams(location.search).get(k)!==null; }
const MANNEQUIN={ready:false, proto:null, h:1.8, minY:0, maxY:1.8, bob:null, src:''};
const MANNEQUINS=[];   // pool of loaded human prototypes (boy + girl)
/* per-material-role palettes -> recolour each cloned NPC so the crowd varies.
   Material names come from the Blender export; matRole() maps them to a role. */
const CHAR_MATPAL={
  Top:   [0xe3644f,0x3fa9f5,0x3fbf8f,0x9a6dd6,0xe8913a,0x7fb8e0,0xd94f5e,0x46b060,0x2b3550,0x1c1c22,0xd8a930,0x8c1f24],
  Shoes: [0x1c1f26,0xe8e8e8,0x8c1f24,0x2a2a5a,0x6a4a20,0xd8d8d8],
  Hair:  [0x15151a,0x241b14,0x3a2c1e,0x6b4a2a,0x8a5a2a,0xa87a3a,0xd8b26a,0x8f8f96,0x6a1f1f,0x2f2440],
  Skin:  [0xffffff,0xf6e3d0,0xecd0b4,0xdcb894,0xc9a074,0xf9ecdd,0xe6c39c],
};
/* map a GLB material name to a recolour ROLE (or null = leave it alone).
   Checked most-specific first so e.g. Human.eyebrow003_mat -> Brow, not Skin. */
function matRole(n){
  if(!n) return null;
  if(/eyebrow/i.test(n)) return 'Brow';
  if(/eyelash/i.test(n)) return 'Lash';
  if(/teeth/i.test(n)) return 'Teeth';
  if(/casualsuit|sportsuit|elegantsuit|worksuit|hoodie|jacket|shirt|clothes|suit/i.test(n)) return 'Top';
  if(/shoe|sneaker|boot/i.test(n)) return 'Shoes';
  if(/short\d|long\d|bob\d|ponytail|afro|braid|hair/i.test(n)) return 'Hair';
  if(/^human_mat$|human\.?mat$|lips|ears|nipple|nails|skin/i.test(n)) return 'Skin';
  if(/^eye/i.test(n) || /_eye$/i.test(n)) return 'Eye';
  return null;
}
/* apply a role->colour look to every mesh under root. */
function applyLook(root, look){
  root.traverse(o=>{ if(!o.isMesh) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    const out=mats.map(m=>{ const role=matRole(m.name); if(!role) return m;
      const col=look[role]; if(col===undefined||col===null) return m;
      const nm=m.clone(); nm.color.setHex(col); return nm; });
    o.material = out.length===1?out[0]:out;
  });
}
function loadMannequin(){
  const files=[['boy','assets/boy.glb'],['girl','assets/girl.glb']];
  let pending=files.length;
  const done=()=>{ if(--pending<=0){ MANNEQUIN.ready=MANNEQUINS.length>0; if(!P('procedural')) reloadPeds(); } };
  for(const f of files){
    const which=f[0], url=f[1];
    new GLTFLoader().load(url, g=>{
      const root=g.scene; root.updateMatrixWorld(true);
      const box=new THREE.Box3().setFromObject(root);
      const m={which, proto:root, h:Math.max(0.1, box.max.y-box.min.y), minY:box.min.y, maxY:box.max.y, bob:measureBobAxis(root)};
      MANNEQUINS.push(m);
      if(!MANNEQUIN.proto){ MANNEQUIN.proto=root; MANNEQUIN.h=m.h; MANNEQUIN.minY=m.minY; MANNEQUIN.maxY=m.maxY; MANNEQUIN.bob=m.bob; MANNEQUIN.src=which; }
      let nb=0, nm=0; root.traverse(o=>{ if(o.isBone) nb++; if(o.isMesh) nm++; });
      console.log('[human] '+which+' loaded h='+m.h.toFixed(3)+' bones='+nb+' meshes='+nm);
      done();
    }, undefined, e=>{ console.warn('[human] load failed '+which, e); done(); });
  }
}
loadMannequin();
/* The FBX->GLB bake leaves the armature at a 0.01 scale and rotates the bone axes,
   so the Hips bone's local axes do NOT line up with world up and 1 local unit is
   worth ~0.01m. Measure it instead of hard-coding: returns which local axis moves
   the body vertically and how many local units = 1 metre. */
function measureBobAxis(root){
  let hips=null; root.traverse(o=>{ if(!hips && o.isBone && _boneKey(o.name)==='Hips') hips=o; });
  if(!hips) return {ax:2, upm:100};
  const p0=hips.position.clone();
  const wy=()=>{ hips.updateMatrixWorld(true); const v=new THREE.Vector3(); hips.getWorldPosition(v); return v.y; };
  hips.position.copy(p0); const y0=wy(); const res=[0,0,0];
  for(let i=0;i<3;i++){ const t=p0.clone(); t.setComponent(i,t.getComponent(i)+1); hips.position.copy(t); res[i]=wy()-y0; }
  hips.position.copy(p0);
  let ax=0; for(let i=1;i<3;i++) if(Math.abs(res[i])>Math.abs(res[ax])) ax=i;
  const d=res[ax]|| -0.01;
  return {ax, upm: 1/d};
}
function reloadPeds(){
  for(const p of peds){ if(p.group) scene.remove(p.group); }
  peds.length=0;
  const n = P('n') ? Math.max(2, +new URLSearchParams(location.search).get('n')||24) : 72;
  spawnPeds(n);
  if(MANNEQUIN.ready && !P('procedural')) makeSkinnedPlayer();
}
/* bone name without the mixamo prefix.
   GLTFLoader strips the colon -> names arrive as `mixamorig1Hips` (no ':'),
   so the prefix match must make the colon OPTIONAL. Getting this wrong means
   sb() finds no bones and the whole crowd stands still. */
const _boneKey = n => n.replace(/^mixamorig[0-9]*:?/,'');
function pickMannequin(){ return MANNEQUINS.length ? MANNEQUINS[(Math.random()*MANNEQUINS.length)|0] : MANNEQUIN; }
function buildSkinnedPed(x,z,targetHeight,mk){
  mk = mk || pickMannequin();
  const root=skeletonClone(mk.proto);
  const target=targetHeight||rnd(1.62,1.88);
  const s=target/mk.h;
  root.scale.setScalar(s);
  root.position.y=-mk.minY*s;                 // feet on the ground
  applyLook(root, { Top:pck(CHAR_MATPAL.Top), Shoes:pck(CHAR_MATPAL.Shoes),
                    Hair:pck(CHAR_MATPAL.Hair), Skin:pck(CHAR_MATPAL.Skin) });
  const bones={};
  root.traverse(o=>{ if(o.isBone){ const k=_boneKey(o.name); if(!bones[k]) bones[k]=o; } });
  for(const k in bones){ const b=bones[k]; b.userData.rest=b.quaternion.clone(); b.userData.restPos=b.position.clone(); }
  root.userData.bones=bones;
  // let the Hips bone be pushed up/down in WORLD metres (pelvis bob / crouch)
  if(bones['Hips'] && mk.bob){ const bo=mk.bob; bones['Hips'].userData.bobAxis=bo.ax; bones['Hips'].userData.bobUpm=bo.upm/s; }
  const wrap=new THREE.Group(); wrap.add(root); scene.add(wrap);

       + a second, smaller absorption bend on stance contact

       toe-up (dorsiflex) as it reaches forward

  //     reach the ground on stance instead of hovering at hip height. ---
  const A=0.60+0.55*R, bias=0.14*R, backC=0.60, adduct=0.05+0.06*R;
  const swing=(sv)=>{ const r=A*sv; return bias + (r>0? r : r*backC); };
  // --- legs: AIM each bone in body space (+Z fwd / +Y up / +X = char's LEFT) so it
  //     works on a T-pose OR an A-pose rig. thighL/thighR > 0 = leg swung FORWARD ---
  const thighL=swing(s), thighR=swing(-s);

  aimBone(B,'RightUpLeg',  adduct*0.5, -Math.cos(thighR), Math.sin(thighR));  // -> legs track under
  // --- knees: one flex per step, PEAKED MID-SWING (thigh vertical, heel up to the
  //     butt) then extending as the thigh drives forward to reach for the ground.
  //     Plus a smaller absorption flex at stance contact. The kernel is asymmetric
  //     (fast flex, slower extend) so the two legs never mirror into a "both legs
  //     folded" pose. ---

  //     the shortfall. Drop the pelvis by the SUPPORT (lower) leg's lift -> planted.
  //   LIFT: a run needs a flight bounce between strides.
  //   Plus a slow counter-rotation of the pelvis against the shoulders. ---

    p=[[0,bl+0.04],[0.06,bl+0.08],[hood-0.02,bl+0.11],

       [0.5,rl+0.006],[roofb+0.05,rl],[1-(s0+0.10),rl-0.045],

function profileZ(prof,u){
  u=clamp(u,0,1);
  for(let i=0;i<prof.length-1;i++){ const [u0,z0]=prof[i],[u1,z1]=prof[i+1];
    if(u<=u1+1e-9){ const t=(u-u0)/Math.max(u1-u0,1e-9); return z0+(z1-z0)*t; } }
  return prof[prof.length-1][1];
}
/* loft the painted shell from super-elliptical cross-sections; split the top
   band (windshield / windows / backlight) into a separate glass shell so the
   cabin is part of the body, not a floating box. */
function carLoft(T, col){
  const prof=carProfile(T), L=T.len, hw=T.wid/2;
  const NX=34, NS=18, P=0.66;
  const bl=T.tall, roofY=profileZ(prof,0.5);
  const archHalf=Math.max(T.wr*0.95,1.0);
  const uF=0.5-(T.wb/2)/L, uB=0.5+(T.wb/2)/L;
  const nearArch=u=>Math.min(Math.abs(u-uF),Math.abs(u-uB))*L < archHalf;
  const pos=[]; const vid=(i,k)=>i*NS+(k%NS);
  for(let i=0;i<=NX;i++){
    const u=i/NX, z=(u-0.5)*L;               // length along Z (game convention: yaw0 faces +Z)
    const bot=0.26 + (nearArch(u)?0.15:0.02) + 0.07*Math.abs(u-0.5)*2;
    const top=profileZ(prof,u);
    const taper=1-0.12*Math.pow(Math.abs(u-0.5)*2,2.4);
    const wt=hw*taper, wb=hw*taper*0.93;
    for(let k=0;k<NS;k++){
      const a=2*Math.PI*k/NS, sn=Math.sin(a), cs=Math.cos(a);
      const xn=(sn<0?-1:1)*Math.abs(sn)**P;      // width across X
      const zn=0.5-0.5*(cs<0?-1:1)*Math.abs(cs)**P;
      const y=bot+(top-bot)*zn;                  // height UP Y (three.js is Y-up)
      const w=wb*(1-zn)+wt*zn;
      pos.push(xn*w, y, z);
    }
  }
  const idx=[]; const tri=(a,b,c)=>idx.push(a,b,c);
  for(let i=0;i<NX;i++) for(let k=0;k<NS;k++)
    tri(vid(i,k),vid(i,k+1),vid(i+1,k+1)), tri(vid(i,k),vid(i+1,k+1),vid(i+1,k));
  for(const i of [0,NX]){ const b=i*NS;
    for(let k=1;k<NS-1;k++){ if(i===0) tri(b,b+k+1,b+k); else tri(b,b+k,b+k+1); } }
  const gp=[], gg=[];
  for(let f=0;f<idx.length;f+=3){
    const ia=idx[f]*3, ib=idx[f+1]*3, ic=idx[f+2]*3;
    const cy=(pos[ia+1]+pos[ib+1]+pos[ic+1])/3;
    const glass=(cy>bl-0.03 && cy<roofY-0.05);
    (glass?gg:gp).push(ia,ib,ic);
  }
  const mk=(faces,hex)=>{ const c=new THREE.Color(hex), p=[], cc=[];
    for(const fi of faces){ p.push(pos[fi],pos[fi+1],pos[fi+2]); cc.push(c.r,c.g,c.b); }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(cc,3));
    g.computeVertexNormals(); return g; };
  return { paint:mk(gp,col), glass:mk(gg,0x4a6c8c) };
}

/* ============================================================
   TRAFFIC (NPC cars driving the road grid)
   ============================================================ */
/* road CENTRE-lines = the GAPS between 32-wide blocks centred on multiples of 48 → ±24, ±72 */
const ROAD=[-72,-24,24,72];
const HALF_ROAD=8;                 // road half-width (blocks are 32 wide, gaps are 16)

/* ============================================================
   TRAFFIC LIGHTS + CROSSWALKS
   ============================================================ */
const LIGHT_PERIOD=13;             // seconds for a full cycle
const COMMIT_DIST=16;              // stop line sits this far before the junction centre.
                                   // Crosswalk spans 9-13m, so stopping at >=16m keeps cars
                                   // clear of the stripes. Inside 16m you're COMMITTED.
const INTERSECTIONS=[];            // {x,z,off,zLamps,xLamps}
const INTER_MAP=new Map();         // "x,z" -> intersection
const CROSSWALKS=[];               // {x0,x1,z0,z1,axis}

const SIG={
  r_on:new THREE.MeshStandardMaterial({color:0xff3344,emissive:0xff3344,emissiveIntensity:1.4}),
  r_off:new THREE.MeshStandardMaterial({color:0x361317,emissive:0x180a0c,emissiveIntensity:0.15}),
  a_on:new THREE.MeshStandardMaterial({color:0xffc23d,emissive:0xffc23d,emissiveIntensity:1.4}),
  a_off:new THREE.MeshStandardMaterial({color:0x362c10,emissive:0x181306,emissiveIntensity:0.15}),
  g_on:new THREE.MeshStandardMaterial({color:0x3dff8a,emissive:0x3dff8a,emissiveIntensity:1.4}),
  g_off:new THREE.MeshStandardMaterial({color:0x0e3620,emissive:0x06180e,emissiveIntensity:0.15}),
};
function buildSignal(x,z,rot){
  const g=new THREE.Group();
  g.add(box(0.28,5,0.28,0x2a2f36,0,2.5,0));
  g.add(box(0.52,1.55,0.5,0x14181d,0,5.62,0));
  const lamps=[];
  for(let i=0;i<3;i++){ const l=box(0.34,0.32,0.34,0x000000,0,6.12-i*0.46,0.2); g.add(l); lamps.push(l); }
  g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
  return { r:lamps[0], a:lamps[1], g:lamps[2] };
}
function stripeTexture(vertical){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const g=c.getContext('2d'); g.clearRect(0,0,256,64);
  g.fillStyle='rgba(238,243,248,0.92)';
  const n=9;
  if(vertical){ const w=256/n; for(let i=0;i<n;i+=2) g.fillRect(i*w+w*0.18,0,w*0.64,64); }
  else{ const h=64/n; for(let i=0;i<n;i+=2) g.fillRect(0,i*h+h*0.18,256,h*0.64); }
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function buildRoadFurniture(){
  const texV=stripeTexture(true), texH=stripeTexture(false);
  // shared geometries + materials (keep draw overhead low: 64 crosswalks, 2 of each)
  const geoH=new THREE.PlaneGeometry(16,4), geoV=new THREE.PlaneGeometry(4,16);
  const matH=new THREE.MeshBasicMaterial({map:texV, transparent:true, depthWrite:false});
  const matV=new THREE.MeshBasicMaterial({map:texH, transparent:true, depthWrite:false});
  // axis 'x' = a crosswalk ACROSS a north-south road (spans x, thin in z)
  // axis 'z' = a crosswalk ACROSS an east-west road  (spans z, thin in x)
  const mkCross=(cx,cz,axis)=>{
    const horiz = axis==='x';
    const m=new THREE.Mesh(horiz?geoH:geoV, horiz?matH:matV);
    m.rotation.x=-Math.PI/2; m.position.set(cx,0.06,cz); m.renderOrder=1; scene.add(m);
    if(horiz) CROSSWALKS.push({x0:cx-8,x1:cx+8,z0:cz-2,z1:cz+2,axis:'x',cx,cz});
    else      CROSSWALKS.push({x0:cx-2,x1:cx+2,z0:cz-8,z1:cz+8,axis:'z',cx,cz});
  };
  for(const rx of ROAD) for(const rz of ROAD){
    // crosswalks on the four approaches
    mkCross(rx, rz-11, 'x');
    mkCross(rx, rz+11, 'x');
    mkCross(rx-11, rz, 'z');
    mkCross(rx+11, rz, 'z');
    // traffic lights: one pole shows the Z-road signal, the other the X-road signal
    const off = ((rx*3 + rz*7) % LIGHT_PERIOD + LIGHT_PERIOD) % LIGHT_PERIOD;
    const it = { x:rx, z:rz, off, zLamps:buildSignal(rx-8.7, rz-8.7, 0), xLamps:buildSignal(rx+8.7, rz+8.7, Math.PI/2) };
    INTERSECTIONS.push(it); INTER_MAP.set(rx+','+rz, it);
  }
}
buildRoadFurniture();
function lightState(it, t){
  const ph=(((t + it.off) % LIGHT_PERIOD) + LIGHT_PERIOD) % LIGHT_PERIOD;
  let z='red', x='red';
  if(ph<5) z='green'; else if(ph<6) z='amber';
  else if(ph<11) x='green'; else if(ph<12) x='amber';
  return { z, x };                      // ph 12..13 = all-red gap
}
function setSignal(lamps, state){
  lamps.r.material = state==='red'  ? SIG.r_on : SIG.r_off;
  lamps.a.material = state==='amber'? SIG.a_on : SIG.a_off;
  lamps.g.material = state==='green'? SIG.g_on : SIG.g_off;
}
function updateLights(t){
  for(const it of INTERSECTIONS){
    const st=lightState(it,t);
    setSignal(it.zLamps, st.z); setSignal(it.xLamps, st.x);
  }
}
const TRAFFIC=[];
function nextRoadAhead(v,dir){
  if(dir>0){ for(const r of ROAD) if(r>v+0.5) return r; return null; }
  for(let i=ROAD.length-1;i>=0;i--) if(ROAD[i]<v-0.5) return ROAD[i];
  return null;
}
function spawnTraffic(n){
  for(let k=0;k<n;k++){
    const alongZ=Math.random()<0.5;
    const dir=Math.random()<0.5?1:-1;
    const line=ROAD[Math.floor(Math.random()*ROAD.length)];
    const col=CARCOLS[Math.floor(Math.random()*CARCOLS.length)];
    const ttype=CARKEYS[Math.floor(Math.random()*CARKEYS.length)];
    const car=buildCar(ttype,col,0,0,0);
    const start=ROAD[Math.floor(Math.random()*ROAD.length)]+rnd(-30,30);
    const t={ car, alongZ, dir, line, base:rnd(7,13), speed:rnd(6,11), axial:start, next:null };
    t.next=nextRoadAhead(start,dir);
    if(t.next===null){ t.axial = dir>0? ROAD[0]-3 : ROAD[ROAD.length-1]+3; t.next=nextRoadAhead(t.axial,dir); }
    placeTraffic(t);
    TRAFFIC.push(t);
  }
}
function placeTraffic(t){
  const c=t.car;
  c.moving = true;
  if(t.alongZ){ c.pos.set(t.line + 4.6*t.dir, 0, t.axial); c.yaw = t.dir>0?0:Math.PI; }
  else { c.pos.set(t.axial, 0, t.line - 4.6*t.dir); c.yaw = t.dir>0?Math.PI/2:-Math.PI/2; }
  // keep traffic cars from clipping through buildings (shouldn't happen on-lane, but safety)
  const [rx,rz]=resolveXZ(c.pos.x,c.pos.z,1.6); c.pos.x=rx; c.pos.z=rz;
  c.group.position.copy(c.pos); c.group.rotation.y=c.yaw;
}
const AVOID=13;   // start planning a stop this far ahead of the car in front
function updateTraffic(dt, t){
  const p=player.pos;
  const worldXZ=(alongZ,dir)=> alongZ ? [0,dir] : [dir,0];
  const lanePos=(alongZ,line,dir,axial)=> alongZ ? {x:line+4.6*dir, z:axial} : {x:axial, z:line-4.6*dir};
  for(const tr of TRAFFIC){
    if(tr.stolen) continue;
    const c=tr.car;
    let target=tr.base;
    // yield to the player on foot standing directly ahead
    if(player.onFoot){
      const dx=p.x-c.pos.x, dz=p.z-c.pos.z, d=Math.hypot(dx,dz);
      if(d<10){ const fx=Math.sin(c.yaw), fz=Math.cos(c.yaw); if((dx*fx+dz*fz)/(d||1) > 0.55) target=0; }
    }
    // obey the traffic lights on the intersection ahead
    if(tr.next!==null){
      const inter = INTER_MAP.get(tr.alongZ ? (tr.line+','+tr.next) : (tr.next+','+tr.line));
      if(inter){
        const st=lightState(inter, t);
        const sig = tr.alongZ ? st.z : st.x;
        const approach=(tr.next - tr.axial)*tr.dir;   // >0 = still approaching the junction
        if(approach<=COMMIT_DIST) tr.committed=true;
        else if(approach>COMMIT_DIST+8) tr.committed=false;
        const mustYield = (sig==='red') || (sig==='amber' && approach<COMMIT_DIST+12);
        // taper to a smooth stop AT the stop line (not a last-second slam)
        if(!tr.committed && approach>0 && mustYield)
          target=Math.min(target, Math.max(0, (approach-COMMIT_DIST)*0.9));
      }
    }
    // ---- anti-crash: brake for ANY vehicle just ahead (traffic, parked, player's) ----
    const [dx,dz]=worldXZ(tr.alongZ,tr.dir);
    let closest=Infinity;
    const consider=o=>{ if(!o||o===c) return;
      const rx=o.pos.x-c.pos.x, rz=o.pos.z-c.pos.z;
      const fwd=rx*dx+rz*dz, lat=Math.abs(rx*dz-rz*dx);   // ahead-distance + lateral offset
      if(lat<2.3 && fwd>-1.5 && fwd<AVOID && fwd<closest) closest=fwd; };
    for(const o of TRAFFIC){ if(o.stolen) continue; consider(o.car); }
    for(const o of cars) consider(o);
    if(S.car) consider(S.car);
    if(closest<AVOID){ const stopGap=c.len*0.5+1.6;
      target=Math.min(target, Math.max(0,(closest-stopGap)*1.6)); }
    // ease speed toward target
    tr.speed += (target-tr.speed)*Math.min(1,(target<tr.speed?7:4)*dt);
    if(c.tailMat) c.tailMat.emissiveIntensity = (target<tr.speed-0.4 || tr.speed<1.5) ? 3.0 : 1.1;
    // advance along the lane
    tr.axial += tr.dir*tr.speed*dt;
    // crossing an intersection → maybe turn onto the crossing road
    if(tr.next!==null){
      const crossed = tr.dir>0 ? tr.axial>=tr.next-0.01 : tr.axial<=tr.next+0.01;
      if(crossed){
        tr.axial = tr.next;
        const inter = tr.next, oldLine = tr.line;
        if(Math.random()<0.5){
          const nAlongZ=!tr.alongZ, nLine=inter, nDir=Math.random()<0.5?1:-1, nAxial=oldLine;
          if(laneClear(nAlongZ,nLine,nDir,nAxial,tr)){ tr.alongZ=nAlongZ; tr.line=nLine; tr.dir=nDir; tr.axial=nAxial; }
        }
        tr.next = nextRoadAhead(tr.axial, tr.dir);
        if(tr.next===null){ tr.axial = tr.dir>0? ROAD[0]-3 : ROAD[ROAD.length-1]+3; tr.next=nextRoadAhead(tr.axial,tr.dir); }
      }
    }
    // EASE position toward the lane path → cars ARC smoothly through turns.
    // (no more snapping to the side; the eased yaw + eased path = a real curve)
    const want=lanePos(tr.alongZ,tr.line,tr.dir,tr.axial), k=Math.min(1, 7.5*dt);
    c.pos.x += (want.x-c.pos.x)*k;
    c.pos.z += (want.z-c.pos.z)*k;
    const [hx,hz]=worldXZ(tr.alongZ,tr.dir);
    c.yaw = lerpAngle(c.yaw, Math.atan2(hx,hz), Math.min(1, 6.5*dt));
    c.moving = tr.speed>1.5;
    c.group.position.set(c.pos.x,0,c.pos.z);
    c.group.rotation.y=c.yaw;
  }
}
/* is a spot in a given lane clear of other cars? */
function laneClear(alongZ,line,dir,axial,self){
  const minSep=6.5;
  for(const o of TRAFFIC){
    if(o===self || o.stolen) continue;
    if(o.alongZ!==alongZ || o.line!==line || o.dir!==dir) continue;
    if(Math.abs(o.axial-axial)<minSep) return false;
  }
  return true;
}
/* hard separation: no two same-lane cars may overlap. Push followers back. */
function separateTraffic(){
  const lanes={};
  for(const t of TRAFFIC){
    if(t.stolen) continue;
    const k=t.alongZ+'|'+t.line+'|'+t.dir;
    (lanes[k]=lanes[k]||[]).push(t);
  }
  for(const k in lanes){
    const arr=lanes[k];
    const dir=arr[0].dir;
    // order front→back so we can place each follower behind the one ahead
    arr.sort((a,b)=> dir>0 ? b.axial-a.axial : a.axial-b.axial);
    for(let i=1;i<arr.length;i++){
      const lead=arr[i-1], foll=arr[i];
      const minSep=(lead.car.len+foll.car.len)/2 + 1.2;   // 1.2m bumper gap
      const gap=(lead.axial-foll.axial)*dir;
      if(gap<minSep) foll.axial = lead.axial - dir*minSep;
    }
  }
}

function insideSolid(x,z,pad){
  for(const s of solids){
    if(x>s.minx-pad && x<s.maxx+pad && z>s.minz-pad && z<s.maxz+pad) return true;
  }
  return false;
}
function onRoad(x,z){
  for(const r of ROAD){ if(Math.abs(x-r)<HALF_ROAD) return true; if(Math.abs(z-r)<HALF_ROAD) return true; }
  return false;
}
function inCrosswalk(x,z){
  for(const c of CROSSWALKS){ if(x>c.x0 && x<c.x1 && z>c.z0 && z<c.z1) return true; }
  return false;
}
function walkable(x,z){
  if(insideSolid(x,z,0.6)) return false;
  if(onRoad(x,z) && !inCrosswalk(x,z)) return false;   // sidewalks + crossings only
  return true;
}
function freeSpot(){
  for(let k=0;k<80;k++){
    const x=rnd(-CITY.half+8, CITY.half-8), z=rnd(-CITY.half+8, CITY.half-8);
    if(walkable(x,z)) return {x,z};
  }
  return {x:24,z:24};
}
function spawnPeds(n){
  const useSkin=MANNEQUIN.ready;
  for(let k=0;k<n;k++){
    const s=freeSpot();
    const p = useSkin ? buildSkinnedPed(s.x,s.z) : buildPed(s.x,s.z);
    p.hp=60; p.angry=false; p.kod=false;
    peds.push(p);
  }
}

function pickPedTarget(p){
  // prefer a nearby walkable spot (sidewalk / crossing) so they don't wander into traffic
  for(let k=0;k<14;k++){
    const x=clamp(p.pos.x+rnd(-16,16),-CITY.half+6,CITY.half-6);
    const z=clamp(p.pos.z+rnd(-16,16),-CITY.half+6,CITY.half-6);
    if(walkable(x,z)){ p.target.set(x,0,z); return; }
  }
  // fallback: a short hop in any walkable direction, else stay put
  for(let a=0;a<14;a++){
    const ang=rnd(0,6.28);
    const x=clamp(p.pos.x+Math.cos(ang)*7,-CITY.half+6,CITY.half-6);
    const z=clamp(p.pos.z+Math.sin(ang)*7,-CITY.half+6,CITY.half-6);
    if(walkable(x,z)){ p.target.set(x,0,z); return; }
  }
  p.target.copy(p.pos);
}

  const dx=e.clientX-look.lastX, dy=e.clientY-look.lastY;
  look.lastX=e.clientX; look.lastY=e.clientY; look.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw -= dx*0.005;
  cam.pitch = clamp(cam.pitch + dy*0.004, 0.06, 1.15);
});

function distToRect(px,pz,pl){
  const dx=Math.max(pl.x-pl.w/2 - px, 0, px-(pl.x+pl.w/2));
  const dz=Math.max(pl.z-pl.d/2 - pz, 0, pz-(pl.z+pl.d/2));
  return Math.hypot(dx,dz);
}
function nearestTarget(){
  const p=player.pos;
  let best=null, bd=3.4;
  // cars (enter) — only on foot
  if(player.onFoot){
    for(const c of cars){ const d=Math.hypot(c.pos.x-p.x,c.pos.z-p.z); if(d<bd){ bd=d; best={type:'car',car:c}; } }
    for(const t of TRAFFIC){ if(t.stolen) continue; const c=t.car; const d=Math.hypot(c.pos.x-p.x,c.pos.z-p.z); if(d<bd){ bd=d; best={type:'car',car:c}; } }
    // buildings — measured from the wall edge, not the centre
    for(const [k,pl] of Object.entries(PLACES)){
      const d=distToRect(p.x,p.z,pl);
      if(d<3.0 && d<bd){ bd=d; best={type:'place', place:k}; }
    }
    for(const ped of peds){ const d=Math.hypot(ped.pos.x-p.x,ped.pos.z-p.z); if(d<1.9 && d<bd){ bd=d; best={type:'ped',ped}; } }
  } else {
    best={ type:'exit' };
  }
  return best;
}

  const clean = (S.legit - S.under)/100;     // -1..1
  const mult = 1 + clamp(clean,0,1)*0.9;      // up to ~1.9x
  S.heat = clamp(S.heat + v*mult, 0, 5);
  S.heatLock = 14;
  S.under = clamp(S.under + v*6, 0, 100);
  S.legit = clamp(S.legit - v*4, 0, 100);
}

  for(const p of peds){
    if(p.robbed||p.kod) continue;
    const dx=p.pos.x-player.pos.x, dz=p.pos.z-player.pos.z, d=Math.hypot(dx,dz);
    if(d<hd && (dx*fx+dz*fz)/(d||1)>0.35){ hd=d; hit=p; }
  }
  if(hit) hurtPed(hit, 14, fy); else feel(0.12);
}
function hurtPed(p, dmg, fromYaw){
  p.hp=(p.hp??60)-dmg;
  p.pos.x += Math.sin(fromYaw)*0.8; p.pos.z += Math.cos(fromYaw)*0.8;   // knockback
  p.angry=true; p.aggro=18; p.kod=false;
  addHeat(0.22); feel(0.28);
  if(p.hp<=0) koPed(p);
}
function koPed(p){
  p.kod=true; p.kodT=6; p.robbed=false; p.koPhase=0; p.angry=false; p.group.rotation.x=0;
  koCount++; toast('💥 KO\u2019d a pedestrian'); addHeat(0.5);
}
function pedAttack(p){
  playerHp=Math.max(0, playerHp-9); dmgCd=0.6; feel(0.7); shake=Math.max(shake,0.9);
  if(playerHp<=0){ playerHp=100; addHeat(0.5);
    player.pos.set(24,0,40); playerHP_reset(); toast('🚑 They knocked you down — you blacked out'); }
}
function playerHP_reset(){ if(player.group) player.group.position.copy(player.pos); }
function updateCombat(dt){
  if(punchCd>0) punchCd-=dt;
  if(dmgCd>0) dmgCd-=dt;
  // player punch pose (skinned rig): snap the right arm forward then recoil
  if(player.skinned && punchT>0){
    punchT-=dt;
    const B=player.bones, u=clamp(1-punchT/0.30,0,1), s=Math.sin(u*Math.PI);
    const ra=B['RightArm'], rf=B['RightForeArm'];
    if(ra&&ra.userData.rest) ra.rotation.x = ra.userData.rest.x - 1.55*s;
    if(rf&&rf.userData.rest) rf.rotation.x = rf.userData.rest.x - 1.0*s;
  }
  for(const p of peds){
    if(!p.group) continue;
    if(p.kod){
      p.kodT-=dt;
      p.group.rotation.x = Math.min(1.45, p.group.rotation.x + dt*4);   // fall over
      p.group.position.set(p.pos.x,0,p.pos.z);
      if(p.kodT<=0){ p.kod=false; p.hp=60; p.group.rotation.x=0; p.angry=false; }
      continue;
    }
    if(p.angry){
      p.aggro=(p.aggro??0)-dt;
      if(p.aggro<=0){ p.angry=false; p.hp=60; continue; }
      const dx=player.pos.x-p.pos.x, dz=player.pos.z-p.pos.z, d=Math.hypot(dx,dz);
      p.tYaw=Math.atan2(dx,dz);
      if(d>1.1 && player.onFoot){
        const step=3.7*dt, [rx,rz]=resolveXZ(p.pos.x+dx/d*step, p.pos.z+dz/d*step, 0.5);
        p.pos.x=rx; p.pos.z=rz;
      }
      const moved=Math.hypot(p.pos.x-(p._lx??p.pos.x), p.pos.z-(p._lz??p.pos.z));
      p._lx=p.pos.x; p._lz=p.pos.z; p.phase=(p.phase||0)+moved*9+dt*3;
      if(p.skinned) animateSkinned(p,p.phase,1,1); else animateWalk(p.group,p.phase,1,0.6);
      p.yaw=lerpAngle(p.yaw||0,p.tYaw||p.yaw||0,Math.min(1,11*dt));
      p.group.position.set(p.pos.x,0,p.pos.z); p.group.rotation.y=p.yaw;
      if(d<1.35 && dmgCd<=0 && player.onFoot) pedAttack(p);
    }
  }
}

/* ============================================================
   UPDATE: PLAYER / CAR / PEDS / COPS
   ============================================================ */
const clock=new THREE.Clock();
function inputVec(){
  let x=0,z=0;
  if(keys.KeyW||keys.ArrowUp) z+=1;
  if(keys.KeyS||keys.ArrowDown) z-=1;
  if(keys.KeyA||keys.ArrowLeft) x-=1;
  if(keys.KeyD||keys.ArrowRight) x+=1;
  x += (joy.vx||0); z += (joy.vy||0);
  const m=Math.hypot(x,z); if(m>1){ x/=m; z/=m; }
  return {x,z,m:Math.min(1,m)};
}
function resolveXZ(px,pz,r){
  for(const s of solids){
    const nx=clamp(px,s.minx,s.maxx), nz=clamp(pz,s.minz,s.maxz);
    let dx=px-nx, dz=pz-nz, d=Math.hypot(dx,dz);
    if(d<0.0001){
      // centre is INSIDE the box — push out through the nearest face (stops tunnelling)
      const dl=px-s.minx, dr=s.maxx-px, dn=pz-s.minz, df=s.maxz-pz, m=Math.min(dl,dr,dn,df);
      if(m===dl) px=s.minx-r; else if(m===dr) px=s.maxx+r; else if(m===dn) pz=s.minz-r; else pz=s.maxz+r;
      continue;
    }
    if(d<r){ const push=(r-d)/d; px+=dx*push; pz+=dz*push; }
  }
  return [px,pz];
}
function collideCircle(px,pz,r){
  [px,pz]=resolveXZ(px,pz,r);
  px=clamp(px,-CITY.half,CITY.half); pz=clamp(pz,-CITY.half,CITY.half);
  return [px,pz];
}
function updatePlayer(dt){
  if(!player.onFoot){ jumpY=0; jumpV=0; return; }
  const iv=inputVec();
  const boost = S.energy>0 ? 1.35 : 1;             // restaurant feed = faster on foot
  const RUN=9.4, WALK=5.6;
  // How the body turns:
  //  • full stick (forward / forward+strafe) → body faces where you're going
  //  • pure sideways or backward → body turns to FACE the camera (true strafe /
  //    backpedal), never moonwalks — the character always faces its heading.
  const sin=Math.sin(cam.yaw), cos=Math.cos(cam.yaw);
  const wx = iv.x*cos - iv.z*sin;                  // world move dir
  const wz = -iv.x*sin - iv.z*cos;
  const isStrafe = Math.abs(iv.x)>0.1 && iv.z<=0.1;
  const speed = (isStrafe?WALK:(sprint?RUN:WALK)) * boost;
  let nx=player.pos.x + wx*speed*dt;
  let nz=player.pos.z + wz*speed*dt;
  [nx,nz]=collideCircle(nx,nz,0.7);
  player.pos.x=nx; player.pos.z=nz;
  const moving = iv.m>0.05;
  if(moving){
    player.yaw = isStrafe ? (cam.yaw+Math.PI) : Math.atan2(wx,wz);
    player.phase += dt*((sprint&&!isStrafe)?17:10);
  } else player.phase *= 0.85;
  // jump: simple ballistic arc
  if(jumpY>0 || jumpV!==0){
    jumpV -= 18*dt; jumpY += jumpV*dt;
    if(jumpY<=0){ jumpY=0; jumpV=0; landT=1; }   // touch down -> landing crouch
  }
  player.group.position.set(player.pos.x, jumpY, player.pos.z);
  player.group.rotation.y = lerpAngle(player.group.rotation.y, player.yaw, Math.min(1,12*dt));
  // limb animation: airborne pose / landing crouch / walk-run cycle
  if(player.skinned){
    if(jumpY>0)            poseJumpSkinned(player, jumpY/1.25, jumpV>0);
    else if(landT>0.01){ landT=Math.max(0, landT-dt*3.2); poseLandSkinned(player, landT); }
    else if(moving && !isStrafe) animateSkinned(player, player.phase, 1, sprint?1:0);
    else                         idleSkinned(player, performance.now()/1000);
  } else {
    if(jumpY>0){
      poseJump(player.group, jumpY/1.25, jumpV>0);
    } else if(landT>0.01){
      landT=Math.max(0, landT-dt*3.2);
      poseLand(player.group, landT);
    } else {
      animateWalk(player.group, player.phase, moving?1:0.10, sprint?1:0);
    }
  }
}
function updateCar(dt){
  if(player.onFoot||!S.car) return;
  const c=S.car, iv=inputVec();
  const accel = 26, maxSpd=26, revMax=9, fric=1.6, brake=34;
  if(iv.z>0.1) c.speed += accel*iv.z*dt;
  else if(iv.z<-0.1) c.speed += accel*iv.z*0.7*dt;
  else c.speed -= c.speed*fric*dt;
  c.speed = clamp(c.speed, -revMax, maxSpd);
  // steering (only when moving) — D turns the car to the RIGHT on screen
  const steer = iv.x * 1.6 * clamp(Math.abs(c.speed)/8,0,1) * (c.speed<0?-1:1);
  c.yaw -= steer*dt;
  const fx=Math.sin(c.yaw), fz=Math.cos(c.yaw);
  let nx=c.pos.x + fx*c.speed*dt;
  let nz=c.pos.z + fz*c.speed*dt;
  // collide (cars bigger radius) — resolveXZ handles the inside-a-building case too
  let [cx,cz]=resolveXZ(nx,nz,1.6);
  if(Math.abs(cx-nx)>0.001 || Math.abs(cz-nz)>0.001) c.speed*=0.4;
  cx=clamp(cx,-CITY.half,CITY.half); cz=clamp(cz,-CITY.half,CITY.half);
  c.pos.x=cx; c.pos.z=cz;
  c.group.position.set(c.pos.x,0,c.pos.z);
  c.group.rotation.y=c.yaw;
  // player rides along
  player.pos.set(c.pos.x,c.pos.z?0:0,c.pos.z);
}
function updatePeds(dt){
  for(const p of peds){
    if(p.robbed || p.kod || p.angry) continue;
    const dx=p.target.x-p.pos.x, dz=p.target.z-p.pos.z, d=Math.hypot(dx,dz);
    if(d<0.6){ pickPedTarget(p); }
    else {
      const sp=p.speed||2.2, step=sp*dt;
      const nx=p.pos.x+dx/d*step, nz=p.pos.z+dz/d*step;
      // move; never step onto the road unless it's a crossing. Blocked → slide along the curb.
      const tryMove=(ax,az)=>{
        const [rx,rz]=resolveXZ(ax,az,0.5);
        if(onRoad(rx,rz) && !inCrosswalk(rx,rz)) return false;
        p.pos.x=rx; p.pos.z=rz; return true;
      };
      if(!tryMove(nx,nz)){
        if(!tryMove(nx,p.pos.z)){ if(!tryMove(p.pos.x,nz)){ pickPedTarget(p); } }
      }
      if(d>0.01) p.tYaw=Math.atan2(dx,dz);
    }
    // turn smoothly toward the heading — the body always faces where it's walking
    p.yaw = lerpAngle(p.yaw||0, p.tYaw||p.yaw||0, Math.min(1, 11*dt));
    // walking animation + bob, driven by distance actually travelled
    const moved=Math.hypot(p.pos.x-(p._lx??p.pos.x), p.pos.z-(p._lz??p.pos.z));
    p._lx=p.pos.x; p._lz=p.pos.z;
    p.phase=(p.phase||0) + moved*9 + dt*0.7;
    const walking = moved>0.0008;
    if(p.skinned){ if(walking) animateSkinned(p, p.phase, 1, 0); else idleSkinned(p, performance.now()/1000); }
    else animateWalk(p.group, p.phase, walking?1:0.12);
    p.group.position.set(p.pos.x, 0, p.pos.z);
    p.group.rotation.y=p.yaw;
    // exact ground clamp so the support foot plants (no skating) — nearby peds only,
    // so the crowd keeps the cheap analytic plant at distance.
    if(p.skinned){
      const ddx=p.pos.x-player.pos.x, ddz=p.pos.z-player.pos.z;
      if(ddx*ddx+ddz*ddz < 900){ p.group.updateMatrixWorld(true); groundClampOne(p,false,0.30); }
    }
  }
}
function updateCops(dt){
  const stars=Math.round(S.heat);  while(cops.length<stars) spawnCop();
  while(cops.length>stars){ const c=cops.pop(); scene.remove(c.group); }
  for(const c of cops){
    const dx=player.pos.x-c.pos.x, dz=player.pos.z-c.pos.z, d=Math.hypot(dx,dz);
    const bx=c.pos.x, bz=c.pos.z;
    if(d>1.2){ const sp=Math.min(6.5, 3.4+stars*0.5); let nx=c.pos.x+dx/d*sp*dt, nz=c.pos.z+dz/d*sp*dt; [nx,nz]=resolveXZ(nx,nz,0.55); c.pos.x=nx; c.pos.z=nz; c.yaw=Math.atan2(dx,dz); }
    const moved=Math.hypot(c.pos.x-bx, c.pos.z-bz);
    c.phase=(c.phase||0)+moved*9+dt*0.7;
    animateWalk(c.group, c.phase, moved>0.0008?1:0.1);
    c.group.position.set(c.pos.x,0,c.pos.z);
    c.group.rotation.y+=dt*0.0 + (c.yaw-c.group.rotation.y)*Math.min(1,8*dt);
    if(d<1.4 && S.heat>0){ busted(); break; }
  }
}
function busted(){
  if(S.heat<=0) return;
  const fine=Math.round(S.cash*0.30);
  S.cash-=fine; S.heat=0; S.arrested=true;
  cops.forEach(c=>scene.remove(c.group)); cops.length=0;
  if(!player.onFoot) exitCar();
  player.pos.set(24,0,40); player.group.position.copy(player.pos);
  bigMsg('BUSTED','Lost $'+fine+' — heat cleared','#ff5d6d');
  updateHUD(); feel(1);
}
function updateEnergy(dt){
  if(S.energy>0){ S.energy=Math.max(0,S.energy-dt); if(S.energy===0) toast('🍔 Energy worn off'); }
}
function updateHeat(dt){
  if(S.heatLock>0){ S.heatLock-=dt; return; }
  if(S.heat>0){ S.heat=Math.max(0, S.heat-dt*0.18); if(S.heat<0.02) S.heat=0; }
  if(S.under>0){ S.under=Math.max(0,S.under-dt*0.4); }
  if(S.legit<100 && S.heat===0){ S.legit=Math.min(100,S.legit+dt*0.5); }
}
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }

/* ============================================================
   CAMERA
   ============================================================ */
function updateCamera(dt){
  // auto-recenter behind player when moving on foot and not dragging
  const iv=inputVec();
  if(player.onFoot && iv.m>0.2 && !look.dragging){
    cam.yaw = lerpAngle(cam.yaw, player.yaw+Math.PI, Math.min(1, 1.6*dt));
  }
  const target = (player.onFoot? player.pos : (S.car? S.car.pos : player.pos));
  const cy = target.y + (player.onFoot?(1.6+jumpY):1.0);
  const horiz = Math.cos(cam.pitch)*cam.dist;
  const cx = target.x + Math.sin(cam.yaw)*horiz;
  const cz = target.z + Math.cos(cam.yaw)*horiz;
  const camy = cy + Math.sin(cam.pitch)*cam.dist;
  camera.position.lerp(new THREE.Vector3(cx,camy,cz), Math.min(1, 8*dt));
  camera.lookAt(target.x, cy, target.z);
  if(shake>0){ shake=Math.max(0,shake-dt*2.5); const s=shake*0.35; camera.position.x+=(Math.random()-0.5)*s; camera.position.y+=(Math.random()-0.5)*s; }
}

/* ============================================================
   LOOP
   ============================================================ */
let acc=0;
let paused=false;   // debug/test hook: freeze player + camera so poses can be inspected
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05, clock.getDelta());
  const t=performance.now()/1000;

  if(!MG.active && !paused){
    updatePlayer(dt); updateCar(dt); updateCops(dt);
  }
  updateCombat(dt);
  updatePeds(dt);
  updateTraffic(dt, t);
  updateLights(t);
  updateHeat(dt);
  updateEnergy(dt);
  // ground-clamp the player so the support foot plants (no skating) — measured, exact
  if(player.skinned && player.onFoot){
    player.root.updateMatrixWorld(true);
    groundClampOne(player, jumpY>0, sprint?0.06:0.30);
  }
  if(!paused) updateCamera(dt);
  updateBeam(t);

  // minigame update
  if(MG.active && !MG.done){
    MG.timer-=dt; document.getElementById('mgTime').textContent=Math.max(0,Math.ceil(MG.timer));
    MG.spawn-=dt;
    if(MG.spawn<=0 && MG.timer>1){ MG.spawn=MG.rateSpawn*rnd(0.7,1.3);
      const el=document.createElement('div'); el.className='item'; el.textContent=EMOJI[Math.floor(Math.random()*EMOJI.length)];
      el.style.left='100%'; convEl.appendChild(el);
      MG.items.push({ el, pct:100, speed:rnd(22,34), scanned:false });
    }
    for(const it of MG.items){
      if(it.scanned) continue;
      it.pct -= it.speed*dt;
      it.el.style.left=it.pct+'%';
      if(it.pct<0){ it.done=true; it.el.remove(); MG.miss++; document.getElementById('mgMiss').textContent=MG.miss; it.pct=-999; }
    }
    MG.items=MG.items.filter(it=>it.pct>-500);
    if(MG.timer<=0) endShift();
  }

  // interaction prompt
  nearTarget=nearestTarget();
  if(nearTarget){
    let txt='';
    if(nearTarget.type==='car') txt='<b>E</b> — '+(nearTarget.car.moving?'Carjack':'Get in car');
    else if(nearTarget.type==='exit') txt='<b>E</b> — Get out';
    else if(nearTarget.type==='ped') txt='<b>E</b> — Mug (⚠ crime)';
    else if(nearTarget.type==='place'){
      const k=nearTarget.place;
      if((k==='store'||k==='tower') && S.activeJob && S.activeJob.place===k) txt='<b>E</b> — Start shift';
      else if(k==='shop') txt='<b>E</b> — Open shop';
      else txt='<b>E</b> — '+placeName(k);
    }
    promptEl.innerHTML=txt; promptEl.style.display='inline-block';
  } else promptEl.style.display='none';

  // toast fade
  if(toastT>0){ toastT-=dt; if(toastT<=0) document.getElementById('toast').style.opacity=0; }

  updateHUD();
  renderer.render(scene,camera);
}
updateHUD(); updateObjective();
frame();

/* ---------- resize ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
// show joystick on touch devices
if('ontouchstart' in window || innerWidth<900) joyEl.classList.add('show');

/* expose for debugging/testing */
window.GRIND = { S, PLACES, player, cars, peds, cops, traffic:TRAFFIC, cam, camera, scene, THREE, solids, INTERSECTIONS, CROSSWALKS, ROAD, lightState, onRoad, inCrosswalk, walkable, startShift, applyJob, buy, addHeat, doAction, enterCar, exitCar, MG, openPhone, selectTab, nearestTarget, usePlace, mug, punch, hurtPed, updateCombat, updateTraffic, tryJump, setSprint, animateWalk, poseJump, poseLand, idlePose, buildHumanoid, buildPed, buildSkinnedPed, animateSkinned, idleSkinned, poseJumpSkinned, poseLandSkinned, makeSkinnedPlayer, MANNEQUIN, MANNEQUINS, aimBone, aimArm, aimFore, reloadPeds, groundClampOne, measureBobAxis, setPause:(v)=>{paused=!!v;}, get paused(){return paused;}, get jumpY(){return jumpY;}, get sprint(){return sprint;}, get nearTarget(){return nearTarget;}, get playerHp(){return playerHp;} };
</script>
