<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>GRIND — Open City (working title)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0b0f14;font-family:'Trebuchet MS',system-ui,sans-serif;color:#eaf6ff;user-select:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hud{position:absolute;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.7);}

  /* top-left: cash + stars */
  #topLeft{top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:20;}
  .pill{background:rgba(6,16,26,.72);border:1px solid rgba(120,210,255,.35);border-radius:12px;padding:7px 12px;font-size:15px;font-weight:bold;backdrop-filter:blur(6px);}
  #cash{color:#5dff9d;}
  #heat{color:#ffb020;letter-spacing:2px;}
  #heat.hot{color:#ff4d6d;animation:pulse .7s infinite alternate;}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}

  /* top-right: objective */
  #objWrap{top:10px;right:10px;max-width:46vw;z-index:20;}
  #obj{background:rgba(6,16,26,.72);border:1px solid rgba(120,210,255,.35);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.35;backdrop-filter:blur(6px);}
  #obj b{color:#ffd85e;}
  #obj .sub{opacity:.7;font-size:11px;}

  /* bottom-center interaction prompt */
  #prompt{bottom:118px;left:0;right:0;text-align:center;z-index:20;}
  #prompt span{background:rgba(6,16,26,.8);border:1px solid rgba(120,210,255,.5);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:bold;display:none;}
  #prompt span b{color:#ffd85e;}

  /* toast */
  #toast{bottom:180px;left:0;right:0;text-align:center;z-index:25;font-size:16px;font-weight:bold;min-height:22px;transition:opacity .25s;}

  /* touch controls */
  #joy{position:absolute;left:20px;bottom:24px;width:140px;height:140px;border-radius:50%;z-index:30;
    background:radial-gradient(circle at 50% 42%, rgba(30,52,74,.5), rgba(5,12,20,.55));
    border:2px solid rgba(120,210,255,.35);touch-action:none;display:none;}
  #joy.show{display:block;}
  #joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #bfe9ff, #5aa8e0);border:2px solid rgba(255,255,255,.6);box-shadow:0 4px 14px rgba(0,0,0,.5);}
  #joy .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:10px;letter-spacing:2px;opacity:.6;}

  /* action buttons */
  #btns{position:absolute;right:18px;bottom:26px;display:flex;flex-direction:column;gap:10px;z-index:30;align-items:flex-end;}
  .abtn{width:70px;height:70px;border-radius:50%;border:2px solid rgba(120,210,255,.55);background:rgba(10,40,64,.72);
    color:#eaf6ff;font-size:22px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);}
  .abtn small{font-size:9px;opacity:.7;letter-spacing:1px;}
  .abtn:active{background:rgba(63,169,245,.5);}
  .abtn.hot{border-color:#ffd85e;box-shadow:0 0 16px rgba(255,216,94,.55);}
  #phoneBtn{width:56px;height:56px;font-size:20px;}
  #btns .srow{display:flex;gap:10px;}
  .abtn.small{width:58px;height:58px;font-size:18px;}

  /* phone / panels */
  .overlay{position:absolute;inset:0;z-index:60;background:rgba(3,8,14,.86);backdrop-filter:blur(8px);display:none;flex-direction:column;}
  .overlay.show{display:flex;}
  .ovHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(120,210,255,.25);}
  .ovHead h2{font-size:17px;letter-spacing:1px;}
  .ovHead .close{background:rgba(255,255,255,.08);border:none;color:#eaf6ff;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;}
  .ovBody{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(120,210,255,.3);background:rgba(10,40,64,.5);text-align:center;font-size:13px;font-weight:bold;cursor:pointer;}
  .tab.active{background:rgba(63,169,245,.4);border-color:#7dffd6;}

  .card{background:rgba(8,22,36,.8);border:1px solid rgba(120,210,255,.25);border-radius:12px;padding:12px;margin-bottom:10px;}
  .card h3{font-size:14.5px;margin-bottom:3px;}
  .card .meta{font-size:11.5px;opacity:.75;line-height:1.4;}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px;}
  .card .pay{color:#5dff9d;font-weight:bold;font-size:13px;}
  .card .req{font-size:11px;color:#ffb020;}
  .btn{background:linear-gradient(180deg,#3fa9f5,#1d6fb8);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;}
  .btn:disabled{background:#33404d;color:#8fa0ad;cursor:not-allowed;}
  .btn.good{background:linear-gradient(180deg,#3ddc84,#1d9c5c);}
  .btn.bad{background:linear-gradient(180deg,#ff5d6d,#b81d3d);}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(125,255,214,.15);color:#7dffd6;border:1px solid rgba(125,255,214,.4);margin-left:6px;}

  /* cashier minigame */
  #mini{position:absolute;inset:0;z-index:70;background:rgba(3,8,14,.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;}
  #mini.show{display:flex;}
  #mini h2{font-size:18px;letter-spacing:1px;margin-bottom:4px;}
  #mini .sub{font-size:12px;opacity:.7;margin-bottom:14px;}
  #conv{position:relative;width:min(92vw,560px);height:120px;border-radius:14px;background:rgba(8,22,36,.9);border:1px solid rgba(120,210,255,.3);overflow:hidden;}
  #scanZone{position:absolute;top:0;bottom:0;left:26%;width:26%;background:rgba(125,255,214,.14);border-left:2px dashed rgba(125,255,214,.6);border-right:2px dashed rgba(125,255,214,.6);}
  .item{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:40px;will-change:left;}
  #miniStats{display:flex;gap:22px;margin:14px 0;font-size:14px;}
  #miniStats b{color:#ffd85e;}
  #scanBtn{margin-top:6px;}
  #miniEnd{display:none;text-align:center;}
  #miniEnd h2{color:#5dff9d;}

  /* busted / fail flash */
  #flash{position:absolute;inset:0;z-index:80;background:rgba(184,29,61,0);pointer-events:none;transition:background .3s;}
  #bigMsg{position:absolute;inset:0;z-index:81;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;}
  #bigMsg .t{font-size:34px;font-weight:bold;letter-spacing:3px;color:#ff5d6d;text-shadow:0 4px 18px rgba(0,0,0,.8);}
  #bigMsg .s{font-size:14px;opacity:.85;margin-top:6px;}

  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="topLeft" class="hud">
  <div class="pill" id="cash">$0</div>
  <div class="pill" id="heat">☆☆☆☆☆</div>
</div>
<div id="objWrap" class="hud">
  <div id="obj"><b>Objective</b><br><span class="sub">Open your phone (📱) and apply for a job.</span></div>
</div>
<div id="prompt" class="hud"><span></span></div>
<div id="toast" class="hud"></div>

<!-- touch controls -->
<div id="joy"><div id="joyKnob"></div><div class="lbl">MOVE</div></div>
<div id="btns">
  <div class="srow">
    <div class="abtn small" id="jumpBtn">⤒<small>JUMP</small></div>
    <div class="abtn small" id="sprintBtn">»<small>RUN</small></div>
  </div>
  <div class="abtn" id="utilBtn">📱<small>PHONE</small></div>
  <div class="abtn" id="actBtn">E<small>USE</small></div>
</div>

<!-- phone overlay -->
<div class="overlay" id="phone">
  <div class="ovHead"><h2>📱 PHONE</h2><button class="close" data-close="phone">✕</button></div>
  <div class="ovBody">
    <div class="tabs">
      <div class="tab active" data-tab="jobs">💼 JOBS</div>
      <div class="tab" data-tab="shop">🛒 SHOP</div>
      <div class="tab" data-tab="me">🧍 ME</div>
    </div>
    <div id="tabJobs"></div>
    <div id="tabShop" class="hidden"></div>
    <div id="tabMe" class="hidden"></div>
  </div>
</div>

<!-- cashier minigame -->
<div id="mini">
  <h2>🛒 CASHIER SHIFT</h2>
  <div class="sub">Tap <b>SCAN</b> (or spacebar) when an item is inside the green zone.</div>
  <div id="conv"><div id="scanZone"></div></div>
  <div id="miniStats"><div>Time <b id="mgTime">25</b>s</div><div>Scanned <b id="mgHits">0</b></div><div>Missed <b id="mgMiss">0</b></div></div>
  <div id="miniEnd"></div>
  <button class="btn good" id="scanBtn">SCAN</button>
</div>

<div id="flash"></div>
<div id="bigMsg"><div class="t"></div><div class="s"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   GRIND — Open City (working title) — Slice 1
   Low-poly 3D open-world: on foot + cars, apply for jobs via
   phone, work a cashier shift, shop, crime + heat + cops.
   ============================================================ */

/* ---------- renderer / scene ---------- */
const wrap = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc2e8);
scene.fog = new THREE.Fog(0x9cc2e8, 90, 340);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 900);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xdfeaff, 0x4a5568, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.15);
sun.position.set(80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-160; sc.right=160; sc.top=160; sc.bottom=-160; sc.near=1; sc.far=420;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.28));

/* ---------- helpers ---------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function mesh(geo, col, x,y,z, flat=true){
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:col, roughness:1, metalness:0, flatShading:flat }));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function box(w,h,d,col,x,y,z){ return mesh(new THREE.BoxGeometry(w,h,d), col, x,y,z); }
function makeLabel(text, w=8, h=2.2, bg='#0b2338', fg='#eaf6ff', border='#7dffd6'){
  const c=document.createElement('canvas'); c.width=512; c.height=Math.round(512*h/w);
  const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle=border; g.lineWidth=10; g.strokeRect(8,8,c.width-16,c.height-16);
  g.fillStyle=fg; g.font='bold 74px Trebuchet MS, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, c.width/2, c.height/2, c.width-40);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:true }));
  sp.scale.set(w,h,1); return sp;
}

/* ============================================================
   CITY
   ============================================================ */
const CITY = { half: 112, step: 48, road: 16 };
const GROUND = new THREE.Mesh(new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x2b2f36, roughness:1 }));
GROUND.rotation.x=-Math.PI/2; GROUND.receiveShadow=true; scene.add(GROUND);

const solids = []; // AABBs for collision {minx,maxx,minz,maxz}
function addSolid(cx,cz,w,d){ solids.push({ minx:cx-w/2, maxx:cx+w/2, minz:cz-d/2, maxz:cz+d/2 }); }

/* ---------- shared mesh helpers: vertex-coloured merged geometry ----------
   One merged geometry per rigid part → far fewer draw calls. Used by
   buildings, houses AND people. */
const VCMAT = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.72 });
const _tmpc = new THREE.Color();
function cgeo(geo, hex, pos, scl, rot){
  const q = rot ? new THREE.Quaternion().setFromEuler(rot) : new THREE.Quaternion();
  const m = new THREE.Matrix4().compose(
    pos || new THREE.Vector3(),
    q,
    scl || new THREE.Vector3(1,1,1));
  geo.applyMatrix4(m);
  _tmpc.set(hex);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=_tmpc.r; arr[i*3+1]=_tmpc.g; arr[i*3+2]=_tmpc.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr,3));
  return geo;
}
function part(geos){ return partMat(geos, VCMAT); }
function partMat(geos, mat){
  const merged = mergeGeometries(geos, false);
  for(const g of geos) g.dispose();
  const m = new THREE.Mesh(merged, mat);
  m.castShadow = true;
  return m;
}
function V(x,y,z){ return new THREE.Vector3(x,y,z); }
function caps(r,len){ return new THREE.CapsuleGeometry(r,len,2,8); }
function ball(r,seg=9){ return new THREE.SphereGeometry(r,seg,Math.max(6,Math.round(seg*0.7))); }
function RNG(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
/* triangular-prism gable roof (has uv so it merges cleanly) */
function gableGeo(w,d,h){
  const hw=w/2, hd=d/2;
  const v=[-hw,0,-hd, hw,0,-hd, hw,0,hd, -hw,0,hd, -hw,h,0, hw,h,0];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  g.setIndex([0,1,5, 0,5,4, 3,4,5, 3,5,2, 0,4,3, 1,2,5]);
  g.computeVertexNormals();
  const uv=[]; for(let i=0;i<6;i++) uv.push((v[i*3]+hw)/w, v[i*3+1]/(h||1));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  return g;
}

const PALETTE = [0xd9dde3,0xc4ccd4,0xaeb8c2,0xd8c9b8,0xbfd0c4,0xcdd6df,0xa9c0d6,0xe0d5c4,0xb9c2b0];

/* ---- lit-window facade texture (one canvas, whole grid of windows) ---- */
const _texCache = {};
function litWindowMat(cols,rows,warm){
  const key=cols+'_'+rows+'_'+(warm?1:0);
  if(_texCache[key]) return _texCache[key];
  const c=document.createElement('canvas'); c.width=cols*10; c.height=rows*10;
  const g=c.getContext('2d');
  g.fillStyle='#0c1017'; g.fillRect(0,0,c.width,c.height);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const r=Math.random();
    g.fillStyle = r<0.40 ? (warm?'#ffd79a':'#c2e6ff')
               : r<0.56 ? (warm?'#6d5638':'#3f5a78')
               : '#111620';
    g.fillRect(x*10+2, y*10+2.5, 6, 5);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff,
                                           emissiveIntensity:0.85, roughness:0.85 });
  _texCache[key]=m; return m;
}
/* ---- tower silhouette by style ---- */
function towerTiers(style,w,d,h){
  if(style==='block') return [[w,d,0,h]];
  if(style==='setback'){ const n=h>55?4:3, t=[]; let cw=w,cd=d,z=0;
    for(let i=0;i<n;i++){ const seg=h*(i===0?0.42:0.58/(n-1)); t.push([cw,cd,z,z+seg]); z+=seg; cw*=0.78; cd*=0.78; } return t; }
  if(style==='taper'){ const n=4, t=[]; let cw=w,cd=d,z=0;
    for(let i=0;i<n;i++){ const seg=h/n; t.push([cw,cd,z,z+seg]); z+=seg; cw*=0.82; cd*=0.82; } return t; }
  if(style==='podium'){ const ph=h*0.26; return [[w,d,0,ph],[w*0.58,d*0.62,ph,h]]; }
  return [[w,d,0,h*0.8],[w*0.92,d*1.1,h*0.8,h]];              // slab
}
const ACCENTCOLS=[0x66e0ff,0xffb347,0xff4d8d,0x6dff9e];
function buildTower(cx,cz,w,d,h,style,seed){
  const R=RNG(seed);
  const warm=R()<0.62, acc=ACCENTCOLS[Math.floor(R()*ACCENTCOLS.length)];
  const grp=new THREE.Group(); grp.position.set(cx,0,cz);
  const tiers=towerTiers(style,w,d,h);
  for(const [tw,td,z0,z1] of tiers){
    const th=z1-z0;
    const cols=Math.max(3,Math.round(tw/2.6)), rows=Math.max(2,Math.round(th/3.0));
    const m=new THREE.Mesh(new THREE.BoxGeometry(tw,th,td), litWindowMat(cols,rows,warm));
    m.position.y=(z0+z1)/2+0.35;
    m.castShadow=true; m.receiveShadow=true;
    grp.add(m);
  }
  // glowing accent band at each setback
  for(let i=1;i<tiers.length;i++){
    const tw=tiers[i][0], td=tiers[i][1], z0=tiers[i][2];
    const band=new THREE.Mesh(new THREE.BoxGeometry(tw*1.06,0.45,td*1.06),
      new THREE.MeshStandardMaterial({color:acc,emissive:acc,emissiveIntensity:1.5}));
    band.position.y=z0+0.35; grp.add(band);
  }
  // rooftop plant + mast + beacon
  const [tw,td]=tiers[tiers.length-1]||[w,d];
  const top=h+0.35;
  const roof=new THREE.Mesh(new THREE.BoxGeometry(tw*0.5,1.6,td*0.5),
    new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:1}));
  roof.position.y=top+0.8; grp.add(roof);
  if(R()<0.65){
    const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,10,6),
      new THREE.MeshStandardMaterial({color:0x8a929c,metalness:0.6,roughness:0.4}));
    mast.position.y=top+6; grp.add(mast);
    const beacon=new THREE.Mesh(new THREE.SphereGeometry(0.42,8,6),
      new THREE.MeshStandardMaterial({color:0xff3333,emissive:0xff2222,emissiveIntensity:2.2}));
    beacon.position.y=top+11; grp.add(beacon);
  }
  scene.add(grp); addSolid(cx,cz,w,d);
}
/* ---- suburban house (merged to ~2 meshes each) ---- */
const WINMAT_BAY = new THREE.MeshStandardMaterial({color:0xfff0c8,emissive:0xffd9a0,emissiveIntensity:1.3});
const WALLCOLS=[0xd8cfc0,0xa8bacd,0xc09a86,0xa8b89a,0xe0dcd2,0xc08f8f,0x9aa2ab];
const ROOFCOLS=[0x3a3f47,0x6b3a2a,0x2f4a4e,0x4a4a52,0x7a4a3a,0x54585f];
function buildHouse(cx,cz,rot,seed){
  const R=RNG(seed);
  const wall=WALLCOLS[Math.floor(R()*WALLCOLS.length)];
  const roof=ROOFCOLS[Math.floor(R()*ROOFCOLS.length)];
  const w=8.2+R()*2.4, d=7.2+R()*1.6, h=2.8+R()*0.8;
  const geos=[], wins=[];
  geos.push(cgeo(new THREE.BoxGeometry(15,0.16,15), 0x3c6b34, V(0,0.08,0.6)));              // lawn
  geos.push(cgeo(new THREE.BoxGeometry(3.4,0.22,6.5), 0x8f8b84, V(w/2+1.4,0.12,-6.6)));    // driveway
  geos.push(cgeo(new THREE.BoxGeometry(w,h,d), wall, V(0,h/2+0.3,0)));                      // body
  geos.push(cgeo(gableGeo(w+0.9,d+0.9,d*0.38), roof, V(0,h+0.3,0)));                        // roof
  const gw=3.9, gd=4.8, gh=h*0.82;
  geos.push(cgeo(new THREE.BoxGeometry(gw,gh,gd), wall, V(w/2+1.3, gh/2+0.3, -d/2+gd/2-0.2)));   // garage
  geos.push(cgeo(gableGeo(gw+0.5,gd+0.5,gd*0.3), roof, V(w/2+1.3, gh+0.3, -d/2+gd/2-0.2)));      // garage roof
  geos.push(cgeo(new THREE.BoxGeometry(gw-0.6, gh*0.62, 0.16), 0x6b5a48, V(w/2+1.3, gh*0.42, -d/2-0.29)));
  geos.push(cgeo(new THREE.BoxGeometry(1.1,2.1,0.16), 0x5a3d2a, V(-w/2+2.0,1.4,-d/2-0.09)));// door
  geos.push(cgeo(new THREE.BoxGeometry(3.2,0.18,1.8), roof, V(-w/2+2.0,2.62,-d/2-1.0)));    // porch roof
  geos.push(cgeo(new THREE.BoxGeometry(0.14,2.3,0.14), 0xd8d4cc, V(-w/2+3.4,1.45,-d/2-1.7)));
  geos.push(cgeo(new THREE.BoxGeometry(0.14,2.3,0.14), 0xd8d4cc, V(-w/2+0.6,1.45,-d/2-1.7)));
  const fw=14.2, n=11;
  for(let i=0;i<n;i++){ const px=-fw/2+i*(fw/(n-1));
    geos.push(cgeo(new THREE.BoxGeometry(0.11,1.05,0.11), 0xbca87e, V(px,0.72,-7.3))); }
  geos.push(cgeo(new THREE.BoxGeometry(fw,0.12,0.09), 0xbca87e, V(0,1.12,-7.3)));
  geos.push(cgeo(new THREE.BoxGeometry(fw,0.12,0.09), 0xbca87e, V(0,0.6,-7.3)));
  if(R()<0.75){                                                                             // tree
    geos.push(cgeo(new THREE.CylinderGeometry(0.16,0.2,2.4,6), 0x5a4630, V(-w/2-1.7,1.2,-3)));
    geos.push(cgeo(ball(1.35,8), 0x3f7a3a, V(-w/2-1.7,3.0,-3), V(1,0.85,1)));
  }
  const wc=Math.max(2,Math.round(w/3.0));                                                    // lit front windows
  for(let i=0;i<wc;i++){
    const wx=-w/2+(i+0.5)*(w/wc);
    wins.push(cgeo(new THREE.BoxGeometry(1.05,1.0,0.14), 0xffffff, V(wx,1.78,-d/2-0.08)));
  }
  const g=new THREE.Group(); g.position.set(cx,0,cz); g.rotation.y=rot*Math.PI/180;
  g.add(part(geos));
  if(wins.length){ const wm=new THREE.Mesh(mergeGeometries(wins,false), WINMAT_BAY);
    for(const x of wins) x.dispose(); wm.castShadow=false; g.add(wm); }
  scene.add(g);
  addSolid(cx,cz,11,10);
}
function buildCity(){
  const special = {
    '-1,-1':'store', '1,1':'shop', '-1,1':'police', '1,-1':'bank', '0,0':'tower'
  };
  const blockSize = CITY.step - CITY.road; // 32
  const styles=['setback','taper','podium','slab','block'];
  let seed=1000;
  for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
    const cx=i*CITY.step, cz=j*CITY.step, key=i+','+j;
    const slab=box(blockSize,0.35,blockSize, key==='0,0'?0x9aa3ad:0x8f97a0, cx,0.17,cz); scene.add(slab);
    const kind=special[key];
    if(kind){ buildSpecial(kind,cx,cz); continue; }
    const outer = (Math.abs(i)===2 || Math.abs(j)===2);
    if(outer){
      // ---- suburban ring: houses with lawns + fences ----
      buildHouse(cx-8.6, cz-8.6, 0, seed++);
      buildHouse(cx+8.2, cz-8.2, 0, seed++);
      buildHouse(cx+0.4, cz+8.6, 180, seed++);
    } else {
      // ---- downtown core: 1-2 varied towers ----
      if(Math.random()<0.45){
        buildTower(cx-7.5, cz-7.5, 12, 12, 22+Math.random()*34, 'taper', seed++);
        buildTower(cx+7.5, cz+7.5, 12, 12, 18+Math.random()*30, 'block', seed++);
      } else {
        const w=17+Math.random()*6, d=15+Math.random()*6, h=26+Math.random()*48;
        buildTower(cx, cz, w, d, h, styles[Math.floor(Math.random()*styles.length)], seed++);
      }
    }
  }
}
function buildSpecial(kind, cx, cz){
  const spec = {
    store:{ w:16, d:14, h:6,  warm:true,  acc:0xffd9a0, sign:'CORNER STORE',  signCol:'#3a2400', fg:'#7a4a00' },

    bank:{  w:18, d:16, h:12, warm:true,  acc:0xf0e2b8, sign:'BANK',          signCol:'#31260a', fg:'#ffd85e' },
    tower:{ w:20, d:20, h:52, warm:false, acc:0xcfe0ff, sign:'MEGA TOWER',    signCol:'#0b2338', fg:'#eaf6ff' }
  }[kind];
  const grp=new THREE.Group(); grp.position.set(cx,0,cz);

  const body=new THREE.Mesh(new THREE.BoxGeometry(spec.w,spec.h,spec.d), litWindowMat(cols,rows,spec.warm));
  body.position.y=spec.h/2+0.35; body.castShadow=true; body.receiveShadow=true; grp.add(body);
  const base=new THREE.Mesh(new THREE.BoxGeometry(spec.w*1.05,1.0,spec.d*1.05),
    new THREE.MeshStandardMaterial({color:spec.acc,emissive:spec.acc,emissiveIntensity:0.85}));
  base.position.y=0.85; grp.add(base);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(spec.w*1.03,0.7,spec.d*1.03),
    new THREE.MeshStandardMaterial({color:0x39404a,roughness:1}));
  roof.position.y=spec.h+0.7; grp.add(roof);

  lbl.position.set(cx, spec.h*0.62, cz + spec.d/2 + 0.6); scene.add(lbl);

const player = { pos:new THREE.Vector3(24,0,40), yaw:0, vel:new THREE.Vector3(), onFoot:true, group:null, speed:0, phase:0 };
/* ---------- shared low-poly humanoid ----------
   Limbs are parented to pivot Groups at the hip/shoulder so they swing naturally. */
/* ---------- smooth humanoid (capsules + spheres, NOT boxes) ----------
   Rounded bodies so people read as real humans, not Minecraft blocks.
   Body merges to ONE vertex-coloured geometry → 5 meshes/ped (body + 2 legs
   + 2 arms), FEWER draw calls than the old boxy version. Limbs stay parented
   to hip/shoulder pivots so the walk cycle still works.
   (cgeo/part/caps/ball/V live in the shared mesh-helpers block above.) */
function buildHumanoid({shirt=0xe3644f, pants=0x2b3a55, skin=0xe9b98c, hair=0x2a201a,
                        cap=null, hands=true, scale=1, longHair=false, shoe=0x1c1f26, capcol=null}={}){
  const g=new THREE.Group();
  const capCol = capcol || cap;
  // ---------- body (static: torso, pelvis, shoulders, neck, head, hair) ----------
  const body=[];
  body.push(cgeo(caps(0.30,0.60), shirt, V(0,1.42,0), V(1.06,1,0.80)));  // torso
  body.push(cgeo(ball(0.30), pants, V(0,0.99,0), V(1.12,0.62,0.86)));     // pelvis (bridges waist)
  body.push(cgeo(ball(0.16), shirt, V(-0.30,1.70,0), V(1,1,0.86)));        // shoulder L
  body.push(cgeo(ball(0.16), shirt, V( 0.30,1.70,0), V(1,1,0.86)));        // shoulder R
  body.push(cgeo(caps(0.105,0.10), skin, V(0,2.00,0)));                   // neck
  body.push(cgeo(ball(0.235,11), skin, V(0,2.24,0), V(1,1.12,1)));        // head
  body.push(cgeo(ball(0.248,11), capCol||hair, V(0,2.30,0.015), V(1,0.98,1)));
  if(longHair) body.push(cgeo(ball(0.20,10), hair, V(0,2.06,0.13), V(1.05,1.25,1)));
  if(capCol)   body.push(cgeo(ball(0.20,10), capCol, V(0,2.38,-0.14), V(1,0.35,1.3))); // cap brim
  body.push(cgeo(ball(0.032,8), 0x141414, V(-0.085,2.27,-0.212), V(1,1.15,0.7)));  // eye L
  body.push(cgeo(ball(0.032,8), 0x141414, V( 0.085,2.27,-0.212), V(1,1.15,0.7)));  // eye R
  g.add(part(body));
  // ---------- legs ----------
  function leg(sx){
    const p=new THREE.Group(); p.position.set(sx*0.17,0.95,0);
    p.add(part([ cgeo(caps(0.150,0.55), pants, V(0,-0.45,0)),
                 cgeo(ball(0.16), shoe, V(0,-0.86,-0.07), V(1,0.5,1.5)) ]));
    return p;
  }
  // ---------- arms ----------
  function arm(sx){
    const p=new THREE.Group(); p.position.set(sx*0.345,1.80,0);
    const parts=[ cgeo(caps(0.122,0.46), shirt, V(0,-0.30,0)) ];
    if(hands) parts.push(cgeo(ball(0.135,10), skin, V(0,-0.60,0.01), V(1,0.9,0.75)));
    p.add(part(parts));
    return p;
  }
  const legL=leg(-1), legR=leg(1), armL=arm(-1), armR=arm(1);
  g.add(legL,legR,armL,armR);
  g.userData.limbs={legL,legR,armL,armR};
  if(scale!==1) g.scale.setScalar(scale);
  return g;
}
function animateWalk(g, phase, amt){
  const L=g.userData.limbs; if(!L) return;
  const sw=Math.sin(phase)*0.62*amt;
  L.legL.rotation.x=sw;        L.legR.rotation.x=-sw;
  L.armL.rotation.x=-sw*0.85;  L.armR.rotation.x=sw*0.85;
}
function buildPlayer(){
  const g=buildHumanoid({ shirt:0xe3644f, pants:0x2b3a55, hands:true });
  scene.add(g); return g;
}

/* box with a shrunken top face → tapered body / cabin */
function frustumGeo(wb,db,wt,dt,h){
  const a=wb/2,b=db/2,c=wt/2,d=dt/2;
  const v=[-a,0,-b, a,0,-b, a,0,b, -a,0,b, -c,h,-d, c,h,-d, c,h,d, -c,h,d];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setIndex([0,1,2,0,2,3, 4,6,5,4,7,6, 0,4,5,0,5,1, 1,5,6,1,6,2, 2,6,7,2,7,3, 3,7,4,3,4,0]);
  g.computeVertexNormals();
  const uv=[]; for(let i=0;i<8;i++) uv.push(0,0);
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return g;
}
function buildCar(type, col, x, z, yaw=0){
  const T=CAR_TYPES[type]||CAR_TYPES.sedan;
  if(type==='taxi') col=0xf2c23a;
  const paint=[], trim=[];
  const bottom=0.32, top=bottom+T.bh;
  // lower body (tapered toward the roof line)
  paint.push(cgeo(frustumGeo(T.wid,T.len,T.wid*0.92,T.len*0.86,T.bh), col, V(0,bottom,0)));
  // greenhouse (dark tinted glass)
  const cw=T.boxy?T.wid*0.98:T.wid*0.88;
  trim.push(cgeo(frustumGeo(cw,T.cl,cw*0.72,T.cl*0.66,T.ch), 0x0c141d, V(0,top,T.co)));
  // roof cap (painted)
  paint.push(cgeo(frustumGeo(cw*0.72,T.cl*0.72,cw*0.66,T.cl*0.64,0.09), col, V(0,top+T.ch,T.co)));
  // bumpers + skirts
  trim.push(cgeo(new THREE.BoxGeometry(T.wid*0.97,0.2,0.22), 0x161c24, V(0,bottom+0.06, T.len/2-0.06)));
  trim.push(cgeo(new THREE.BoxGeometry(T.wid*0.97,0.2,0.22), 0x161c24, V(0,bottom+0.06,-T.len/2+0.06)));
  trim.push(cgeo(new THREE.BoxGeometry(T.wid*1.005,0.14,T.len*0.7), 0x11161d, V(0,bottom-0.06,0)));
  // wheels
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    trim.push(cgeo(new THREE.CylinderGeometry(T.wr,T.wr,0.26,12), 0x0e1216,
      V(sx*(T.wid/2-0.01), T.wr, sz*(T.len*0.32)), V(1,1,1), new THREE.Euler(0,0,Math.PI/2)));
    trim.push(cgeo(new THREE.CylinderGeometry(T.wr*0.5,T.wr*0.5,0.28,8), 0x8f97a2,
      V(sx*(T.wid/2-0.01), T.wr, sz*(T.len*0.32)), V(1,1,1), new THREE.Euler(0,0,Math.PI/2)));
  }
  if(T.spoiler) paint.push(cgeo(new THREE.BoxGeometry(T.wid*0.8,0.07,0.32), col, V(0,top+0.12,-T.len/2+0.2)));
  if(T.bed) paint.push(cgeo(new THREE.BoxGeometry(T.wid*0.9,0.5,1.5), col, V(0,bottom+T.bh*0.6,-T.len/2+0.9)));
  const g=new THREE.Group();
  g.add(partMat(paint,CARPAINTMAT));
  g.add(partMat(trim,CARTRIMAT));
  // lights
  const hy=bottom+0.3;
  g.add(new THREE.Mesh(mergeGeometries([
    cgeo(new THREE.BoxGeometry(0.36,0.15,0.09), 0xffffff, V(-T.wid*0.33,hy,T.len/2-0.02)),
    cgeo(new THREE.BoxGeometry(0.36,0.15,0.09), 0xffffff, V( T.wid*0.33,hy,T.len/2-0.02))],false),
    new THREE.MeshStandardMaterial({color:0xfff6d2,emissive:0xfff0b4,emissiveIntensity:1.3})));
  g.add(new THREE.Mesh(mergeGeometries([
    cgeo(new THREE.BoxGeometry(0.32,0.14,0.08), 0xffffff, V(-T.wid*0.33,hy,-T.len/2+0.01)),
    cgeo(new THREE.BoxGeometry(0.32,0.14,0.08), 0xffffff, V( T.wid*0.33,hy,-T.len/2+0.01))],false),
    new THREE.MeshStandardMaterial({color:0xff3a2a,emissive:0xff2010,emissiveIntensity:1.1})));
  if(T.taxi){
    const sign=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.22,0.34),
      new THREE.MeshStandardMaterial({color:0xfff2b0,emissive:0xffd873,emissiveIntensity:1.2}));
    sign.position.set(0,top+T.ch+0.2,T.co);
    g.add(sign);
  }
  g.traverse(o=>{o.castShadow=true;});
  g.position.set(x,0,z); g.rotation.y=yaw;
  scene.add(g);
  return { group:g, pos:new THREE.Vector3(x,0,z), yaw, speed:0, isPlayer:false, len:T.len, wid:T.wid };
}

   ============================================================ */
/* road CENTRE-lines = the GAPS between 32-wide blocks centred on multiples of 48 → ±24, ±72 */
const ROAD=[-72,-24,24,72];
const HALF_ROAD=8;                 // road half-width (blocks are 32 wide, gaps are 16)

/* ============================================================
   TRAFFIC LIGHTS + CROSSWALKS
   ============================================================ */
const LIGHT_PERIOD=13;             // seconds for a full cycle
const INTERSECTIONS=[];            // {x,z,off,zLamps,xLamps}
const INTER_MAP=new Map();         // "x,z" -> intersection
const CROSSWALKS=[];               // {x0,x1,z0,z1,axis}

const SIG={
  r_on:new THREE.MeshStandardMaterial({color:0xff3344,emissive:0xff3344,emissiveIntensity:1.4}),
  r_off:new THREE.MeshStandardMaterial({color:0x361317,emissive:0x180a0c,emissiveIntensity:0.15}),
  a_on:new THREE.MeshStandardMaterial({color:0xffc23d,emissive:0xffc23d,emissiveIntensity:1.4}),
  a_off:new THREE.MeshStandardMaterial({color:0x362c10,emissive:0x181306,emissiveIntensity:0.15}),
  g_on:new THREE.MeshStandardMaterial({color:0x3dff8a,emissive:0x3dff8a,emissiveIntensity:1.4}),
  g_off:new THREE.MeshStandardMaterial({color:0x0e3620,emissive:0x06180e,emissiveIntensity:0.15}),
};
function buildSignal(x,z,rot){
  const g=new THREE.Group();
  g.add(box(0.28,5,0.28,0x2a2f36,0,2.5,0));
  g.add(box(0.52,1.55,0.5,0x14181d,0,5.62,0));
  const lamps=[];
  for(let i=0;i<3;i++){ const l=box(0.34,0.32,0.34,0x000000,0,6.12-i*0.46,0.2); g.add(l); lamps.push(l); }
  g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
  return { r:lamps[0], a:lamps[1], g:lamps[2] };
}
function stripeTexture(vertical){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const g=c.getContext('2d'); g.clearRect(0,0,256,64);
  g.fillStyle='rgba(238,243,248,0.92)';
  const n=9;
  if(vertical){ const w=256/n; for(let i=0;i<n;i+=2) g.fillRect(i*w+w*0.18,0,w*0.64,64); }
  else{ const h=64/n; for(let i=0;i<n;i+=2) g.fillRect(0,i*h+h*0.18,256,h*0.64); }
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function buildRoadFurniture(){
  const texV=stripeTexture(true), texH=stripeTexture(false);
  // shared geometries + materials (keep draw overhead low: 64 crosswalks, 2 of each)
  const geoH=new THREE.PlaneGeometry(16,4), geoV=new THREE.PlaneGeometry(4,16);
  const matH=new THREE.MeshBasicMaterial({map:texV, transparent:true, depthWrite:false});
  const matV=new THREE.MeshBasicMaterial({map:texH, transparent:true, depthWrite:false});
  // axis 'x' = a crosswalk ACROSS a north-south road (spans x, thin in z)
  // axis 'z' = a crosswalk ACROSS an east-west road  (spans z, thin in x)
  const mkCross=(cx,cz,axis)=>{
    const horiz = axis==='x';
    const m=new THREE.Mesh(horiz?geoH:geoV, horiz?matH:matV);
    m.rotation.x=-Math.PI/2; m.position.set(cx,0.06,cz); m.renderOrder=1; scene.add(m);
    if(horiz) CROSSWALKS.push({x0:cx-8,x1:cx+8,z0:cz-2,z1:cz+2,axis:'x',cx,cz});
    else      CROSSWALKS.push({x0:cx-2,x1:cx+2,z0:cz-8,z1:cz+8,axis:'z',cx,cz});
  };
  for(const rx of ROAD) for(const rz of ROAD){
    // crosswalks on the four approaches
    mkCross(rx, rz-11, 'x');
    mkCross(rx, rz+11, 'x');
    mkCross(rx-11, rz, 'z');
    mkCross(rx+11, rz, 'z');
    // traffic lights: one pole shows the Z-road signal, the other the X-road signal
    const off = ((rx*3 + rz*7) % LIGHT_PERIOD + LIGHT_PERIOD) % LIGHT_PERIOD;
    const it = { x:rx, z:rz, off, zLamps:buildSignal(rx-8.7, rz-8.7, 0), xLamps:buildSignal(rx+8.7, rz+8.7, Math.PI/2) };
    INTERSECTIONS.push(it); INTER_MAP.set(rx+','+rz, it);
  }
}
buildRoadFurniture();
function lightState(it, t){
  const ph=(((t + it.off) % LIGHT_PERIOD) + LIGHT_PERIOD) % LIGHT_PERIOD;
  let z='red', x='red';
  if(ph<5) z='green'; else if(ph<6) z='amber';
  else if(ph<11) x='green'; else if(ph<12) x='amber';
  return { z, x };                      // ph 12..13 = all-red gap
}
function setSignal(lamps, state){
  lamps.r.material = state==='red'  ? SIG.r_on : SIG.r_off;
  lamps.a.material = state==='amber'? SIG.a_on : SIG.a_off;
  lamps.g.material = state==='green'? SIG.g_on : SIG.g_off;
}
function updateLights(t){
  for(const it of INTERSECTIONS){
    const st=lightState(it,t);
    setSignal(it.zLamps, st.z); setSignal(it.xLamps, st.x);
  }
}
const TRAFFIC=[];
function nextRoadAhead(v,dir){
  if(dir>0){ for(const r of ROAD) if(r>v+0.5) return r; return null; }
  for(let i=ROAD.length-1;i>=0;i--) if(ROAD[i]<v-0.5) return ROAD[i];
  return null;
}
function spawnTraffic(n){
  for(let k=0;k<n;k++){
    const alongZ=Math.random()<0.5;
    const dir=Math.random()<0.5?1:-1;
    const line=ROAD[Math.floor(Math.random()*ROAD.length)];
    const col=CARCOLS[Math.floor(Math.random()*CARCOLS.length)];
    const ttype=CARKEYS[Math.floor(Math.random()*CARKEYS.length)];
    const car=buildCar(ttype,col,0,0,0);
    const start=ROAD[Math.floor(Math.random()*ROAD.length)]+rnd(-30,30);
    const t={ car, alongZ, dir, line, base:rnd(7,13), speed:rnd(6,11), axial:start, next:null };
    t.next=nextRoadAhead(start,dir);
    if(t.next===null){ t.axial = dir>0? ROAD[0]-3 : ROAD[ROAD.length-1]+3; t.next=nextRoadAhead(t.axial,dir); }
    placeTraffic(t);
    TRAFFIC.push(t);
  }
}
function placeTraffic(t){
  const c=t.car;
  c.moving = true;
  if(t.alongZ){ c.pos.set(t.line + 4.6*t.dir, 0, t.axial); c.yaw = t.dir>0?0:Math.PI; }
  else { c.pos.set(t.axial, 0, t.line - 4.6*t.dir); c.yaw = t.dir>0?Math.PI/2:-Math.PI/2; }
  // keep traffic cars from clipping through buildings (shouldn't happen on-lane, but safety)
  const [rx,rz]=resolveXZ(c.pos.x,c.pos.z,1.6); c.pos.x=rx; c.pos.z=rz;
  c.group.position.copy(c.pos); c.group.rotation.y=c.yaw;
}
function updateTraffic(dt, t){
  const p=player.pos;
  for(const t2 of TRAFFIC){
    if(t2.stolen) continue;
    const c=t2.car;
    // ease speed; pause if the player on foot is directly in front
    let target=t2.base;
    if(player.onFoot){
      const dx=p.x-c.pos.x, dz=p.z-c.pos.z, d=Math.hypot(dx,dz);
      if(d<10){ const fx=Math.sin(c.yaw), fz=Math.cos(c.yaw); if((dx*fx+dz*fz)/(d||1) > 0.55) target=0; }
    }
    // obey the traffic lights on the intersection ahead
    if(t2.next!==null){
      const inter = INTER_MAP.get(t2.alongZ ? (t2.line+','+t2.next) : (t2.next+','+t2.line));
      if(inter){
        const st=lightState(inter, t);
        const sig = t2.alongZ ? st.z : st.x;
        const dist=(t2.next - t2.axial)*t2.dir;      // >0 = still approaching
        if(dist>0 && dist<9 && (sig==='red' || (sig==='amber' && dist<4))) target=0;
      }
    }
    t2.speed += (target-t2.speed)*Math.min(1,4*dt);
    // keep a gap: don't rear-end the car ahead in the same lane
    let gap=Infinity;
    for(const o of TRAFFIC){
      if(o===t2 || o.stolen || o.alongZ!==t2.alongZ || o.line!==t2.line || o.dir!==t2.dir) continue;
      const d=(o.axial - t2.axial)*t2.dir;
      if(d>0 && d<gap) gap=d;
    }
    if(gap<10) t2.speed = Math.min(t2.speed, Math.max(0,(gap-4.6)*1.7));
    c.moving = t2.speed>1.5;
    t2.axial += t2.dir*t2.speed*dt;
    if(t2.next!==null){
      const crossed = t2.dir>0 ? t2.axial>=t2.next-0.01 : t2.axial<=t2.next+0.01;
      if(crossed){
        t2.axial = t2.next;                        // snap onto the intersection
        const inter = t2.next, oldLine = t2.line;
        if(Math.random()<0.45){                  // maybe turn onto the crossing road
          const nAlongZ=!t2.alongZ, nLine=inter, nDir=Math.random()<0.5?1:-1, nAxial=oldLine;
          // only turn if that lane slot is clear — never teleport on top of another car
          if(laneClear(nAlongZ,nLine,nDir,nAxial,t2)){
            t2.alongZ=nAlongZ; t2.line=nLine; t2.dir=nDir; t2.axial=nAxial;
          }
        }
        t2.next = nextRoadAhead(t2.axial, t2.dir);
        if(t2.next===null){ t2.axial = t2.dir>0? ROAD[0]-3 : ROAD[ROAD.length-1]+3; t2.next=nextRoadAhead(t2.axial,t2.dir); }
      }
    }
    placeTraffic(t2);
  }
  separateTraffic();
}
/* is a spot in a given lane clear of other cars? */
function laneClear(alongZ,line,dir,axial,self){
  const minSep=6.5;
  for(const o of TRAFFIC){
    if(o===self || o.stolen) continue;
    if(o.alongZ!==alongZ || o.line!==line || o.dir!==dir) continue;
    if(Math.abs(o.axial-axial)<minSep) return false;
  }
  return true;
}
/* hard separation: no two same-lane cars may overlap. Push followers back. */
function separateTraffic(){
  const lanes={};
  for(const t of TRAFFIC){
    if(t.stolen) continue;
    const k=t.alongZ+'|'+t.line+'|'+t.dir;
    (lanes[k]=lanes[k]||[]).push(t);
  }
  for(const k in lanes){
    const arr=lanes[k];
    const dir=arr[0].dir;
    // order front→back so we can place each follower behind the one ahead
    arr.sort((a,b)=> dir>0 ? b.axial-a.axial : a.axial-b.axial);
    for(let i=1;i<arr.length;i++){
      const lead=arr[i-1], foll=arr[i];
      const minSep=(lead.car.len+foll.car.len)/2 + 1.2;   // 1.2m bumper gap
      const gap=(lead.axial-foll.axial)*dir;
      if(gap<minSep) foll.axial = lead.axial - dir*minSep;
    }
  }
}

function buildPed(x,z){

                          longHair:Math.random()<0.35,
                          scale:(kid?rnd(0.66,0.76):rnd(0.90,1.02)) });
  scene.add(g);
  const ped={ group:g, pos:new THREE.Vector3(x,0,z), yaw:rnd(0,6.28), t:0, target:new THREE.Vector3(x,0,z), speed:rnd(1.6,2.9), phase:rnd(0,6.28) };
  return ped;
}
function insideSolid(x,z,pad){
  for(const s of solids){
    if(x>s.minx-pad && x<s.maxx+pad && z>s.minz-pad && z<s.maxz+pad) return true;
  }
  return false;
}
function onRoad(x,z){
  for(const r of ROAD){ if(Math.abs(x-r)<HALF_ROAD) return true; if(Math.abs(z-r)<HALF_ROAD) return true; }
  return false;
}
function inCrosswalk(x,z){
  for(const c of CROSSWALKS){ if(x>c.x0 && x<c.x1 && z>c.z0 && z<c.z1) return true; }
  return false;
}
function walkable(x,z){
  if(insideSolid(x,z,0.6)) return false;
  if(onRoad(x,z) && !inCrosswalk(x,z)) return false;   // sidewalks + crossings only
  return true;
}
function freeSpot(){
  for(let k=0;k<80;k++){
    const x=rnd(-CITY.half+8, CITY.half-8), z=rnd(-CITY.half+8, CITY.half-8);
    if(walkable(x,z)) return {x,z};
  }
  return {x:24,z:24};
}
function spawnPeds(n){
  for(let k=0;k<n;k++){
    const s=freeSpot();
    peds.push(buildPed(s.x,s.z));
  }
}
spawnPeds(72);
function pickPedTarget(p){
  // prefer a nearby walkable spot (sidewalk / crossing) so they don't wander into traffic
  for(let k=0;k<14;k++){
    const x=clamp(p.pos.x+rnd(-16,16),-CITY.half+6,CITY.half-6);
    const z=clamp(p.pos.z+rnd(-16,16),-CITY.half+6,CITY.half-6);
    if(walkable(x,z)){ p.target.set(x,0,z); return; }
  }
  // fallback: a short hop in any walkable direction, else stay put
  for(let a=0;a<14;a++){
    const ang=rnd(0,6.28);
    const x=clamp(p.pos.x+Math.cos(ang)*7,-CITY.half+6,CITY.half-6);
    const z=clamp(p.pos.z+Math.sin(ang)*7,-CITY.half+6,CITY.half-6);
    if(walkable(x,z)){ p.target.set(x,0,z); return; }
  }
  p.target.copy(p.pos);
}

});

  const dx=e.clientX-look.lastX, dy=e.clientY-look.lastY;
  look.lastX=e.clientX; look.lastY=e.clientY; look.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw -= dx*0.005;
  cam.pitch = clamp(cam.pitch + dy*0.004, 0.06, 1.15);
});

let promptEl = document.querySelector('#prompt span');
let nearTarget=null;
function distToRect(px,pz,pl){
  const dx=Math.max(pl.x-pl.w/2 - px, 0, px-(pl.x+pl.w/2));
  const dz=Math.max(pl.z-pl.d/2 - pz, 0, pz-(pl.z+pl.d/2));
  return Math.hypot(dx,dz);
}
function nearestTarget(){
  const p=player.pos;
  let best=null, bd=3.4;
  // cars (enter) — only on foot
  if(player.onFoot){
    for(const c of cars){ const d=Math.hypot(c.pos.x-p.x,c.pos.z-p.z); if(d<bd){ bd=d; best={type:'car',car:c}; } }
    for(const t of TRAFFIC){ if(t.stolen) continue; const c=t.car; const d=Math.hypot(c.pos.x-p.x,c.pos.z-p.z); if(d<bd){ bd=d; best={type:'car',car:c}; } }
    // buildings — measured from the wall edge, not the centre
    for(const [k,pl] of Object.entries(PLACES)){
      const d=distToRect(p.x,p.z,pl);
      if(d<3.0 && d<bd){ bd=d; best={type:'place', place:k}; }
    }
    for(const ped of peds){ const d=Math.hypot(ped.pos.x-p.x,ped.pos.z-p.z); if(d<1.9 && d<bd){ bd=d; best={type:'ped',ped}; } }
  } else {
    best={ type:'exit' };
  }
  return best;
}

/* traffic cars can be carjacked too (stealing a moving car = GTA vibes) */

function doAction(){
  if(MG.active){ scanTap(); return; }
  if(!nearTarget) return;
  const t=nearTarget;
  if(t.type==='car'){ enterCar(t.car); }
  else if(t.type==='exit'){ exitCar(); }
  else if(t.type==='ped'){ mug(t.ped); }
  else if(t.type==='place'){ usePlace(t.place); }
}

  if(k==='store'||k==='tower'){
    const job = S.activeJob && JOBS.find(j=>j.id===S.activeJob.id);
    if(job && job.place===k){ startShift(job); }
    else if(k==='store'){ toast('You could apply here — open your phone 📱'); }
    else toast('MEGA TOWER — office jobs live here. Apply on your phone.');
  } else if(k==='shop'){ openPhone('shop'); }
  else if(k==='bank'){ toast('BANK — a job for later… or a target. 🔒'); }
  else if(k==='police'){ toast('POLICE STATION — apply on your phone to join.'); }
}

}

  document.getElementById('miniStats').style.display='none';
  setTimeout(()=>{ document.getElementById('mini').classList.remove('show'); MG.active=false; }, 2200);
}
document.getElementById('scanBtn').addEventListener('click',scanTap);

/* ============================================================
   PHONE UI
   ============================================================ */
const phoneEl=document.getElementById('phone');
function openPhone(tab){
  phoneEl.classList.add('show'); renderPhone();
  if(tab) selectTab(tab);
}
function togglePhone(){ phoneEl.classList.contains('show')?phoneEl.classList.remove('show'):openPhone('jobs'); }
document.getElementById('utilBtn').addEventListener('click',()=>togglePhone());
document.getElementById('actBtn').addEventListener('click',doAction);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>phoneEl.classList.remove('show')));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>selectTab(t.dataset.tab)));
function selectTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('tabJobs').classList.toggle('hidden',name!=='jobs');
  document.getElementById('tabShop').classList.toggle('hidden',name!=='shop');
  document.getElementById('tabMe').classList.toggle('hidden',name!=='me');
}
function renderPhone(){
  // JOBS
  const j=document.getElementById('tabJobs');
  j.innerHTML = JOBS.map(job=>{
    const active = S.activeJob && S.activeJob.id===job.id;
    let can=true, why=job.req;
    if(job.id==='police' && (S.arrested||S.heat>0)) { can=false; why='Needs a clean record'; }
    if(job.id==='banker' && !S.hasSuit){ can=false; why='Needs a suit (buy in Shop)'; }
    if(job.id==='courier' && !S.ownedCar && !S.car){ can=false; why='Needs your own vehicle'; }
    return `<div class="card"><h3>${job.name}${active?'<span class="badge">ACTIVE</span>':''}</h3>
      <div class="meta">📍 ${placeName(job.place)} · ${job.pay}</div>
      <div class="meta req">Requirement: ${why}</div>
      <div class="row"><span></span><button class="btn ${can?'':'bad'}" data-job="${job.id}" ${can?'':'disabled'}>${can?(active?'APPLIED ✓':'APPLY'):'LOCKED'}</button></div></div>`;
  }).join('');
  j.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>applyJob(b.dataset.job)));
  // SHOP
  const s=document.getElementById('tabShop');
  s.innerHTML = `<div class="card"><h3>🛒 Goods Store</h3><div class="meta">Spend that money.</div></div>` + SHOP.map(it=>{
    const owned = (it.id==='suit'&&S.hasSuit)||((it.id==='sedan'||it.id==='scooter')&&S.ownedCar);
    return `<div class="card"><h3>${it.name}</h3><div class="meta">${it.desc}</div>
      <div class="row"><span class="pay">$${it.price}</span>
      <button class="btn ${owned?'good':''}" data-buy="${it.id}" ${owned?'disabled':''}>${owned?'OWNED ✓':'BUY'}</button></div></div>`;
  }).join('');
  s.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
  // ME
  const m=document.getElementById('tabMe');
  m.innerHTML = `<div class="card"><h3>🧍 You</h3>
    <div class="meta">💵 Cash: <b style="color:#5dff9d">$${S.cash}</b></div>
    <div class="meta">😇 Legit rep: <b>${Math.round(S.legit)}</b></div>
    <div class="meta">😈 Underworld rep: <b>${Math.round(S.under)}</b></div>
    <div class="meta">🚨 Record: <b>${S.arrested?'Arrested before':'Clean'}</b></div>
    <div class="meta">🚗 Vehicle: <b>${S.ownedCar?'Owned':'None'}</b></div></div>`;
}
function placeName(k){ return {store:'Corner Store',shop:'Goods Store',bank:'Bank',police:'Police Station',tower:'Mega Tower'}[k]||k; }
function applyJob(id){
  const job=JOBS.find(x=>x.id===id); if(!job) return;
  S.activeJob={ id:job.id, name:job.name, place:job.place };
  toast('✅ Hired: '+job.name+' — go to '+placeName(job.place));
  updateObjective();
  renderPhone();
}
function buy(id){
  const it=SHOP.find(x=>x.id===id); if(!it) return;
  if(S.cash<it.price){ toast('❌ Not enough cash'); return; }
  S.cash-=it.price;
  if(it.id==='suit'){ S.hasSuit=true; toast('👔 Bought a suit — corporate jobs unlocked'); }
  else if(it.id==='snack'){ toast('☕ Nice. +morale'); }
  else if(it.id==='scooter'||it.id==='sedan'){
    S.ownedCar=true;
    const c=buildCar(it.id==='sedan'?'sedan':'hatch', it.id==='sedan'?0x3fa9f5:0x9fd6ff, player.pos.x+4, player.pos.z+4, player.yaw);
    cars.push(c);
    toast('🚗 Your '+it.name+' is parked right there!');
  }
  renderPhone(); updateHUD();
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD(){
  document.getElementById('cash').textContent='$'+S.cash.toLocaleString();
  const stars=Math.round(S.heat);
  const h=document.getElementById('heat');
  h.textContent='★'.repeat(stars)+'☆'.repeat(5-stars);
  h.classList.toggle('hot',stars>=3);
}
function updateObjective(){
  const o=document.getElementById('obj');
  if(!S.activeJob){ o.innerHTML='<b>Objective</b><br><span class="sub">Open your phone (📱) and apply for a job.</span>'; return; }
  o.innerHTML=`<b>${S.activeJob.name}</b><br><span class="sub">📍 Head to ${placeName(S.activeJob.place)} and press <b>E</b> to work.</span>`;
}
let toastT=0;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.opacity=1; toastT=2.6; }
function feel(a){ /* hook for screen shake later */ shake=Math.max(shake||0,a); }
let shake=0;
function bigMsg(t,s='',color='#ff5d6d'){
  const b=document.getElementById('bigMsg'); b.style.display='flex';
  b.querySelector('.t').textContent=t; b.querySelector('.t').style.color=color; b.querySelector('.s').textContent=s;
  setTimeout(()=>{ b.style.display='none'; }, 1800);
}

/* ============================================================
   WAYPOINT BEAM
   ============================================================ */
const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,26,16,1,true),
  new THREE.MeshBasicMaterial({color:0xffd85e,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
beam.visible=false; scene.add(beam);
function updateBeam(t){
  if(S.activeJob){ const pl=PLACES[S.activeJob.place]; beam.visible=true; beam.position.set(pl.x,13,pl.z); beam.material.opacity=0.14+0.1*(0.5+0.5*Math.sin(t*3)); }
  else beam.visible=false;
}

/* ============================================================
   UPDATE: PLAYER / CAR / PEDS / COPS
   ============================================================ */
const clock=new THREE.Clock();
function inputVec(){
  let x=0,z=0;
  if(keys.KeyW||keys.ArrowUp) z+=1;
  if(keys.KeyS||keys.ArrowDown) z-=1;
  if(keys.KeyA||keys.ArrowLeft) x-=1;
  if(keys.KeyD||keys.ArrowRight) x+=1;
  x += (joy.vx||0); z += (joy.vy||0);
  const m=Math.hypot(x,z); if(m>1){ x/=m; z/=m; }
  return {x,z,m:Math.min(1,m)};
}
function resolveXZ(px,pz,r){
  for(const s of solids){
    const nx=clamp(px,s.minx,s.maxx), nz=clamp(pz,s.minz,s.maxz);
    let dx=px-nx, dz=pz-nz, d=Math.hypot(dx,dz);
    if(d<0.0001){
      // centre is INSIDE the box — push out through the nearest face (stops tunnelling)
      const dl=px-s.minx, dr=s.maxx-px, dn=pz-s.minz, df=s.maxz-pz, m=Math.min(dl,dr,dn,df);
      if(m===dl) px=s.minx-r; else if(m===dr) px=s.maxx+r; else if(m===dn) pz=s.minz-r; else pz=s.maxz+r;
      continue;
    }
    if(d<r){ const push=(r-d)/d; px+=dx*push; pz+=dz*push; }
  }
  return [px,pz];
}
function collideCircle(px,pz,r){
  [px,pz]=resolveXZ(px,pz,r);
  px=clamp(px,-CITY.half,CITY.half); pz=clamp(pz,-CITY.half,CITY.half);
  return [px,pz];
}
function updatePlayer(dt){
  if(!player.onFoot){ jumpY=0; jumpV=0; return; }
  const iv=inputVec();
  const spd = sprint ? 9.4 : 5.6;                  // RUN = hold Shift / tap the RUN button
  // move relative to camera yaw
  const sin=Math.sin(cam.yaw), cos=Math.cos(cam.yaw);
  const wx = iv.x*cos - iv.z*sin;
  const wz = -iv.x*sin - iv.z*cos;
  let nx=player.pos.x + wx*spd*dt;
  let nz=player.pos.z + wz*spd*dt;
  [nx,nz]=collideCircle(nx,nz,0.7);
  player.pos.x=nx; player.pos.z=nz;
  const moving = iv.m>0.05;
  if(moving){ player.yaw = Math.atan2(wx,wz); player.phase += dt*(sprint?17:10); } else player.phase *= 0.85;
  // jump: simple ballistic arc
  if(jumpY>0 || jumpV!==0){
    jumpV -= 18*dt; jumpY += jumpV*dt;
    if(jumpY<=0){ jumpY=0; jumpV=0; }
  }
  player.group.position.set(player.pos.x, jumpY, player.pos.z);
  player.group.rotation.y = lerpAngle(player.group.rotation.y, player.yaw, Math.min(1,12*dt));
  // limb swing
  animateWalk(player.group, player.phase, moving?1:0.06);
}
function updateCar(dt){
  if(player.onFoot||!S.car) return;
  const c=S.car, iv=inputVec();
  const accel = 26, maxSpd=26, revMax=9, fric=1.6, brake=34;
  if(iv.z>0.1) c.speed += accel*iv.z*dt;
  else if(iv.z<-0.1) c.speed += accel*iv.z*0.7*dt;
  else c.speed -= c.speed*fric*dt;
  c.speed = clamp(c.speed, -revMax, maxSpd);
  // steering (only when moving) — D turns the car to the RIGHT on screen
  const steer = iv.x * 1.6 * clamp(Math.abs(c.speed)/8,0,1) * (c.speed<0?-1:1);
  c.yaw -= steer*dt;
  const fx=Math.sin(c.yaw), fz=Math.cos(c.yaw);
  let nx=c.pos.x + fx*c.speed*dt;
  let nz=c.pos.z + fz*c.speed*dt;
  // collide (cars bigger radius) — resolveXZ handles the inside-a-building case too
  let [cx,cz]=resolveXZ(nx,nz,1.6);
  if(Math.abs(cx-nx)>0.001 || Math.abs(cz-nz)>0.001) c.speed*=0.4;
  cx=clamp(cx,-CITY.half,CITY.half); cz=clamp(cz,-CITY.half,CITY.half);
  c.pos.x=cx; c.pos.z=cz;
  c.group.position.set(c.pos.x,0,c.pos.z);
  c.group.rotation.y=c.yaw;
  // player rides along
  player.pos.set(c.pos.x,c.pos.z?0:0,c.pos.z);
}
function updatePeds(dt){
  for(const p of peds){
    if(p.robbed) continue;
    const dx=p.target.x-p.pos.x, dz=p.target.z-p.pos.z, d=Math.hypot(dx,dz);
    if(d<0.6){ pickPedTarget(p); }
    else {
      const sp=p.speed||2.2, step=sp*dt;
      const nx=p.pos.x+dx/d*step, nz=p.pos.z+dz/d*step;
      // move; never step onto the road unless it's a crossing. Blocked → slide along the curb.
      const tryMove=(ax,az)=>{
        const [rx,rz]=resolveXZ(ax,az,0.5);
        if(onRoad(rx,rz) && !inCrosswalk(rx,rz)) return false;
        p.pos.x=rx; p.pos.z=rz; return true;
      };
      if(!tryMove(nx,nz)){
        if(!tryMove(nx,p.pos.z)){ if(!tryMove(p.pos.x,nz)){ pickPedTarget(p); } }
      }
      if(d>0.01) p.yaw=Math.atan2(dx,dz);
    }
    // walking animation + bob, driven by distance actually travelled
    const moved=Math.hypot(p.pos.x-(p._lx??p.pos.x), p.pos.z-(p._lz??p.pos.z));
    p._lx=p.pos.x; p._lz=p.pos.z;
    p.phase=(p.phase||0) + moved*9 + dt*0.7;
    animateWalk(p.group, p.phase, moved>0.0008?1:0.12);
    p.group.position.set(p.pos.x, Math.abs(Math.sin(p.phase))*0.05, p.pos.z);
    p.group.rotation.y=p.yaw;
  }
}
function updateCops(dt){
  const stars=Math.round(S.heat);  while(cops.length<stars) spawnCop();
  while(cops.length>stars){ const c=cops.pop(); scene.remove(c.group); }
  for(const c of cops){
    const dx=player.pos.x-c.pos.x, dz=player.pos.z-c.pos.z, d=Math.hypot(dx,dz);
    const bx=c.pos.x, bz=c.pos.z;
    if(d>1.2){ const sp=Math.min(6.5, 3.4+stars*0.5); let nx=c.pos.x+dx/d*sp*dt, nz=c.pos.z+dz/d*sp*dt; [nx,nz]=resolveXZ(nx,nz,0.55); c.pos.x=nx; c.pos.z=nz; c.yaw=Math.atan2(dx,dz); }
    const moved=Math.hypot(c.pos.x-bx, c.pos.z-bz);
    c.phase=(c.phase||0)+moved*9+dt*0.7;
    animateWalk(c.group, c.phase, moved>0.0008?1:0.1);
    c.group.position.set(c.pos.x,0,c.pos.z);
    c.group.rotation.y+=dt*0.0 + (c.yaw-c.group.rotation.y)*Math.min(1,8*dt);
    if(d<1.4 && S.heat>0){ busted(); break; }
  }
}
function busted(){
  if(S.heat<=0) return;
  const fine=Math.round(S.cash*0.30);
  S.cash-=fine; S.heat=0; S.arrested=true;
  cops.forEach(c=>scene.remove(c.group)); cops.length=0;
  if(!player.onFoot) exitCar();
  player.pos.set(24,0,40); player.group.position.copy(player.pos);
  bigMsg('BUSTED','Lost $'+fine+' — heat cleared','#ff5d6d');
  updateHUD(); feel(1);
}
function updateHeat(dt){
  if(S.heatLock>0){ S.heatLock-=dt; return; }
  if(S.heat>0){ S.heat=Math.max(0, S.heat-dt*0.18); if(S.heat<0.02) S.heat=0; }
  if(S.under>0){ S.under=Math.max(0,S.under-dt*0.4); }
  if(S.legit<100 && S.heat===0){ S.legit=Math.min(100,S.legit+dt*0.5); }
}
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }

/* ============================================================
   CAMERA
   ============================================================ */
function updateCamera(dt){
  // auto-recenter behind player when moving on foot and not dragging
  const iv=inputVec();
  if(player.onFoot && iv.m>0.2 && !look.dragging){
    cam.yaw = lerpAngle(cam.yaw, player.yaw+Math.PI, Math.min(1, 1.6*dt));
  }
  const target = (player.onFoot? player.pos : (S.car? S.car.pos : player.pos));
  const cy = target.y + (player.onFoot?(1.6+jumpY):1.0);
  const horiz = Math.cos(cam.pitch)*cam.dist;
  const cx = target.x + Math.sin(cam.yaw)*horiz;
  const cz = target.z + Math.cos(cam.yaw)*horiz;
  const camy = cy + Math.sin(cam.pitch)*cam.dist;
  camera.position.lerp(new THREE.Vector3(cx,camy,cz), Math.min(1, 8*dt));
  camera.lookAt(target.x, cy, target.z);
  if(shake>0){ shake=Math.max(0,shake-dt*2.5); const s=shake*0.35; camera.position.x+=(Math.random()-0.5)*s; camera.position.y+=(Math.random()-0.5)*s; }
}

/* ============================================================
   LOOP
   ============================================================ */
let acc=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05, clock.getDelta());
  const t=performance.now()/1000;

  if(!MG.active){
    updatePlayer(dt); updateCar(dt); updateCops(dt);
  }
  updatePeds(dt);
  updateTraffic(dt, t);
  updateLights(t);
  updateHeat(dt);
  updateCamera(dt);
  updateBeam(t);

  // minigame update
  if(MG.active && !MG.done){
    MG.timer-=dt; document.getElementById('mgTime').textContent=Math.max(0,Math.ceil(MG.timer));
    MG.spawn-=dt;
    if(MG.spawn<=0 && MG.timer>1){ MG.spawn=MG.rateSpawn*rnd(0.7,1.3);
      const el=document.createElement('div'); el.className='item'; el.textContent=EMOJI[Math.floor(Math.random()*EMOJI.length)];
      el.style.left='100%'; convEl.appendChild(el);
      MG.items.push({ el, pct:100, speed:rnd(22,34), scanned:false });
    }
    for(const it of MG.items){
      if(it.scanned) continue;
      it.pct -= it.speed*dt;
      it.el.style.left=it.pct+'%';
      if(it.pct<0){ it.done=true; it.el.remove(); MG.miss++; document.getElementById('mgMiss').textContent=MG.miss; it.pct=-999; }
    }
    MG.items=MG.items.filter(it=>it.pct>-500);
    if(MG.timer<=0) endShift();
  }

  // interaction prompt
  nearTarget=nearestTarget();
  if(nearTarget){
    let txt='';
    if(nearTarget.type==='car') txt='<b>E</b> — '+(nearTarget.car.moving?'Carjack':'Get in car');
    else if(nearTarget.type==='exit') txt='<b>E</b> — Get out';
    else if(nearTarget.type==='ped') txt='<b>E</b> — Mug (⚠ crime)';
    else if(nearTarget.type==='place'){
      const k=nearTarget.place;
      if((k==='store'||k==='tower') && S.activeJob && S.activeJob.place===k) txt='<b>E</b> — Start shift';
      else if(k==='shop') txt='<b>E</b> — Open shop';
      else txt='<b>E</b> — '+placeName(k);
    }
    promptEl.innerHTML=txt; promptEl.style.display='inline-block';
  } else promptEl.style.display='none';

  // toast fade
  if(toastT>0){ toastT-=dt; if(toastT<=0) document.getElementById('toast').style.opacity=0; }

  updateHUD();
  renderer.render(scene,camera);
}
updateHUD(); updateObjective();
frame();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
// show joystick on touch devices
if('ontouchstart' in window || innerWidth<900) joyEl.classList.add('show');

/* expose for debugging/testing */
window.GRIND = { S, PLACES, player, cars, peds, cops, traffic:TRAFFIC, cam, camera, scene, THREE, solids, INTERSECTIONS, CROSSWALKS, ROAD, lightState, onRoad, inCrosswalk, walkable, startShift, applyJob, buy, addHeat, doAction, enterCar, exitCar, MG, openPhone, selectTab, nearestTarget, usePlace, mug, tryJump, setSprint, get jumpY(){return jumpY;}, get sprint(){return sprint;}, get nearTarget(){return nearTarget;} };
</script>
